<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rev Barbell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0e0e; --card:#181818; --line:#2a2a2a; --text:#f2f2f2; --muted:#9a9a9a;
    --accent:#e4572e; --ok:#3fb950; --err:#f85149;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
  body{min-height:100dvh;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
  .wrap{max-width:440px;margin:0 auto;padding:48px 0}
  .brand{font-weight:800;letter-spacing:.14em;font-size:13px;color:var(--accent);text-transform:uppercase}
  h1{font-size:30px;margin:6px 0 28px;font-weight:800;letter-spacing:-.01em}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
  label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
  input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#111;color:var(--text);font-size:16px}
  input:focus{outline:2px solid var(--accent);border-color:transparent}
  button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--text);margin-top:12px}
  button:disabled{opacity:.6}
  .msg{margin-top:14px;font-size:14px;min-height:20px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}
  .toggle{margin-top:18px;text-align:center;font-size:14px;color:var(--muted)}
  .toggle a{color:var(--text);cursor:pointer;text-decoration:underline}
  .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .row:last-child{border-bottom:0}
  .row span:first-child{color:var(--muted)}
  .pill{display:inline-block;padding:4px 10px;border-radius:999px;background:#222;border:1px solid var(--line);font-size:13px;margin:4px 6px 0 0}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">Rev Barbell Club</div>

  <!-- AUTH -->
  <section id="auth">
    <h1 id="authTitle">Sign in</h1>
    <div class="card">
      <form id="authForm">
        <div id="nameField" class="hidden">
          <label for="name">Full name</label>
          <input id="name" autocomplete="name">
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <button id="authBtn" type="submit">Sign in</button>
        <div id="authMsg" class="msg"></div>
      </form>
      <div class="toggle"><span id="toggleText">New member?</span> <a id="toggleLink">Create account</a></div>
    </div>
  </section>

  <!-- HOME -->
  <section id="home" class="hidden">
    <h1 id="hello">Welcome</h1>
    <div class="card">
      <div class="row"><span>Email</span><span id="pEmail"></span></div>
      <div class="row"><span>Role</span><span id="pRole"></span></div>
      <div style="padding-top:12px">
        <div style="color:var(--muted);font-size:13px">Groups</div>
        <div id="pGroups" style="margin-top:4px"></div>
      </div>
    </div>
    <p style="color:var(--muted);font-size:14px;margin-top:18px">Your programs will show up here soon.</p>
    <button class="ghost" id="signOut">Sign out</button>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://kaehtivwphtwoiaeszui.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_dO4G2c-8mo3Zh3aol276ZQ_em98zjeC'; // publishable key, safe in the browser
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const $ = id => document.getElementById(id);
  let mode = 'signin';

  function setMode(m){
    mode = m;
    const up = m === 'signup';
    $('authTitle').textContent = up ? 'Create account' : 'Sign in';
    $('authBtn').textContent = up ? 'Create account' : 'Sign in';
    $('nameField').classList.toggle('hidden', !up);
    $('toggleText').textContent = up ? 'Already a member?' : 'New member?';
    $('toggleLink').textContent = up ? 'Sign in' : 'Create account';
    $('password').autocomplete = up ? 'new-password' : 'current-password';
    msg('');
  }
  function msg(t, cls){ const m=$('authMsg'); m.textContent=t; m.className='msg '+(cls||''); }

  $('toggleLink').onclick = () => setMode(mode === 'signin' ? 'signup' : 'signin');

  $('authForm').onsubmit = async e => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    $('authBtn').disabled = true; msg('');
    try{
      if(mode === 'signup'){
        const { data, error } = await sb.auth.signUp({
          email, password,
          options:{ data:{ full_name:$('name').value.trim() }, emailRedirectTo: location.origin + location.pathname }
        });
        if(error) throw error;
        if(!data.session) msg('Check your email to confirm your account, then sign in.', 'ok');
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if(error) throw error;
      }
    }catch(err){ msg(err.message, 'err'); }
    $('authBtn').disabled = false;
  };

  $('signOut').onclick = () => sb.auth.signOut();

  async function showHome(user){
    $('auth').classList.add('hidden'); $('home').classList.remove('hidden');
    const { data: p } = await sb.from('profiles').select('full_name,email,role').eq('id', user.id).single();
    $('hello').textContent = 'G’day ' + ((p && p.full_name) || '').split(' ')[0];
    $('pEmail').textContent = (p && p.email) || user.email;
    $('pRole').textContent = p ? (p.role === 'coach' ? 'Coach' : 'Athlete') : '';
    const { data: gm } = await sb.from('group_members').select('groups(name)').eq('profile_id', user.id);
    const names = (gm||[]).map(r => r.groups && r.groups.name).filter(Boolean);
    $('pGroups').innerHTML = names.length
      ? names.map(n => '<span class="pill">'+n.replace(/[<>&]/g,'')+'</span>').join('')
      : '<span style="color:var(--muted);font-size:14px">Not in a group yet</span>';
  }
  function showAuth(){ $('home').classList.add('hidden'); $('auth').classList.remove('hidden'); }

  sb.auth.onAuthStateChange((_evt, session) => { session ? showHome(session.user) : showAuth(); });
</script>
</body>
</html>
