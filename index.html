const REPS_MAX=/max reps/i;
// Maxes that aren't kilos. Stored in the same column (athlete_maxes.weight_kg): reps, seconds, or calories.
const MX_UNITS={'tri erg test':{u:'time',low:true},'5km row':{u:'time',low:true},'max plank hold':{u:'time'},'30s assault bike':{u:'cal'}};
const mxUnit=n=>{ const k=(n||'').trim().toLowerCase(); return MX_UNITS[k] || (REPS_MAX.test(k)?{u:'reps'}:{u:'kg'}); };
const mxFmt=(v,un)=>v==null||v===''?'–':un.u==='time'?mmss(Math.round(+v)):String(+(+v).toFixed(2));
const mxSuffix=un=>un.u==='reps'?'reps':un.u==='cal'?'cal':un.u==='time'?'':'kg';
// "4:35" or "275" (seconds) -> seconds
const parseTime=t=>{ t=String(t||'').trim(); const m=t.match(/^(\d+):(\d{1,2})$/); if(m) return +m[1]*60+(+m[2]); return /^\d+(\.\d+)?$/.test(t)?+t:NaN; };
const mxBetter=(un,v,old)=>un.low?v<old:v>old;
// Each program's important ones (Maxes) and Blackboard columns
const KEY_LIFTS={ barbell:['Snatch','Clean & Jerk','Clean','Split Jerk from Blocks','Back Squat','Front Squat','Deadlift','Bench Press','Strict Press','Push Press'],
  fndn:['Back Squat','Deadlift','Bench Press','Barbell Hip Thrust','Pull-Ups (Max Reps)','Weighted Pull-Up','Snatch','Clean & Jerk','Tri Erg Test','5km Row','Max Plank Hold','30s Assault Bike'] };
async function myPrograms(){ if(S.myProgs) return S.myProgs;
  const { data } = await sb.from('group_members').select('groups(name)').eq('profile_id',S.user.id);
  const g=(data||[]).map(r=>r.groups?.name||''); const f=g.includes('FNDN'), b=g.includes('Barbell Club');
  S.myProgs = isCoach() ? ['barbell','fndn'] : f&&!b ? ['fndn'] : f&&b ? ['barbell','fndn'] : ['barbell'];
  return S.myProgs; }
async function loadMaxes(){
  await Promise.all([loadExercises(), myPrograms()]);
  const { data:hist } = await sb.from('athlete_maxes').select('id,exercise_id,weight_kg,recorded_on,created_at,kind')
    .eq('athlete_id',S.user.id).order('recorded_on',{ascending:false}).order('created_at',{ascending:false});
  buildMaxes(hist||[]);
  const byEx={}; (hist||[]).filter(m=>m.kind!=='working').forEach(m=>(byEx[m.exercise_id]=byEx[m.exercise_id]||[]).push(m));
  const pct=+(S.profile?.working_max_pct||0);
  // lifts that percentages are worked off, plus any lift with a max recorded
  const bases=Object.values(S.exercises).filter(e=>(!e.default_percent_of || byEx[e.id] || S.maxWork[e.id]) && e.category!=='conditioning');
  const order=['Snatch','Clean & Jerk','Clean','Back Squat','Front Squat','Push Press'];
  bases.sort((a,b)=>{ const ia=order.indexOf(a.name), ib=order.indexOf(b.name); return (ia<0?99:ia)-(ib<0?99:ib) || a.name.localeCompare(b.name); });
  const presets=[0,5,10,15];
  // Categories: the exercise's own category where set, otherwise worked out from the name
  const CATS=[['snatch','Snatch'],['cj','Clean & Jerk'],['squat','Squats'],['pull','Pulls & deadlifts'],['press','Pressing'],['bench','Conditioning tests'],['other','Accessories & other']];
  const catOf=e=>{ const c=(e.category||'').toLowerCase(), n=e.name.toLowerCase();
    if(c==='benchmark') return 'bench';
    if(c==='snatch'||(!c&&/snatch/.test(n))) return 'snatch';
    if(c==='clean & jerk'||(!c&&/clean|jerk/.test(n))) return 'cj';
    if(c==='squat'||(!c&&/squat/.test(n))) return 'squat';
    if(c==='pull'||(!c&&/pull|deadlift|rdl|row/.test(n))) return 'pull';
    if(c==='press'||(!c&&/press|bench|dip/.test(n))) return 'press';
    return 'other'; };
  // The important ones first, in this order (Pull-Ups (Max Reps) is a rep count, not kilos)
  // FNDN and Barbell Club have their own important ones; someone in both (and coaches) gets both lists
  const progs=S.myProgs, both=progs.length>1;
  const keyLists=progs.map(p=>({k:'key-'+p, l:'The important ones'+(both?(p==='fndn'?' · FNDN':' · Barbell Club'):''),
    items:KEY_LIFTS[p].map(n=>Object.values(S.exercises).find(e=>e.name===n)).filter(Boolean)}));
  const keyEx=keyLists.flatMap(c=>c.items);
  const rest=bases.filter(e=>!keyEx.includes(e));
  const cats=[...keyLists, ...CATS.map(([k,l])=>({k,l,items:rest.filter(e=>catOf(e)===k)}))].filter(c=>c.items.length);
  $('view').innerHTML=`<div class="card bb-in"><div><b>Show my PRs on the Blackboard</b><span>Your all-time maxes go up on the club\u2019s PR board in Training › PRs, next to everyone else\u2019s.</span></div>
      <label class="sw"><input type="checkbox" id="bbOpt" ${S.profile?.blackboard?'checked':''} aria-label="Show my PRs on the Blackboard"><i></i></label></div>
  <div class="card"><div class="card-label"><span>Working maxes</span><span>${pct?`${pct}% under`:'Same as all-time'}</span></div>
    <p class="hint" style="margin-bottom:10px">Your program's percentages are worked off your working maxes. Take a few percent off your all-time bests on a heavy block, coming back from a break, or when you're beat up.</p>
    <div class="wm-pick"><span>Reduce by</span>${presets.map(v=>`<button data-wmp="${v}" class="${v===pct?'on':''}">${v}%</button>`).join('')}
      <span class="wm-own"><input inputmode="decimal" id="wmPct" value="${presets.includes(pct)?'':pct}" placeholder="other" aria-label="Other percentage">%</span></div></div>
  <div class="mx-tools"><input type="search" id="mxQ" placeholder="Search lifts" aria-label="Search lifts" autocomplete="off">
    <div class="fm-cats" id="mxCats">${cats.map(c=>`<button data-mxcat="${c.k}">${esc(c.l)} <span>${c.items.length}</span></button>`).join('')}</div></div>
  <div class="card"><div class="card-label"><span>Your maxes</span><span>kg</span></div>
    <p class="hint" style="margin-bottom:6px">Update your all-time max whenever you hit a new best. To use a different working max on one lift, set it by hand.</p>
    ${cats.map(c=>`<div class="mx-sec" data-sec="${c.k}"><div class="mx-h">${esc(c.l)}</div>`+c.items.map(e=>{ const un=mxUnit(e.name), isReps=un.u!=='kg';
      const cur=byEx[e.id]?.[0], prev=byEx[e.id]?.[1], w=isReps?null:S.maxWork[e.id], eff=isReps?null:S.maxes[e.id];
      const ph=un.u==='time'?'m:ss':un.u==='cal'?'cals':un.u==='reps'?'reps':'new';
      return `<div class="mx-row" data-nm="${esc(e.name.toLowerCase())}"><div class="mx-n"><b>${esc(e.name)}</b><span>${cur?`Set ${fmtDate(cur.recorded_on)}${prev?` · was ${mxFmt(prev.weight_kg,un)}`:''}`:'Not set'}${un.u==='time'?(un.low?' · lower is better':' · longer is better'):''}</span></div>
        <div class="mx-line"><span class="mx-l">${isReps?'Best':'All-time'}</span><b class="mx-v">${cur?mxFmt(cur.weight_kg,un):'–'}${isReps&&cur&&mxSuffix(un)?` <small>${mxSuffix(un)}</small>`:''}</b>
          <span class="inline"><input inputmode="${un.u==='kg'?'decimal':un.u==='time'?'text':'numeric'}" placeholder="${ph}" data-max="${e.id}" aria-label="New ${esc(e.name)} best"><button class="btn sm" data-savemax="${e.id}">Save</button></span></div>
        ${!isReps&&(cur||w)?`<div class="mx-line wk"><span class="mx-l">Working</span><b class="mx-v">${eff?+eff.weight_kg:'–'}</b>
          <span class="mx-how">${w?`set by hand <button class="linkbtn" data-clrwm="${e.id}">use ${pct?pct+'% rule':'all-time'}</button>`:eff&&pct?`${100-pct}% of all-time`:eff?'same as all-time':''}</span>
          <button class="linkbtn" data-setwm="${e.id}">${w?'Change':'Set by hand'}</button></div>
        <div class="mx-line" data-wmbox="${e.id}" hidden><span class="mx-l"></span><span class="inline"><input inputmode="decimal" placeholder="kg" data-wmv="${e.id}" aria-label="${esc(e.name)} working max"><button class="btn sm primary" data-savewm="${e.id}">Save</button></span></div>`:''}</div>`; }).join('')+'</div>').join('')}
    <div class="empty" id="mxNone" hidden>No lifts match.</div>
  </div>`;
  // search filters rows as you type; category chips jump to that section
  $('mxQ').oninput=e=>{ const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.mx-row').forEach(r=>r.hidden=!!q && !r.dataset.nm.includes(q));
    document.querySelectorAll('.mx-sec').forEach(sec=>sec.hidden=![...sec.querySelectorAll('.mx-row')].some(r=>!r.hidden));
    $('mxNone').hidden=[...document.querySelectorAll('.mx-row')].some(r=>!r.hidden); };
  document.querySelectorAll('[data-mxcat]').forEach(b=>b.onclick=()=>{ const sec=document.querySelector(`[data-sec="${b.dataset.mxcat}"]`); if(!sec) return;
    if($('mxQ').value){ $('mxQ').value=''; $('mxQ').oninput({target:$('mxQ')}); }
    window.scrollTo({ top:sec.getBoundingClientRect().top+window.scrollY-70, behavior:'smooth' }); });
  const setPct=async v=>{ v=Math.max(0,Math.min(50,+v||0));
    const { error } = await sb.from('profiles').update({ working_max_pct:v }).eq('id',S.user.id);
    if(error){ toast(error.message); return; } S.profile.working_max_pct=v; toast(v?`Working maxes are ${v}% under your bests`:'Working maxes match your bests'); loadMaxes(); };
  $('bbOpt').onchange=async e=>{ const on=e.target.checked; e.target.disabled=true; if(!await setBlackboard(on)) e.target.checked=!on; e.target.disabled=false; };
  document.querySelectorAll('[data-wmp]').forEach(b=>b.onclick=()=>setPct(b.dataset.wmp));
  $('wmPct').onchange=e=>{ const v=e.target.value.replace(',','.').trim(); if(v!=='') setPct(v); };
  document.querySelectorAll('[data-savemax]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.savemax, inp=document.querySelector(`[data-max="${id}"]`), un=mxUnit(S.exercises[id]?.name);
    const isReps=un.u==='reps';
    const v = un.u==='time' ? parseTime(inp.value) : Number(inp.value.replace(',','.'));
    if(!v||v<=0||isNaN(v)){ toast(un.u==='time'?'Enter a time like 4:35':un.u==='cal'?'Enter your calories':isReps?'Enter how many reps':'Enter a weight in kg'); return; }
    // reps, seconds and calories are stored in the same column as kilos
    const { error } = await sb.from('athlete_maxes').insert({ athlete_id:S.user.id, exercise_id:id, weight_kg:v, source:'manual', kind:'max', ...(isReps?{reps:Math.round(v)}:{}) });
    if(error){ toast(error.message); return; }
    const old=byEx[id]?.[0]; S.week=null; await loadMaxes();
    // beat the old best: celebrate and offer a PR card (lifts and reps); conditioning tests just get a cheer
    if(old && mxBetter(un,v,+old.weight_kg) && S.view==='maxes'){ if(un.u==='kg'||un.u==='reps') prPrompt(S.exercises[id], v, +old.weight_kg); else toast(`New best ${S.exercises[id].name}: ${mxFmt(v,un)}${un.u==='cal'?' cal':''} 🎉`); }
    else toast('Saved');
  });
  document.querySelectorAll('[data-setwm]').forEach(b=>b.onclick=()=>{ const box=document.querySelector(`[data-wmbox="${b.dataset.setwm}"]`); box.hidden=!box.hidden; if(!box.hidden) box.querySelector('input').focus(); });
  document.querySelectorAll('[data-savewm]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.savewm, v=Number(document.querySelector(`[data-wmv="${id}"]`).value.replace(',','.'));
    if(!v||v<=0){ toast('Enter a weight in kg'); return; }
    await sb.from('athlete_maxes').delete().eq('athlete_id',S.user.id).eq('exercise_id',id).eq('kind','working');
    const { error } = await sb.from('athlete_maxes').insert({ athlete_id:S.user.id, exercise_id:id, weight_kg:v, source:'manual', kind:'working' });
    if(error){ toast(error.message); return; }
    toast('Working max saved'); S.week=null; loadMaxes();
  });
  document.querySelectorAll('[data-clrwm]').forEach(b=>b.onclick=async()=>{
    const { error } = await sb.from('athlete_maxes').delete().eq('athlete_id',S.user.id).eq('exercise_id',b.dataset.clrwm).eq('kind','working');
    if(error){ toast(error.message); return; } toast('Back to the % rule'); loadMaxes(); });
}


/* ---------------- PRs ----------------
   Training > PRs, two sections.
   Blackboard: a chalkboard of every opted-in athlete's current all-time maxes (rpc blackboard; athletes opt in from Maxes, profiles.blackboard).
   PR Cards: pr_cards feed (lift, kilos or reps, previous best, note, optional video in the private 'prs' bucket at <athlete id>/<file>),
   shown as gold (single) or silver (rep max) cards; pr_fistbumps is one fistbump per person per card and pings the card's owner. Deep link #pr/<id>. */
const PR_ABBR={'snatch':'SN','clean & jerk':'C&J','clean':'CL','jerk':'JK','split jerk':'JK','back squat':'BS','front squat':'FS','overhead squat':'OHS','deadlift':'DL',
  'bench press':'BP','strict press':'SP','push press':'PP','power snatch':'PSN','power clean':'PCL','weighted pull-up':'WPU','pull-ups (max reps)':'PU','total':'TOT',
  'split jerk from blocks':'JK','barbell hip thrust':'HT','tri erg test':'TRI','5km row':'5K','max plank hold':'PLK','30s assault bike':'BIKE'};
const prAbbr=n=>{ const k=(n||'').trim().toLowerCase(); if(PR_ABBR[k]) return PR_ABBR[k];
  return (n||'').replace(/\(.*?\)/g,'').split(/[\s\-&]+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase()||'PR'; };
const kgS=v=>v==null||v===''||isNaN(+v)?'':String(+(+v).toFixed(2));
// Board columns come straight from each program's important ones (KEY_LIFTS), so Maxes and the board always match
const boardCols=p=>KEY_LIFTS[p].map(n=>[n.toLowerCase(), prAbbr(n)]);

async function loadPRs(){
  S.prTab = S.prTab || store.get('prTab') || 'board';
  $('view').innerHTML=`<div class="pr-tabs">
      <button data-prtab="board" class="${S.prTab==='board'?'on':''}"><i>🧾</i><div><b>Blackboard</b><span>Everyone's bests</span></div></button>
      <button data-prtab="cards" class="${S.prTab==='cards'?'on':''}"><i>🏆</i><div><b>PR Cards</b><span>New PRs, fistbumps</span></div></button>
      <button data-prtab="records" class="${S.prTab==='records'?'on':''}"><i>🏅</i><div><b>Records</b><span>Club to world</span></div></button></div>
    <div id="prBody"><div class="empty">Loading…</div></div>`;
  document.querySelectorAll('[data-prtab]').forEach(b=>b.onclick=()=>{ if(S.prTab===b.dataset.prtab) return; S.prTab=b.dataset.prtab; store.set('prTab',S.prTab);
    document.querySelectorAll('[data-prtab]').forEach(x=>x.classList.toggle('on',x===b)); $('prBody').innerHTML='<div class="empty">Loading…</div>'; prDraw(); });
  prDraw();
}
function prDraw(){ ({board:drawBoard,cards:drawCards,records:drawRecords})[S.prTab]?.() ?? drawBoard();
}
async function setBlackboard(on){
  const { error } = await sb.from('profiles').update({ blackboard:!!on }).eq('id',S.user.id);
  if(error){ toast(error.message); return false; }
  S.profile.blackboard=!!on; toast(on?'You’re on the Blackboard 🧾':'Taken off the Blackboard'); return true;
}

/* ---------- Blackboard ---------- */
async function drawBoard(){
  const [{ data, error }, { data:sx }, { data:cn }] = await Promise.all([sb.rpc('blackboard'), sb.rpc('blackboard_sex'), sb.rpc('consistency_board'), myPrograms()]);
  const consOf=Object.fromEntries((cn||[]).map(r=>[r.athlete_id,r]));
  if(S.view!=='prs' || S.prTab!=='board') return;
  const sexOf=Object.fromEntries((sx||[]).map(r=>[r.athlete_id,r.sex]));
  const body=$('prBody');
  if(error){ body.innerHTML=`<div class="empty">Couldn’t load the Blackboard. ${esc(isNetErr(error)?'Check your signal and try again.':error.message)}</div>`; return; }
  const ath={};
  (data||[]).forEach(r=>{ const a=ath[r.athlete_id]=ath[r.athlete_id]||{ id:r.athlete_id, name:r.name, groups:r.groups||[], sex:sexOf[r.athlete_id]||null, lifts:{} };
    a.lifts[(r.exercise_name||'').trim().toLowerCase()]={ v:+r.weight_kg, d:r.recorded_on }; });
  Object.values(ath).forEach(a=>{ const c=consOf[a.id]; if(c && (c.streak||c.best)) a.lifts.streak={ v:c.streak, best:c.best }; });
  // Barbell Club and FNDN boards: own lifts, own people (in both = on both)
  const progs=S.myProgs, prog=S.bbProg && progs.includes(S.bbProg) ? S.bbProg : (progs.includes(store.get('bbProg'))?store.get('bbProg'):progs[0]);
  S.bbProg=prog;
  const isF=a=>a.groups.includes('FNDN'), isB=a=>a.groups.includes('Barbell Club');
  const list=Object.values(ath).filter(a=>prog==='fndn'?isF(a):(isB(a)||!isF(a)));
  // every one of the program's important ones shows, in the same order as Maxes
  const cols=[...(list.some(a=>a.lifts.streak)?[['streak','🔥']]:[]), ...boardCols(prog)];
  const gset={}; list.forEach(a=>a.groups.forEach(g=>{ if(!/video review|whole team|trial|^fndn$|^barbell club$|beta testers/i.test(g)) gset[g]=(gset[g]||0)+1; }));
  const groups=Object.keys(gset).sort();
  S.bb={ list, cols, sort:S.bb?.sort&&cols.some(c=>c[0]===S.bb.sort)?S.bb.sort:'name', grp:groups.includes(S.bb?.grp)?S.bb.grp:'', sex:S.bb?.sex??store.get('bbSex')??'', q:'' };
  const on=!!S.profile?.blackboard;
  body.innerHTML=`${!on?`<div class="bb-opt"><div><b>You’re not on the Blackboard</b><span>Put your all-time maxes up with the rest of the club. Turn it off any time in Maxes.</span></div><button class="btn primary sm" id="bbJoin">Put me on it</button></div>`:''}
    <div class="bb-frame"><div class="bb">
      ${progs.length>1?`<div class="bb-grp bb-prog">${[['barbell','Barbell Club'],['fndn','FNDN']].map(([k,l])=>`<button data-bbp="${k}" class="${prog===k?'on':''}">${l}</button>`).join('')}</div>`:''}
      <div class="bb-h"><div class="bb-t">PR Board</div><div class="bb-s">${prog==='fndn'?'FNDN':'Rev Barbell Club'} · all-time bests · kg${prog==='fndn'?' · times in m:ss':''}</div></div>
      ${list.length?`<div class="bb-grp bb-sex">${[['','All'],['male','Men'],['female','Women']].map(([k,l])=>`<button data-bbx="${k}" class="${S.bb.sex===k?'on':''}">${l}</button>`).join('')}</div>
      <div class="bb-tools"><input type="search" id="bbQ" placeholder="find a name…" autocomplete="off" aria-label="Find a name">
        ${groups.length>1?`<div class="bb-grp"><button data-bbg="" class="${!S.bb.grp?'on':''}">Everyone</button>${groups.map(g=>`<button data-bbg="${esc(g)}" class="${S.bb.grp===g?'on':''}">${esc(g)}</button>`).join('')}</div>`:''}</div>
      <div class="bb-scroll"><table class="bb-tbl" id="bbTbl"></table></div>`
      :`<div class="bb-empty">Nobody’s up here yet.<br>Be the first name on the board!</div>`}
    </div><div class="bb-tray"><i></i><i></i><i></i></div></div>
    <p class="hint" style="margin-top:12px;text-align:center">${list.length?'Tap a heading to sort by it, tap again for A to Z. ':''}${on?'You’re on the board. Keep your maxes up to date in <a href="#" data-goto="maxes">Maxes</a>.':''}</p>`;
  document.querySelectorAll('#prBody [data-goto]').forEach(a=>a.onclick=e=>{ e.preventDefault(); go(a.dataset.goto); });
  if($('bbJoin')) $('bbJoin').onclick=async()=>{ $('bbJoin').disabled=true; if(await setBlackboard(true)) drawBoard(); else $('bbJoin').disabled=false; };
  document.querySelectorAll('[data-bbp]').forEach(b=>b.onclick=()=>{ if(S.bbProg===b.dataset.bbp) return; S.bbProg=b.dataset.bbp; store.set('bbProg',S.bbProg); S.bb.sort='name'; drawBoard(); });
  if(!list.length) return;
  $('bbQ').oninput=e=>{ S.bb.q=e.target.value.trim().toLowerCase(); drawBoardTable(); };
  document.querySelectorAll('[data-bbx]').forEach(b=>b.onclick=()=>{ S.bb.sex=b.dataset.bbx; store.set('bbSex',S.bb.sex); document.querySelectorAll('[data-bbx]').forEach(x=>x.classList.toggle('on',x===b)); drawBoardTable(); });
  document.querySelectorAll('[data-bbg]').forEach(b=>b.onclick=()=>{ S.bb.grp=b.dataset.bbg; document.querySelectorAll('[data-bbg]').forEach(x=>x.classList.toggle('on',x===b)); drawBoardTable(); });
  drawBoardTable();
}
function drawBoardTable(){
  const { cols, sort, grp, q, sex } = S.bb;
  let rows=S.bb.list.filter(a=>(!grp||a.groups.includes(grp)) && (!sex||a.sex===sex) && (!q||a.name.toLowerCase().includes(q)));
  const val=(a,k)=>a.lifts[k]?.v;
  // Alphabetical by first name unless a column is picked; no rank numbers (it's a board, not a ladder)
  const byName=(a,b)=>a.name.localeCompare(b.name,'en',{sensitivity:'base'});
  const low=k=>!!MX_UNITS[k]?.low;   // times where lower is better sort the other way
  rows.sort((a,b)=>{ if(sort==='name') return byName(a,b); const x=val(a,sort), y=val(b,sort); if(x!=null&&y!=null&&x!==y) return low(sort)?x-y:y-x; if(x!=null&&y==null) return -1; if(y!=null&&x==null) return 1; return byName(a,b); });
  // circle the best number only in the column being sorted
  const lead={}; cols.forEach(([k])=>{ if(k!==sort) return; let m=null; rows.forEach(a=>{ const v=val(a,k); if(v!=null&&(m==null||(low(k)?v<m:v>m))) m=v; }); lead[k]=m; });
  $('bbTbl').innerHTML=`<thead><tr><th data-bbs="name" class="${sort==='name'?'on':''}" scope="col">Name</th>${cols.map(([k,l])=>`<th data-bbs="${esc(k)}" class="${k===sort?'on':''}" scope="col">${l}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(a=>{
      return `<tr class="${a.id===S.user.id?'me':''}"><td>${esc(a.name)}</td>${cols.map(([k])=>{ const x=val(a,k);
        return x==null?'<td class="no">–</td>':k==='streak'?`<td class="${x===lead[k]&&x>0?'top':''}"><b>${x}</b>${a.lifts.streak.best>x?`<small class="bst">best ${a.lifts.streak.best}</small>`:''}</td>`:`<td class="${x===lead[k]?'top':''}"><b>${mxFmt(x,mxUnit(k))}</b>${mxUnit(k).u==='reps'?'<small>r</small>':mxUnit(k).u==='cal'?'<small>cal</small>':''}</td>`; }).join('')}</tr>`; }).join('')
      || `<tr><td colspan="${cols.length+1}" style="text-align:center">No one matches</td></tr>`}</tbody>`;
  // tap a heading to sort by it; tap it again (or Name) to go back to A to Z
  document.querySelectorAll('[data-bbs]').forEach(th=>th.onclick=()=>{ S.bb.sort = th.dataset.bbs===S.bb.sort ? 'name' : th.dataset.bbs; drawBoardTable(); });
}

/* ---------- Club records (honour board) ----------
   club_records: coach-entered senior records for Snatch, C&J and Total in the current IWF categories.
   Every entry is kept; the record is the heaviest per sex + category + lift (earliest date wins a tie). Coaches add and delete. */
// IWF senior classes from 1 August 2026 (the LA 2028 set); AWF and WWA use the same ones
const REC_CATS={ male:['60','65','70','75','85','95','110','+110'], female:['49','53','57','61','69','77','86','+86'] };
const REC_SRC={ wa:['wwa.org.au','https://www.wwa.org.au/Statistics/Records'], aus:['awf.com.au','https://www.awf.com.au/competition/statistics/records'], world:['iwf.sport','https://iwf.sport/results/world-records/'] };
const REC_LIFTS=[['snatch','Snatch'],['cj','C&J'],['total','Total']];
const REC_LEVELS=[['club','Club','Club Records','REV BARBELL CLUB'],['wa','WA','WA State Records','WESTERN AUSTRALIA'],['aus','Australia','Australian Records','AUSTRALIA'],['world','World','World Records','WORLD']];
const recLvl=k=>REC_LEVELS.find(l=>l[0]===k)||REC_LEVELS[0];
const recLiftName=k=>({snatch:'Snatch',cj:'Clean & Jerk',total:'Total'})[k];
const recCatL=c=>c.startsWith('+')?`${c} kg`:`${c} kg`;
const recShort=n=>{ const p=(n||'').trim().split(/\s+/); return p.length>1&&n.length>13 ? p[0]+' '+p[p.length-1][0]+'.' : (n||''); };
const recMon=d=>{ const x=new Date(d+'T00:00:00'); return x.toLocaleDateString('en-AU',{month:'short'})+' ’'+String(x.getFullYear()).slice(2); };
// best entry for one sex/category/lift
// WA / Australian / World come from the daily sync: the rows the source lists now (is_current) are the record
function recBest(sex,cat,lift,lvl=S.recLvl||'club'){ let b=null;
  const pool=(S.recs||[]).filter(r=>(r.level||'club')===lvl&&r.sex===sex&&r.category===cat&&r.lift===lift);
  const cur=lvl!=='club'?pool.filter(r=>r.is_current):[];
  (cur.length?cur:pool).forEach(r=>{
  if(!b || +r.weight_kg>+b.weight_kg || (+r.weight_kg===+b.weight_kg && r.set_on<b.set_on)) b=r; }); return b; }

function recSrcHTML(lvl){
  const st=S.recSync?.[lvl]||{}, [host,url]=REC_SRC[lvl];
  const when=st.at?timeAgo(st.at):null;
  return `<div class="rb-src"><span>${lvl==='world'?'IWF world records, via Wikipedia':'Official records from '+host}${when?` · updated ${when}`:''}${st.ok===false?' · <em>last check failed</em>':''}</span>
    <a href="${url}" target="_blank" rel="noopener">${host} ↗</a>${isCoach()?'<button class="linkbtn" id="rbSync">↻ Refresh</button>':''}</div>`;
}
async function recSyncNow(){
  const b=$('rbSync'); if(!b) return; b.disabled=true; b.textContent='Checking…';
  const was=JSON.stringify(S.recSync?.[S.recLvl]?.at||S.recSync?.[S.recLvl]?.tried||'');
  const { error } = await sb.rpc('records_sync_now');
  if(error){ b.disabled=false; b.textContent='↻ Refresh'; toast(error.message); return; }
  // the sync runs on the server (a few seconds); wait for its status to change
  for(let i=0;i<12;i++){ await new Promise(r=>setTimeout(r,2000));
    const { data } = await sb.from('app_settings').select('value').eq('key','records_sync').maybeSingle();
    const v=data?.value?.[S.recLvl]; if(JSON.stringify(v?.at||v?.tried||'')!==was){ toast(v?.ok===false?'Couldn’t reach the site: '+(v.error||''):'Records up to date'); break; } }
  if(S.view==='prs'&&S.prTab==='records') drawRecords();
}
/* Coach quick add: one lift, today, straight onto the club board */
function recQuickHTML(sex){
  const opts=['male','female'].map(x=>`<optgroup label="${x==='male'?'Men':'Women'}">${REC_CATS[x].map(c=>`<option value="${x}|${c}" ${S.rqk?.cls===`${x}|${c}`?'selected':''}>${x==='male'?'M':'W'} ${c} kg</option>`).join('')}</optgroup>`).join('');
  return `<div class="rqk"><div class="rqk-h"><b>Quick add a Rev record</b><button class="linkbtn" id="rqkMore">Full comp entry ›</button></div>
    <input id="rqkWho" list="rqkPpl" placeholder="Lifter" autocomplete="off" value="${esc(S.rqk?.who||'')}"><datalist id="rqkPpl"></datalist>
    <div class="rqk-row"><select id="rqkCls" aria-label="Weight class"><option value="">Class</option>${opts}</select>
      <select id="rqkLift" aria-label="Lift">${REC_LIFTS.map(([k,l])=>`<option value="${k}" ${S.rqk?.lift===k?'selected':''}>${l}</option>`).join('')}</select>
      <input id="rqkKg" inputmode="decimal" placeholder="kg" aria-label="Kilos">
      <button class="btn primary" id="rqkGo">Add</button></div>
    <div class="ra-hint" id="rqkH">Set today. Use Full comp entry for another date or a competition name.</div></div>`;
}
async function recQuickWire(sex){
  if(!S.rqkPpl){ const { data } = await sb.from('profiles').select('id,full_name,sex').order('full_name'); S.rqkPpl=(data||[]).filter(p=>(p.full_name||'').trim()); }
  const dl=$('rqkPpl'); if(!dl) return; dl.innerHTML=S.rqkPpl.map(p=>`<option value="${esc(p.full_name)}"></option>`).join('');
  S.rqk=S.rqk||{};
  if(!$('rqkCls').value && S.rqk.cls===undefined){ /* nothing picked yet */ }
  const who=()=>S.rqkPpl.find(p=>p.full_name.trim().toLowerCase()===$('rqkWho').value.trim().toLowerCase());
  const num=v=>{ const n=Number(String(v||'').replace(',','.').trim()); return n>0?n:null; };
  const hint=()=>{ const h=$('rqkH'), [sx,c]=($('rqkCls').value||'|').split('|'), k=$('rqkLift').value, v=num($('rqkKg').value), p=who();
    S.rqk={ who:$('rqkWho').value, cls:$('rqkCls').value, lift:k };
    h.className='ra-hint';
    if(!c){ h.textContent=p?`${p.full_name} is linked to their account. Pick the class.`:'Set today. Use Full comp entry for another date or a competition name.'; return; }
    const r=recBest(sx,c,k,'club');
    if(!v){ h.textContent=r?`Current record ${kgS(r.weight_kg)} kg, ${r.lifter_name}`:'No record yet in this class'; return; }
    if(!r||v>+r.weight_kg){ h.textContent=r?`New club record, +${kgS(v-+r.weight_kg)} kg`:'New club record (first one)'; h.classList.add('up'); }
    else { h.textContent=v===+r.weight_kg?`Equals ${kgS(r.weight_kg)}, first one keeps it`:`Under the record (${kgS(r.weight_kg)}), saves to history only`; h.classList.add('low'); } };
  $('rqkWho').oninput=()=>{ const p=who(); if(p?.sex && !$('rqkCls').value.startsWith(p.sex)) $('rqkCls').value=''; hint(); };
  $('rqkCls').onchange=hint; $('rqkLift').onchange=hint; $('rqkKg').oninput=hint;
  $('rqkKg').onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('rqkGo').click(); } };
  $('rqkMore').onclick=()=>{ const [sx,c]=($('rqkCls').value||'|').split('|'); recAdd({ sex:sx||sex, cat:c||null }); setTimeout(()=>{ const w=document.getElementById('raWho'); if(w&&$('rqkWho')?.value){ w.value=$('rqkWho').value; w.dispatchEvent(new Event('input')); } },120); };
  $('rqkGo').onclick=async()=>{ const name=$('rqkWho').value.trim(), [sx,c]=($('rqkCls').value||'|').split('|'), k=$('rqkLift').value, v=num($('rqkKg').value), p=who(), b=$('rqkGo');
    if(!name){ toast('Who set it?'); $('rqkWho').focus(); return; }
    if(!c){ toast('Pick the weight class'); $('rqkCls').focus(); return; }
    if(!v||v>=600){ toast('Enter the kilos'); $('rqkKg').focus(); return; }
    const r=recBest(sx,c,k,'club'), beats=!r||v>+r.weight_kg;
    const t=new Date(), today=`${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`;
    b.disabled=true;
    const { data, error } = await sb.from('club_records').insert({ level:'club', sex:sx, category:c, lift:k, weight_kg:v, athlete_id:p?.id||null, lifter_name:(p?.full_name||name).slice(0,80), set_on:today }).select('*').single();
    b.disabled=false;
    if(error){ toast(isNetErr(error)?'No signal. Didn’t save.':error.message); return; }
    S.recs=[data,...(S.recs||[])]; S.rqk.kg='';
    toast(beats?`New club record 🏅 ${recLiftName(k)} ${kgS(v)} kg`:'Saved to the record history'); if(beats) prConfetti();
    if(S.recSex!==sx){ S.recSex=sx; store.set('recSex',sx); }
    drawRecords(); };
  hint();
}

async function drawRecords(){
  const [{ data, error }, { data:sy }] = await Promise.all([sb.from('club_records').select('*').order('set_on',{ascending:false}),
    sb.from('app_settings').select('value').eq('key','records_sync').maybeSingle()]);
  S.recSync=sy?.value||{};
  if(S.view!=='prs' || S.prTab!=='records') return;
  const body=$('prBody');
  if(error){ body.innerHTML=`<div class="empty">Couldn’t load the records. ${esc(isNetErr(error)?'Check your signal and try again.':error.message)}</div>`; return; }
  S.recs=data||[];
  S.recSex = S.recSex || store.get('recSex') || (S.profile?.sex==='female'?'female':'male');
  S.recLvl = S.recLvl || store.get('recLvl') || 'club';
  const sex=S.recSex, lv=recLvl(S.recLvl), any=S.recs.some(r=>r.sex===sex&&(r.level||'club')===lv[0]), since=Date.now()-30*86400e3;
  body.innerHTML=`<div class="fm-cats rb-lv">${REC_LEVELS.map(([k,l])=>`<button data-rbl="${k}" class="${k===lv[0]?'on':''}">${l}</button>`).join('')}</div>
    ${lv[0]==='club'?(isCoach()?recQuickHTML(sex):''):recSrcHTML(lv[0])}
    <div class="rb-frame"><div class="rb"><div class="rb-screws"><i></i><i></i><i></i><i></i></div>
      <div class="rb-h"><div class="rb-club">${lv[3]}</div><div class="rb-t rb-gold">${lv[2]}</div>
        <div class="rb-rule">◆</div><div class="rb-sub">Senior · ${sex==='male'?'Men':'Women'}</div></div>
      <div class="rb-sex">${[['male','Men'],['female','Women']].map(([k,l])=>`<button data-rbx="${k}" class="${sex===k?'on':''}">${l}</button>`).join('')}</div>
      <table class="rb-tbl"><thead><tr><th scope="col">Cat</th>${REC_LIFTS.map(([,l])=>`<th scope="col">${l}</th>`).join('')}</tr></thead>
      <tbody>${REC_CATS[sex].map(c=>`<tr><td class="rb-cat">${esc(c)}<small>kg</small></td>${REC_LIFTS.map(([k])=>{ const r=recBest(sex,c,k);
        if(!r) return `<td><button class="rb-c open" data-rbc="${c}|${k}" aria-label="${esc(c)} kg ${recLiftName(k)}: no record yet"><b>${lv[0]==='club'?'OPEN':'–'}</b></button></td>`;
        const fresh=new Date(r.created_at)>since||new Date(r.set_on+'T00:00:00')>since;
        return `<td><button class="rb-c${r.athlete_id&&r.athlete_id===S.user.id?' mine':''}" data-rbc="${c}|${k}" aria-label="${esc(c)} kg ${recLiftName(k)} record ${kgS(r.weight_kg)} kilos, ${esc(r.lifter_name)}">${fresh?'<i>NEW</i>':''}<b class="rb-gold">${kgS(r.weight_kg)}</b><span>${esc(recShort(r.lifter_name))}</span><em>${r.nation&&lv[0]==='world'?esc(r.nation)+' · ':''}${esc(recMon(r.set_on))}</em></button></td>`; }).join('')}</tr>`).join('')}</tbody></table>
      ${!any?`<div class="rb-empty">No ${sex==='male'?'men’s':'women’s'} ${lv[0]==='club'?'club':lv[1]} records in yet.${isCoach()&&lv[0]==='club'?' Use Quick add above to fill the board.':''}</div>`:''}
      <div class="rb-foot">${lv[0]==='club'?'EST. BALCATTA · KG':'SENIOR · KG'}</div>
    </div></div>
    <div class="rb-note"><b>Weight classes</b>These are the IWF senior weight classes that came into effect on 1 August 2026 (men 60, 65, 70, 75, 85, 95, 110, +110 kg; women 49, 53, 57, 61, 69, 77, 86, +86 kg). They replaced the classes used from 1 June 2025, which had replaced the 2018 classes. Records in a class that changed start again from 1 August 2026${lv[0]==='world'?', from World Standards set by the IWF until someone beats them':''}; classes that didn\u2019t change (like men\u2019s 60, 65 and 110) carry their records over.</div>
    <p class="hint" style="margin-top:10px;text-align:center">Tap a record to see who held it before.</p>`;
  document.querySelectorAll('[data-rbx]').forEach(b=>b.onclick=()=>{ S.recSex=b.dataset.rbx; store.set('recSex',S.recSex); drawRecords(); });
  document.querySelectorAll('[data-rbl]').forEach(b=>b.onclick=()=>{ S.recLvl=b.dataset.rbl; store.set('recLvl',S.recLvl); drawRecords(); });
  document.querySelectorAll('[data-rbc]').forEach(b=>b.onclick=()=>{ const [c,k]=b.dataset.rbc.split('|'); recDetail(sex,c,k); });
  if(lv[0]==='club' && isCoach()) recQuickWire(sex);
  if($('rbSync')) $('rbSync').onclick=recSyncNow;
}

function recDetail(sex,cat,lift){
  const lvl=S.recLvl||'club', lv=recLvl(lvl);
  const hist=(S.recs||[]).filter(r=>(r.level||'club')===lvl&&r.sex===sex&&r.category===cat&&r.lift===lift)
    .sort((a,b)=>+b.weight_kg-+a.weight_kg || a.set_on.localeCompare(b.set_on));
  const cur=recBest(sex,cat,lift,lvl), coach=isCoach();
  document.querySelector('.vr-ov')?.remove();
  const ov=document.createElement('div'); ov.className='vr-ov';
  const ttl=`${lvl==='club'?'Club':lv[1]}: ${sex==='male'?'men’s':'women’s'} ${recCatL(cat)} ${recLiftName(lift)}`;
  ov.innerHTML=`<div class="vr-sheet"><div class="vr-h"><b>${esc(ttl)}</b><button class="vr-x" aria-label="Close">✕</button></div>
    ${cur?`<div class="rd-top"><div class="rd-k rb-gold">${kgS(cur.weight_kg)} kg</div><div class="rd-n">${esc(cur.lifter_name)}${cur.nation?` <span style="color:var(--muted);font-weight:400">(${esc(cur.nation)})</span>`:''}</div>
      <div class="rd-m">${cur.lifter_name==='World Standard'?'Set by the IWF for the new classes':fmtDate(cur.set_on+'T00:00:00')+' '+new Date(cur.set_on).getFullYear()}${cur.competition?' · '+esc(cur.competition):''}</div>
      ${cur.note&&cur.lifter_name!=='World Standard'?`<div class="rd-m" style="color:var(--amber)">${esc(cur.note)}</div>`:''}</div>`
      :`<div class="rd-top"><div class="rd-n">No record yet</div><div class="rd-m">This one’s up for grabs.</div></div>`}
    ${hist.length>1||coach&&hist.length?`<div class="card-label" style="margin:6px 0 2px"><span>Record history</span></div><div class="rd-hist">${hist.map((r,i)=>`<div class="rd-row${i===0?' cur':''}"><b>${kgS(r.weight_kg)}</b>
      <div>${esc(r.lifter_name)}${r.nation?' ('+esc(r.nation)+')':''}<span>${esc(fmtDate(r.set_on+'T00:00:00'))} ${new Date(r.set_on).getFullYear()}${r.competition?' · '+esc(r.competition):''}</span></div>
      ${coach&&lvl==='club'?`<button class="rd-del" data-rdel="${r.id}">Delete</button>`:''}</div>`).join('')}</div>`:''}
    ${lvl!=='club'?`<p class="hint" style="margin-top:12px">${lvl==='world'?'From Wikipedia\u2019s list of IWF world records. History builds up here as records are broken. ':''}<a href="${esc(cur?.source_url&&lvl!=='world'?cur.source_url:REC_SRC[lvl][1])}" target="_blank" rel="noopener">See it on ${REC_SRC[lvl][0]} ↗</a></p>`:''}
    ${coach&&lvl==='club'?`<button class="btn primary block" id="rdAdd" style="margin-top:14px">＋ Add a ${esc(recLiftName(lift))} record here</button>`:''}</div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('.vr-x').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  if($('rdAdd')) $('rdAdd').onclick=()=>{ close(); recAdd({ sex, cat, lift, lvl }); };
  ov.querySelectorAll('[data-rdel]').forEach(b=>{ let armed=false; b.onclick=async()=>{
    if(!armed){ armed=true; b.textContent='Tap again'; setTimeout(()=>{ if(b.isConnected){ armed=false; b.textContent='Delete'; } },4000); return; }
    b.disabled=true; const { error } = await sb.from('club_records').delete().eq('id',b.dataset.rdel);
    if(error){ b.disabled=false; toast(error.message); return; }
    S.recs=S.recs.filter(r=>r.id!==b.dataset.rdel); toast('Record entry deleted'); close(); drawRecords(); }; });
}

/* Coach: add records from a comp. One lifter, one category, any of Snatch / C&J / Total (Total fills itself from the two). */
async function recAdd(pre={}){
  const { data:ppl } = await sb.from('profiles').select('id,full_name,sex,active').order('full_name');
  const people=(ppl||[]).filter(p=>(p.full_name||'').trim());
  const today=new Date(); const iso=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  let sex=pre.sex||'male', cat=pre.cat&&REC_CATS[sex].includes(pre.cat)?pre.cat:null, totTouched=false, lvl='club';
  document.querySelector('.vr-ov')?.remove();
  const ov=document.createElement('div'); ov.className='vr-ov';
  ov.innerHTML=`<div class="vr-sheet"><div class="vr-h"><b>Add club records</b><button class="vr-x" aria-label="Close">✕</button></div>
    <div class="vr-f"><label for="raWho">Lifter</label><input id="raWho" list="raPpl" placeholder="Start typing a name" autocomplete="off" style="width:100%">
      <datalist id="raPpl">${people.map(p=>`<option value="${esc(p.full_name)}"></option>`).join('')}</datalist>
      <div class="ra-hint" id="raWhoH">Pick an athlete, or type the name of a past lifter.</div></div>
    <div class="vr-f" id="raNatF" hidden><label for="raNat">Country</label><input id="raNat" placeholder="e.g. CHN" maxlength="40" style="width:100%"></div>
    <div class="vr-f"><label>Men or women</label><div class="ra-seg" id="raSex">${[['male','Men'],['female','Women']].map(([k,l])=>`<button type="button" data-ras="${k}">${l}</button>`).join('')}</div></div>
    <div class="vr-f"><label>Weight class</label><div class="ra-cats" id="raCats"></div></div>
    <div class="ra-lifts">${REC_LIFTS.map(([k,l])=>`<div class="vr-f"><label for="ra_${k}">${l}</label><input id="ra_${k}" inputmode="decimal" placeholder="kg"><div class="ra-hint" id="raH_${k}"></div></div>`).join('')}</div>
    <div class="pr-row"><div class="vr-f"><label for="raDate">Date</label><input id="raDate" type="date" value="${iso}" max="${iso}" style="width:100%"></div>
      <div class="vr-f"><label for="raComp">Competition</label><input id="raComp" placeholder="optional" maxlength="120" style="width:100%"></div></div>
    <button class="btn primary block" id="raGo">Save records</button>
    <p class="vr-tip">Leave a lift empty to skip it. Lifts under the current record are kept in that record’s history only.</p></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove();
  ov.querySelector('.vr-x').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  const num=s=>{ const v=Number(String(s||'').replace(',','.').trim()); return v>0?v:null; };
  const personFor=n=>people.find(p=>p.full_name.trim().toLowerCase()===String(n||'').trim().toLowerCase());
  const draw=()=>{
    ov.querySelectorAll('[data-ras]').forEach(b=>b.classList.toggle('on',b.dataset.ras===sex));
    $('raNatF').hidden=true;
    $('raCats').innerHTML=REC_CATS[sex].map(c=>`<button type="button" data-rac="${c}" class="${c===cat?'on':''}">${c}</button>`).join('');
    $('raCats').querySelectorAll('[data-rac]').forEach(b=>b.onclick=()=>{ cat=b.dataset.rac; draw(); });
    if(!totTouched){ const s=num($('ra_snatch').value), c=num($('ra_cj').value); $('ra_total').value=s&&c?kgS(s+c):''; }
    REC_LIFTS.forEach(([k])=>{ const h=$('raH_'+k), v=num($('ra_'+k).value), r=cat?recBest(sex,cat,k,lvl):null;
      h.className='ra-hint';
      if(!cat){ h.textContent=''; return; }
      if(!r){ h.textContent=v?'New record (none yet)':'No record yet'; if(v) h.classList.add('up'); return; }
      if(!v){ h.textContent=`Record ${kgS(r.weight_kg)}`; return; }
      if(v>+r.weight_kg){ h.textContent=`New record, +${kgS(v-+r.weight_kg)}`; h.classList.add('up'); }
      else if(v===+r.weight_kg){ h.textContent=`Equals ${kgS(r.weight_kg)}, first one keeps it`; h.classList.add('low'); }
      else { h.textContent=`Under ${kgS(r.weight_kg)}, history only`; h.classList.add('low'); } });
  };
  ov.querySelectorAll('[data-ras]').forEach(b=>b.onclick=()=>{ if(sex!==b.dataset.ras){ sex=b.dataset.ras; cat=null; } draw(); });
  ['ra_snatch','ra_cj'].forEach(i=>$(i).addEventListener('input',draw));
  $('ra_total').addEventListener('input',()=>{ totTouched=$('ra_total').value.trim()!==''; draw(); });
  $('raWho').addEventListener('input',()=>{ const p=personFor($('raWho').value), h=$('raWhoH');
    if(p){ h.textContent=`Linked to ${p.full_name}’s account`; h.className='ra-hint up'; if(p.sex&&p.sex!==sex){ sex=p.sex; cat=null; draw(); } }
    else { h.textContent=$('raWho').value.trim()?'Not an athlete in the app. Saved as a name only.':'Pick an athlete, or type the name of a past lifter.'; h.className='ra-hint'; } });
  $('raGo').onclick=async()=>{ const name=$('raWho').value.trim(), btn=$('raGo');
    if(!name){ toast('Who set it?'); $('raWho').focus(); return; }
    if(!cat){ toast('Pick the weight class'); return; }
    const p=personFor(name), date=$('raDate').value||iso, comp=$('raComp').value.trim().slice(0,120)||null;
    const rows=REC_LIFTS.map(([k])=>({ k, v:num($('ra_'+k).value) })).filter(x=>x.v)
      .map(x=>({ level:lvl, nation:lvl==='world'?($('raNat').value.trim().slice(0,40)||null):null, sex, category:cat, lift:x.k, weight_kg:x.v, athlete_id:p?.id||null, lifter_name:(p?.full_name||name).slice(0,80), set_on:date, competition:comp }));
    if(!rows.length){ toast('Enter at least one lift'); return; }
    if(rows.some(r=>r.weight_kg>=600)){ toast('That number looks off'); return; }
    const s=rows.find(r=>r.lift==='snatch'), c=rows.find(r=>r.lift==='cj'), t=rows.find(r=>r.lift==='total');
    if(s&&c&&t&&Math.abs(s.weight_kg+c.weight_kg-t.weight_kg)>0.01 && !btn.dataset.ok){ btn.dataset.ok='1'; toast('Total isn’t Snatch + C&J. Tap Save again to keep it.'); return; }
    const beats=rows.filter(r=>{ const b=recBest(sex,cat,r.lift,lvl); return !b||r.weight_kg>+b.weight_kg; }).length;
    btn.disabled=true; btn.textContent='Saving…';
    const { data, error } = await sb.from('club_records').insert(rows).select('*');
    if(error){ btn.disabled=false; btn.textContent='Save records'; toast(isNetErr(error)?'No signal. Didn’t save.':error.message); return; }
    S.recs=[...(data||[]),...(S.recs||[])]; S.recSex=sex; store.set('recSex',sex); S.recLvl=lvl; store.set('recLvl',lvl); close();
    const lw=lvl==='club'?'club':recLvl(lvl)[1]; toast(beats?`${beats} new ${lw} record${beats>1?'s':''} 🏅`:'Saved to the record history'); if(beats&&lvl==='club') prConfetti();
    if(S.view==='prs'&&S.prTab==='records') drawRecords();
  };
  if(pre.lift) setTimeout(()=>$('ra_'+pre.lift)?.focus(),60); else setTimeout(()=>$('raWho').focus(),60);
  draw();
}

/* ---------- PR Cards ---------- */
function prCardHTML(c, o={}){
  const repLift=REPS_MAX.test(c.lift_name||''), v=kgS(c.weight_kg), prev=kgS(c.previous_kg);
  const diff=c.previous_kg!=null&&c.weight_kg!=null&&+c.weight_kg>+c.previous_kg ? '+'+kgS(+c.weight_kg-+c.previous_kg) : '–';
  const nm=(c.athlete_name||'Athlete').trim(), parts=nm.split(/\s+/);
  const shown = nm.length<=13 ? nm : parts.length>1 ? parts[0]+' '+parts[parts.length-1][0]+'.' : nm;
  const d=c.achieved_on?new Date(c.achieved_on+'T00:00:00'):new Date();
  const dd=d.toLocaleDateString('en-AU',{day:'numeric',month:'short'})+" '"+String(d.getFullYear()).slice(2);
  return `<div class="prc ${c.reps>1&&!repLift?'silver':'gold'}${c.video_path||o.vid?' vid':''}${o.shine?' shine':''}" ${c.id?`data-prc="${c.id}"`:''} role="button" tabindex="0" aria-label="${esc(nm)} ${esc(c.lift_name)} PR ${v}${repLift?' reps':' kilos'}">
    <div class="prc-in">
      <div class="prc-top"><div class="prc-rate"><b class="${v.length>4?'long':''}">${v||'–'}</b><span>${repLift?'REPS':c.reps>1?'KG × '+c.reps:'KG'}</span><i>${esc(prAbbr(c.lift_name))}</i></div>
        <div class="prc-ph">${avIn(c.athlete_id, nm)}</div></div>
      <div class="prc-name">${esc(shown)}</div>
      <div class="prc-lift">${esc(c.lift_name||'Lift')}${c.reps>1&&!repLift?` · ${c.reps}RM`:''}</div>
      <div class="prc-stats"><div><b>${prev||'–'}</b><span>PREV</span></div><div><b>${diff}</b><span>UP</span></div><div><b class="dt">${esc(dd)}</b><span>DATE</span></div></div>
      <div class="prc-foot">REV · NEW PR</div>
    </div>${c.video_path||o.vid?'<span class="prc-play" aria-hidden="true">▶</span>':''}</div>`;
}
const myBump=id=>(S.prBumps?.[id]||[]).some(b=>b.profile_id===S.user.id);
const bumpBtn=c=>{ const n=(S.prBumps?.[c.id]||[]).length; return `<button class="fist ${myBump(c.id)?'on':''}" data-bump="${c.id}" aria-label="Fistbump" aria-pressed="${myBump(c.id)}">👊<b>${n||''}</b></button>`; };
function bumpNames(id){
  const bs=(S.prBumps?.[id]||[]).slice().sort((a,b)=>(b.profile_id===S.user.id)-(a.profile_id===S.user.id));
  if(!bs.length) return 'Be the first to give a fistbump';
  const nm=b=>b.profile_id===S.user.id?'You':esc((b.name||'Athlete').split(' ')[0]);
  if(bs.length<=3) return 'Fistbumps from '+bs.map(nm).join(bs.length===2?' and ':', ').replace(/, ([^,]*)$/,' and $1');
  return `Fistbumps from ${nm(bs[0])}, ${nm(bs[1])} and ${bs.length-2} others`;
}

function drawCardGrid(){
  const f=S.prFilter, list=S.prCards.filter(c=>f==='mine'?c.athlete_id===S.user.id:f==='vid'?!!c.video_path:true);
  $('prGrid').innerHTML = list.length ? `<div class="prc-rail" id="prRail">${list.map(c=>`<div class="prc-item">${prCardHTML(c)}
      <div class="prc-meta"><span>${c.athlete_id===S.user.id?'You':esc((c.athlete_name||'Athlete').split(' ')[0])} · ${timeAgo(c.created_at)}</span>${bumpBtn(c)}</div></div>`).join('')}</div>`
    : `<div class="empty">${f==='mine'?'You haven’t posted a PR card yet.':f==='vid'?'No PR videos yet.':'No PR cards yet. Hit a PR and be the first!'}</div>`;
  // side to side: the card in the middle pops up bigger; tap a side card to bring it to the middle, tap the middle one to open it
  const rail=$('prRail');
  if(rail){
    const items=[...rail.children];
    const pop=()=>{ const mid=rail.scrollLeft+rail.clientWidth/2;
      items.forEach(it=>{ const c=it.offsetLeft+it.offsetWidth/2, t=Math.min(1,Math.abs(c-mid)/it.offsetWidth);
        it.style.transform=`scale(${(1-0.16*t).toFixed(3)})`; it.style.opacity=(1-0.45*t).toFixed(2); it.classList.toggle('mid',t<0.3); }); };
    let raf; rail.addEventListener('scroll',()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(pop); },{passive:true});
    pop(); requestAnimationFrame(pop);
    rail.querySelectorAll('[data-prc]').forEach(el=>{ const it=el.closest('.prc-item');
      el.onclick=()=>{ if(it.classList.contains('mid')) openPR(el.dataset.prc); else rail.scrollTo({left:it.offsetLeft+it.offsetWidth/2-rail.clientWidth/2,behavior:'smooth'}); };

  }

  $('prGrid').querySelectorAll('[data-bump]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); toggleBump(b.dataset.bump, b); });

function syncBump(id){
  document.querySelectorAll(`[data-bump="${id}"]`).forEach(b=>{ const on=myBump(id), n=(S.prBumps[id]||[]).length;
    b.classList.toggle('on',on); b.setAttribute('aria-pressed',on);
    if(b.classList.contains('pr-bumpbig')) b.innerHTML=`<i>👊</i>${on?'You fistbumped this':'Give a fistbump'}${n?` · ${n}`:''}`;
    else b.innerHTML=`👊<b>${n||''}</b>`; });
  document.querySelectorAll(`[data-bumpnames="${id}"]`).forEach(e=>e.innerHTML=bumpNames(id));
}
async function toggleBump(id, btn){
  if(toggleBump.busy?.[id]) return; toggleBump.busy={...(toggleBump.busy||{}),[id]:true};
  const was=myBump(id); S.prBumps[id]=S.prBumps[id]||[];
  if(was) S.prBumps[id]=S.prBumps[id].filter(b=>b.profile_id!==S.user.id);
  else { S.prBumps[id].push({ card_id:id, profile_id:S.user.id, name:S.profile?.full_name||'' });
    btn.classList.remove('pop'); void btn.offsetWidth; btn.classList.add('pop'); fistFly(btn); }
  syncBump(id);
  const { error } = was ? await sb.from('pr_fistbumps').delete().eq('card_id',id).eq('profile_id',S.user.id)
                        : await sb.from('pr_fistbumps').insert({ card_id:id });
  toggleBump.busy[id]=false;
  if(error && !/duplicate/i.test(error.message)){ // put it back
    if(was) S.prBumps[id].push({ card_id:id, profile_id:S.user.id, name:S.profile?.full_name||'' }); else S.prBumps[id]=S.prBumps[id].filter(b=>b.profile_id!==S.user.id);
    syncBump(id); toast(isNetErr(error)?'No signal. Fistbump didn’t send.':error.message); }
}
function fistFly(el){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const r=el.getBoundingClientRect(); const f=document.createElement('div'); f.className='fist-fly'; f.textContent='👊';
  f.style.left=(r.left+r.width/2)+'px'; f.style.top=(r.top+r.height/2)+'px'; document.body.appendChild(f); setTimeout(()=>f.remove(),950);
}
function prConfetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='pr-confetti'; const dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; document.body.appendChild(cv);
  const x=cv.getContext('2d'); x.scale(dpr,dpr);
  const cols=['#c8f06a','#f7d36a','#ffffff','#e9c45a','#5ab4ff','#ff7a7a'];
  const ps=Array.from({length:150},()=>({ x:innerWidth/2+(Math.random()-.5)*80, y:innerHeight*.38, vx:(Math.random()-.5)*14, vy:-Math.random()*15-4,
    s:Math.random()*7+4, r:Math.random()*6, vr:(Math.random()-.5)*.35, c:cols[Math.floor(Math.random()*cols.length)] }));
  const t0=performance.now();
  (function f(t){ const el=t-t0; x.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{ p.vy+=.38; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.globalAlpha=Math.max(0,1-el/2600); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); x.restore(); });
    if(el<2600) requestAnimationFrame(f); else cv.remove(); })(t0);
}

  document.body.appendChild(ov); document.body.style.overflow='hidden';
  const close=()=>{ ov.remove(); document.body.style.overflow=''; if(/^#pr\//.test(location.hash)) history.replaceState(null,'',location.pathname); if(S.prTab==='cards'&&$('prGrid')) drawCardGrid(); };

    b.disabled=true;

/* Post a PR card. pre: { lift, kg, reps, prev, maxDone } (from saving a new max) */

function ytId(u){ if(!safeYoutube(u)) return null; const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m?m[1]:null; }
function inlineMd(t){
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$|[.,!?])/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(text){
  const lines=esc(text||'').split('\n'); let out='', list=false, para=[];
  const flush=()=>{ if(para.length){ out+='<p>'+inlineMd(para.join('<br>'))+'</p>'; para=[]; } };
  for(const raw of lines){ const l=raw.trimEnd();
    if(/^- /.test(l)){ flush(); if(!list){ out+='<ul>'; list=true; } out+='<li>'+inlineMd(l.slice(2))+'</li>'; continue; }
    if(list){ out+='</ul>'; list=false; }
    if(/^#{1,3} /.test(l)){ flush(); out+='<h3>'+inlineMd(l.replace(/^#{1,3} /,''))+'</h3>'; continue; }
    if(!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); if(list) out+='</ul>'; return out;
}
const plain=t=>String(t||'').replace(/[#*_>\[\]()-]/g,' ').replace(/https:\/\/\S+/g,'').replace(/\s+/g,' ').trim();

async function fetchPosts(reset){
  const F=S.forum, PER=15;
  if(reset){ F.page=0; F.done=false; $('fmList').innerHTML='<div class="empty">Loading…</div>'; }
  let q=sb.from('posts').select('id,title,body,category,video_url,pinned,status,created_at')
    .order('pinned',{ascending:false}).order('created_at',{ascending:false}).range(F.page*PER, F.page*PER+PER-1);
  if(F.cat!=='All') q=q.eq('category',F.cat);
  const term=F.q.replace(/[,()*:%\\."']/g,' ').trim();
  if(term) q=q.or(`title.ilike.*${term}*,body.ilike.*${term}*`);
  const { data, error } = await q;
  if(error){ $('fmList').innerHTML=`<div class="empty">${esc(error.message)}</div>`; return; }
  const ids=data.map(p=>p.id);
  const [c,r]=ids.length?await Promise.all([
    sb.from('post_comments').select('post_id').in('post_id',ids),
    sb.from('post_reactions').select('post_id,kind').in('post_id',ids)]):[{data:[]},{data:[]}];
  const cc={}, rc={}; (c.data||[]).forEach(x=>cc[x.post_id]=(cc[x.post_id]||0)+1);
  (r.data||[]).forEach(x=>{ (rc[x.post_id]=rc[x.post_id]||{})[x.kind]=(rc[x.post_id][x.kind]||0)+1; });
  const html=data.map(p=>{ const id=ytId(p.video_url); const ex=plain(p.body);
    return `<a class="fm-card" href="#post/${p.id}">
      ${id?`<div class="fm-thumb" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')"><span>▶</span></div>`:''}
      <div class="fm-body"><div class="fm-meta"><span class="tag cat">${esc(p.category)}</span>${p.created_at>(S.forumPrevSeen||'')&&p.status==='published'?'<span class="tag newtag">New</span>':''}${p.pinned?'<span class="tag pin">📌 Pinned</span>':''}${p.status==='draft'?'<span class="tag reminder">Draft</span>':''}<span class="hint">${fmtDate(p.created_at)}</span></div>
        <div class="fm-t">${esc(p.title)}</div>
        ${ex?`<div class="fm-ex">${esc(ex.slice(0,170))}${ex.length>170?'…':''}</div>`:''}
        <div class="fm-stats">${REACTS.map(([k,e])=>rc[p.id]?.[k]?`<span>${e} ${rc[p.id][k]}</span>`:'').join('')}<span>💬 ${cc[p.id]||0}</span></div></div></a>`; }).join('');
  if(reset) $('fmList').innerHTML = html || `<div class="card"><div class="empty">${F.q||F.cat!=='All'?'Nothing matches that. Try another word.':'No posts yet.'}</div></div>`;
  else $('fmList').insertAdjacentHTML('beforeend',html);
  F.done=data.length<PER; F.page++;
  $('fmMore').innerHTML=F.done?'':'<button class="btn block" id="fmMoreBtn">Load older posts</button>';
  $('fmMoreBtn') && ($('fmMoreBtn').onclick=()=>fetchPosts(false));
}

const BK_DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const bkYmd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const bkToday=()=>new Date(new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Perth'})+'T00:00:00');

async function loadBookInApp(){
  const { data:cls, error } = await sb.from('classes').select('id,name,program,dow,start_time,end_time,capacity,coach,group_ids').eq('active',true).eq('open_session',false).order('start_time');
  if(error || !cls || !cls.length) return false;
  const gids=new Set(((await sb.from('group_members').select('group_id').eq('profile_id',S.user.id)).data||[]).map(r=>r.group_id));
  const mineCls=cls.filter(c=>isCoach() || c.group_ids.some(g=>gids.has(g)));
  const t0=bkToday(), days=[...Array(14)].map((_,i)=>{ const d=new Date(t0); d.setDate(d.getDate()+i); return d; });
  const from=bkYmd(days[0]), to=bkYmd(days[13]);
  const [cnt, my, cx, code] = await Promise.all([
    sb.rpc('class_counts',{p_from:from,p_to:to}),
    sb.from('class_bookings').select('id,class_id,class_date,status').eq('profile_id',S.user.id).eq('status','booked').gte('class_date',from).order('class_date'),
    sb.from('class_cancellations').select('class_id,class_date,note').eq('status','cancelled').gte('class_date',from).lte('class_date',to),
    sb.from('checkin_codes').select('code').eq('profile_id',S.user.id).maybeSingle()
  ]);
  S.bk={ cls, mine:mineCls, days, counts:cnt.data||[], my:my.data||[], cx:cx.data||[], code:code.data?.code||null, day:S.bk?.day && S.bk.day>=from && S.bk.day<=to ? S.bk.day : from };
  renderBookInApp();
  return true;
}
function renderBookInApp(){
  const B=S.bk, today=bkYmd(bkToday()), nowMin=bkNowMin();
  const started=(c,ds)=>ds<today || (ds===today && bkMin(c.start_time)<=nowMin);
  const count=(c,ds)=>(B.counts.find(x=>x.class_id===c.id && x.class_date===ds)||{}).booked||0;
  const myB=(c,ds)=>B.my.find(b=>b.class_id===c.id && b.class_date===ds);
  const dowOf=ds=>{ const j=new Date(ds+'T00:00:00').getDay(); return j===0?7:j; };
  const upcoming=B.my.map(b=>({b,c:B.cls.find(c=>c.id===b.class_id)})).filter(x=>x.c && !started(x.c,x.b.class_date))
    .sort((a,b)=>a.b.class_date.localeCompare(b.b.class_date) || a.c.start_time.localeCompare(b.c.start_time));
  const dayCls=B.mine.filter(c=>c.dow===dowOf(B.day));
