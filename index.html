<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rev">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<title>Rev Barbell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Caveat:wght@500;700&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#4a4a48;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12);
  --red:#ff5a5a; --red-dim:rgba(255,90,90,0.14);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --purple:#b08fff; --purple-dim:rgba(176,143,255,0.13);
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh;padding:calc(22px + env(safe-area-inset-top,0px)) 26px calc(80px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--border2)}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
h1{font-size:28px;font-weight:300;letter-spacing:-.02em}
h1 b{font-weight:500}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--border2)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:#000}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%;padding:11px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.card-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:3px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.views button{background:none;border:0;border-radius:20px;padding:7px 15px;color:var(--muted);font-size:13px;white-space:nowrap}
.views button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:24px 0}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* week + day nav */
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.cal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-bottom:14px;overscroll-behavior-x:contain}
.cal::-webkit-scrollbar{display:none}
.cal-wk{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always}
.cal .strip{margin-bottom:0}
#title{display:inline-block;vertical-align:middle}
.today-btn{vertical-align:middle;margin-left:10px;background:var(--accent);color:#0b0d05;border:0;border-radius:999px;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:4px 10px;position:relative;top:2px}
.wk-nav .lbl{flex:1;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.wk-nav button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:30px;color:var(--muted)}
.wk-nav button:disabled{opacity:.3}
.strip{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;margin-bottom:14px}
.dy{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px;text-align:center;color:var(--muted)}
.dy .n{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.dy .d{font-size:16px;font-weight:500;color:var(--text);margin-top:2px}
.dy .dot{width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:transparent}
.dy .dot.done{background:var(--accent)} .dy .dot.part{background:var(--amber)}
.dy .dot.miss{background:var(--red)} .dy .dot.up{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.wk-nav .lbl .wk-dates{display:block;font-size:11px;letter-spacing:.02em;text-transform:none;color:var(--text);margin-top:2px}
.strip.wk7{grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.strip.wk7 .dy{padding:8px 0}
.strip.wk7 .dy .d{font-size:15px}
.strip.wk7 .dy .d.dn{font-size:13px;margin-top:4px}
.strip.wk7 .dy .n{font-size:10px}
.dy.rest{opacity:.45}
.dy.today .n{color:var(--accent)}
.dy.on{border-color:var(--accent);background:var(--surface2)}

/* program block */
.prog-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.prog-h h2{font-size:17px;font-weight:500}
.pill{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.pill.technical{background:var(--blue-dim);color:var(--blue)}
.pill.strength{background:var(--purple-dim);color:var(--purple)}
.pill.other,.pill.accessory{background:var(--surface2);color:var(--muted)}
.pill.draft{background:var(--amber-dim);color:var(--amber)}
.pill.published{background:var(--accent-dim);color:var(--accent)}
details.notes{margin:4px 0 2px}
details.notes summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
details.notes summary::before{content:'+ '}
details.notes.sn summary{display:inline-block;padding:5px 12px;border:1px solid var(--border2);border-radius:20px;color:var(--text);margin:2px 0}
details.notes.sn[open] summary{border-color:var(--accent);color:var(--accent)}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(200,240,106,0)}50%{box-shadow:0 0 14px 2px rgba(200,240,106,.38)}}
.glow{animation:glowPulse 2.4s ease-in-out infinite;border-color:rgba(200,240,106,.65)!important;color:var(--accent)!important}
@media (prefers-reduced-motion:reduce){.glow{animation:none;box-shadow:0 0 10px 1px rgba(200,240,106,.3)}}
details.notes[open] summary::before{content:'– '}
details.notes p{font-size:13px;line-height:1.55;color:var(--text);margin-top:8px;white-space:pre-line}

/* exercise */
.ex{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.ex-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.slot{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-dim);border-radius:4px;padding:2px 6px;margin-top:2px}
.ex-n{font-size:15px;font-weight:500;flex:1;line-height:1.3}
.ex-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ex-btns .btn.on{border-color:var(--accent);color:var(--accent)}
.nbox{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;margin:4px 0 10px}
.nbox textarea,.card textarea{width:100%;resize:vertical;min-height:64px;background:var(--bg);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:9px 10px;font-size:14px;line-height:1.4}
.nbox-a{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px}
.nprev{font-size:13px;color:var(--muted);border-top:1px solid var(--border);margin-top:8px;padding-top:8px;white-space:pre-wrap}
.nprev span{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.card.note .note-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.card.note .note-b{white-space:pre-wrap;line-height:1.45;font-size:14px}
.card.note .note-a{margin-top:10px;gap:6px}
.card select#nEx,.card.note select{width:100%}
.rx{font-size:13px;color:var(--text);line-height:1.6;margin:2px 0 6px}
.rx .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rx .sr{font-family:"DM Mono",monospace;min-width:52px;color:var(--muted);white-space:nowrap}
.rx .kg{color:var(--accent);font-weight:500}
.rx .nt{font-size:12px;color:var(--muted)}
.rx .wu-line{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;margin-bottom:2px}
.rx .wu-line b{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.opt-pick{display:flex;gap:4px;padding:3px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);margin-top:10px;overflow-x:auto}
.opt-pick button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:calc(var(--radius-sm) - 3px);font-weight:600;font-size:13px}
.opt-pick button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.part + .part{border-top:1px dashed var(--border);margin-top:16px;padding-top:4px}
.part-h{display:flex;align-items:center;gap:8px;margin-top:14px}
.info{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;line-height:1.55;margin:6px 0 8px;white-space:pre-line}
.info .lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.info .blk+.blk{margin-top:8px}
.last{font-size:12px;color:var(--muted);margin-bottom:8px}
.last b{color:var(--text);font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.set-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.set-lbl b{color:var(--text);font-weight:600}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 62px 38px;gap:6px;align-items:center}
.set .no{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);text-align:center}
.set .tg{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set.extra .tg{color:var(--accent);display:flex;align-items:center;gap:5px}
.set.extra .xl{overflow:hidden;text-overflow:ellipsis;min-width:0}
.set.extra.top .tg{color:var(--blue)}
.set.extra .no{color:var(--muted)}
.add-sets{display:flex;gap:6px}
.rm-set{border:1px solid var(--border2);background:var(--surface2);color:var(--muted);border-radius:50%;width:22px;height:22px;font-size:11px;line-height:1;padding:0;flex:none}
.add-set{display:block;flex:1;width:100%;margin-top:8px;border:1px dashed var(--border2);background:transparent;color:var(--muted);border-radius:var(--radius-sm);padding:8px;font-size:13px}
.add-set:active{border-color:var(--accent);color:var(--accent)}
.set input{width:100%;text-align:right;font-size:15px;padding:8px}
.set input.saved{border-color:rgba(200,240,106,.4)}
.set .mk{height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:15px}
.set .mk.made{color:var(--accent);border-color:rgba(200,240,106,.4)}
.set .mk.miss{color:var(--red);border-color:rgba(255,90,90,.4)}
.set-head{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 62px 38px;gap:6px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.set-head span:nth-child(3),.set-head span:nth-child(4){text-align:right;padding-right:8px}
.done-bar{display:flex;gap:8px;align-items:center;margin-top:4px}
/* conditioning pieces: the workout written out, then one score */
.pill.cond{background:var(--amber-dim);color:var(--amber)}
.cond-body{font-size:14px;line-height:1.6;white-space:pre-line;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;margin:2px 0 10px}
.cond-log{display:grid;gap:8px}
.cond-lbl{font-size:12px;color:var(--muted)}
.cond-lbl b{color:var(--text);font-weight:600}
.cond-in{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cond-in label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.cond-in input{width:96px;text-align:right;font-size:16px;padding:8px}
.cond-in input.wide{width:100%;text-align:left}
.cond-in .t-in{display:flex;gap:8px;align-items:center}
.cond-in .t-in input{width:64px}
.cond-in input.saved,.cond-note.saved{border-color:rgba(200,240,106,.4)}
.cond-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg2{display:inline-flex;border:1px solid var(--border);border-radius:var(--radius-sm);padding:2px;background:var(--bg)}
.seg2 button{border:0;background:transparent;color:var(--muted);padding:6px 12px;border-radius:calc(var(--radius-sm) - 3px);font-weight:600;font-size:12px}
.seg2 button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.cond-note{flex:1;min-width:140px;font-size:13px;padding:8px}
.cond-done{border:1px solid var(--border);background:var(--surface2);color:var(--muted);border-radius:var(--radius-sm);padding:9px 14px;font-weight:600}
.cond-done.on{color:var(--accent);border-color:rgba(200,240,106,.4)}
.hist-ex .sc{color:var(--text)}

/* lists */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .l b{font-weight:500;display:block}
.row .l span{font-size:12px;color:var(--muted)}
.row .r{font-family:'DM Mono',monospace;font-size:14px;text-align:right;white-space:nowrap}
.inline{display:flex;gap:6px;align-items:center}
.inline input{width:80px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 10px;margin:4px 4px 0 0}
.chip button{background:none;border:0;color:var(--dim);font-size:14px;padding:0 5px}
.chip button:hover{color:var(--red)}
.chips-add{display:flex;gap:6px;margin-top:8px}
.chips-add select{flex:1}
.hist-ex{font-size:13px;margin-top:6px}
.hist-ex span{color:var(--muted)}

/* auth */
.auth{max-width:400px;margin:40px auto 0}
.auth label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.auth input{width:100%;padding:12px;font-size:16px}
.msg{margin-top:12px;font-size:13px;min-height:18px}
.msg.err{color:var(--red)} .msg.ok{color:var(--accent)}
.toggle{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
.toggle a{color:var(--text);cursor:pointer;text-decoration:underline}

/* home: comp banner */
.ev-wrap{margin-bottom:12px}
.ev-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.ev-track::-webkit-scrollbar{display:none}
.comp{position:relative;flex:0 0 100%;scroll-snap-align:start;height:clamp(190px,41vw,300px);border-radius:16px;overflow:hidden;border:1px solid var(--border2);background:#08080e}
.comp.party .k{color:#ffd36b}
.jlights{position:absolute;top:12px;right:14px;display:flex;gap:6px;background:#0b0b12;border:1px solid #2a2c3e;border-radius:6px;padding:5px 7px}
.jlights i{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7);animation:glow 2.2s ease-in-out infinite}
.jlights i:nth-child(2){animation-delay:.2s}.jlights i:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.jlights i{animation:none}}
.ev-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.ev-dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--dim)}
.ev-dots button.on{background:var(--accent);width:18px;border-radius:4px}
.comp svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.comp-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,12,0) 0%,rgba(5,6,12,0) 50%,rgba(5,6,12,.62) 74%,rgba(5,6,12,.82) 100%)}
.comp-txt{position:absolute;right:16px;top:50%;transform:translateY(-50%);text-align:right;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.7);max-width:58%}
.comp .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.comp .t{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:3px;line-height:1.1}
.comp .cd{font-family:'DM Mono',monospace;font-size:21px;letter-spacing:-.02em;margin-top:6px;line-height:1.1;white-space:nowrap}
.comp .cd small{font-family:'DM Sans',sans-serif;font-size:10px;color:rgba(255,255,255,.7);margin:0 3px 0 1px}
.comp .cd-day{font-family:'DM Sans',sans-serif;font-size:15px}
.comp .d{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:.95}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.comp .tw{animation:twinkle 3s ease-in-out infinite}
.comp .gl{animation:glow 2.2s ease-in-out infinite}
.comp .bb{animation:bob 2.6s ease-in-out infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(215px)}}
.comp .sn{animation:fall 7s linear infinite}
@media (prefers-reduced-motion:reduce){.comp .tw,.comp .gl,.comp .bb,.comp .sn{animation:none}.comp .sn{display:none}}
.ev-more{margin:-4px 0 10px}

/* home: from the coach */
.brief{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(200,240,106,.07),rgba(200,240,106,0) 70%),var(--surface);border:1px solid rgba(200,240,106,.28);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.brief-top{display:flex;align-items:flex-end;gap:12px;margin:-8px 0 0}
.coach-fig{width:112px;flex:none;margin-left:-10px}
.coach-fig svg{width:100%;height:auto;display:block}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.coach-fig .br{animation:breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.coach-fig .br{animation:none}}
.brief-top .brief-h{flex:1;min-width:0;padding-bottom:14px}
.bubble{position:relative;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:14px 16px}
.bubble::before{content:'';position:absolute;left:44px;top:-8px;width:14px;height:14px;background:var(--surface2);border-left:1px solid var(--border2);border-top:1px solid var(--border2);transform:rotate(45deg)}
.brief-h{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#000;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.brief-k{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brief-n{font-size:14px;font-weight:500}
.brief-n span{color:var(--muted);font-weight:400;font-size:12px}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.tag.reminder{background:var(--amber-dim);color:var(--amber)} .tag.focus{background:var(--blue-dim);color:var(--blue)}

.pod.bronze .pod-m{background:radial-gradient(circle at 35% 30%,#f2c7a0,#b06a35)}
.pod-n{font-size:16px;font-weight:500}
.pod-d{font-size:12px;color:var(--muted)} .pod-d b{color:var(--text)}
.wk-top{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none;transform:rotate(-90deg)}
.ring text{transform:rotate(90deg);transform-origin:42px 42px}

.wk-msg{font-size:14px;line-height:1.45;margin-bottom:12px}

.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:10px;color:var(--dim)}
.wd i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;background:var(--surface2);border:1.5px solid transparent}
.wd.prog i{border-color:var(--border2)}
.wd.today i{border-color:var(--accent)} .wd.today span{color:var(--accent)}
.wd.done i{background:var(--accent)} .wd.done span{color:var(--text)}
.wd.miss i{background:var(--red-dim);border-color:rgba(255,90,90,.35)}
.hero{display:grid;grid-template-columns:136px 1fr;background:var(--surface);border:1px solid var(--border2);border-radius:16px;overflow:hidden;margin-bottom:14px}
.hero-m{padding:14px 16px 14px 14px;display:flex;flex-direction:column;min-width:0}
.hero .k{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.hero .k.mute{color:var(--muted)}
.hero-t{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1.15;margin-top:4px}
.hero-s{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.35}
.hero-b{margin-top:auto;padding-top:10px;padding-bottom:10px}
.hero-m .hero-s+.hero-b{margin-top:12px}
.pad{position:relative;margin:12px 0 12px 12px;align-self:start;border-radius:4px 4px 6px 6px;padding:20px 6px 8px 18px;font-family:'Caveat',cursive;color:#1d2a08;transform:rotate(-2deg);box-shadow:0 6px 14px rgba(0,0,0,.45);
 background:repeating-linear-gradient(to bottom,transparent 0 17px,rgba(40,70,10,.18) 17px 18px),linear-gradient(#e4f8a8,#cfec7c);background-position:0 15px,0 0;min-height:118px}
.pad::before{content:'';position:absolute;left:14px;top:0;bottom:0;border-left:1.5px solid rgba(29,42,8,.25)}
.pad .rings{position:absolute;top:-6px;left:10px;right:10px;display:flex;justify-content:space-between}
.pad .rings i{width:6px;height:14px;border-radius:4px;background:linear-gradient(90deg,#777,#ddd,#888);box-shadow:0 1px 2px rgba(0,0,0,.5)}
.pad .hd{font-size:18px;font-weight:700;line-height:18px;margin-bottom:0}
.pad .ln{font-size:17px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pad .ln b{font-weight:700}
.pad .ln.pl{display:flex;gap:3px}.pad .ln.pl span{overflow:hidden;text-overflow:ellipsis;min-width:0}.pad .ln.pl b{flex-shrink:0;font-size:15px}

.next{border-color:rgba(200,240,106,.25)}

.streak{display:flex;gap:10px}
.streak>div{flex:1;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px}
.st-n{font-size:24px;font-weight:500}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.bcol{text-align:center;font-size:9px;color:var(--muted)}
.bwrap{position:relative;height:64px;display:flex;align-items:flex-end;justify-content:center}
.b{width:100%;max-width:18px;border-radius:3px 3px 1px 1px;background:var(--dim)}
.b.part{background:var(--amber)} .b.hit{background:var(--accent)}
.tline{position:absolute;left:0;right:0;border-top:1px dashed var(--border2)}

.card.latest{display:block;color:var(--text);text-decoration:none}
/* forum */
.fm-top{display:flex;gap:8px;margin-bottom:10px}
.fm-search{flex:1}

.fm-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag.cat{background:var(--accent-dim);color:var(--accent)} .tag.pin{background:var(--surface2);color:var(--text)}
.fm-t{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em}

.bk-left b{color:var(--accent)}
.bk-code{display:flex;justify-content:space-between;align-items:center;gap:12px}

.bk-code span{font-family:'DM Mono',ui-monospace,monospace;font-size:24px;letter-spacing:.15em;color:var(--accent)}

.bk-days button{flex:0 0 auto;width:52px;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative;color:var(--text)}
.bk-days button span{font-size:10.5px;color:var(--muted)}

.bk-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border)}

.bk-time{font-size:11.5px;color:var(--muted);font-family:'DM Mono',ui-monospace,monospace}
.bk-act{display:flex;align-items:center;gap:6px;flex-shrink:0}
.bk-tag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.bk-tag.in{background:var(--accent-dim);color:var(--accent)}
.bk-tag.full{background:var(--amber-dim);color:var(--amber)}
.pay-test{background:rgba(90,180,255,.1);border:1px solid rgba(90,180,255,.35);color:#cfe6ff;border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.45}
.pay-note{border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;background:var(--surface2)}
.pay-note.ok{background:var(--accent-dim);color:var(--accent)} .pay-note.err{background:rgba(255,90,90,.12);color:#ff8a8a}
.pay-fail{display:grid;gap:3px;background:rgba(255,90,90,.1);border:1px solid rgba(255,90,90,.4);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:13px;line-height:1.45}
.pay-fail b{color:#ff8a8a}
.pay-fail .pay-again{margin-top:10px}
.pay-alert{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;background:linear-gradient(180deg,rgba(229,72,77,.22),rgba(229,72,77,.12));border:1.5px solid #e5484d;border-radius:16px;padding:16px;margin-bottom:14px}

.pay-alert span{font-size:13.5px;line-height:1.45;color:#ffd5d6}

.pay-next{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}

.pay-next span{color:var(--muted);font-size:13px}
.pay-pm{display:flex;gap:12px;align-items:center}
.pay-pm b{font-weight:500}
.pay-ic{font-size:24px}
.pay-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.pay-row:last-child{border-bottom:0}
.pay-row b{font-weight:500}
.pay-st{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.pay-st.ok{background:var(--accent-dim);color:var(--accent)} .pay-st.proc{background:rgba(90,180,255,.12);color:#5ab4ff} .pay-st.bad{background:rgba(255,90,90,.12);color:#ff8a8a}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:12px}
.post{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px}
.post-t{font-size:24px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin:4px 0 12px}
.post-by{display:flex;align-items:center;gap:10px;margin-bottom:14px}

.mini-av{width:40px;height:40px;border-radius:50%;background:var(--surface2);overflow:hidden;flex:none;border:1px solid var(--border2)}

.yt{position:relative;aspect-ratio:16/9;border-radius:var(--radius-sm);overflow:hidden;background:#000;margin-bottom:14px}

/* nav */

/* ---------- PRs: Blackboard + PR Cards ---------- */
.pr-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}

/* the blackboard */
.bb-frame{position:relative;border-radius:14px;padding:10px 10px 18px;background:linear-gradient(90deg,#5b3b20,#7a5230 18%,#6a4527 50%,#80583a 78%,#5b3b20);box-shadow:0 10px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.bb{position:relative;border-radius:6px;padding:14px 12px 12px;color:#eef0ea;font-family:'Caveat',cursive;
  background:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(255,255,255,.07),transparent 70%),radial-gradient(ellipse 50% 35% at 82% 78%,rgba(255,255,255,.05),transparent 70%),radial-gradient(ellipse 30% 20% at 60% 30%,rgba(255,255,255,.035),transparent 70%),#1f2d26;
  box-shadow:inset 0 0 36px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.4)}
.bb *{text-shadow:0 0 1px rgba(255,255,255,.55),0 0 7px rgba(255,255,255,.1)}
.bb-tray{position:absolute;left:8%;right:8%;bottom:4px;height:8px;border-radius:2px;background:linear-gradient(#8a6040,#4d3119)}
.bb-tray i{position:absolute;top:-3px;width:22px;height:6px;border-radius:3px;background:#f2f1ea;box-shadow:0 1px 1px rgba(0,0,0,.4)}
.bb-tray i:nth-child(1){left:12%} .bb-tray i:nth-child(2){left:20%;width:14px;background:#f7d36a;transform:rotate(-8deg)} .bb-tray i:nth-child(3){right:16%;width:30px;height:10px;top:-6px;background:#c9b48a;border-radius:2px}
.bb-h{text-align:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1.5px dashed rgba(255,255,255,.22)}
.bb-t{font-size:40px;font-weight:700;line-height:1;letter-spacing:.02em;transform:rotate(-1.2deg)}
.bb-s{font-size:17px;opacity:.75;margin-top:2px}
.bb-best{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px 2px 8px;border-bottom:1.5px dashed rgba(255,255,255,.22);margin-bottom:8px}
.bb-best::-webkit-scrollbar{display:none}
.bb-best span{flex:none;border:1.5px solid rgba(255,255,255,.35);border-radius:14px 10px 16px 9px;padding:2px 10px 3px;font-size:18px;line-height:1.15;white-space:nowrap}
.bb-best em{font-style:normal;color:#f7d36a;margin-right:4px} .bb-best small{font-size:15px;opacity:.75;margin-left:4px}
.bb-tools{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.bb-tools input{background:rgba(255,255,255,.06);border:1px dashed rgba(255,255,255,.3);border-radius:8px;color:#eef0ea;font-family:'Caveat',cursive;font-size:20px;padding:3px 10px;width:100%}
.bb-tools input::placeholder{color:rgba(238,240,234,.45)}
.bb-grp{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none} .bb-grp::-webkit-scrollbar{display:none}
.bb-grp button{flex:none;background:none;border:1.5px solid rgba(255,255,255,.25);border-radius:12px;color:#eef0ea;font-family:'Caveat',cursive;font-size:18px;padding:0 10px;line-height:1.4}
.bb-grp button.on{border-color:#f7d36a;color:#f7d36a}
.bb-scroll{overflow:auto;max-height:62vh;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;margin:0 -4px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.25) transparent}
.bb-tbl{border-collapse:separate;border-spacing:0;min-width:100%;font-size:21px}
.bb-tbl th,.bb-tbl td{padding:3px 8px;text-align:center;white-space:nowrap;border-bottom:1.5px dashed rgba(255,255,255,.13)}
.bb-tbl thead th{position:sticky;top:0;z-index:2;background:#1f2d26;font-weight:700;font-size:20px;color:#f7d36a;cursor:pointer;user-select:none;border-bottom:2px solid rgba(255,255,255,.35)}

/* PR cards */
.pr-new{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px dashed var(--accent);background:var(--accent-dim);color:var(--accent);border-radius:var(--radius);padding:14px;font-size:15px;font-weight:600;margin-bottom:12px}
.prc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px 12px}
.prc-item{display:flex;flex-direction:column;gap:6px;min-width:0}

@keyframes fistPop{0%{transform:scale(1)}35%{transform:scale(1.35) rotate(-12deg)}70%{transform:scale(.92)}100%{transform:scale(1)}}

@keyframes fistFly{0%{opacity:1;transform:translate(-50%,-50%) scale(.6)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%) scale(1.6) rotate(-14deg)}}

.prc{position:relative;width:100%;aspect-ratio:.7;container-type:inline-size;cursor:pointer;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45));-webkit-tap-highlight-color:transparent}
.prc-in{position:absolute;inset:0;overflow:hidden;clip-path:polygon(0 7%,9% 3%,17% 0,83% 0,91% 3%,100% 7%,100% 87%,82% 93%,50% 100%,18% 93%,0 87%);
  color:#3a2806;background:linear-gradient(155deg,#fff4bf 0%,#f0cf6a 22%,#c9972f 48%,#f6dc83 70%,#b8862b 100%);display:flex;flex-direction:column;padding:8cqw 9cqw 0}
.prc-in::before{content:'';position:absolute;inset:3.2cqw;box-shadow:inset 0 0 0 .9cqw rgba(255,255,255,.45);pointer-events:none;
  clip-path:polygon(0 7%,9% 3%,17% 0,83% 0,91% 3%,100% 7%,100% 87%,82% 93%,50% 100%,18% 93%,0 87%)}
.prc-in::after{content:'';position:absolute;inset:-40%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.5) 48%,transparent 56%);transform:translateX(-60%);pointer-events:none}

.prc-rate{display:flex;flex-direction:column;align-items:center;width:30cqw;flex:none;line-height:.9}
.prc-rate b{font-size:20cqw;font-weight:700;letter-spacing:-.04em}
.prc-rate b.long{font-size:15cqw}
.prc-rate span{font-size:6.5cqw;font-weight:600;letter-spacing:.06em;margin-top:1cqw}

.prc-ph{flex:1;aspect-ratio:1;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.14);display:flex;align-items:center;justify-content:center;font-size:14cqw;font-weight:600;margin-top:2cqw;box-shadow:0 0 0 .8cqw rgba(255,255,255,.4)}

.prc-name{position:relative;z-index:1;text-align:center;font-weight:700;font-size:9cqw;letter-spacing:.02em;text-transform:uppercase;margin-top:4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.prc-lift{position:relative;z-index:1;text-align:center;font-size:6.2cqw;font-weight:600;opacity:.8;border-bottom:.5cqw solid currentColor;padding-bottom:2cqw;margin:0 4cqw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prc-stats{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);margin-top:2.5cqw;text-align:center}

<script>
const SUPABASE_URL = 'https://kaehtivwphtwoiaeszui.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dO4G2c-8mo3Zh3aol276ZQ_em98zjeC'; // publishable key, safe in the browser
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['', 'Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const store = { get(k){ try{ return JSON.parse(localStorage.getItem('rev.'+k)); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem('rev.'+k, JSON.stringify(v)); }catch(e){} } };
function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2200); }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function safeYoutube(u){ return /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(u||'') ? u : null; }

/* ---------------- JOIN LINKS ----------------
   index.html?join=<code> puts the athlete in that code's group: at sign-up (handle_new_user reads join_code) and on next sign-in (join_with_code). */
(()=>{ const q=new URLSearchParams(location.search), c=(q.get('join')||'').trim().toLowerCase();
  // coming from the free trial page: their name and email are passed along so creating the account is one step
  if(q.get('name')||q.get('email')) store.set('prefill',{ name:(q.get('name')||'').slice(0,80), email:(q.get('email')||'').slice(0,120) });
  if(c){ store.set('join',c); history.replaceState(null,'',location.pathname+location.hash); } })();
async function applyJoin(){ const c=store.get('join'); if(!c) return;
  const { data, error } = await sb.rpc('join_with_code',{ p_code:c });
  store.set('join',null);
  if(error) toast(error.message.replace(/^.*?:\s*/,'')); else toast(`You\u2019re in ${data}`);
  return !error; }

/* ---------------- AUTH ---------------- */
let mode='signin';
function setMode(m){
  mode=m; const up=m==='signup', rs=m==='reset';
  $('authTitle').innerHTML = up ? 'Create <b>account</b>' : rs ? 'Reset <b>password</b>' : 'Sign <b>in</b>';
  $('authBtn').textContent = up ? 'Create account' : rs ? 'Email me a reset link' : 'Sign in';
  $('nameField').hidden = !up;
  $('pwField').hidden = rs; $('password').required = !rs; $('forgotLink').hidden = m!=='signin';
  $('toggleText').textContent = up ? 'Already signed up?' : rs ? 'Remembered it?' : 'New athlete?';
  $('toggleLink').textContent = up||rs ? 'Sign in' : 'Create account';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
  authMsg('');
}
function authMsg(t,c){ $('authMsg').textContent=t; $('authMsg').className='msg '+(c||''); }
$('toggleLink').onclick = () => setMode(mode==='signin'?'signup':'signin');
$('forgotLink').onclick = e => { e.preventDefault(); setMode('reset'); authMsg('Enter your email and we\u2019ll send you a link to set a new password.'); $('email').focus(); };
if(store.get('join')){ setMode('signup'); authMsg('You\u2019ve got a team link. Create your account (or sign in) and you\u2019ll be added to your group.','ok'); }
(()=>{ const pf=store.get('prefill'); if(!pf) return; store.set('prefill',null);
  setMode('signup'); if(pf.name) $('name').value=pf.name; if(pf.email) $('email').value=pf.email;
  authMsg('Nearly there. Choose a password to create your account.','ok'); })();
$('authForm').onsubmit = async e => {
  e.preventDefault(); $('authBtn').disabled=true; authMsg('');
  const email=$('email').value.trim(), password=$('password').value;
  try{
    if(mode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password,
        options:{ data:{ full_name:$('name').value.trim(), ...(store.get('join')?{join_code:store.get('join')}:{}) }, emailRedirectTo: location.origin+location.pathname } });
      if(error) throw error;
      if(!data.session) authMsg('Check your email to confirm your account, then sign in.','ok');
    } else if(mode==='reset'){
      if(!email){ authMsg('Enter your email first.','err'); $('authBtn').disabled=false; return; }
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin+location.pathname });
      if(error) throw (/rate limit|only request this after/i.test(error.message) ? new Error('Too many emails just now. Wait a few minutes and try again, or message your coach.') : error);
      authMsg('Check your email (and junk folder) for a link to set a new password.','ok');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  }catch(err){ authMsg(err.message,'err'); }
  $('authBtn').disabled=false;
};

// Opened from a reset email: set a new password
function newPasswordSheet(){
  document.querySelector('.pw-ov')?.remove();
  const ov=document.createElement('div'); ov.className='pw-ov';
  ov.innerHTML=`<form class="card pw-card"><div class="card-label"><span>Set a new password</span></div>
    <label for="np1">New password</label><input id="np1" type="password" autocomplete="new-password" minlength="6" required>
    <label for="np2" style="margin-top:10px">Type it again</label><input id="np2" type="password" autocomplete="new-password" minlength="6" required>
    <button class="btn primary block" style="margin-top:14px">Save password</button><div class="msg" id="npMsg"></div></form>`;
  document.body.appendChild(ov);

function buildMaxes(rows){

  rows.forEach(m=>{ const k=m.kind==='working'?S.maxWork:S.maxAll; if(!k[m.exercise_id]) k[m.exercise_id]=m; });

  });
}

/* Coach in the athlete app: two modes on the Training tab.
   Train = the coach's own program, exactly as an athlete gets it (assigned to them directly or through a group, published only).
   View  = read-only look through any program, one at a time; logging is greyed out. */
S.cmode = store.get('cmode')==='view' ? 'view' : 'train';
S.viewPlan = store.get('viewPlan') || null;
S.viewDays = store.get('viewDays') || null;
const PLAN_ORDER={BASE:0,COMPETITIVE:1,FNDN:2,INDIVIDUAL:3};
const PLAN_LBL={BASE:'Base',COMPETITIVE:'Competitive',FNDN:'FNDN',INDIVIDUAL:'Individual'};
async function coachFilterPrograms(mode){
  if(mode==='view'){
    const { data:plans } = await sb.from('program_plans').select('id,name,plan_type,athlete_id,start_date,status').neq('status','archived');
    const withProg=new Set(S.programs.map(p=>p.plan_id).filter(Boolean));
    S.viewPlans=(plans||[]).filter(p=>withProg.has(p.id))
      .sort((a,b)=>((PLAN_ORDER[String(a.plan_type).toUpperCase()]??9)-(PLAN_ORDER[String(b.plan_type).toUpperCase()]??9))||a.name.localeCompare(b.name));
    if(!S.viewPlans.some(p=>p.id===S.viewPlan)) S.viewPlan=S.viewPlans[0]?.id||null;
    S.programs=S.programs.filter(p=>p.plan_id===S.viewPlan);
    // Base 4 / 3 day, Competitive 5 / 4 day: show one day option at a time
    S.viewVers=[...new Set(S.programs.map(p=>p.days_version).filter(Boolean))].sort((a,b)=>b-a);
    if(S.viewVers.length>1){ if(!S.viewVers.includes(S.viewDays)) S.viewDays=S.viewVers[0];
      S.programs=S.programs.filter(p=>!p.days_version||p.days_version===S.viewDays); }
    return;
  }
  const me=S.user.id;
  const gids=((await sb.from('group_members').select('group_id').eq('profile_id',me)).data||[]).map(r=>r.group_id);
  let q=sb.from('program_assignments').select('program_id');
  q = gids.length ? q.or(`athlete_id.eq.${me},group_id.in.(${gids.join(',')})`) : q.eq('athlete_id',me);
  const mine=new Set(((await q).data||[]).map(a=>a.program_id));
  S.programs=S.programs.filter(p=>mine.has(p.id) && p.status==='published');
}

// Programs, sessions and this athlete's logs for them. Returns true, or HTML to show instead.
// mode: 'train' (default; athletes are always train) or 'view' (coach only, read-only).
async function loadTrainingData(mode='train'){
  S.ro = isCoach() && mode==='view';
  // Newer columns (plan_id, week_offset, is_option, code, warmup) come from the program builder update; fall back if it isn't in yet.
  let { data:progs, error } = await sb.from('programs').select('id,name,description,kind,phase,track,status,start_date,plan_id,week_offset,is_option,days_version,is_select').neq('status','archived');
  if(error && /column/i.test(error.message)) ({ data:progs, error } = await sb.from('programs').select('id,name,description,kind,phase,track,status,start_date').neq('status','archived'));
  if(error) return `<div class="empty">${esc(error.message)}</div>`;
  const order={technical:0,strength:1,accessory:2,other:3};
  S.programs=(progs||[]).sort((a,b)=>(order[a.kind]-order[b.kind])||a.name.localeCompare(b.name));
  if(isCoach()) await coachFilterPrograms(mode);
  // a different program (or mode) opens on the current week again
  const key = S.ro ? 'view|'+S.viewPlan+'|'+S.viewDays : 'train';
  if(S.dataKey!==key){ S.week=null; S.dataKey=key; }
  S.noProgram=!S.programs.length;
  if(S.noProgram){ S.sessions=[]; S.logs={}; S.planStart=mondayOf(perthDate(Date.now())); S.curWeek=1;
    const jsd0=new Date().getDay(); if(S.week==null){ S.week=1; S.day=jsd0===0?7:jsd0; } return true; }
  const ids=S.programs.map(p=>p.id);
  let { data:sess, error:se1 } = await sb.from('sessions')
    .select('id,program_id,week_number,day_number,title,notes,code,scheduled_date,override_athlete_id,override_kind,session_exercises(*,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,load_text,rpe,rest_seconds,notes,warmup))')
    .in('program_id',ids);
  if(se1 && /column/i.test(se1.message)) ({ data:sess } = await sb.from('sessions')
    .select('id,program_id,week_number,day_number,title,notes,session_exercises(id,label,sort,notes,percent_of,exercise_id,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,load_text,rpe,rest_seconds,notes))')
    .in('program_id',ids));
  S.sessions=sess||[];
  // Personal sessions (coach edits for one athlete) replace the shared one on the same program, week and day.
  // The coach previews the shared program, so personal versions are left out of the coach's own view.
  if(S.sessions.some(s=>'override_athlete_id' in s)){
    const me=S.user.id;
    S.sessions=S.sessions.filter(s=>!s.override_athlete_id || (s.override_athlete_id===me && !S.ro));
    // replace = their own version, removed = taken off their calendar (both hide the shared one), extra = added for them
    const kindOf=s=>s.override_athlete_id?(s.override_kind||'replace'):'shared';
    const mine=new Set(S.sessions.filter(s=>kindOf(s)==='replace'||kindOf(s)==='removed').map(s=>s.program_id+'|'+s.week_number+'|'+s.day_number));
    S.sessions=S.sessions.filter(s=>s.override_athlete_id || !mine.has(s.program_id+'|'+s.week_number+'|'+s.day_number));
    S.sessions=S.sessions.filter(s=>kindOf(s)!=='removed');
  }
  // One continuous timeline per plan: block 2 week 1 becomes week 5 when block 1 is 4 weeks.
  const progById=Object.fromEntries(S.programs.map(p=>[p.id,p]));
  S.sessions.forEach(s=>{ s.wk=s.week_number; s.week_number=s.wk+((progById[s.program_id]||{}).week_offset||0); });
  // Calendar dates, matching the coach calendar: a program's start date, or else the Monday of the week it was assigned.
  S.planStart=null; S.curWeek=null;
  const started=S.programs.find(p=>p.start_date);
  const vPlan=S.ro && (S.viewPlans||[]).find(p=>p.id===S.viewPlan);
  if(started){ const ps=new Date(started.start_date+'T00:00:00'); ps.setDate(ps.getDate()-7*(started.week_offset||0)); S.planStart=ps; }
  else if(vPlan?.start_date){ S.planStart=mondayOf(vPlan.start_date); }
  else {
    const { data:asg } = await sb.from('program_assignments').select('program_id,created_at').in('program_id',ids).order('created_at').limit(1);
    if(asg?.[0]){ const p0=progById[asg[0].program_id]||{}; const ps=mondayOf(perthDate(asg[0].created_at)); ps.setDate(ps.getDate()-7*(p0.week_offset||0)); S.planStart=ps; }
  }
  if(S.planStart){
    const diff=Math.floor((Date.now()-S.planStart)/864e5); S.curWeek=Math.floor(diff/7)+1;
    // sessions the coach pinned to a date land on that date
    S.sessions.forEach(s=>{ if(!s.scheduled_date) return; const dd=Math.round((new Date(s.scheduled_date+'T00:00:00')-S.planStart)/864e5);
      if(dd>=0){ s.week_number=Math.floor(dd/7)+1; s.day_number=dd%7+1; } });
  }
  if(!S.planStart){ S.planStart=mondayOf(perthDate(Date.now())); S.curWeek=1; }
  S.sessions.forEach(s=>{ s.session_exercises.sort((a,b)=>a.sort-b.sort); s.session_exercises.forEach(se=>se.prescriptions.sort((a,b)=>a.sort-b.sort)); });

  // View mode shows the program clean, with no logs
  const { data:logs } = S.ro ? { data:[] } : await sb.from('workout_logs').select('id,session_id,completed_at,set_logs(session_exercise_id,set_number,weight_kg,reps,made,notes,placement)')
    .eq('athlete_id',S.user.id).in('session_id',S.sessions.map(s=>s.id).concat(['00000000-0000-0000-0000-000000000000']));
  S.logs=Object.fromEntries((logs||[]).map(l=>[l.session_id,l]));
  // workouts this athlete moved to another day (session_moves): new session id -> move
  S.moveOf={};
  if(!S.ro){ const { data:mv } = await sb.from('session_moves').select('id,title,from_date,to_date,items,created_at').eq('athlete_id',S.user.id).is('undone_at',null);
    (mv||[]).forEach(m=>(m.items||[]).forEach(i=>{ S.moveOf[i.new]=m; })); }

  // default: open on today (calendar view, 2 weeks back to 4 weeks ahead)
  if(S.week==null){ const jsd=new Date().getDay(); S.week=S.curWeek; S.day=jsd===0?7:jsd; }
  return true;
}

function timeAgo(t){ const s=(Date.now()-new Date(t))/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+'m ago'; if(s<86400) return Math.round(s/3600)+'h ago';
  if(s<7*86400) return Math.round(s/86400)+'d ago'; return fmtDate(t); }

function evStart(e){ const [y,m,d]=e.event_date.split('-').map(Number); const [hh,mm]=(e.event_time||'08:00').split(':').map(Number); return new Date(y,m-1,d,hh,mm).getTime(); }
function tickCountdown(){
  const els=document.querySelectorAll('[data-cd]'); if(!els.length){ clearInterval(S.cdTimer); return; }
  const pad=n=>String(n).padStart(2,'0');
  els.forEach(el=>{
    const ms=+el.dataset.cd - Date.now();
    if(ms<=0){ el.innerHTML=`<span class="cd-day">${el.dataset.theme==='party'?'Party time. See you there.':el.dataset.theme==='comp'?'It\u2019s comp day. Go get it.':'It\u2019s on.'}</span>`; return; }
    const D=Math.floor(ms/864e5), H=Math.floor(ms%864e5/36e5), M=Math.floor(ms%36e5/6e4), Sx=Math.floor(ms%6e4/1e3);
    el.innerHTML=`${D}<small>d</small> ${pad(H)}<small>h</small> ${pad(M)}<small>m</small> ${pad(Sx)}<small>s</small>`;
  });
}

function bindHome(){
  $('bookBtn') && ($('bookBtn').onclick=()=>go('book'));
  clearInterval(S.cdTimer);
  if(document.querySelector('[data-cd]')){ tickCountdown(); S.cdTimer=setInterval(tickCountdown,1000); }
  const track=$('evTrack'), dots=$('evDots');
  if(track && dots){
    const n=track.children.length;
    const cur=()=>Math.round(track.scrollLeft/track.clientWidth);
    const mark=()=>dots.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur()));
    track.addEventListener('scroll',()=>{ cancelAnimationFrame(track._r); track._r=requestAnimationFrame(mark); },{passive:true});
    dots.querySelectorAll('button').forEach(b=>b.onclick=()=>{ track.scrollTo({left:+b.dataset.evi*track.clientWidth,behavior:'smooth'}); });
    // gentle auto-advance every 7s until someone touches it
    let touched=false; ['pointerdown','touchstart','wheel'].forEach(t=>track.addEventListener(t,()=>touched=true,{passive:true}));
    clearInterval(S.evTimer);
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)
      S.evTimer=setInterval(()=>{ if(!document.body.contains(track)){ clearInterval(S.evTimer); return; } if(touched) return;
        track.scrollTo({left:((cur()+1)%n)*track.clientWidth,behavior:'smooth'}); },7000);
  }
}

const perthDate = d => new Date(d).toLocaleDateString('en-CA',{timeZone:'Australia/Perth'}); // YYYY-MM-DD
function mondayOf(dateStr){ const d=new Date(dateStr+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d; }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

// Session streak (programmed workouts done in a row; a workout 2+ days past and not done resets it) and % done, last 3 months
function consHTML(c){
  if(!c || !c.due && !c.streak) return '';
  return `<div class="cons"><div class="cons-s"><b>🔥 ${c.streak}</b><span>session streak${c.best>c.streak?` · best ${c.best}`:c.streak?' · your best':''}</span></div>
    <div class="cons-p"><b>${c.pct!=null?c.pct+'%':'–'}</b><span>${c.due?`${c.done} of ${c.due} done, last 3 months`:'last 3 months'}</span></div></div>`;
}
async function loadHome(){
  const payP=checkPayMenu().catch(()=>{});
  const todayStr=perthDate(Date.now());
  const since=mondayOf(todayStr); since.setDate(since.getDate()-7*11);
  const [trainOk, , ev, hist, chk, notes, cons] = await Promise.all([
    loadTrainingData(), S.exercises&&Object.keys(S.exercises).length?null:loadExercises(),
    sb.from('events').select('id,title,event_date,event_time,theme,location,description,link').gte('event_date',todayStr).order('event_date').order('event_time',{nullsFirst:true}).limit(8),
    sb.from('workout_logs').select('session_id,completed_at').eq('athlete_id',S.user.id).not('completed_at','is',null).gte('completed_at',ymd(since)),
    sb.from('checkins').select('day').eq('profile_id',S.user.id).gte('day',ymd(since)),
    sb.from('coach_notes').select('id,title,body,kind,group_id,pinned,created_at').order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(4),
    sb.rpc('my_consistency'),
  ]);
  const groups = isCoach() ? ((await sb.from('groups').select('id,name,sort').order('sort')).data||[]) : [];
  // scoreboards: one per group the member is in (Whole Team excluded); coach sees every group
  const boardGroups = (isCoach() ? groups : ((await sb.from('group_members').select('groups(id,name,sort)').eq('profile_id',S.user.id)).data||[]).map(r=>r.groups).filter(Boolean))
    .filter(g=>g.name!=='Whole Team' && !['video review','beta testers'].includes(g.name.trim().toLowerCase())).sort((a,b)=>(a.sort??0)-(b.sort??0));
  const boards = await Promise.all(boardGroups.map(g=>sb.rpc('group_session_streaks',{gid:g.id}).then(r=>({g,rows:r.data||[]}))));
  const latest = (await sb.from('posts').select('id,title,category,created_at').eq('status','published').order('created_at',{ascending:false}).limit(1)).data?.[0];
  const hasProgram = trainOk===true && !S.noProgram;

  // Days trained, by calendar date (Perth). Technical + strength on one day = one training day.
  const checkDates=new Set((chk.data||[]).map(c=>c.day));
  // A session counts on the day it was programmed for, so logging yesterday's session today ticks off yesterday.
  // (Falls back to the day it was completed when the session isn't on the athlete's current calendar.)
  const sessDate=id=>{ const ss=S.sessions?.find(x=>x.id===id); if(!ss||!S.planStart) return null;
    const d=new Date(S.planStart); d.setDate(d.getDate()+(ss.week_number-1)*7+(ss.day_number-1)); return ymd(d); };
  const doneDates=new Set([...(hist.data||[]).map(l=>sessDate(l.session_id)||perthDate(l.completed_at)), ...checkDates]);
  // weekly goal: the member's own setting, else the program's days, else 3
  const target = S.profile.weekly_target || (hasProgram ? Math.max(1, daysForWeek(S.week).length) : 3);
  const thisMon=mondayOf(todayStr);
  const weekStats=[];
  for(let i=11;i>=0;i--){
    const m=new Date(thisMon); m.setDate(m.getDate()-7*i);
    let n=0; for(let k=0;k<7;k++){ const d=new Date(m); d.setDate(d.getDate()+k); if(doneDates.has(ymd(d))) n++; }
    weekStats.push({ mon:m, n });
  }
  const cur=weekStats[weekStats.length-1];
  // streak: full weeks hitting target, counting back from last week (this week counts once it's hit)
  let streak=0;
  for(let i=weekStats.length-2;i>=0;i--){ if(target && weekStats[i].n>=target) streak++; else break; }
  if(target && cur.n>=target) streak++;
  let best=0, run=0; weekStats.forEach(w=>{ run = target && w.n>=target ? run+1 : 0; best=Math.max(best,run); });

  let h='';

  // EVENTS
  const events=(ev.data||[]).filter(e=>evStart(e) > Date.now()-6*36e5); // drop events that started 6h+ ago
  if(events.length){
    const kicker={comp:'Next comp',party:'Save the date',other:'Coming up'};

function daysForWeek(w){ return [...new Set(S.sessions.filter(s=>s.week_number===w).map(s=>s.day_number))].sort((a,b)=>a-b); }

async function loadLast(){
  const exIds=[...new Set(S.sessions.flatMap(s=>s.session_exercises.map(se=>se.exercise_id)))];
  if(!exIds.length){ S.last={}; return; }
  const { data } = await sb.from('set_logs')
    .select('weight_kg,reps,made,set_number,logged_at,workout_log_id,session_exercises!inner(exercise_id),workout_logs!inner(athlete_id,started_at)')
    .eq('workout_logs.athlete_id',S.user.id).in('session_exercises.exercise_id',exIds)
    .order('logged_at',{ascending:false}).limit(500);
  S.lastRows=data||[];
}
function lastFor(exId, excludeLogId){
  const rows=(S.lastRows||[]).filter(r=>r.session_exercises.exercise_id===exId && r.workout_log_id!==excludeLogId && r.weight_kg);
  if(!rows.length) return null;
  const wid=rows[0].workout_log_id;
  const sets=rows.filter(r=>r.workout_log_id===wid).sort((a,b)=>a.set_number-b.set_number);
  return { date:rows[0].workout_logs.started_at, sets };
}

function exKind(id){
  const ex=S.exercises[id]||{};
  if(ex.lift_type==='technical'||ex.lift_type==='strength') return ex.lift_type;
  const n=(ex.name||'').toLowerCase(), c=(ex.category||'').toLowerCase();
  if(/pull|squat|deadlift|press|row|rdl|good ?morning|lunge|step|carry|plank|sled|curl|dip/.test(n)) return 'strength';
  return (/snatch|clean|jerk/.test(n) || c==='snatch' || c==='clean & jerk') ? 'technical' : 'strength';
}
function baseMax(se){
  const ex=S.exercises[se.exercise_id]||{};
  let baseId=se.percent_of||ex.default_percent_of||se.exercise_id;
  // Safety net: a technical lift (snatch, clean, jerk and variations) never takes its kilos from a strength lift's max
  if(baseId!==se.exercise_id && exKind(se.exercise_id)==='technical' && exKind(baseId)==='strength')
    baseId = ex.default_percent_of && exKind(ex.default_percent_of)==='technical' ? ex.default_percent_of : se.exercise_id;
  return { max:S.maxes[baseId]?.weight_kg ? Number(S.maxes[baseId].weight_kg) : null, base:S.exercises[baseId] };
}
const kg = (max,pct) => Math.round(max*pct/100);
/* "Build to a heavy / moderate / light and snappy X" and down sets "10% less than your heavy", written by the program builder.
   Down-set kilos are worked out from the heaviest made set the athlete logs on the heavy line. */
const HEAVY_RE=/^Build to an? (?:heavy|moderate|light and snappy)\b/i, DROP_RE=/^(\d+(?:\.\d+)?)%\s+less than (?:your|today's) (?:heavy|moderate|top set|light)/i;
const setRows = p => HEAVY_RE.test(p.load_text||'') ? Math.max(3, +p.sets||1) : (+p.sets||1);
const heavyShort = t => String(t).replace(/^Build to an? /i,'').replace(/\s*for the day.*$/i,'').replace(/^./,c=>c.toUpperCase());
const dropPct = p => { const m=String(p.load_text||'').match(DROP_RE); return m?+m[1]:null; };
const dropKg = (hk,pct) => hk ? Math.round(hk*(100-pct)/100) : null;
function heavyLogged(card, seId){
  let best=null;
  card?.querySelectorAll(`.set[data-se="${seId}"][data-heavy]`).forEach(r=>{
    const sid=r.closest('[data-sess]')?.dataset.sess, log=S.logs[sid];
    const sl=log?.set_logs?.find(x=>x.session_exercise_id===seId&&x.set_number===+r.dataset.n);
    if(sl && sl.weight_kg!=null && sl.made!==false) best=Math.max(best||0,+sl.weight_kg);
  });
  return best;
}
function heavyFromLog(se, log){
  let n=0, best=null;
  se.prescriptions.filter(p=>!p.warmup).forEach(p=>{ for(let i=0;i<setRows(p);i++){ n++;
    if(HEAVY_RE.test(p.load_text||'')){ const sl=log?.set_logs?.find(x=>x.session_exercise_id===se.id&&x.set_number===n); if(sl && sl.weight_kg!=null && sl.made!==false) best=Math.max(best||0,+sl.weight_kg); } } });
  return best;
}
function refreshDrops(card, seId){
  const hk=heavyLogged(card, seId);
  card?.querySelectorAll(`[data-dropfor="${seId}"]`).forEach(el=>{ const pct=+el.dataset.pct, k=dropKg(hk,pct);
    el.textContent = el.dataset.short ? (k?`≈ ${k} kg`:`${pct}% less`) : (k?`≈ ${k} kg`:''); });
}

function rxText(p, se, short){
  const { max } = baseMax(se);
  const parts=[];
  if(p.percent!=null){
    const pct = p.percent_max ? `${+p.percent}–${+p.percent_max}%` : `${+p.percent}%`;
    let k='';
    if(max) k = p.percent_max ? `${kg(max,p.percent)}–${kg(max,p.percent_max)} kg` : `${kg(max,p.percent)} kg`;
    parts.push(short ? (k||pct) : `${pct}${k?` <span class="kg">${k}</span>`:''}`);
  }
  if(p.load_kg!=null) parts.push(short?`${+p.load_kg} kg`:`<span class="kg">${+p.load_kg} kg</span>`);
  if(p.load_text) parts.push(short && p.percent!=null ? '' : esc(p.load_text));
  if(p.rpe!=null) parts.push(short||parts.length?`RPE ${+p.rpe}`:`@ RPE ${+p.rpe}`);
  return parts.filter(Boolean).join(short?' ':' · ');
}

/* ---------------- SET GUIDE ----------------
   Tap "Set Guide" on a lift for what the prescription means in kilos, where to aim today and warm-up jumps.
   Technical lifts (classic lifts and variations) and strength lifts are guided differently.
   Numbers: the coach's Set Guide settings (app_settings 'set_guide', edited in the program builder), else these defaults.
   Per lift the coach can turn it off, set a week 1 start % and add a note (session_exercises.guide). Rounded to 1 kg. */
const GUIDE_DEFAULTS={
  strength:{rm:{1:100,2:95,3:92,4:89,5:86,6:84,8:79,10:74,12:70,15:65}, start:{heavy:5,moderate:12,light:22}, floor:{heavy:0,moderate:8,light:18}, weekly:2},
  // Classic lifts (researched 3 Oct): doubles about 95%, triples 90 to 92%, 5s about 84%; variations as a % of the full lift
  technical:{rm:{1:100,2:95,3:91,4:87,5:84}, vary:{power:80,hang:92,block:97,pause:90,muscle:65}, start:{heavy:5,moderate:10,light:20}, floor:{heavy:0,moderate:6,light:15}, weekly:2.5},
  bar:20
};
const numOk = v => v!=null && v!=='' && !isNaN(+v);
function mergeGuideCfg(v){
  const g=JSON.parse(JSON.stringify(GUIDE_DEFAULTS)); v=v||{};
  ['strength','technical'].forEach(t=>{ const o=v[t]||{};
    if(o.rm && Object.keys(o.rm).length) g[t].rm=Object.fromEntries(Object.entries(o.rm).filter(([k,x])=>numOk(k)&&numOk(x)).map(([k,x])=>[+k,+x]));
    ['start','floor'].forEach(k=>{ if(o[k]) ['heavy','moderate','light'].forEach(l=>{ if(numOk(o[k][l])) g[t][k][l]=+o[k][l]; }); });
    if(numOk(o.weekly)) g[t].weekly=+o.weekly;
    if(t==='technical' && o.vary) Object.keys(g.technical.vary).forEach(k=>{ if(numOk(o.vary[k])) g.technical.vary[k]=+o.vary[k]; }); });
  if(numOk(v.bar)) g.bar=+v.bar;
  return g;
}
let GUIDE=mergeGuideCfg(null);
async function loadGuideCfg(){
  try{ const { data, error } = await sb.from('app_settings').select('value').eq('key','set_guide').maybeSingle();
    if(!error) GUIDE=mergeGuideCfg(data&&data.value); }catch(e){}
}
const gR = v => Math.round(v);
const VARY_RE={power:/\bpower\b/, hang:/\bhang\b/, block:/\bblocks?\b/, pause:/\bpause/, muscle:/\bmuscle\b/};
function varyFactor(name, vary){
  // complexes are limited by their hardest part; stacked words multiply (Power Hang Snatch = power x hang)
  return String(name||'').toLowerCase().split(/\s+plus\s+|\s*\+\s*/).reduce((f,part)=>{
    let x=1; Object.entries(VARY_RE).forEach(([k,re])=>{ if(re.test(part)) x*=(numOk((vary||{})[k])?+vary[k]:100)/100; });
    return Math.min(f,x); },1);
}
const liftKind = se => exKind(se.exercise_id);
function rmPct(reps, kind){
  const t=GUIDE[kind].rm, keys=Object.keys(t).map(Number).sort((a,b)=>a-b);
  if(t[reps]!=null) return t[reps];

/* ---------------- REST TIMER ----------------
   Sits at the top of the workout (sticky). 3:00 by default; athletes pick their own length (saved on the phone).

const restCfg = () => ({ dur:180, auto:true, ...(store.get('rest')||{}) });
S.rest = { end:null, doneAt:null, open:false };
const mmss = t => `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`;

function restDraw(){

  const left = R.end ? Math.max(0, Math.ceil((R.end-now)/1000)) : null;

  $('restSub').textContent = running ? 'Resting' : done ? 'Rest done' : 'Rest';
  $('restProg').style.width = running ? (100*(1-left/(R.total||c.dur)))+'%' : done ? '100%' : '0%';

      <button type="button" class="vp-arrow" id="vpNext" ${i>=plans.length-1?'disabled':''} aria-label="Next program">›</button></div>

    <div class="hint" style="margin-top:8px">${i+1} of ${plans.length} · View only. Switch to Train to log your own sessions.</div></div>`;
  return h;
}

}

const KORDER={technical:0,strength:1,accessory:2,other:3};
const planName = p => p.plan_id ? String(p.name).split(' · ')[0] : p.name;
const trackLabel = p => p.track || (p.kind==='other' ? 'Program' : p.kind[0].toUpperCase()+p.kind.slice(1));
function weekPhase(w){ const s=S.sessions.find(x=>x.week_number===w); const p=s&&S.programs.find(p=>p.id===s.program_id); return p?.phase||''; }

// Everything from one plan (and one day option, e.g. Base 4 day) on one day is one session for the athlete.
// Option tracks (FNDN Strength / Engine / Oly) are alternatives: on days with 2+ the athlete picks one.
// Athletes only ever get their own strength track; the coach sees all of them, so those become a preview switch.
function dayGroups(week, day){
  const items=S.sessions.filter(s=>s.week_number===week&&s.day_number===day)
    .map(s=>({s, p:S.programs.find(p=>p.id===s.program_id)})).filter(x=>x.p);
  const by=new Map();
  items.forEach(x=>{ const mv=S.moveOf?.[x.s.id]; const k=(x.p.plan_id||x.p.id)+(x.p.days_version?'|'+x.p.days_version+'d':'')+(mv?'|mv'+mv.id:''); if(!by.has(k)) by.set(k,[]); by.get(k).push(x); });
  const pick=store.get('opt')||{};
  const choose=(key,set,tag)=>{ if(set.length<2) return null; const saved=pick[key+'|'+tag+'|'+week+'|'+day];
    return set.find(x=>x.s.id===saved) || set.find(x=>S.logs[x.s.id]) || set[0]; };
  return [...by.entries()].map(([key,list])=>{
    const isAlt=x=>x.p.is_option||x.p.is_select;
    list.sort((a,b)=>(a.p.is_option?1:0)-(b.p.is_option?1:0)
      || (a.p.is_option ? (a.p.track||'').localeCompare(b.p.track||'') : (KORDER[a.p.kind]-KORDER[b.p.kind]) || (a.p.track||'').localeCompare(b.p.track||'')));
    const opts=list.filter(x=>x.p.is_option), sels=list.filter(x=>x.p.is_select);
    const chosen=choose(key,opts,'o'), chosenSel=choose(key,sels,'s');
    const shown=list.filter(x=>!isAlt(x) || (x.p.is_option ? (!chosen || x===chosen) : (!chosenSel || x===chosenSel)));
    return { key, list, opts, chosen, sels, chosenSel, shown, ver:list[0].p.days_version||null };
  });
}
