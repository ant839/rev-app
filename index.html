<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rev">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<title>Rev Barbell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#4a4a48;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12);
  --red:#ff5a5a; --red-dim:rgba(255,90,90,0.14);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --purple:#b08fff; --purple-dim:rgba(176,143,255,0.13);
  --radius:10px; --radius-sm:6px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;min-height:100vh;padding:calc(22px + env(safe-area-inset-top,0px)) 26px calc(80px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;outline:none;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--border2)}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
h1{font-size:28px;font-weight:300;letter-spacing:-.02em}
h1 b{font-weight:500}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--border2)}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:#000}
.btn.primary{background:var(--accent);color:#000;border-color:var(--accent);font-weight:600}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.block{width:100%;padding:11px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.card-label{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.views{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:3px;margin-bottom:16px;width:max-content;max-width:100%;overflow-x:auto}
.views button{background:none;border:0;border-radius:20px;padding:7px 15px;color:var(--muted);font-size:13px;white-space:nowrap}
.views button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:24px 0}
.hint{font-size:12px;color:var(--muted);line-height:1.5}

/* week + day nav */
.wk-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wk-nav .lbl{flex:1;font-size:12px;color:var(--muted);text-align:center;letter-spacing:.06em;text-transform:uppercase}
.wk-nav button{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);width:34px;height:30px;color:var(--muted)}
.wk-nav button:disabled{opacity:.3}
.strip{display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;margin-bottom:14px}
.dy{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:9px 4px;text-align:center;color:var(--muted)}
.dy .n{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.dy .d{font-size:16px;font-weight:500;color:var(--text);margin-top:2px}
.dy .dot{width:6px;height:6px;border-radius:50%;margin:5px auto 0;background:transparent}
.dy .dot.done{background:var(--accent)} .dy .dot.part{background:var(--amber)}
.dy.on{border-color:var(--accent);background:var(--surface2)}

/* program block */
.prog-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.prog-h h2{font-size:17px;font-weight:500}
.pill{font-size:10px;font-weight:600;padding:2px 9px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase}
.pill.technical{background:var(--blue-dim);color:var(--blue)}
.pill.strength{background:var(--purple-dim);color:var(--purple)}
.pill.other,.pill.accessory{background:var(--surface2);color:var(--muted)}
.pill.draft{background:var(--amber-dim);color:var(--amber)}
.pill.published{background:var(--accent-dim);color:var(--accent)}
details.notes{margin:4px 0 2px}
details.notes summary{cursor:pointer;font-size:12px;color:var(--muted);list-style:none}
details.notes summary::before{content:'+ '}
details.notes[open] summary::before{content:'– '}
details.notes p{font-size:13px;line-height:1.55;color:var(--text);margin-top:8px;white-space:pre-line}

/* exercise */
.ex{border-top:1px solid var(--border);padding-top:14px;margin-top:14px}
.ex-h{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.slot{font-family:'DM Mono',monospace;font-size:11px;color:var(--accent);background:var(--accent-dim);border-radius:4px;padding:2px 6px;margin-top:2px}
.ex-n{font-size:15px;font-weight:500;flex:1;line-height:1.3}
.ex-btns{display:flex;gap:6px}
.rx{font-size:13px;color:var(--text);line-height:1.6;margin:2px 0 6px}
.rx .ln{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.rx .sr{font-family:'DM Mono',monospace;min-width:52px;color:var(--muted)}
.rx .kg{color:var(--accent);font-weight:500}
.rx .nt{font-size:12px;color:var(--muted)}
.rx .wu-line{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:baseline;margin-bottom:2px}
.rx .wu-line b{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.opt-pick{display:flex;gap:4px;padding:3px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);margin-top:10px;overflow-x:auto}
.opt-pick button{flex:1;min-width:max-content;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:calc(var(--radius-sm) - 3px);font-weight:600;font-size:13px}
.opt-pick button.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--accent)}
.part + .part{border-top:1px dashed var(--border);margin-top:16px;padding-top:4px}
.part-h{display:flex;align-items:center;gap:8px;margin-top:14px}
.info{background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;line-height:1.55;margin:6px 0 8px;white-space:pre-line}
.info .lbl{font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:2px}
.info .blk+.blk{margin-top:8px}
.last{font-size:12px;color:var(--muted);margin-bottom:8px}
.last b{color:var(--text);font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.set-lbl{font-size:12px;color:var(--muted);margin-top:4px}
.set-lbl b{color:var(--text);font-weight:600}
.set{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 62px 38px;gap:6px;align-items:center}
.set .no{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);text-align:center}
.set .tg{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set input{width:100%;text-align:right;font-size:15px;padding:8px}
.set input.saved{border-color:rgba(200,240,106,.4)}
.set .mk{height:36px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);color:var(--dim);font-size:15px}
.set .mk.made{color:var(--accent);border-color:rgba(200,240,106,.4)}
.set .mk.miss{color:var(--red);border-color:rgba(255,90,90,.4)}
.set-head{display:grid;grid-template-columns:22px minmax(0,1fr) 78px 62px 38px;gap:6px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.set-head span:nth-child(3),.set-head span:nth-child(4){text-align:right;padding-right:8px}
.done-bar{display:flex;gap:8px;align-items:center;margin-top:4px}

/* lists */
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.row:last-child{border-bottom:0}
.row .l{min-width:0}
.row .l b{font-weight:500;display:block}
.row .l span{font-size:12px;color:var(--muted)}
.row .r{font-family:'DM Mono',monospace;font-size:14px;text-align:right;white-space:nowrap}
.inline{display:flex;gap:6px;align-items:center}
.inline input{width:80px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:3px 4px 3px 10px;margin:4px 4px 0 0}
.chip button{background:none;border:0;color:var(--dim);font-size:14px;padding:0 5px}
.chip button:hover{color:var(--red)}
.chips-add{display:flex;gap:6px;margin-top:8px}
.chips-add select{flex:1}
.hist-ex{font-size:13px;margin-top:6px}
.hist-ex span{color:var(--muted)}

/* auth */
.auth{max-width:400px;margin:40px auto 0}
.auth label{display:block;font-size:11px;color:var(--muted);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.06em}
.auth input{width:100%;padding:12px;font-size:16px}
.msg{margin-top:12px;font-size:13px;min-height:18px}
.msg.err{color:var(--red)} .msg.ok{color:var(--accent)}
.toggle{margin-top:16px;text-align:center;font-size:13px;color:var(--muted)}
.toggle a{color:var(--text);cursor:pointer;text-decoration:underline}

/* home: comp banner */
.ev-wrap{margin-bottom:12px}
.ev-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.ev-track::-webkit-scrollbar{display:none}
.comp{position:relative;flex:0 0 100%;scroll-snap-align:start;height:clamp(190px,41vw,300px);border-radius:16px;overflow:hidden;border:1px solid var(--border2);background:#08080e}
.comp.party .k{color:#ffd36b}
.jlights{position:absolute;top:12px;right:14px;display:flex;gap:6px;background:#0b0b12;border:1px solid #2a2c3e;border-radius:6px;padding:5px 7px}
.jlights i{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 8px 2px rgba(255,255,255,.7);animation:glow 2.2s ease-in-out infinite}
.jlights i:nth-child(2){animation-delay:.2s}.jlights i:nth-child(3){animation-delay:.4s}
@media (prefers-reduced-motion:reduce){.jlights i{animation:none}}
.ev-dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.ev-dots button{width:7px;height:7px;border-radius:50%;border:0;padding:0;background:var(--dim)}
.ev-dots button.on{background:var(--accent);width:18px;border-radius:4px}
.comp svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.comp-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,6,12,0) 0%,rgba(5,6,12,0) 50%,rgba(5,6,12,.62) 74%,rgba(5,6,12,.82) 100%)}
.comp-txt{position:absolute;right:16px;top:50%;transform:translateY(-50%);text-align:right;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.7);max-width:58%}
.comp .k{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.comp .t{font-size:22px;font-weight:600;letter-spacing:-.01em;margin-top:3px;line-height:1.1}
.comp .cd{font-family:'DM Mono',monospace;font-size:21px;letter-spacing:-.02em;margin-top:6px;line-height:1.1;white-space:nowrap}
.comp .cd small{font-family:'DM Sans',sans-serif;font-size:10px;color:rgba(255,255,255,.7);margin:0 3px 0 1px}
.comp .cd-day{font-family:'DM Sans',sans-serif;font-size:15px}
.comp .d{font-size:11px;color:rgba(255,255,255,.7);margin-top:4px}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes glow{0%,100%{opacity:.6}50%{opacity:.95}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.comp .tw{animation:twinkle 3s ease-in-out infinite}
.comp .gl{animation:glow 2.2s ease-in-out infinite}
.comp .bb{animation:bob 2.6s ease-in-out infinite}
@keyframes fall{from{transform:translateY(0)}to{transform:translateY(215px)}}
.comp .sn{animation:fall 7s linear infinite}
@media (prefers-reduced-motion:reduce){.comp .tw,.comp .gl,.comp .bb,.comp .sn{animation:none}.comp .sn{display:none}}
.ev-more{margin:-4px 0 10px}

/* home: from the coach */
.brief{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(200,240,106,.07),rgba(200,240,106,0) 70%),var(--surface);border:1px solid rgba(200,240,106,.28);border-left:3px solid var(--accent);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.brief-top{display:flex;align-items:flex-end;gap:12px;margin:-8px 0 0}
.coach-fig{width:112px;flex:none;margin-left:-10px}
.coach-fig svg{width:100%;height:auto;display:block}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
.coach-fig .br{animation:breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.coach-fig .br{animation:none}}
.brief-top .brief-h{flex:1;min-width:0;padding-bottom:14px}
.bubble{position:relative;background:var(--surface2);border:1px solid var(--border2);border-radius:14px;padding:14px 16px}
.bubble::before{content:'';position:absolute;left:44px;top:-8px;width:14px;height:14px;background:var(--surface2);border-left:1px solid var(--border2);border-top:1px solid var(--border2);transform:rotate(45deg)}
.brief-h{display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#000;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.brief-k{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brief-n{font-size:14px;font-weight:500}
.brief-n span{color:var(--muted);font-weight:400;font-size:12px}
.tag{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:20px;background:var(--surface2);color:var(--muted)}
.tag.reminder{background:var(--amber-dim);color:var(--amber)} .tag.focus{background:var(--blue-dim);color:var(--blue)}
.brief-t{font-size:17px;font-weight:500;margin-bottom:4px}
.brief-b{font-size:14px;line-height:1.6;white-space:pre-line}
.brief-act{display:flex;gap:6px;margin-top:10px}
.brief-old{border-top:1px solid var(--border);padding:8px 0}
.brief-old p{font-size:13px;line-height:1.5;white-space:pre-line;margin-top:2px}
.composer{border-top:1px solid var(--border);margin-top:14px;padding-top:12px;display:flex;flex-direction:column;gap:6px}
.composer textarea{min-height:70px;resize:vertical;line-height:1.45}

/* home: leaderboard */
.podium{display:flex;flex-direction:column;gap:8px}
.pod{display:grid;grid-template-columns:44px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px;border:1px solid var(--border)}
.pod-m{grid-row:1/3;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:#111}
.pod.gold{border-color:rgba(247,201,72,.4);background:linear-gradient(90deg,rgba(247,201,72,.12),var(--surface2) 60%)}
.pod.gold .pod-m{background:radial-gradient(circle at 35% 30%,#ffe9a0,#e0a91f);box-shadow:0 0 16px rgba(247,201,72,.35)}
.pod.silver .pod-m{background:radial-gradient(circle at 35% 30%,#f4f4f4,#a9adb4)}
.pod.bronze .pod-m{background:radial-gradient(circle at 35% 30%,#f2c7a0,#b06a35)}
.pod-n{font-size:16px;font-weight:500}
.pod-d{font-size:12px;color:var(--muted)} .pod-d b{color:var(--text)}
.wk-top{display:flex;gap:16px;align-items:center}
.ring{width:96px;height:96px;flex:none;transform:rotate(-90deg)}
.ring text{transform:rotate(90deg);transform-origin:42px 42px}
.ring-bg{fill:none;stroke:var(--surface2);stroke-width:8}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring-n{fill:var(--text);font-size:17px;font-weight:500;font-family:'DM Sans',sans-serif}
.ring-l{fill:var(--muted);font-size:9px;font-family:'DM Sans',sans-serif;text-transform:uppercase;letter-spacing:.06em}
.wk-msg{font-size:14px;line-height:1.45;margin-bottom:12px}
.wk-msg b{color:var(--accent);font-weight:600}
.wdots{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{text-align:center;font-size:10px;color:var(--dim)}
.wd i{display:block;width:22px;height:22px;margin:0 auto 3px;border-radius:50%;background:var(--surface2);border:1.5px solid transparent}
.wd.prog i{border-color:var(--border2)}
.wd.today i{border-color:var(--accent)} .wd.today span{color:var(--accent)}
.wd.done i{background:var(--accent)} .wd.done span{color:var(--text)}
.wd.miss i{background:var(--red-dim);border-color:rgba(255,90,90,.35)}
.next{border-color:rgba(200,240,106,.25)}
.next-t{font-size:18px;font-weight:500;margin-bottom:2px}
.streak{display:flex;gap:10px}
.streak>div{flex:1;background:var(--surface2);border-radius:var(--radius-sm);padding:10px 12px}
.st-n{font-size:24px;font-weight:500}
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;margin-top:14px}
.bcol{text-align:center;font-size:9px;color:var(--muted)}
.bwrap{position:relative;height:64px;display:flex;align-items:flex-end;justify-content:center}
.b{width:100%;max-width:18px;border-radius:3px 3px 1px 1px;background:var(--dim)}
.b.part{background:var(--amber)} .b.hit{background:var(--accent)}
.tline{position:absolute;left:0;right:0;border-top:1px dashed var(--border2)}

.card.latest{display:block;color:var(--text);text-decoration:none}
/* forum */
.fm-top{display:flex;gap:8px;margin-bottom:10px}
.fm-search{flex:1}
.fm-search input{width:100%;padding:10px 12px;font-size:15px;border-radius:20px}
.fm-cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:14px;padding-bottom:2px}
.fm-cats::-webkit-scrollbar{display:none}
.fm-cats button{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 13px;color:var(--muted);white-space:nowrap;font-size:12px}
.fm-cats button.on{color:#000;background:var(--accent);border-color:var(--accent);font-weight:600}
.fm-card{display:block;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;color:var(--text);text-decoration:none}
.fm-card:hover{border-color:var(--border2)}
.fm-thumb{aspect-ratio:16/7;background:#000 center/cover no-repeat;position:relative}
.fm-thumb span{position:absolute;left:12px;bottom:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;font-size:12px}
.fm-body{padding:14px 16px}
.fm-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.tag.cat{background:var(--accent-dim);color:var(--accent)} .tag.pin{background:var(--surface2);color:var(--text)}
.fm-t{font-size:18px;font-weight:500;line-height:1.3;letter-spacing:-.01em}
.fm-ex{font-size:13px;color:var(--muted);line-height:1.5;margin-top:5px}
.fm-stats{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-top:10px}
.back{display:inline-block;color:var(--muted);text-decoration:none;font-size:13px;margin-bottom:12px}

<body>
<div class="wrap">
  <!-- AUTH -->
  <section id="auth" class="auth" hidden>
    <div class="eyebrow">Rev Barbell Club</div>
    <h1 id="authTitle">Sign <b>in</b></h1>
    <div class="card" style="margin-top:18px">
      <form id="authForm">
        <div id="nameField" hidden>
          <label for="name">Full name</label>
          <input id="name" autocomplete="name">
        </div>
        <label for="email">Email</label>
        <input id="email" type="email" autocomplete="email" required>
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" minlength="6" required>
        <button class="btn primary block" id="authBtn" type="submit" style="margin-top:18px">Sign in</button>
        <div id="authMsg" class="msg"></div>
      </form>
      <div class="toggle"><span id="toggleText">New member?</span> <a id="toggleLink">Create account</a></div>
    </div>
  </section>

  <!-- APP -->
  <section id="app" hidden>
    <div class="head">
      <div><div class="eyebrow" id="eyebrow">Rev Barbell Club</div><h1 id="title">Training</h1></div>
      <button class="mebtn" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-label="Menu"><span id="meInit">··</span></button>
    </div>
    <div class="menu" id="meMenu" role="menu" hidden></div>
    <div class="seg" id="sub" hidden></div>
    <div id="view"><div class="empty">Loading…</div></div>
  </section>
  <nav class="tabbar" id="views" hidden></nav>
</div>
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://kaehtivwphtwoiaeszui.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dO4G2c-8mo3Zh3aol276ZQ_em98zjeC'; // publishable key, safe in the browser
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAYS = ['', 'Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const store = { get(k){ try{ return JSON.parse(localStorage.getItem('rev.'+k)); }catch(e){ return null; } },
                set(k,v){ try{ localStorage.setItem('rev.'+k, JSON.stringify(v)); }catch(e){} } };
function toast(t){ const el=$('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true, 2200); }
function fmtDate(d){ return new Date(d).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'}); }
function safeYoutube(u){ return /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(u||'') ? u : null; }

/* ---------------- AUTH ---------------- */
let mode='signin';
function setMode(m){
  mode=m; const up=m==='signup';
  $('authTitle').innerHTML = up ? 'Create <b>account</b>' : 'Sign <b>in</b>';
  $('authBtn').textContent = up ? 'Create account' : 'Sign in';
  $('nameField').hidden = !up;
  $('toggleText').textContent = up ? 'Already a member?' : 'New member?';
  $('toggleLink').textContent = up ? 'Sign in' : 'Create account';
  $('password').autocomplete = up ? 'new-password' : 'current-password';
  authMsg('');
}
function authMsg(t,c){ $('authMsg').textContent=t; $('authMsg').className='msg '+(c||''); }
$('toggleLink').onclick = () => setMode(mode==='signin'?'signup':'signin');
$('authForm').onsubmit = async e => {
  e.preventDefault(); $('authBtn').disabled=true; authMsg('');
  const email=$('email').value.trim(), password=$('password').value;
  try{
    if(mode==='signup'){
      const { data, error } = await sb.auth.signUp({ email, password,
        options:{ data:{ full_name:$('name').value.trim() }, emailRedirectTo: location.origin+location.pathname } });
      if(error) throw error;
      if(!data.session) authMsg('Check your email to confirm your account, then sign in.','ok');
    } else {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if(error) throw error;
    }
  }catch(err){ authMsg(err.message,'err'); }
  $('authBtn').disabled=false;
};

/* ---------------- STATE ---------------- */
const S = { user:null, profile:null, view: 'home', // always open on Home
  programs:[], sessions:[], exercises:{}, maxes:{}, logs:{}, last:{}, week:null, day:null, open:{}, guide:{} };
const isCoach = () => S.profile && S.profile.role==='coach';

let booted=false;
sb.auth.onAuthStateChange((_e, session) => {
  if(session){ if(!booted || S.user?.id!==session.user.id){ booted=true; S.user=session.user; boot(); } }
  else { booted=false; S.user=null; $('app').hidden=true; $('views').hidden=true; $('auth').hidden=false; }
});

async function boot(){
  $('auth').hidden=true; $('app').hidden=false; $('views').hidden=false;
  const { data:p } = await sb.from('profiles').select('id,full_name,email,role,forum_seen_at,weekly_target').eq('id',S.user.id).single();
  S.profile = p || { role:'athlete', full_name:'' };
  const nm=(S.profile.full_name||S.user.email||'').trim();
  $('eyebrow').textContent = 'Let\u2019s go, ' + (nm.split(' ')[0] || 'team') + '!';
  $('meInit').textContent = nm.split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase() || 'ME';
  const r=route(); if(r) S.view=r.view;
  renderTabs(); go(S.view, true);
  startInbox();
  registerSW().then(refreshPush);
}

// Programs, sessions and this athlete's logs for them. Returns true, or HTML to show instead.
async function loadTrainingData(){
  // Newer columns (plan_id, week_offset, is_option, code, warmup) come from the program builder update; fall back if it isn't in yet.
  let { data:progs, error } = await sb.from('programs').select('id,name,description,kind,phase,track,status,start_date,plan_id,week_offset,is_option,days_version,is_select').neq('status','archived');
  if(error && /column/i.test(error.message)) ({ data:progs, error } = await sb.from('programs').select('id,name,description,kind,phase,track,status,start_date').neq('status','archived'));
  if(error) return `<div class="empty">${esc(error.message)}</div>`;
  const order={technical:0,strength:1,accessory:2,other:3};
  S.programs=(progs||[]).sort((a,b)=>(order[a.kind]-order[b.kind])||a.name.localeCompare(b.name));
  if(!S.programs.length) return '<div class="card"><div class="empty">No program assigned yet. Your coach will add one soon.</div></div>';
  const ids=S.programs.map(p=>p.id);
  let { data:sess, error:se1 } = await sb.from('sessions')
    .select('id,program_id,week_number,day_number,title,notes,code,override_athlete_id,override_kind,session_exercises(*,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,load_text,rpe,rest_seconds,notes,warmup))')
    .in('program_id',ids);
  if(se1 && /column/i.test(se1.message)) ({ data:sess } = await sb.from('sessions')
    .select('id,program_id,week_number,day_number,title,notes,session_exercises(id,label,sort,notes,percent_of,exercise_id,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,load_text,rpe,rest_seconds,notes))')
    .in('program_id',ids));
  S.sessions=sess||[];
  // Personal sessions (coach edits for one athlete) replace the shared one on the same program, week and day.
  // The coach previews the shared program, so personal versions are left out of the coach's own view.
  if(S.sessions.some(s=>'override_athlete_id' in s)){
    const me=S.user.id;
    S.sessions=S.sessions.filter(s=>!s.override_athlete_id || (s.override_athlete_id===me && !isCoach()));
    // replace = their own version, removed = taken off their calendar (both hide the shared one), extra = added for them
    const kindOf=s=>s.override_athlete_id?(s.override_kind||'replace'):'shared';
    const mine=new Set(S.sessions.filter(s=>kindOf(s)==='replace'||kindOf(s)==='removed').map(s=>s.program_id+'|'+s.week_number+'|'+s.day_number));
    S.sessions=S.sessions.filter(s=>s.override_athlete_id || !mine.has(s.program_id+'|'+s.week_number+'|'+s.day_number));
    S.sessions=S.sessions.filter(s=>kindOf(s)!=='removed');
  }
  // One continuous timeline per plan: block 2 week 1 becomes week 5 when block 1 is 4 weeks.
  const progById=Object.fromEntries(S.programs.map(p=>[p.id,p]));
  S.sessions.forEach(s=>{ s.wk=s.week_number; s.week_number=s.wk+((progById[s.program_id]||{}).week_offset||0); });
  S.sessions.forEach(s=>{ s.session_exercises.sort((a,b)=>a.sort-b.sort); s.session_exercises.forEach(se=>se.prescriptions.sort((a,b)=>a.sort-b.sort)); });

  const { data:logs } = await sb.from('workout_logs').select('id,session_id,completed_at,set_logs(session_exercise_id,set_number,weight_kg,reps,made)')
    .eq('athlete_id',S.user.id).in('session_id',S.sessions.map(s=>s.id).concat(['00000000-0000-0000-0000-000000000000']));
  S.logs=Object.fromEntries((logs||[]).map(l=>[l.session_id,l]));

  // default week/day
  const weeks=[...new Set(S.sessions.map(s=>s.week_number))].sort((a,b)=>a-b);
  const saved=store.get('wd');
  if(S.week==null){
    let w=weeks[0]||1, d=null;
    const started=S.programs.find(p=>p.start_date);
    if(started){
      const planStart=new Date(started.start_date+'T00:00:00'); planStart.setDate(planStart.getDate()-7*(started.week_offset||0));
      const diff=Math.floor((Date.now()-planStart)/864e5);
      if(diff>=0){ w=Math.floor(diff/7)+1; }
    } else if(saved && weeks.includes(saved.w)) { w=saved.w; d=saved.d; }
    const jsd=new Date().getDay(); const today= jsd===0?7:jsd;
    const daysIn=daysForWeek(w);
    S.week=weeks.includes(w)?w:weeks[0];
    S.day = d && daysForWeek(S.week).includes(d) ? d : (daysIn.includes(today)?today:daysForWeek(S.week)[0]);
  }
  return true;
}

/* ---------------- HOME ---------------- */
function timeAgo(t){ const s=(Date.now()-new Date(t))/1000;
  if(s<3600) return Math.max(1,Math.round(s/60))+'m ago'; if(s<86400) return Math.round(s/3600)+'h ago';
  if(s<7*86400) return Math.round(s/86400)+'d ago'; return fmtDate(t); }

function evStart(e){ const [y,m,d]=e.event_date.split('-').map(Number); const [hh,mm]=(e.event_time||'08:00').split(':').map(Number); return new Date(y,m-1,d,hh,mm).getTime(); }
function tickCountdown(){
  const els=document.querySelectorAll('[data-cd]'); if(!els.length){ clearInterval(S.cdTimer); return; }
  const pad=n=>String(n).padStart(2,'0');
  els.forEach(el=>{
    const ms=+el.dataset.cd - Date.now();
    if(ms<=0){ el.innerHTML=`<span class="cd-day">${el.dataset.theme==='party'?'Party time. See you there.':el.dataset.theme==='comp'?'It\u2019s comp day. Go get it.':'It\u2019s on.'}</span>`; return; }
    const D=Math.floor(ms/864e5), H=Math.floor(ms%864e5/36e5), M=Math.floor(ms%36e5/6e4), Sx=Math.floor(ms%6e4/1e3);
    el.innerHTML=`${D}<small>d</small> ${pad(H)}<small>h</small> ${pad(M)}<small>m</small> ${pad(Sx)}<small>s</small>`;
  });
}

function bindHome(){
  $('bookBtn') && ($('bookBtn').onclick=()=>go('book'));
  clearInterval(S.cdTimer);
  if(document.querySelector('[data-cd]')){ tickCountdown(); S.cdTimer=setInterval(tickCountdown,1000); }
  const track=$('evTrack'), dots=$('evDots');
  if(track && dots){
    const n=track.children.length;
    const cur=()=>Math.round(track.scrollLeft/track.clientWidth);
    const mark=()=>dots.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===cur()));
    track.addEventListener('scroll',()=>{ cancelAnimationFrame(track._r); track._r=requestAnimationFrame(mark); },{passive:true});
    dots.querySelectorAll('button').forEach(b=>b.onclick=()=>{ track.scrollTo({left:+b.dataset.evi*track.clientWidth,behavior:'smooth'}); });
    // gentle auto-advance every 7s until someone touches it
    let touched=false; ['pointerdown','touchstart','wheel'].forEach(t=>track.addEventListener(t,()=>touched=true,{passive:true}));
    clearInterval(S.evTimer);
    if(!matchMedia('(prefers-reduced-motion: reduce)').matches)
      S.evTimer=setInterval(()=>{ if(!document.body.contains(track)){ clearInterval(S.evTimer); return; } if(touched) return;
        track.scrollTo({left:((cur()+1)%n)*track.clientWidth,behavior:'smooth'}); },7000);
  }
  const act=async fn=>{ const { error } = await fn(); if(error) toast(error.message); else loadHome(); };
  $('nPost') && ($('nPost').onclick=()=>{
    const body=$('nBody').value.trim(); if(!body){ toast('Write something first'); return; }
    act(()=>sb.from('coach_notes').insert({ title:$('nTitle').value.trim()||null, body, kind:$('nKind').value, group_id:$('nGroup').value||null }));
  });
  document.querySelectorAll('[data-delnote]').forEach(b=>b.onclick=e=>{ e.preventDefault(); act(()=>sb.from('coach_notes').delete().eq('id',b.dataset.delnote)); });
  document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>act(()=>sb.from('coach_notes').update({pinned:b.dataset.p!=='true'}).eq('id',b.dataset.pin)));
}

/* Christmas party scene: night sky, festoon lights, a tree with a glowing star, presents and a barbell in a Santa hat. */
function partyScene(){
  const rnd=i=>{ const x=Math.sin(i*777)*10000; return x-Math.floor(x); };
  const stars=Array.from({length:40},(_,i)=>`<circle class="tw" style="animation-delay:${(rnd(i)*3).toFixed(2)}s" cx="${(rnd(i+1)*480).toFixed(1)}" cy="${(rnd(i+9)*90).toFixed(1)}" r="${(0.4+rnd(i+4)*0.8).toFixed(2)}" fill="#fff" opacity="${(0.35+rnd(i+6)*0.6).toFixed(2)}"/>`).join('');
  const snow=Array.from({length:30},(_,i)=>`<circle class="sn" style="animation-delay:${(rnd(i+20)*6).toFixed(2)}s;animation-duration:${(5+rnd(i+30)*4).toFixed(1)}s" cx="${(rnd(i+40)*480).toFixed(1)}" cy="-6" r="${(0.8+rnd(i+50)*1.2).toFixed(2)}" fill="#fff" opacity=".8"/>`).join('');
  const cols=['#ff4d4d','#ffd36b','#3ddc84','#5ab4ff','#c8f06a'];
  const bulbs=(y0,sag,n,off)=>Array.from({length:n},(_,i)=>{ const t=i/(n-1), x=t*480, y=y0+Math.sin(t*Math.PI)*sag; const c=cols[(i+off)%5];
    return `<circle class="gl" style="animation-delay:${(i*.17%1.6).toFixed(2)}s" cx="${x.toFixed(1)}" cy="${(y+4).toFixed(1)}" r="6" fill="${c}" opacity=".25"/><circle cx="${x.toFixed(1)}" cy="${(y+4).toFixed(1)}" r="2.6" fill="${c}"/>`; }).join('');
  const tree=(x,b)=>`<path d="M${x},${b-118} L${x-26},${b-78} L${x-14},${b-78} L${x-38},${b-42} L${x-22},${b-42} L${x-48},${b-6} L${x+48},${b-6} L${x+22},${b-42} L${x+38},${b-42} L${x+14},${b-78} L${x+26},${b-78} Z" fill="#14532d"/>
    <path d="M${x},${b-118} L${x-26},${b-78} L${x-14},${b-78} L${x-38},${b-42} L${x-22},${b-42} L${x-48},${b-6} L${x},${b-6} Z" fill="#0f3f22"/>

const perthDate = d => new Date(d).toLocaleDateString('en-CA',{timeZone:'Australia/Perth'}); // YYYY-MM-DD
function mondayOf(dateStr){ const d=new Date(dateStr+'T00:00:00'); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return d; }
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

async function loadHome(){
  const todayStr=perthDate(Date.now());
  const since=mondayOf(todayStr); since.setDate(since.getDate()-7*11);
  const [trainOk, ev, hist, chk, notes] = await Promise.all([
    loadTrainingData(),
    sb.from('events').select('id,title,event_date,event_time,theme,location,description,link').gte('event_date',todayStr).order('event_date').order('event_time',{nullsFirst:true}).limit(8),
    sb.from('workout_logs').select('session_id,completed_at').eq('athlete_id',S.user.id).not('completed_at','is',null).gte('completed_at',ymd(since)),
    sb.from('checkins').select('day').eq('profile_id',S.user.id).gte('day',ymd(since)),
    sb.from('coach_notes').select('id,title,body,kind,group_id,pinned,created_at').order('pinned',{ascending:false}).order('created_at',{ascending:false}).limit(4),
  ]);
  const groups = isCoach() ? ((await sb.from('groups').select('id,name').order('sort')).data||[]) : [];
  // scoreboards: one per group the member is in (Whole Team excluded); coach sees every group
  const boardGroups = (isCoach() ? groups : ((await sb.from('group_members').select('groups(id,name,sort)').eq('profile_id',S.user.id)).data||[]).map(r=>r.groups).filter(Boolean))
    .filter(g=>g.name!=='Whole Team').sort((a,b)=>(a.sort??0)-(b.sort??0));
  const boards = await Promise.all(boardGroups.map(g=>sb.rpc('group_streaks',{gid:g.id}).then(r=>({g,rows:r.data||[]}))));
  const latest = (await sb.from('posts').select('id,title,category,created_at').eq('status','published').order('created_at',{ascending:false}).limit(1)).data?.[0];
  const hasProgram = trainOk===true;

  // Days trained, by calendar date (Perth). Technical + strength on one day = one training day.
  const checkDates=new Set((chk.data||[]).map(c=>c.day));
  const doneDates=new Set([...(hist.data||[]).map(l=>perthDate(l.completed_at)), ...checkDates]);
  // weekly goal: the member's own setting, else the program's days, else 3
  const target = S.profile.weekly_target || (hasProgram ? Math.max(1, daysForWeek(S.week).length) : 3);
  const thisMon=mondayOf(todayStr);
  const weekStats=[];
  for(let i=11;i>=0;i--){
    const m=new Date(thisMon); m.setDate(m.getDate()-7*i);
    let n=0; for(let k=0;k<7;k++){ const d=new Date(m); d.setDate(d.getDate()+k); if(doneDates.has(ymd(d))) n++; }
    weekStats.push({ mon:m, n });
  }
  const cur=weekStats[weekStats.length-1];
  // streak: full weeks hitting target, counting back from last week (this week counts once it's hit)
  let streak=0;
  for(let i=weekStats.length-2;i>=0;i--){ if(target && weekStats[i].n>=target) streak++; else break; }
  if(target && cur.n>=target) streak++;
  let best=0, run=0; weekStats.forEach(w=>{ run = target && w.n>=target ? run+1 : 0; best=Math.max(best,run); });

  let h='';

  // EVENTS
  const events=(ev.data||[]).filter(e=>evStart(e) > Date.now()-6*36e5); // drop events that started 6h+ ago
  if(events.length){
    const kicker={comp:'Next comp',party:'Save the date',other:'Coming up'};
    h+=`<div class="ev-wrap"><div class="ev-track" id="evTrack">${events.map((e,i)=>{
      const st=evStart(e);
      const when=new Date(st).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})+(e.event_time?' · '+new Date(st).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'}).replace(':00',''):'');
      return `<div class="comp ${esc(e.theme)}" role="group" aria-roledescription="slide" aria-label="${i+1} of ${events.length}: ${esc(e.title)}">
        ${e.theme==='party'?partyScene():compScene()}<div class="comp-shade"></div>${e.theme==='comp'?'<div class="jlights" aria-hidden="true"><i></i><i></i><i></i></div>':''}
        <div class="comp-txt"><div class="k">${kicker[e.theme]||'Coming up'}</div><div class="t">${esc(e.title)}</div>
          <div class="cd" data-cd="${st}" data-theme="${esc(e.theme)}"></div>
          <div class="d">${when}${e.location?' · '+esc(e.location):''}</div></div></div>`; }).join('')}</div>
      ${events.length>1?`<div class="ev-dots" id="evDots">${events.map((_,i)=>`<button aria-label="Show event ${i+1}" class="${i?'':'on'}" data-evi="${i}"></button>`).join('')}</div>`:''}</div>`;
  }

  // FROM THE COACH
  const ns=notes.data||[];
  if(ns.length || isCoach()){
    const top=ns[0], rest=ns.slice(1);
    const kindLbl={note:'Note',reminder:'Reminder',focus:'Focus'};
    h+=`<div class="brief"><div class="brief-top"><div class="coach-fig">${coachFigure()}</div>
        <div class="brief-h"><div style="flex:1;min-width:0"><div class="brief-k">From the coach</div>
          <div class="brief-n">Coach Ant${top?` <span>· ${timeAgo(top.created_at)}</span>`:''}</div></div>
          ${top?`<span class="tag ${esc(top.kind)}">${top.pinned?'📌 ':''}${kindLbl[top.kind]||'Note'}</span>`:''}</div></div>
        <div class="bubble">${top?`${top.title?`<div class="brief-t">${esc(top.title)}</div>`:''}<div class="brief-b">${esc(top.body)}</div>`
             :`<div class="brief-b" style="color:var(--muted)">Nothing posted yet.</div>`}</div>
        ${top&&isCoach()?`<div class="brief-act"><button class="btn sm" data-pin="${top.id}" data-p="${top.pinned}">${top.pinned?'Unpin':'Pin'}</button><button class="btn sm" data-delnote="${top.id}">Delete</button></div>`:''}`;
    if(rest.length) h+=`<details class="notes" style="margin-top:10px"><summary>Earlier (${rest.length})</summary>${rest.map(n=>`<div class="brief-old">
        <div class="hint">${kindLbl[n.kind]||'Note'} · ${timeAgo(n.created_at)}${isCoach()?` · <a href="#" data-delnote="${n.id}">delete</a>`:''}</div>
        ${n.title?`<b>${esc(n.title)}</b>`:''}<p>${esc(n.body)}</p></div>`).join('')}</details>`;
    if(isCoach()) h+=`<div class="composer">
        <input id="nTitle" placeholder="Headline (optional)">
        <textarea id="nBody" placeholder="Reminder, focus for the week, a note to the team…"></textarea>
        <div class="chips-add"><select id="nKind"><option value="note">Note</option><option value="reminder">Reminder</option><option value="focus">Focus</option></select>
          <select id="nGroup"><option value="">Everyone</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
          <button class="btn sm primary" id="nPost">Post</button></div></div>`;
    h+='</div>';
  }

  if(latest) h+=`<a class="card latest" href="#post/${latest.id}"><div class="card-label"><span>Latest on the forum</span><span>${timeAgo(latest.created_at)}</span></div>
      <div class="fm-meta"><span class="tag cat">${esc(latest.category)}</span></div><div class="fm-t">${esc(latest.title)}</div><div class="hint" style="margin-top:6px">Read and comment ›</div></a>`;
  const featH=h; h='';

  // THIS WEEK
  const pct=Math.min(100,Math.round(cur.n/target*100));
  const remaining=Math.max(0,target-cur.n);
  const jsd=new Date().getDay(); const todayN=jsd===0?7:jsd;
  const programmed=hasProgram?daysForWeek(S.week):[];
  const todayDone=doneDates.has(todayStr), todayCheck=checkDates.has(todayStr);
  let msg;
  if(remaining===0) msg = streak>1 ? `Week done. That's <b>${streak} weeks</b> in a row.` : `Week done. That's how it's built.`;
  else if(streak>0) msg = `<b>${remaining} more</b> to keep your ${streak}-week streak alive.`;
  else msg = `Hit <b>${target} sessions</b> this week to start a streak.`;
  const R=34, C=2*Math.PI*R;
  h+=`<div class="card"><div class="card-label"><span>This week</span><button class="goal-btn" id="goalBtn" aria-expanded="false">Goal ${target}/wk ✎</button></div>
    <div class="goal-edit" id="goalEdit" hidden><span>Sessions per week</span>
      <button class="btn sm" id="gMinus" aria-label="Fewer">−</button><b id="gVal">${target}</b><button class="btn sm" id="gPlus" aria-label="More">+</button>
      <button class="btn sm primary" id="gSave">Save</button></div>
    <div class="wk-top">
      <svg class="ring" viewBox="0 0 84 84" aria-label="${cur.n} of ${target} sessions done">
        <circle cx="42" cy="42" r="${R}" class="ring-bg"/>
        <circle cx="42" cy="42" r="${R}" class="ring-fg" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}"/>
        <text x="42" y="40" text-anchor="middle" class="ring-n">${cur.n}/${target}</text>
        <text x="42" y="55" text-anchor="middle" class="ring-l">sessions</text>
      </svg>
      <div style="flex:1;min-width:0"><div class="wk-msg">${msg}</div>
        <div class="wdots">${[1,2,3,4,5,6,7].map(d=>{
          const date=new Date(thisMon); date.setDate(date.getDate()+d-1);
          const done=doneDates.has(ymd(date)), prog=programmed.includes(d);
          const cls = done?'done' : (prog && d<todayN)?'miss' : d===todayN?'today' : prog?'prog':'';
          return `<div class="wd ${cls}"><i></i><span>${DAYS[d][0]}</span></div>`; }).join('')}</div>
      </div>
    </div>
    <div class="checkin">${todayDone
      ? `<span class="ci-done">✓ Trained today</span>${todayCheck?'<button class="btn sm" id="ciUndo">Undo</button>':''}`
      : `<button class="btn primary block" id="ciLog">Log today\u2019s session</button>`}</div></div>`;

  // UP NEXT
  const nextDay = programmed.find(d=>d>=todayN && !doneDates.has(ymd(new Date(thisMon.getFullYear(),thisMon.getMonth(),thisMon.getDate()+d-1))));
  if(hasProgram && nextDay){
    const gs=dayGroups(S.week,nextDay);
    const names=gs.map(g=>g.opts.length>1 ? planName(g.shown[0].p)+' · '+g.opts.map(x=>trackLabel(x.p)).join(' or ') : planName(g.shown[0].p));
    const exCount=gs.reduce((a,g)=>a+g.shown.reduce((b,x)=>b+x.s.session_exercises.length,0),0);
    h+=`<div class="card next"><div class="card-label"><span>${nextDay===todayN?'Today':'Up next · '+DAYS[nextDay]}</span><span>W${S.week} D${nextDay}</span></div>
      <div class="next-t">${esc(names.join(' + '))}</div><div class="hint">${exCount} exercise${exCount===1?'':'s'}</div>
      <button class="btn primary block" style="margin-top:12px" id="startNext">${nextDay===todayN?'Start session':'View session'}</button></div>`;
  } else if(hasProgram && remaining>0){
    h+=`<div class="card next"><div class="next-t">Missed one? Make it up.</div><div class="hint">Any session you get done this week counts toward your ${target}. Open Training and pick a day you missed.</div>
      <button class="btn block" style="margin-top:12px" id="startMakeup">Open training</button></div>`;
  } else if(remaining===0){
    h+=`<div class="card next"><div class="next-t">All done for the week.</div><div class="hint">Recover well. Eat, sleep, come back hungry.</div></div>`;
  }

  h+=bookCardHTML();
  const trainH=h; h='';

  // STREAK + LAST 12 WEEKS
  const maxN=Math.max(target,...weekStats.map(w=>w.n));
  h+=`<div class="card"><div class="card-label"><span>Consistency</span><span>Last 12 weeks</span></div>
    <div class="streak"><div><div class="st-n">${streak}</div><div class="hint">week streak</div></div>
      <div><div class="st-n">${best}</div><div class="hint">best streak</div></div>
      <div><div class="st-n">${weekStats.reduce((a,w)=>a+w.n,0)}</div><div class="hint">days trained</div></div></div>
    <div class="bars">${weekStats.map((w,i)=>`<div class="bcol" title="Week of ${w.mon.toLocaleDateString('en-AU',{day:'numeric',month:'short'})}: ${w.n} days">

  technical:{rm:{1:100,2:95,3:91,4:87,5:84}, vary:{power:80,hang:92,block:97,pause:90,muscle:65}, start:{heavy:5,moderate:10,light:20}, floor:{heavy:0,moderate:6,light:15}, weekly:2.5},

function mergeGuideCfg(v){

    ['start','floor'].forEach(k=>{ if(o[k]) ['heavy','moderate','light'].forEach(l=>{ if(numOk(o[k][l])) g[t][k][l]=+o[k][l]; }); });
    if(numOk(o.weekly)) g[t].weekly=+o.weekly;
    if(t==='technical' && o.vary) Object.keys(g.technical.vary).forEach(k=>{ if(numOk(o.vary[k])) g.technical.vary[k]=+o.vary[k]; }); });

let GUIDE=mergeGuideCfg(null);
async function loadGuideCfg(){

}
const gR = v => Math.round(v);
const VARY_RE={power:/\bpower\b/, hang:/\bhang\b/, block:/\bblocks?\b/, pause:/\bpause/, muscle:/\bmuscle\b/};
function varyFactor(name, vary){

    let x=1; Object.entries(VARY_RE).forEach(([k,re])=>{ if(re.test(part)) x*=(numOk((vary||{})[k])?+vary[k]:100)/100; });
    return Math.min(f,x); },1);

function jumps(target, reps, kind){

  return `<div class="sg"><div class="sg-h">Set Guide <span>${tech?'Technical lift':'Strength lift'}</span></div>${note}${P.map(x=>`<p>${x}</p>`).join('')}${jl}<div class="sg-f">${foot}</div></div>`;
}

function renderToday(){
  const weeks=[...new Set(S.sessions.map(s=>s.week_number))].sort((a,b)=>a-b);
  const days=daysForWeek(S.week);
  const wi=weeks.indexOf(S.week);
  store.set('wd',{w:S.week,d:S.day});
  const dayDot=d=>{
    const ss=dayGroups(S.week,d).flatMap(g=>g.shown.map(x=>x.s));
    const done=ss.filter(s=>S.logs[s.id]?.completed_at).length;
    const any=ss.some(s=>S.logs[s.id]);
    return done===ss.length&&done? 'done' : any? 'part' : '';
  };
  let h=`<div class="wk-nav"><button id="wPrev" ${wi<=0?'disabled':''} aria-label="Previous week">‹</button>
    <div class="lbl">Week ${S.week}${weekPhase(S.week)?' · '+esc(weekPhase(S.week)):''}</div>
    <button id="wNext" ${wi>=weeks.length-1?'disabled':''} aria-label="Next week">›</button></div>
    <div class="strip" style="--n:${Math.max(days.length,1)}">${days.map(d=>`<button class="dy ${d===S.day?'on':''}" data-d="${d}">
      <div class="n">${DAYS[d]||'Day'}</div><div class="d">D${d}</div><div class="dot ${dayDot(d)}"></div></button>`).join('')}</div>`;

  const groups=dayGroups(S.week,S.day);
  if(!groups.length) h+='<div class="card"><div class="empty">Rest day. Nothing programmed.</div></div>';
  groups.forEach(g=>{ h+=renderGroup(g); });
  $('view').innerHTML=h;
  bindToday();
}

const KORDER={technical:0,strength:1,accessory:2,other:3};
const planName = p => p.plan_id ? String(p.name).split(' · ')[0] : p.name;
const trackLabel = p => p.track || (p.kind==='other' ? 'Program' : p.kind[0].toUpperCase()+p.kind.slice(1));
function weekPhase(w){ const s=S.sessions.find(x=>x.week_number===w); const p=s&&S.programs.find(p=>p.id===s.program_id); return p?.phase||''; }

// Everything from one plan (and one day option, e.g. Base 4 day) on one day is one session for the athlete.
// Option tracks (FNDN Strength / Engine / Oly) are alternatives: on days with 2+ the athlete picks one.
// Athletes only ever get their own strength track; the coach sees all of them, so those become a preview switch.
function dayGroups(week, day){
  const items=S.sessions.filter(s=>s.week_number===week&&s.day_number===day)
    .map(s=>({s, p:S.programs.find(p=>p.id===s.program_id)})).filter(x=>x.p);
  const by=new Map();
  items.forEach(x=>{ const k=(x.p.plan_id||x.p.id)+(x.p.days_version?'|'+x.p.days_version+'d':''); if(!by.has(k)) by.set(k,[]); by.get(k).push(x); });
  const pick=store.get('opt')||{};
  const choose=(key,set,tag)=>{ if(set.length<2) return null; const saved=pick[key+'|'+tag+'|'+week+'|'+day];
    return set.find(x=>x.s.id===saved) || set.find(x=>S.logs[x.s.id]) || set[0]; };
  return [...by.entries()].map(([key,list])=>{
    const isAlt=x=>x.p.is_option||x.p.is_select;
    list.sort((a,b)=>(a.p.is_option?1:0)-(b.p.is_option?1:0)
      || (a.p.is_option ? (a.p.track||'').localeCompare(b.p.track||'') : (KORDER[a.p.kind]-KORDER[b.p.kind]) || (a.p.track||'').localeCompare(b.p.track||'')));
    const opts=list.filter(x=>x.p.is_option), sels=list.filter(x=>x.p.is_select);
    const chosen=choose(key,opts,'o'), chosenSel=choose(key,sels,'s');
    const shown=list.filter(x=>!isAlt(x) || (x.p.is_option ? (!chosen || x===chosen) : (!chosenSel || x===chosenSel)));
    return { key, list, opts, chosen, sels, chosenSel, shown, ver:list[0].p.days_version||null };
  });
}

function renderGroup(g){
  const first=g.shown[0], p0=first.p;
  const ids=g.shown.map(x=>x.s.id);
  const done=g.shown.every(x=>S.logs[x.s.id]?.completed_at);
  const doneAt=done ? g.shown.map(x=>S.logs[x.s.id].completed_at).sort().pop() : null;
  const multi=g.shown.length>1;
  const code=g.shown.map(x=>x.s.code).filter(Boolean)[0];
  let h=`<div class="card">
    <div class="prog-h"><h2>${esc(first.s.title||DAYS[first.s.day_number])}</h2>
      ${isCoach()&&g.shown.some(x=>x.p.status!=='published')?'<span class="pill draft">Draft</span>':''}</div>
    <div class="hint">${esc(planName(p0))}${g.ver&&isCoach()?' · '+g.ver+' day':''}${p0.phase&&p0.phase!==planName(p0)?' · '+esc(p0.phase):''}${code?' · '+esc(code):''}</div>`;
  if(g.opts.length>1){
    h+=`<div class="opt-pick" role="tablist" aria-label="Choose today's session">${g.opts.map(x=>`<button role="tab" aria-selected="${x===g.chosen}" class="${x===g.chosen?'on':''}" data-opt="${esc(g.key)}|o|${x.s.id}">${esc(trackLabel(x.p))}${S.logs[x.s.id]?.completed_at?' ✓':''}</button>`).join('')}</div>
      <div class="hint" style="margin-top:6px">Pick one for today. Swipe or tap to compare.</div>`;
  }
  if(g.sels.length>1){
    h+=`<div class="opt-pick" role="tablist" aria-label="Preview strength track">${g.sels.map(x=>`<button role="tab" aria-selected="${x===g.chosenSel}" class="${x===g.chosenSel?'on':''}" data-opt="${esc(g.key)}|s|${x.s.id}">${esc(trackLabel(x.p))}</button>`).join('')}</div>
      <div class="hint" style="margin-top:6px">Coach preview: athletes only see their own strength track.</div>`;
  }
  g.shown.forEach(x=>{
    h+=`<div class="part" data-sess="${x.s.id}">`;
    if(multi) h+=`<div class="part-h"><span class="pill ${esc(x.p.kind)}">${esc(trackLabel(x.p))}</span></div>`;
    h+=renderSessionBody(x.p,x.s)+'</div>';
  });
  h+=`<div class="done-bar" style="margin-top:16px">${done
      ? `<span class="hint" style="flex:1">Completed ${fmtDate(doneAt)}</span><button class="btn sm" data-undo="${ids.join(',')}">Undo</button>`
      : `<button class="btn primary block" data-complete="${ids.join(',')}">Complete session</button>`}</div>`;
  return h+'</div>';
}

function renderSessionBody(p,s){
  const log=S.logs[s.id];
  let h='';
  if(s.notes) h+=`<details class="notes" open><summary>Session notes</summary><p>${esc(s.notes)}</p></details>`;
  if(p.description) h+=`<details class="notes"><summary>About this block</summary><p>${esc(p.description)}</p></details>`;
  s.session_exercises.forEach(se=>{
    const ex=S.exercises[se.exercise_id]||{name:'Exercise'};
    const { max, base } = baseMax(se);
    const usesPct=se.prescriptions.some(p=>p.percent!=null&&!p.warmup);
    const yt=safeYoutube(ex.youtube_url);
    const hasInfo=ex.cues||ex.description||se.notes||yt;
    const openKey=se.id;
    h+=`<div class="ex"><div class="ex-h">${se.label?`<span class="slot">${esc(se.label)}</span>`:''}
      <div class="ex-n">${esc(ex.name)}</div>
      <div class="ex-btns">${guideOn(se)?`<button class="btn sm sg-btn ${S.guide[openKey]?'on':''}" data-guide="${openKey}" aria-expanded="${S.guide[openKey]?'true':'false'}">Set Guide</button>`:''}${hasInfo?`<button class="btn sm" data-info="${openKey}">${S.open[openKey]?'Hide':'Info'}</button>`:''}
      ${yt?`<a class="btn sm" href="${esc(yt)}" target="_blank" rel="noopener">▶ Video</a>`:''}</div></div>`;
    const wu=se.prescriptions.filter(p=>p.warmup), work=se.prescriptions.filter(p=>!p.warmup), hk=heavyFromLog(se, log);
    h+='<div class="rx">'+(wu.length?`<div class="wu-line"><b>Build up</b>${wu.map(pr=>`<span>${rxText(pr,se,true)||esc(pr.load_text||'')} × ${esc(pr.reps)}</span>`).join('<span>·</span>')}</div>`:'')+work.map(pr=>{ const nt=pr.notes?`<span class="nt">${esc(pr.notes)}</span>`:'';
        if(HEAVY_RE.test(pr.load_text||'')) return `<div class="ln"><b>${esc(pr.load_text)}</b>${nt}</div>`;
        const dp=dropPct(pr); if(dp!=null){ const k=dropKg(hk,dp); return `<div class="ln"><span class="sr">${pr.sets>1?pr.sets+' × ':''}${esc(pr.reps)}</span><span>${esc(pr.load_text)} <span class="kg" data-dropfor="${se.id}" data-pct="${dp}">${k?`≈ ${k} kg`:''}</span></span>${nt}</div>`; }
        return `<div class="ln"><span class="sr">${pr.sets>1?pr.sets+' × ':''}${esc(pr.reps)}</span><span>${rxText(pr,se)}</span>${nt}</div>`; }).join('')+'</div>';
    if(S.guide[openKey] && guideOn(se)) h+=setGuideHTML(p, s, se, log);
    if(usesPct && !max && !S.guide[openKey]) h+=`<div class="hint" style="margin-bottom:6px">Add your ${esc(base?.name||ex.name)} max in <a href="#" data-goto="maxes">Maxes</a> to see kilos.</div>`;
    if(S.open[openKey]){
      h+='<div class="info">';
      if(se.notes) h+=`<div class="blk"><span class="lbl">Coach notes</span>${esc(se.notes)}</div>`;
      if(ex.cues) h+=`<div class="blk"><span class="lbl">Cues</span>${esc(ex.cues)}</div>`;
      if(ex.description) h+=`<div class="blk"><span class="lbl">About</span>${esc(ex.description)}</div>`;
      if(yt) h+=`<div class="blk"><a href="${esc(yt)}" target="_blank" rel="noopener">Watch the demo video</a></div>`;
      h+='</div>';
    }
    const lst=lastFor(se.exercise_id, log?.id);
    if(lst) h+=`<div class="last">Last time (${fmtDate(lst.date)}): <b>${lst.sets.map(r=>`${+r.weight_kg}${r.reps?'×'+esc(r.reps):''}${r.made?'':'✗'}`).join(', ')}</b></div>`;

    // set rows
    const rows=[]; let n=0;
    se.prescriptions.filter(pr=>!pr.warmup).forEach(pr=>{ for(let i=0;i<setRows(pr);i++){ n++; rows.push({n,pr,i}); } });
    h+=`<div class="set-head"><span>#</span><span>Target</span><span>Kg</span><span>Reps</span><span></span></div><div class="sets">`;
    rows.forEach(({n,pr,i})=>{
      const sl=log?.set_logs?.find(x=>x.session_exercise_id===se.id&&x.set_number===n);
      const isHv=HEAVY_RE.test(pr.load_text||''), dp=dropPct(pr);
      if(isHv && i===0) h+=`<div class="set-lbl"><b>Top three attempts</b> <span>(include your heaviest three attempts)</span></div>`;
      if(dp!=null && i===0 && rows.some(r=>HEAVY_RE.test(r.pr.load_text||''))) h+=`<div class="set-lbl"><b>Down sets</b></div>`;
      const tgt= isHv ? esc(heavyShort(pr.load_text))
        : dp!=null ? `${esc(pr.reps)} @ <span data-dropfor="${se.id}" data-pct="${dp}" data-short="1">${dropKg(hk,dp)?`≈ ${dropKg(hk,dp)} kg`:`${dp}% less`}</span>`
        : `${esc(pr.reps)} @ ${rxText(pr,se,true)||'—'}`;
      const made = sl ? (sl.made?'made':'miss') : '';
      h+=`<div class="set" data-se="${se.id}" data-n="${n}"${isHv?' data-heavy="1"':''}>
        <span class="no">${n}</span><span class="tg">${tgt}</span>
        <input inputmode="decimal" data-f="w" placeholder="kg" value="${sl?.weight_kg!=null?+sl.weight_kg:''}" class="${sl?'saved':''}" aria-label="Set ${n} weight">
        <input inputmode="text" data-f="r" placeholder="${esc(pr.reps)}" value="${esc(sl?.reps!=null?sl.reps:pr.reps)}" class="${sl?.reps!=null?'saved':'pre'}" aria-label="Set ${n} reps">
        <button class="mk ${made}" data-f="m" aria-label="Made or missed">${made==='miss'?'✗':'✓'}</button></div>`;
    });
    h+='</div></div>';
  });

  return h;
}

function bindToday(){
  document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{ const k=b.dataset.guide; S.guide[k]=!S.guide[k]; renderToday(); });
  const weeks=[...new Set(S.sessions.map(s=>s.week_number))].sort((a,b)=>a-b);
  const wi=weeks.indexOf(S.week);
  const setWeek=w=>{ S.week=w; const ds=daysForWeek(w); if(!ds.includes(S.day)) S.day=ds[0]; renderToday(); };
  $('wPrev') && ($('wPrev').onclick=()=>wi>0&&setWeek(weeks[wi-1]));
  $('wNext') && ($('wNext').onclick=()=>wi<weeks.length-1&&setWeek(weeks[wi+1]));
  document.querySelectorAll('.dy').forEach(b=>b.onclick=()=>{ S.day=+b.dataset.d; renderToday(); });
  document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{ const k=b.dataset.info; S.open[k]=!S.open[k]; renderToday(); });
  document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{ e.preventDefault(); go(a.dataset.goto); });
  document.querySelectorAll('.set input').forEach(inp=>inp.onchange=()=>saveSet(inp.closest('.set')));
  document.querySelectorAll('.set input[data-f=r]').forEach(inp=>inp.addEventListener('input',()=>inp.classList.remove('pre')));
  document.querySelectorAll('.set .mk').forEach(b=>b.onclick=()=>{
    const made=!b.classList.contains('miss') && b.classList.contains('made') ? false : true;
    b.classList.toggle('miss',!made); b.classList.toggle('made',made); b.textContent=made?'✓':'✗';
    saveSet(b.closest('.set'));
  });
  document.querySelectorAll('[data-complete]').forEach(b=>{
    const card=b.closest('.card');
    card.querySelectorAll('.set input').forEach(inp=>inp.addEventListener('input',()=>gateComplete(b)));
    gateComplete(b);
    b.onclick=()=>{ if(gateComplete(b)) completeSession(b.dataset.complete,true); };
  });
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>completeSession(b.dataset.undo,false));
  const pickOpt=v=>{ const i=v.lastIndexOf('|'); const key=v.slice(0,i), sid=v.slice(i+1); const m=store.get('opt')||{}; m[key+'|'+S.week+'|'+S.day]=sid; store.set('opt',m); renderToday(); }; // key already ends in |o or |s
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>pickOpt(b.dataset.opt));
  // swipe left/right on a card with options to move between them
  document.querySelectorAll('.opt-pick[aria-label="Choose today\'s session"]').forEach(bar=>{
    const card=bar.closest('.card'); let x0=null, y0=null;
    card.addEventListener('touchstart',e=>{ if(e.target.closest('input,button')) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
    card.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
      if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)) return;
      const btns=[...bar.querySelectorAll('[data-opt]')], i=btns.findIndex(b=>b.classList.contains('on'));
      const nx=btns[i+(dx<0?1:-1)]; if(nx) pickOpt(nx.dataset.opt); },{passive:true});
  });
}

// Complete only unlocks once every set in the session has kg and reps filled in.
function gateComplete(btn){
  const rows=[...btn.closest('.card').querySelectorAll('.set')];
  const left=rows.filter(r=>!r.querySelector('[data-f=w]').value.trim() || !r.querySelector('[data-f=r]').value.trim()).length;
  btn.disabled=left>0; btn.classList.toggle('locked',left>0);
  btn.textContent = left ? `Fill in every set (${left} to go)` : 'Complete session';
  return left===0;
}
async function ensureLog(sessionId){
  if(S.logs[sessionId]) return S.logs[sessionId];
  const { data, error } = await sb.from('workout_logs').upsert({ athlete_id:S.user.id, session_id:sessionId },{ onConflict:'athlete_id,session_id' })
    .select('id,session_id,completed_at').single();
  if(error) throw error;
  data.set_logs=[]; S.logs[sessionId]=data; return data;
}
async function saveSet(row){
  const sessionId=row.closest('[data-sess]').dataset.sess;
  const seId=row.dataset.se, n=+row.dataset.n;
  const w=row.querySelector('[data-f=w]').value.trim(), r=row.querySelector('[data-f=r]').value.trim();
  const mk=row.querySelector('.mk');
  if(!w && !r && !mk.classList.contains('made') && !mk.classList.contains('miss')) return;
  if(!mk.classList.contains('made')&&!mk.classList.contains('miss')){ mk.classList.add('made'); }
  try{
    const log=await ensureLog(sessionId);
    const rec={ workout_log_id:log.id, session_exercise_id:seId, set_number:n,
      weight_kg: w===''?null:Number(w.replace(',','.')), reps: r===''?null:r, made: !mk.classList.contains('miss') };
    if(rec.weight_kg!=null && isNaN(rec.weight_kg)) { toast('Weight needs to be a number'); return; }
    const { error } = await sb.from('set_logs').upsert(rec,{ onConflict:'workout_log_id,session_exercise_id,set_number' });
    if(error) throw error;
    log.set_logs=(log.set_logs||[]).filter(x=>!(x.session_exercise_id===seId&&x.set_number===n)).concat([rec]);
    row.querySelectorAll('input').forEach(i=>{ i.classList.add('saved'); i.classList.remove('pre'); });
    if(row.dataset.heavy) refreshDrops(row.closest('[data-sess]')?.parentElement||document, seId);
  }catch(err){ toast('Not saved: '+err.message); }
}
async function completeSession(sessionIds, done){
  try{
    const completed_at = done ? new Date().toISOString() : null;
    for(const sessionId of String(sessionIds).split(',').filter(Boolean)){
      const log=await ensureLog(sessionId);
      const { error } = await sb.from('workout_logs').update({ completed_at }).eq('id',log.id);
      if(error) throw error;
      log.completed_at=completed_at;
    }
    renderToday(); if(done) toast('Session complete. Nice work.');
  }catch(err){ toast(err.message); }
}

async function loadMaxes(){
  await loadExercises();
  const { data:hist } = await sb.from('athlete_maxes').select('id,exercise_id,weight_kg,recorded_on,created_at')
    .eq('athlete_id',S.user.id).order('recorded_on',{ascending:false}).order('created_at',{ascending:false});
  const byEx={}; (hist||[]).forEach(m=>(byEx[m.exercise_id]=byEx[m.exercise_id]||[]).push(m));
  // lifts that percentages are worked off, plus any lift with a max recorded
  const bases=Object.values(S.exercises).filter(e=>!e.default_percent_of || byEx[e.id]);
  const order=['Snatch','Clean & Jerk','Clean','Back Squat','Front Squat','Push Press'];
  bases.sort((a,b)=>{ const ia=order.indexOf(a.name), ib=order.indexOf(b.name); return (ia<0?99:ia)-(ib<0?99:ib) || a.name.localeCompare(b.name); });
  $('view').innerHTML=`<div class="card"><div class="card-label"><span>Your 1RMs</span><span>kg</span></div>
    <p class="hint" style="margin-bottom:8px">Percentages in your program turn into kilos from these. Update them whenever you hit a new best.</p>
    ${bases.map(e=>{ const cur=byEx[e.id]?.[0]; const prev=byEx[e.id]?.[1];
      return `<div class="row"><div class="l"><b>${esc(e.name)}</b><span>${cur?`Set ${fmtDate(cur.recorded_on)}${prev?` · was ${+prev.weight_kg}`:''}`:'Not set'}</span></div>
      <div class="inline"><input inputmode="decimal" placeholder="${cur?+cur.weight_kg:'kg'}" data-max="${e.id}" aria-label="${esc(e.name)} max"><button class="btn sm" data-savemax="${e.id}">Save</button></div></div>`; }).join('')}
  </div>`;
  document.querySelectorAll('[data-savemax]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.savemax, inp=document.querySelector(`[data-max="${id}"]`); const v=Number(inp.value.replace(',','.'));
    if(!v||v<=0){ toast('Enter a weight in kg'); return; }
    const { error } = await sb.from('athlete_maxes').insert({ athlete_id:S.user.id, exercise_id:id, weight_kg:v, source:'manual' });
    if(error){ toast(error.message); return; }
    toast('Max saved'); S.week=null; loadMaxes();
  });
}


// Forum unread: published posts newer than the last time this member opened the Forum (not their own).
async function updateForumBadge(){

const REACTS=[['fire','🔥'],['strong','💪'],['clap','👏']];

function ytId(u){ if(!safeYoutube(u)) return null; const m=u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m?m[1]:null; }
function inlineMd(t){
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$|[.,!?])/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(text){
  const lines=esc(text||'').split('\n'); let out='', list=false, para=[];
  const flush=()=>{ if(para.length){ out+='<p>'+inlineMd(para.join('<br>'))+'</p>'; para=[]; } };
  for(const raw of lines){ const l=raw.trimEnd();
    if(/^- /.test(l)){ flush(); if(!list){ out+='<ul>'; list=true; } out+='<li>'+inlineMd(l.slice(2))+'</li>'; continue; }
    if(list){ out+='</ul>'; list=false; }
    if(/^#{1,3} /.test(l)){ flush(); out+='<h3>'+inlineMd(l.replace(/^#{1,3} /,''))+'</h3>'; continue; }
    if(!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); if(list) out+='</ul>'; return out;
}
const plain=t=>String(t||'').replace(/[#*_>\[\]()-]/g,' ').replace(/https:\/\/\S+/g,'').replace(/\s+/g,' ').trim();

async function fetchPosts(reset){
  const F=S.forum, PER=15;
  if(reset){ F.page=0; F.done=false; $('fmList').innerHTML='<div class="empty">Loading…</div>'; }
  let q=sb.from('posts').select('id,title,body,category,video_url,pinned,status,created_at')
    .order('pinned',{ascending:false}).order('created_at',{ascending:false}).range(F.page*PER, F.page*PER+PER-1);
  if(F.cat!=='All') q=q.eq('category',F.cat);
  const term=F.q.replace(/[,()*:%\\."']/g,' ').trim();
  if(term) q=q.or(`title.ilike.*${term}*,body.ilike.*${term}*`);
  const { data, error } = await q;
  if(error){ $('fmList').innerHTML=`<div class="empty">${esc(error.message)}</div>`; return; }
  const ids=data.map(p=>p.id);
  const [c,r]=ids.length?await Promise.all([
    sb.from('post_comments').select('post_id').in('post_id',ids),
    sb.from('post_reactions').select('post_id,kind').in('post_id',ids)]):[{data:[]},{data:[]}];
  const cc={}, rc={}; (c.data||[]).forEach(x=>cc[x.post_id]=(cc[x.post_id]||0)+1);
  (r.data||[]).forEach(x=>{ (rc[x.post_id]=rc[x.post_id]||{})[x.kind]=(rc[x.post_id][x.kind]||0)+1; });
  const html=data.map(p=>{ const id=ytId(p.video_url); const ex=plain(p.body);
    return `<a class="fm-card" href="#post/${p.id}">
      ${id?`<div class="fm-thumb" style="background-image:url('https://i.ytimg.com/vi/${id}/hqdefault.jpg')"><span>▶</span></div>`:''}
      <div class="fm-body"><div class="fm-meta"><span class="tag cat">${esc(p.category)}</span>${p.created_at>(S.forumPrevSeen||'')&&p.status==='published'?'<span class="tag newtag">New</span>':''}${p.pinned?'<span class="tag pin">📌 Pinned</span>':''}${p.status==='draft'?'<span class="tag reminder">Draft</span>':''}<span class="hint">${fmtDate(p.created_at)}</span></div>
        <div class="fm-t">${esc(p.title)}</div>
        ${ex?`<div class="fm-ex">${esc(ex.slice(0,170))}${ex.length>170?'…':''}</div>`:''}
        <div class="fm-stats">${REACTS.map(([k,e])=>rc[p.id]?.[k]?`<span>${e} ${rc[p.id][k]}</span>`:'').join('')}<span>💬 ${cc[p.id]||0}</span></div></div></a>`; }).join('');
  if(reset) $('fmList').innerHTML = html || `<div class="card"><div class="empty">${F.q||F.cat!=='All'?'Nothing matches that. Try another word.':'No posts yet.'}</div></div>`;
  else $('fmList').insertAdjacentHTML('beforeend',html);
  F.done=data.length<PER; F.page++;
  $('fmMore').innerHTML=F.done?'':'<button class="btn block" id="fmMoreBtn">Load older posts</button>';
  $('fmMoreBtn') && ($('fmMoreBtn').onclick=()=>fetchPosts(false));
}

const VAPID_PUBLIC='BNZPCKwEgHDRLxXL25rSqz6nlitht0F5dEx-IRsFEIV7Bs3bJe2nnEehLVIFh5QmkfJQ5Bh3o9941y7GHfO2iRQ';
const pushSupported=()=>'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
function b64ToBytes(b){ const p='='.repeat((4-b.length%4)%4); const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r,c=>c.charCodeAt(0)); }
let swReg=null;
async function registerSW(){ if(!('serviceWorker' in navigator)) return; try{ swReg=await navigator.serviceWorker.register('sw.js'); }catch(e){ console.warn('sw',e); } }
async function saveSub(sub){
  const j=sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({ profile_id:S.user.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0,200) },{ onConflict:'endpoint' });
  if(error) throw error;
}
async function enablePush(){
  if(!pushSupported()){ toast(isIOS()&&!isStandalone()?'Add Rev to your Home Screen first, then open it from there.':'This browser can’t do notifications.'); return false; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast('Notifications are blocked. Turn them on in your phone settings for Rev.'); return false; }
  const reg=swReg||await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC) });
  try{ await saveSub(sub); toast('Notifications on'); return true; }catch(e){ toast('Couldn’t save: '+e.message); return false; }
}
async function disablePush(){
  const reg=swReg||(await navigator.serviceWorker?.getRegistration());
  const sub=await reg?.pushManager.getSubscription();
  if(sub){ await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe().catch(()=>{}); }
}
async function pushState(){
  if(!pushSupported()) return isIOS()&&!isStandalone() ? 'needs-install' : 'unsupported';
  if(Notification.permission==='denied') return 'blocked';
  const reg=swReg||(await navigator.serviceWorker.getRegistration());
  const sub=await reg?.pushManager.getSubscription();
  return sub && Notification.permission==='granted' ? 'on' : 'off';
}
// keep this device's subscription fresh in the database
async function refreshPush(){ try{ if(await pushState()==='on'){ const reg=swReg||await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub) await saveSub(sub); } }catch(e){} }
async function pushPromptHTML(){
  const st=await pushState(); if(store.get('pushDismissed') && st!=='needs-install') return '';
  if(st==='off') return `<div class="card push-card"><div class="pc-i">🔔</div><div style="flex:1"><b>Turn on notifications</b><div class="hint">Get a ping for messages from Coach Ant or your group, and new forum posts.</div></div>
    <div class="pc-b"><button class="btn primary sm" id="pushOn">Turn on</button><button class="btn sm" id="pushNo">Later</button></div></div>`;
  if(st==='needs-install') return `<div class="card push-card"><div class="pc-i">📲</div><div style="flex:1"><b>Install Rev on your phone</b><div class="hint">Tap the Share button, then <b>Add to Home Screen</b>. Open Rev from your home screen to turn on notifications.</div></div></div>`;
  return '';
}
function bindPushPrompt(){
  $('pushOn') && ($('pushOn').onclick=async()=>{ if(await enablePush()) $('pushOn').closest('.push-card').remove(); });
  $('pushNo') && ($('pushNo').onclick=()=>{ store.set('pushDismissed',true); $('pushNo').closest('.push-card').remove(); });
}

async function openChat(id){
  leaveChat(); S.chatId=id; document.body.classList.add('in-chat');
  if(!S.convos) await updateBadge();
  const c=(S.convos||[]).find(x=>x.id===id) || (await updateBadge()).find(x=>x.id===id);
  if(!c){ $('view').innerHTML='<div class="card"><div class="empty">That chat isn’t available.</div></div>'; return; }
  const name=c.kind==='direct'?(c.other_name||'Chat'):(c.title||'Group');
  $('view').innerHTML=`<div class="chat-h"><a class="back" href="#">‹</a><div class="cav ${c.kind} sm">${c.kind==='group'?'👥':esc(initials(name))}</div><b>${esc(name)}</b></div>
    <div class="msgs" id="msgs"><div class="empty">Loading…</div></div>
    <form class="composer-bar" id="sendForm"><textarea id="msgIn" rows="1" placeholder="Message" aria-label="Message"></textarea><button class="btn primary" aria-label="Send">Send</button></form>`;
  const { data } = await sb.from('messages').select('id,author_id,author_name,author_role,body,created_at').eq('conversation_id',id).order('created_at',{ascending:false}).limit(200);
  S.msgs=(data||[]).reverse(); S.chatKind=c.kind; drawMsgs(true); markRead(id);
  S.chatSub=sb.channel('chat-'+id)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:`conversation_id=eq.${id}`},pl=>{
      if(S.msgs.some(m=>m.id===pl.new.id)) return; S.msgs.push(pl.new); drawMsgs(true); markRead(id); })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'},pl=>{
      const n=S.msgs.length; S.msgs=S.msgs.filter(m=>m.id!==pl.old.id); if(S.msgs.length!==n) drawMsgs(false); })
    .subscribe();
  const ta=$('msgIn');
  ta.oninput=()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; };
  ta.onkeydown=e=>{ if(e.key==='Enter' && !e.shiftKey && !('ontouchstart' in window)){ e.preventDefault(); $('sendForm').requestSubmit(); } };
  $('sendForm').onsubmit=async e=>{ e.preventDefault(); const body=ta.value.trim(); if(!body) return;
    ta.value=''; ta.style.height='auto';
    const { data:m, error } = await sb.from('messages').insert({ conversation_id:id, body }).select('id,author_id,author_name,author_role,body,created_at').single();
    if(error){ toast(error.message); ta.value=body; return; }
    if(!S.msgs.some(x=>x.id===m.id)){ S.msgs.push(m); drawMsgs(true); } };
}
function drawMsgs(scroll){
  const box=$('msgs'); if(!box) return;
  if(!S.msgs.length){ box.innerHTML='<div class="empty">Say g’day 👋</div>'; return; }
  let h='', lastDay='', lastAuthor='';
  S.msgs.forEach(m=>{
    const day=new Date(m.created_at).toDateString();
    if(day!==lastDay){ h+=`<div class="mday">${new Date(m.created_at).toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'short'})}</div>`; lastDay=day; lastAuthor=''; }
    const mine=m.author_id===S.user.id, first=m.author_id!==lastAuthor; lastAuthor=m.author_id;
    h+=`<div class="msg ${mine?'me':''} ${m.author_role==='coach'?'coachmsg':''} ${first?'first':''}">
      ${!mine&&first&&S.chatKind==='group'?`<div class="mname">${esc(m.author_name||'Member')}</div>`:''}
      <div class="bub">${linkify(m.body)}<span class="mt">${new Date(m.created_at).toLocaleTimeString('en-AU',{hour:'numeric',minute:'2-digit'})}</span></div>
      ${mine||isCoach()?`<button class="mdel" data-delm="${m.id}" aria-label="Delete message">×</button>`:''}</div>`;
  });
  box.innerHTML=h;
  box.querySelectorAll('[data-delm]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.delm;
    const { error } = await sb.from('messages').delete().eq('id',id); if(error) toast(error.message); else { S.msgs=S.msgs.filter(m=>m.id!==id); drawMsgs(false); } });
  if(scroll) window.scrollTo(0,document.body.scrollHeight);
}
async function markRead(id){
  await sb.from('conversation_reads').upsert({ conversation_id:id, profile_id:S.user.id, last_read_at:new Date().toISOString() },{ onConflict:'conversation_id,profile_id' });
  updateBadge();
}

    h+=`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b style="font-weight:500">${esc(x.full_name||x.email)}</b>
      <span class="hint"> ${esc(x.email||'')}${x.role==='coach'?' · Coach':''}</span>
      <div>${mine.map(m=>`<span class="chip">${esc(gName(m.group_id))}<button data-ungroup="${m.group_id}|${x.id}" aria-label="Remove">×</button></span>`).join('')}</div>
      <div class="chips-add"><select data-groupsel="${x.id}"><option value="">Add to group…</option>${groups.filter(g=>!mine.some(m=>m.group_id===g.id)).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
      <button class="btn sm" data-addgroup="${x.id}">Add</button></div></div>`;
  });
  h+='</div>';
  $('view').innerHTML=h;

  const act=async(fn)=>{ const { error } = await fn(); if(error) toast(error.message); else loadCoach(); };
  document.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>act(()=>sb.from('programs').update({status:b.dataset.st==='published'?'draft':'published'}).eq('id',b.dataset.pub)));
  document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{
    const v=document.querySelector(`[data-assignsel="${b.dataset.assign}"]`).value; if(!v) return;
    const [t,id]=v.split(':'); act(()=>sb.from('program_assignments').insert({program_id:b.dataset.assign, [t==='g'?'group_id':'athlete_id']:id}));
  });
  document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=()=>act(()=>sb.from('program_assignments').delete().eq('id',b.dataset.unassign)));
  document.querySelectorAll('[data-addgroup]').forEach(b=>b.onclick=()=>{
    const g=document.querySelector(`[data-groupsel="${b.dataset.addgroup}"]`).value; if(!g) return;
    act(()=>sb.from('group_members').insert({group_id:g, profile_id:b.dataset.addgroup}));
  });
  document.querySelectorAll('[data-ungroup]').forEach(b=>b.onclick=()=>{ const [g,p]=b.dataset.ungroup.split('|');
    act(()=>sb.from('group_members').delete().eq('group_id',g).eq('profile_id',p)); });
  const twoTap=(b,fn)=>{ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Tap again to delete'; setTimeout(()=>{ if(document.body.contains(b)){ b.dataset.sure=''; b.textContent='Delete'; } },4000); return; } fn(); };
  document.querySelectorAll('[data-delprog]').forEach(b=>b.onclick=()=>twoTap(b,()=>act(()=>sb.from('programs').delete().eq('id',b.dataset.delprog))));
  document.querySelectorAll('[data-delgroup]').forEach(b=>b.onclick=()=>twoTap(b,()=>act(()=>sb.from('groups').delete().eq('id',b.dataset.delgroup))));
  $('addGroup').onclick=async()=>{ const name=$('newGroup').value.trim(); if(!name){ toast('Name the group'); return; }
    const { data:g, error } = await sb.from('groups').insert({ name, sort:groups.length }).select('id').single();
    if(error){ toast(error.message); return; }
    await sb.from('conversations').insert({ kind:'group', group_id:g.id }); loadCoach(); };
  document.querySelectorAll('[data-delevent]').forEach(b=>b.onclick=()=>act(()=>sb.from('events').delete().eq('id',b.dataset.delevent)));
  $('evAdd').onclick=()=>{
    const title=$('evTitle').value.trim(), event_date=$('evDate').value;
    if(!title||!event_date){ toast('Add a name and a date'); return; }
    act(()=>sb.from('events').insert({ title, event_date, event_time:$('evTime').value||null, theme:$('evTheme').value, location:$('evLoc').value.trim()||null, group_id:$('evGroup').value||null }));
  };
}
</script>
</body>
</html>
