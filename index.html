/* ---------------- MOVE A SESSION ----------------
   Athletes move a whole workout (everything from that plan on that day) up to a week either side of its planned day.
   The database makes their own copy on the new day and hides the original for them only (athlete_move_sessions);
   "Put it back" undoes it (athlete_undo_move). Moves are kept in session_moves, which the coach sees on the athlete's page. */
const mvDate=s=>new Date(s+'T00:00:00');
const mvDay=s=>mvDate(s).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
function wdOf(dateStr){ const dd=Math.round((mvDate(dateStr)-S.planStart)/864e5); return { w:Math.floor(dd/7)+1, d:((dd%7)+7)%7+1 }; }
function bindMoves(){
  document.querySelectorAll('[data-mvg]').forEach(b=>b.onclick=()=>{ const g=dayGroups(S.week,S.day).find(x=>x.key===b.dataset.mvg); if(g) moveSheet(g); });
  document.querySelectorAll('[data-mvundo]').forEach(a=>a.onclick=async e=>{ e.preventDefault(); a.style.pointerEvents='none';
    const mv=Object.values(S.moveOf||{}).find(m=>m.id===a.dataset.mvundo);
    const { error } = await sb.rpc('athlete_undo_move',{ p_move:a.dataset.mvundo });
    if(error){ toast(error.message); a.style.pointerEvents=''; return; }
    if(mv){ const t=wdOf(mv.from_date); S.week=t.w; S.day=t.d; }
    toast('Put back on '+(mv?mvDay(mv.from_date):'its day')); loadToday(); });
}
function moveSheet(g){
  const first=g.shown[0].s, mv=S.moveOf?.[first.id];
  const dateOf=(w,d)=>{ const x=new Date(S.planStart); x.setDate(x.getDate()+(w-1)*7+(d-1)); return x; };
  const cur=ymd(dateOf(S.week,S.day)), from=mv?mv.from_date:cur, today=ymd(new Date());
  const days=[]; for(let i=-7;i<=7;i++){ const x=mvDate(from); x.setDate(x.getDate()+i); days.push(ymd(x)); }
  const busy=ds=>{ const t=wdOf(ds); return dayGroups(t.w,t.d).filter(x=>x.key!==g.key).length; };
  document.querySelector('.vr-ov')?.remove();
  const ov=document.createElement('div'); ov.className='vr-ov';
  ov.innerHTML=`<div class="vr-sheet"><div class="vr-h"><b>Move ${esc(first.title||'this session')}</b><button class="vr-x" aria-label="Close">✕</button></div>
    <p class="hint" style="margin-bottom:12px">Pick a new day, up to a week either side of ${mv?'its planned day, '+esc(mvDay(from)):'when it’s planned'}. It only changes your calendar. If there’s already a session that day, they’ll sit one under the other.</p>
    <div class="mv-grid">${['M','T','W','T','F','S','S'].map(x=>`<span class="mv-dh">${x}</span>`).join('')}
      ${(()=>{ const lead=(mvDate(days[0]).getDay()+6)%7; return '<span></span>'.repeat(lead); })()}
      ${days.map(ds=>{ const n=busy(ds), isCur=ds===cur, isPlan=ds===from;
        return `<button class="mv-d ${isCur?'cur':''} ${isPlan&&mv?'plan':''} ${ds===today?'today':''}" data-mvto="${ds}" ${isCur?'disabled':''}>
          <b>${mvDate(ds).getDate()}</b><span>${mvDate(ds).toLocaleDateString('en-AU',{month:'short'})}</span>${n?`<i title="${n} session${n>1?'s':''} already">${'•'.repeat(Math.min(n,3))}</i>`:''}</button>`; }).join('')}</div>
    <div class="mv-key"><span><i class="k cur"></i>Where it is now</span>${mv?'<span><i class="k plan"></i>Planned day</span>':''}<span><i class="k dot">•</i>Already has a session</span></div>
    <button class="btn primary block" id="mvGo" disabled>Pick a day</button></div>`;
  document.body.appendChild(ov);
  const close=()=>ov.remove(); ov.querySelector('.vr-x').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  let to=null;
  ov.querySelectorAll('[data-mvto]').forEach(b=>b.onclick=()=>{ to=b.dataset.mvto; ov.querySelectorAll('[data-mvto]').forEach(x=>x.classList.toggle('on',x===b));
    const go=$('mvGo'); go.disabled=false; go.textContent=mv&&to===from?'Put it back on '+mvDay(to):'Move to '+mvDay(to); });
  $('mvGo').onclick=async()=>{ if(!to) return; const b=$('mvGo'); b.disabled=true; b.textContent='Moving…';
    const { error } = await sb.rpc('athlete_move_sessions',{ p_sessions:g.list.map(x=>x.s.id), p_from:from, p_to:to, p_title:first.title||null });
    if(error){ toast(isNetErr(error)?'No signal. Try again when you have signal.':error.message); b.disabled=false; b.textContent='Move to '+mvDay(to); return; }
    close(); const t=wdOf(to); S.week=t.w; S.day=t.d; toast('Moved to '+mvDay(to)); loadToday(); };
}

/* ---------------- CONDITIONING ----------------
   A conditioning piece is a lift row on the library's "Conditioning" exercise, with session_exercises.guide.cond =
   {title, score} and the workout written in its notes. The athlete logs one score in set 1 of set_logs:
   reps = the score as text ("5+12", "14:32", "CAP 23", "86", "done"), notes = the athlete's note (e.g. weights used). */
const condNote = n => String(n ?? '').replace(/^(Rx|Scaled)\s*(·\s*)?/i, '').trim();   // older logs started with Rx / Scaled
const COND_SCORES={rounds:'Rounds + reps', time:'Time', reps:'Total reps', cals:'Calories', dist:'Distance', load:'Heaviest load', text:'Score', done:'Just tick it off'};
const COND_UNIT={reps:'reps', cals:'cal', dist:'m', load:'kg'};
const isCond=se=>!!(se.guide&&se.guide.cond) || (S.exercises[se.exercise_id]||{}).category==='conditioning';
function condOf(se){
  const c=(se.guide&&se.guide.cond)||{};
  const line=(se.prescriptions||[]).find(p=>!p.warmup);
  return { title:c.title || line?.load_text || 'Conditioning', score:COND_SCORES[c.score]?c.score:'text' };
}
// "5+12" -> 5 rounds + 12 reps; "CAP 23" -> Capped, 23 reps
function condScoreText(score, v){
  v=String(v??'').trim(); if(!v) return '';
  if(score==='done' || v==='done') return 'Done';
  if(score==='rounds'){ const m=v.match(/^(\d+)\s*\+\s*(\d+)$/); if(m) return `${m[1]} round${m[1]==='1'?'':'s'} + ${m[2]} rep${m[2]==='1'?'':'s'}`; if(/^\d+$/.test(v)) return `${v} round${v==='1'?'':'s'}`; return v; }
  if(score==='time'){ const m=v.match(/^CAP\s*(\d+)$/i); return m ? `Capped, ${m[1]} reps` : v; }
  if(COND_UNIT[score] && /^\d+(\.\d+)?$/.test(v)) return v+' '+COND_UNIT[score];
  return v;
}
function condHTML(se, log){
  const {title, score}=condOf(se);
  const sl=log?.set_logs?.find(x=>x.session_exercise_id===se.id&&x.set_number===1);
  const v=String(sl?.reps??''), note=String(sl?.notes??'');
  const extra=condNote(note);
  const sv=sl?' saved':'';
  let inp='';
  if(score==='rounds'){ const m=v.match(/^(\d+)(?:\s*\+\s*(\d+))?$/)||[];
    inp=`<label><input inputmode="numeric" data-c="a" value="${esc(m[1]||'')}" class="${sv}" aria-label="Rounds"> rounds</label><label>+ <input inputmode="numeric" data-c="b" value="${esc(m[2]||'')}" class="${sv}" aria-label="Extra reps"> reps</label>`; }
  else if(score==='time'){ const cap=/^CAP/i.test(v);
    inp=`<span class="seg2" role="group" aria-label="Finished or capped"><button data-cap="0" class="${cap?'':'on'}">Finished</button><button data-cap="1" class="${cap?'on':''}">Hit the cap</button></span>
      <span class="t-in">${timeInputs(cap, v, sv)}</span>`; }
  else if(score==='done') inp=`<button class="cond-done ${v?'on':''}" data-cdone="1">${v?'✓ Done':'Mark as done'}</button>`;
  else if(score==='text') inp=`<input class="wide${sv}" data-c="a" value="${esc(v)}" placeholder="Your score" aria-label="Score">`;
  else inp=`<label><input inputmode="decimal" data-c="a" value="${esc(v)}" class="${sv}" aria-label="${esc(COND_SCORES[score])}"> ${esc(COND_UNIT[score]||'')}</label>`;
  return `<div class="ex cond"><div class="ex-h">${se.label?`<span class="slot">${esc(se.label)}</span>`:''}<div class="ex-n">${esc(title)}</div><span class="pill cond">Conditioning</span></div>
    ${se.notes?`<div class="cond-body">${esc(se.notes)}</div>`:''}
    <div class="cond-log" data-se="${se.id}" data-score="${score}" data-cap="${/^CAP/i.test(v)?1:0}" data-v="${esc(v)}">
      <div class="cond-lbl"><b>Your score</b> · ${esc(score==='done'?'Tick it off when you\'re done':COND_SCORES[score])}</div>
      <div class="cond-in">${inp}</div>
      <div class="cond-row2"><input class="cond-note${extra?' saved':''}" data-c="note" value="${esc(extra)}" placeholder="Weights or notes, e.g. 16 kg KB, 2 × 15 kg DB" aria-label="Weights or notes"></div>
    </div></div>`;
}
// Minutes and seconds get their own number boxes (phone number pads have no ':' key); capped = reps done
function timeInputs(cap, v, sv){
  if(cap) return `<label><input inputmode="numeric" data-c="a" value="${esc((String(v).match(/\d+/)||[''])[0])}" class="${sv}" aria-label="Reps done at the cap"> reps done</label>`;
  const tm=String(v).match(/^(\d+)(?:[:.](\d{1,2}))?$/)||[];
  return `<label><input inputmode="numeric" data-c="a" value="${esc(tm[1]||'')}" placeholder="0" class="${sv}" aria-label="Minutes"> min</label><label><input inputmode="numeric" data-c="b" value="${esc(tm[2]!=null?tm[2].padStart(2,'0'):'')}" placeholder="00" maxlength="2" class="${sv}" aria-label="Seconds"> sec</label>`;
}
// The score as it's saved, from what's on screen ('' = nothing yet)
function condValue(box){
  const sc=box.dataset.score, a=box.querySelector('[data-c=a]')?.value.trim()||'', b=box.querySelector('[data-c=b]')?.value.trim()||'';
  if(sc==='done') return box.dataset.v==='done'?'done':'';
  if(sc==='rounds'){ if(!a && !b) return ''; return (a||'0')+(b && b!=='0'?'+'+b:''); }
  if(sc==='time'){ if(box.dataset.cap==='1') return a?'CAP '+a.replace(/\D/g,''):'';
    const mm=a.replace(/\D/g,''), ss=b.replace(/\D/g,''); if(!mm && !ss) return '';
    return `${+(mm||0)}:${String(Math.min(59,+(ss||0))).padStart(2,'0')}`; }
  return a;
}
async function saveCond(box){
  const sessionId=box.closest('[data-sess]').dataset.sess, seId=box.dataset.se;
  const v=condValue(box);
  const note=box.querySelector('[data-c=note]')?.value.trim()||'';
  const base={ session_exercise_id:seId, set_number:1, weight_kg:null, reps:v||null, made:true, notes:note||null }, key=`set|${sessionId}|${seId}|1`;
  const keepLocal=log=>{ log.set_logs=(log.set_logs||[]).filter(x=>!(x.session_exercise_id===seId&&x.set_number===1)).concat([{ ...base, workout_log_id:log.id }]); };
  box.dataset.v=v;
  try{
    const log=await ensureLog(sessionId);
    const { error } = await sb.from('set_logs').upsert({ ...base, workout_log_id:log.id },{ onConflict:'workout_log_id,session_exercise_id,set_number' });
    if(error) throw error;
    keepLocal(log); obDrop(key);
    box.querySelectorAll('input').forEach(i=>{ i.classList.toggle('saved', !!i.value.trim()); i.classList.remove('queued'); });
  }catch(err){
    if(!isNetErr(err)){ toast('Not saved: '+err.message); return; }
    keepLocal(obLocalLog(sessionId)); obPut({ k:key, kind:'set', sid:sessionId, rec:base });
    box.querySelectorAll('input').forEach(i=>{ if(i.value.trim()) i.classList.add('queued'); }); obQueued();
  }
}
function bindCond(){
  document.querySelectorAll('.cond-log').forEach(box=>{
    const gate=()=>{ const b=box.closest('.card')?.querySelector('[data-complete]'); b && gateComplete(b); };
    const bindInputs=()=>box.querySelectorAll('input').forEach(i=>{ i.onchange=()=>saveCond(box).then(gate); i.oninput=gate; });
    bindInputs();
    box.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>{
      if(box.dataset.cap===b.dataset.cap) return;
      box.dataset.cap=b.dataset.cap;
      box.querySelectorAll('[data-cap]').forEach(x=>x.classList.toggle('on',x===b));
      box.querySelector('.t-in').innerHTML=timeInputs(b.dataset.cap==='1','','');
      bindInputs(); box.querySelector('[data-c=a]').focus(); gate();
    });
    const dn=box.querySelector('[data-cdone]');
    if(dn) dn.onclick=()=>{ const on=box.dataset.v!=='done'; box.dataset.v=on?'done':''; dn.classList.toggle('on',on); dn.textContent=on?'✓ Done':'Mark as done'; saveCond(box).then(gate); gate(); };
  });
}

// Summary lines: back-to-back lines that are the same (reps, load, note) read as one, e.g. two "3 @ Build from here" lines become "2 × 3"
function mergeRx(work){ const out=[];
  work.forEach(pr=>{ const l=out[out.length-1];
    if(l && String(l.reps)===String(pr.reps) && l.percent==pr.percent && l.percent_max==pr.percent_max && l.load_kg==pr.load_kg && (l.load_text||'')===(pr.load_text||'') && l.rpe==pr.rpe && !l.notes && !pr.notes && !HEAVY_RE.test(pr.load_text||''))
      l.sets=(+l.sets||1)+(+pr.sets||1);
    else out.push({...pr}); });
  return out; }
function renderSessionBody(p,s){
  const log=S.logs[s.id];
  let h='';
  // open/closed is remembered, so tapping Set Guide or Info further down doesn't spring these back open
  const dOpen=(k,def)=>(S.dOpen=S.dOpen||{})[k]??def;
  // collapsed by default; glows until the athlete has opened it once
  const seen=store.get('seen')||{}, snOpen=dOpen('sn:'+s.id,false);
  if(s.notes) h+=`<details class="notes sn" data-dk="sn:${s.id}" ${snOpen?'open':''}><summary class="${!snOpen&&!seen['sn:'+s.id]?'glow':''}">Session info</summary><p>${esc(s.notes)}</p></details>`;
  if(p.description) h+=`<details class="notes" data-dk="ab:${s.id}" ${dOpen('ab:'+s.id,false)?'open':''}><summary>About this block</summary><p>${esc(p.description)}</p></details>`;
  s.session_exercises.forEach(se=>{
    if(isCond(se)){ h+=condHTML(se, log); return; }
    const ex=S.exercises[se.exercise_id]||{name:'Exercise'};
    const { max, base } = baseMax(se);
    const usesPct=se.prescriptions.some(p=>p.percent!=null&&!p.warmup);
    const yt=safeYoutube(ex.youtube_url);
    const hasInfo=ex.cues||ex.description||se.notes||yt;
    const openKey=se.id;
    h+=`<div class="ex"><div class="ex-h">${se.label?`<span class="slot">${esc(se.label)}</span>`:''}
      <div class="ex-n">${esc(ex.name)}</div>
      <div class="ex-btns">${guideOn(se)?`<button class="btn sm sg-btn ${S.guide[openKey]?'on':(store.get('seen')||{})['sg:'+openKey]?'':'glow'}" data-guide="${openKey}" aria-expanded="${S.guide[openKey]?'true':'false'}">Set Guide</button>`:''}${hasInfo?`<button class="btn sm" data-info="${openKey}">${S.open[openKey]?'Hide':'Info'}</button>`:''}
      ${yt?`<a class="btn sm" href="${esc(yt)}" target="_blank" rel="noopener">▶ Video</a>`:''}<button class="btn sm ${S.noteOpen?.[openKey]?'on':''}" data-note="${openKey}" aria-label="Technical note">✎ Note</button></div></div>`;
    const wu=se.prescriptions.filter(p=>p.warmup), work=se.prescriptions.filter(p=>!p.warmup), hk=heavyFromLog(se, log);
    h+='<div class="rx">'+(wu.length?`<div class="wu-line"><b>Build up</b>${wu.map(pr=>`<span>${rxText(pr,se,true)||esc(pr.load_text||'')} × ${esc(pr.reps)}</span>`).join('<span>·</span>')}</div>`:'')+mergeRx(work).map(pr=>{ const nt=pr.notes?`<span class="nt">${esc(pr.notes)}</span>`:'';
        if(HEAVY_RE.test(pr.load_text||'')) return `<div class="ln"><b>${esc(pr.load_text)}</b>${nt}</div>`;
        const dp=dropPct(pr); if(dp!=null){ const k=dropKg(hk,dp); return `<div class="ln"><span class="sr">${+pr.sets||1} × ${esc(pr.reps)}</span><span>${esc(pr.load_text)} <span class="kg" data-dropfor="${se.id}" data-pct="${dp}">${k?`≈ ${k} kg`:''}</span></span>${nt}</div>`; }
        return `<div class="ln"><span class="sr">${+pr.sets||1} × ${esc(pr.reps)}</span><span>${rxText(pr,se)}</span>${nt}</div>`; }).join('')+'</div>';
    if(S.guide[openKey] && guideOn(se)) h+=setGuideHTML(p, s, se, log);
    if(usesPct && !max && !S.guide[openKey]) h+=`<div class="hint" style="margin-bottom:6px">Add your ${esc(base?.name||ex.name)} max in <a href="#" data-goto="maxes">Maxes</a> to see kilos.</div>`;
    if(S.open[openKey]){
      h+='<div class="info">';
      if(se.notes) h+=`<div class="blk"><span class="lbl">Coach notes</span>${esc(se.notes)}</div>`;
      if(ex.cues) h+=`<div class="blk"><span class="lbl">Cues</span>${esc(ex.cues)}</div>`;
      if(ex.description) h+=`<div class="blk"><span class="lbl">About</span>${esc(ex.description)}</div>`;
      if(yt) h+=`<div class="blk"><a href="${esc(yt)}" target="_blank" rel="noopener">Watch the demo video</a></div>`;
      h+='</div>';
    }
    if(S.noteOpen?.[openKey]) h+=noteBoxHTML(se, s);
    const lst=lastFor(se.exercise_id, log?.id);
    if(lst) h+=`<div class="last">Last time (${fmtDate(lst.date)}): <b>${lst.sets.map(r=>`${+r.weight_kg}${r.reps?'×'+esc(r.reps):''}${r.made?'':'✗'}`).join(', ')}</b></div>`;

    // set rows
    const rows=[]; let n=0;
    se.prescriptions.filter(pr=>!pr.warmup).forEach(pr=>{ for(let i=0;i<setRows(pr);i++){ n++; rows.push({n,pr,i}); } });
    // Extra sets the athlete added: numbered after the coach's sets; optional, and only these can be removed
    // set_number stays fixed (after the coach's sets); placement 'top' just shows it above them as a warm-up set
    const nBase=n, lastPr=rows.length?rows[rows.length-1].pr:{reps:''};
    const loggedX=(log?.set_logs||[]).filter(x=>x.session_exercise_id===se.id && x.set_number>nBase).map(x=>({n:x.set_number, top:x.placement==='top'}));
    const pendX=((S.xp||{})[se.id]||[]).filter(p=>!loggedX.some(l=>l.n===p.n));
    const xs=[...loggedX,...pendX].sort((a,b)=>a.n-b.n), warm=xs.filter(x=>x.top), after=xs.filter(x=>!x.top);
    rows.unshift(...warm.map((x,k)=>({n:x.n, pr:lastPr, i:-1, extra:true, top:true, lbl:'W'+(k+1)})));
    rows.push(...after.map((x,k)=>({n:x.n, pr:lastPr, i:-1, extra:true, top:false, lbl:String(nBase+k+1)})));
    h+=`<div class="set-head"><span>#</span><span>Target</span><span>Kg</span><span>Reps</span><span></span></div><div class="sets">`;
    rows.forEach(({n,pr,i,extra,top,lbl})=>{
      const sl=log?.set_logs?.find(x=>x.session_exercise_id===se.id&&x.set_number===n);
      if(extra){ const made = sl ? (sl.made?'made':'miss') : '';
        h+=`<div class="set extra ${top?'top':''}" data-se="${se.id}" data-n="${n}" data-extra="1"${top?' data-top="1"':''}>
          <span class="no">${lbl}</span><span class="tg"><span class="xl">${top?'Warm-up':'Extra set'}</span><button class="rm-set" data-mvset="${se.id}|${n}|${top?0:1}" aria-label="${top?'Move below your sets':'Move to the top as a warm-up set'}">${top?'↓':'↑'}</button><button class="rm-set" data-rmset="${se.id}|${n}" aria-label="Remove this set">✕</button></span>
          <input inputmode="decimal" data-f="w" placeholder="kg" value="${sl?.weight_kg!=null?+sl.weight_kg:''}" class="${sl?'saved':''}" aria-label="Set ${n} weight">
          <input inputmode="text" data-f="r" placeholder="${esc(pr.reps||'reps')}" value="${esc(sl?.reps!=null?sl.reps:'')}" class="${sl?.reps!=null?'saved':''}" aria-label="Set ${n} reps">
          <button class="mk ${made}" data-f="m" aria-label="Made or missed">${made==='miss'?'✗':'✓'}</button></div>`;
        return; }
      const isHv=HEAVY_RE.test(pr.load_text||''), dp=dropPct(pr);
      if(isHv && i===0) h+=`<div class="set-lbl"><b>Top three attempts</b> <span>(include your heaviest three attempts)</span></div>`;
      if(dp!=null && i===0 && rows.some(r=>HEAVY_RE.test(r.pr.load_text||''))) h+=`<div class="set-lbl"><b>Down sets</b></div>`;
      const tgt= isHv ? esc(heavyShort(pr.load_text))
        : dp!=null ? `${esc(pr.reps)} @ <span data-dropfor="${se.id}" data-pct="${dp}" data-short="1">${dropKg(hk,dp)?`≈ ${dropKg(hk,dp)} kg`:`${dp}% less`}</span>`
        : `${esc(pr.reps)} @ ${rxText(pr,se,true)||'—'}`;
      const made = sl ? (sl.made?'made':'miss') : '';
      h+=`<div class="set" data-se="${se.id}" data-n="${n}"${isHv?' data-heavy="1"':''}>
        <span class="no">${n}</span><span class="tg">${tgt}</span>
        <input inputmode="decimal" data-f="w" placeholder="kg" value="${sl?.weight_kg!=null?+sl.weight_kg:''}" class="${sl?'saved':''}" aria-label="Set ${n} weight">
        <input inputmode="text" data-f="r" placeholder="${esc(pr.reps)}" value="${esc(sl?.reps!=null?sl.reps:pr.reps)}" class="${sl?.reps!=null?'saved':'pre'}" aria-label="Set ${n} reps">
        <button class="mk ${made}" data-f="m" aria-label="Made or missed">${made==='miss'?'✗':'✓'}</button></div>`;
    });
    h+=`</div><div class="add-sets"><button class="add-set" data-addset="${se.id}|1|${nBase}">+ Warm-up set</button><button class="add-set" data-addset="${se.id}|0|${nBase}">+ Add set</button></div>${vidRowHTML(se)}</div>`;
  });

  return h;
}

function bindToday(){
  document.querySelectorAll('[data-vidsend]').forEach(b=>b.onclick=()=>videoSheet(b.dataset.vidsend, b.closest('[data-sess]')?.dataset.sess));
  const markSeen=k=>{ const m=store.get('seen')||{}; if(!m[k]){ m[k]=1; store.set('seen',m); } };
  document.querySelectorAll('details[data-dk]').forEach(d=>d.addEventListener('toggle',()=>{ (S.dOpen=S.dOpen||{})[d.dataset.dk]=d.open;
    if(d.open){ markSeen(d.dataset.dk); d.querySelector('summary')?.classList.remove('glow'); } }));
  // Re-render but keep the tapped button where it was on screen, so the page doesn't jump
  const keepPlace=(sel,fn)=>{ const before=document.querySelector(sel)?.getBoundingClientRect().top; fn(); renderToday();
    const after=document.querySelector(sel)?.getBoundingClientRect().top; if(before!=null&&after!=null) window.scrollBy(0,after-before); };
  document.querySelectorAll('[data-guide]').forEach(b=>b.onclick=()=>{ const k=b.dataset.guide; keepPlace(`[data-guide="${k}"]`,()=>{ S.guide[k]=!S.guide[k]; markSeen('sg:'+k); }); });
  const { lo, hi } = calRange();
  const setWeek=w=>{ if(w<lo||w>hi) return; S.week=w; renderToday(); };
  $('wPrev') && ($('wPrev').onclick=()=>setWeek(S.week-1));
  $('wNext') && ($('wNext').onclick=()=>setWeek(S.week+1));
  document.querySelectorAll('.dy').forEach(b=>b.onclick=()=>{ S.week=+b.dataset.w; S.day=+b.dataset.d; renderToday(); });
  document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>{ const k=b.dataset.note; keepPlace(`[data-note="${k}"]`,()=>{ (S.noteOpen=S.noteOpen||{})[k]=!S.noteOpen[k]; }); });
  document.querySelectorAll('[data-ndraft]').forEach(t=>t.oninput=()=>{ (S.noteDraft=S.noteDraft||{})[t.dataset.ndraft]=t.value; });
  document.querySelectorAll('[data-nsave]').forEach(b=>b.onclick=async()=>{ const [seId,exId,sid]=b.dataset.nsave.split('|'); const t=document.querySelector(`[data-ndraft="${seId}"]`);
    const body=t.value.trim(); if(!body){ toast('Write your note first'); return; } b.disabled=true;
    const { data, error } = await sb.from('athlete_notes').insert({ body, exercise_id:exId||null, session_id:sid||null }).select('id,exercise_id,session_id,body,created_at,updated_at').single();
    b.disabled=false; if(error){ toast(error.message); return; }
    S.myNotes=[data,...(S.myNotes||[])]; delete S.noteDraft[seId]; toast('Saved to your notes');
    keepPlace(`[data-note="${seId}"]`,()=>{}); });
  document.querySelectorAll('[data-nall]').forEach(a=>a.onclick=e=>{ e.preventDefault(); S.notesFilter=a.dataset.nall||'all'; go('notes'); });
  document.querySelectorAll('[data-info]').forEach(b=>b.onclick=()=>{ const k=b.dataset.info; keepPlace(`[data-info="${k}"]`,()=>{ S.open[k]=!S.open[k]; }); });
  document.querySelectorAll('[data-goto]').forEach(a=>a.onclick=e=>{ e.preventDefault(); go(a.dataset.goto); });
  document.querySelectorAll('.set input').forEach(inp=>inp.onchange=()=>saveSet(inp.closest('.set')));
  document.querySelectorAll('.set input[data-f=r]').forEach(inp=>inp.addEventListener('input',()=>inp.classList.remove('pre')));
  bindRest();
  // Athlete-added sets: add (warm-up at the top or extra at the end), move between the two, remove. Coach's sets can't be moved or removed.
  const xp=id=>((S.xp=S.xp||{})[id]=S.xp[id]||[]);
  const xRow=(seId,n)=>document.querySelector(`.set[data-extra][data-se="${seId}"][data-n="${n}"]`);
  const xLog=row=>S.logs[row.closest('[data-sess]').dataset.sess];
  document.querySelectorAll('[data-addset]').forEach(b=>b.onclick=()=>{ const [id,top,nb]=b.dataset.addset.split('|');
    const used=[...b.closest('.ex').querySelectorAll('.set[data-extra]')].map(r=>+r.dataset.n);
    const n=Math.max(+nb,...used)+1;
    keepPlace(`[data-addset="${b.dataset.addset}"]`,()=>{ xp(id).push({n, top:top==='1'}); }); });
  document.querySelectorAll('[data-mvset]').forEach(b=>b.onclick=async()=>{ const [seId,nS,toTop]=b.dataset.mvset.split('|'), n=+nS, top=toTop==='1';
    const row=xRow(seId,n), log=xLog(row), sl=log?.set_logs?.find(x=>x.session_exercise_id===seId&&x.set_number===n);
    if(sl && log.id){ const { error } = await sb.from('set_logs').update({ placement:top?'top':null }).eq('workout_log_id',log.id).eq('session_exercise_id',seId).eq('set_number',n);
      if(error){ toast(error.message); return; } sl.placement=top?'top':null; }
    else if(sl){ sl.placement=top?'top':null; // logged offline: update the copy waiting to send
      const k=`set|${row.closest('[data-sess]').dataset.sess}|${seId}|${n}`, all=store.get('outbox')||[]; all.forEach(x=>{ if(x.k===k) x.rec.placement=sl.placement; }); store.set('outbox',all); }
    else { const p=xp(seId).find(x=>x.n===n); if(p) p.top=top; }
    keepPlace(`.ex [data-addset^="${seId}|0"]`,()=>{}); });
  document.querySelectorAll('[data-rmset]').forEach(b=>b.onclick=async()=>{ const [seId,nS]=b.dataset.rmset.split('|'), n=+nS;
    const row=xRow(seId,n), log=xLog(row);
    obDrop(`set|${row.closest('[data-sess]').dataset.sess}|${seId}|${n}`);
    if(log?.id && log?.set_logs?.some(x=>x.session_exercise_id===seId&&x.set_number===n)){
      const { error } = await sb.from('set_logs').delete().eq('workout_log_id',log.id).eq('session_exercise_id',seId).eq('set_number',n);
      if(error){ toast(error.message); return; }
      log.set_logs=log.set_logs.filter(x=>!(x.session_exercise_id===seId&&x.set_number===n)); }
    S.xp[seId]=xp(seId).filter(x=>x.n!==n);
    keepPlace(`.ex [data-addset^="${seId}|0"]`,()=>{}); });
  document.querySelectorAll('.set .mk').forEach(b=>b.onclick=()=>{
    if(!b.classList.contains('made')&&!b.classList.contains('miss')) restAuto();
    const made=!b.classList.contains('miss') && b.classList.contains('made') ? false : true;
    b.classList.toggle('miss',!made); b.classList.toggle('made',made); b.textContent=made?'✓':'✗';
    saveSet(b.closest('.set'));
  });
  document.querySelectorAll('[data-complete]').forEach(b=>{
    const card=b.closest('.card');
    card.querySelectorAll('.set input').forEach(inp=>inp.addEventListener('input',()=>gateComplete(b)));
    gateComplete(b);
    b.onclick=()=>{ if(gateComplete(b)) completeSession(b.dataset.complete,true); };
  });
  document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>completeSession(b.dataset.undo,false));
  bindCond();
  const pickOpt=v=>{ const i=v.lastIndexOf('|'); const key=v.slice(0,i), sid=v.slice(i+1); const m=store.get('opt')||{}; m[key+'|'+S.week+'|'+S.day]=sid; store.set('opt',m); renderToday(); }; // key already ends in |o or |s
  document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>pickOpt(b.dataset.opt));
  // swipe left/right on a card with options to move between them
  document.querySelectorAll('.opt-pick[aria-label="Choose today\'s session"]').forEach(bar=>{
    // swipe works on the picker card and on that group's workout card
    const v=bar.querySelector('[data-opt]').dataset.opt, gkey=v.slice(0,v.indexOf('|o|'));
    const cards=[bar.closest('.card'), document.querySelector(`.card[data-gkey="${CSS.escape(gkey)}"]`)].filter(Boolean);
    cards.forEach(card=>{ let x0=null, y0=null;
      card.addEventListener('touchstart',e=>{ if(e.target.closest('input,button')) return; x0=e.touches[0].clientX; y0=e.touches[0].clientY; },{passive:true});
      card.addEventListener('touchend',e=>{ if(x0==null) return; const dx=e.changedTouches[0].clientX-x0, dy=e.changedTouches[0].clientY-y0; x0=null;
        if(Math.abs(dx)<60||Math.abs(dy)>Math.abs(dx)) return;
        const btns=[...bar.querySelectorAll('[data-opt]')], i=btns.findIndex(b=>b.classList.contains('on'));
        const nx=btns[i+(dx<0?1:-1)]; if(nx) pickOpt(nx.dataset.opt); },{passive:true}); });
  });
}

// Complete only unlocks once every set in the session has kg and reps filled in, and every conditioning piece has a score.
function gateComplete(btn){
  const rows=[...btn.closest('.card').querySelectorAll('.set:not([data-extra])')];
  const conds=[...btn.closest('.card').querySelectorAll('.cond-log')];
  const sl=rows.filter(r=>!r.querySelector('[data-f=w]').value.trim() || !r.querySelector('[data-f=r]').value.trim()).length;
  const cl=conds.filter(b=>!condValue(b)).length, left=sl+cl;
  btn.disabled=left>0; btn.classList.toggle('locked',left>0);
  btn.textContent = !left ? 'Complete session' : !sl ? (cl>1?`Add your scores (${cl} to go)`:'Add your score to finish') : `Fill in every set${cl?' and score':''} (${left} to go)`;
  return left===0;
}
async function ensureLog(sessionId){
  if(S.ro) throw new Error('View mode. Switch to Train to log.');
  if(S.logs[sessionId]?.id) return S.logs[sessionId];
  const { data, error } = await sb.from('workout_logs').upsert({ athlete_id:S.user.id, session_id:sessionId },{ onConflict:'athlete_id,session_id' })
    .select('id,session_id,completed_at').single();
  if(error) throw error;
  // keep anything logged on the phone while there was no signal
  const local=S.logs[sessionId]; data.set_logs=local?.set_logs||[]; if(local?.completed_at && !data.completed_at) data.completed_at=local.completed_at;
  S.logs[sessionId]=data; return data;
}
/* ---------------- OFFLINE OUTBOX ----------------
   No signal at the gym? Sets, scores and "complete" are kept on the phone and sent when the connection comes back. */
const isNetErr=e=>!navigator.onLine || /fetch|network|load failed|timed? ?out|offline|aborted/i.test(String(e?.message||e));
const obAll=()=>(store.get('outbox')||[]).filter(x=>x.uid===S.user?.id);
function obPut(item){ const all=(store.get('outbox')||[]).filter(x=>x.k!==item.k); all.push({ ...item, uid:S.user.id, t:Date.now() }); store.set('outbox',all); obDraw(); }
function obDrop(k){ store.set('outbox',(store.get('outbox')||[]).filter(x=>x.k!==k)); obDraw(); }
function obLocalLog(sid){ return S.logs[sid] || (S.logs[sid]={ id:null, session_id:sid, set_logs:[], completed_at:null }); }
function obDraw(){ const el=$('obBar'); if(!el) return; const n=obAll().length;
  el.hidden=!n; el.innerHTML=n?`<span>⏳</span> ${n} thing${n===1?'':'s'} saved on your phone. They\u2019ll send when you have signal. <button class="linkbtn" id="obTry">Try now</button>`:'';
  $('obTry') && ($('obTry').onclick=()=>obFlush(true)); }
let obWarned=0;
function obQueued(){ if(Date.now()-obWarned>60000){ obWarned=Date.now(); toast('No signal. Saved on your phone, it\u2019ll send when you\u2019re back online.'); } }
async function obFlush(loud){
  if(obFlush.busy || !S.user || S.ro) return; const items=obAll(); if(!items.length) return;
  obFlush.busy=true; let sent=0, stuck=false;
  for(const it of items.sort((a,b)=>a.t-b.t)){
    try{
      const log=await ensureLog(it.sid);
      if(it.kind==='set'){ const rec={ ...it.rec, workout_log_id:log.id };
        const { error } = await sb.from('set_logs').upsert(rec,{ onConflict:'workout_log_id,session_exercise_id,set_number' }); if(error) throw error; }
      else if(it.kind==='done'){ const { error } = await sb.from('workout_logs').update({ completed_at:it.at }).eq('id',log.id); if(error) throw error; log.completed_at=it.at; }
      obDrop(it.k); sent++;
    }catch(e){ if(isNetErr(e)){ stuck=true; break; } obDrop(it.k); toast('Couldn\u2019t save: '+e.message); }
  }
  obFlush.busy=false; obDraw();
  if(sent){ document.querySelectorAll('input.queued').forEach(i=>{ i.classList.remove('queued'); i.classList.add('saved'); }); toast(`Back online. ${sent} saved.`); }
  else if(stuck && loud) toast('Still no signal. Try again in a bit.');
}
window.addEventListener('online',()=>obFlush());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) obFlush(); });
setInterval(()=>{ if(obAll().length) obFlush(); },20000);
async function saveSet(row){
  const sessionId=row.closest('[data-sess]').dataset.sess;
  const seId=row.dataset.se, n=+row.dataset.n;
  const w=row.querySelector('[data-f=w]').value.trim(), r=row.querySelector('[data-f=r]').value.trim();
  const mk=row.querySelector('.mk');
  if(!w && !r && !mk.classList.contains('made') && !mk.classList.contains('miss')) return;
  if(!mk.classList.contains('made')&&!mk.classList.contains('miss')){ mk.classList.add('made'); restAuto(); }
  if(S.ro){ toast('View mode. Switch to Train to log.'); return; }
  const base={ session_exercise_id:seId, set_number:n,
    weight_kg: w===''?null:Number(w.replace(',','.')), reps: r===''?null:r, made: !mk.classList.contains('miss'), placement: row.dataset.top?'top':null };
  if(base.weight_kg!=null && isNaN(base.weight_kg)) { toast('Weight needs to be a number'); return; }
  const key=`set|${sessionId}|${seId}|${n}`;
  const keepLocal=log=>{ log.set_logs=(log.set_logs||[]).filter(x=>!(x.session_exercise_id===seId&&x.set_number===n)).concat([{ ...base, workout_log_id:log.id }]); };
  try{
    const log=await ensureLog(sessionId);
    const { error } = await sb.from('set_logs').upsert({ ...base, workout_log_id:log.id },{ onConflict:'workout_log_id,session_exercise_id,set_number' });
    if(error) throw error;
    keepLocal(log); obDrop(key);
    row.querySelectorAll('input').forEach(i=>{ i.classList.add('saved'); i.classList.remove('pre','queued'); });
    if(row.dataset.heavy) refreshDrops(row.closest('[data-sess]')?.parentElement||document, seId);
  }catch(err){
    if(!isNetErr(err)){ toast('Not saved: '+err.message); return; }
    keepLocal(obLocalLog(sessionId)); obPut({ k:key, kind:'set', sid:sessionId, rec:base });
    row.querySelectorAll('input').forEach(i=>{ i.classList.add('queued'); i.classList.remove('pre'); }); obQueued();
  }
}
async function completeSession(sessionIds, done){
  if(S.ro){ toast('View mode. Switch to Train to log.'); return; }
  try{
    const completed_at = done ? new Date().toISOString() : null;
    let queued=false;
    for(const sessionId of String(sessionIds).split(',').filter(Boolean)){
      try{
        const log=await ensureLog(sessionId);
        const { error } = await sb.from('workout_logs').update({ completed_at }).eq('id',log.id);
        if(error) throw error;
        log.completed_at=completed_at; obDrop('done|'+sessionId);
      }catch(err){ if(!isNetErr(err)) throw err;
        obLocalLog(sessionId).completed_at=completed_at; obPut({ k:'done|'+sessionId, kind:'done', sid:sessionId, at:completed_at }); queued=true; }
    }
    renderToday(); if(queued) obQueued(); else if(done) toast('Session complete. Nice work.');
  }catch(err){ toast(err.message); }
}

async function loadHistory(){

      return `<div class="hist-ex">${v.se.label?`<span class="slot">${esc(v.se.label)}</span> `:''}${esc(S.exercises[k]?.name||'')} <span>${sets.map(r=>`${r.weight_kg!=null?+r.weight_kg:'–'}${r.reps?'×'+esc(r.reps):''}${r.made?'':'✗'}`).join(', ')}</span></div>`;

  }).join('');
}

const vidMeta=file=>new Promise(res=>{ const v=document.createElement('video'); v.preload='metadata'; v.muted=true;
  const u=URL.createObjectURL(file); v.onloadedmetadata=()=>{ res({ dur:v.duration, url:u }); }; v.onerror=()=>res({ dur:null, url:u }); v.src=u; });
// Upload with a progress bar (signed upload URL + XHR); falls back to the normal upload if that route isn't available
async function uploadReview(path, file, onProg, bucket='reviews'){
  try{
    const { data, error } = await sb.storage.from(bucket).createSignedUploadUrl(path); if(error) throw error;
    await new Promise((ok,bad)=>{ const x=new XMLHttpRequest(); x.open('PUT', data.signedUrl); x.setRequestHeader('x-upsert','false');
      x.upload.onprogress=e=>{ if(e.lengthComputable) onProg(e.loaded/e.total); };
      x.onload=()=> x.status>=200&&x.status<300 ? ok() : bad(new Error('Upload failed ('+x.status+')')); x.onerror=()=>bad(new Error('network'));
      const fd=new FormData(); fd.append('cacheControl','3600'); fd.append('',file); x.send(fd); });
  }catch(e){
    onProg(null);
    const { error } = await sb.storage.from(bucket).upload(path, file, { contentType:file.type||'video/mp4' }); if(error) throw error;
  }
}
function videoSheet(seId, sessionId){
  const se=S.sessions.flatMap(x=>x.session_exercises).find(x=>x.id===seId); if(!se) return;
  const ex=S.exercises[se.exercise_id]||{name:'Lift'}, log=S.logs[sessionId];
  const rows=[...document.querySelectorAll(`.set[data-se="${seId}"]`)].map(r=>{ const n=+r.dataset.n, sl=log?.set_logs?.find(x=>x.session_exercise_id===seId&&x.set_number===n);
    return { n, lbl:r.querySelector('.no')?.textContent||n, kg:sl?.weight_kg!=null?+sl.weight_kg:(r.querySelector('[data-f=w]')?.value||'') }; });
  const MAXV=5;
  document.querySelector('.vr-ov')?.remove();
  const ov=document.createElement('div'); ov.className='vr-ov';
  ov.innerHTML=`<div class="vr-sheet"><div class="vr-h"><b>Send ${esc(ex.name)} for review</b><button class="vr-x" aria-label="Close">✕</button></div>
    <div id="vrClips" class="vr-clips"></div>
    <label class="vr-pick" id="vrPick"><input type="file" accept="video/*" multiple hidden id="vrFile"><span id="vrPickTxt">🎥 Film or choose videos</span></label>
    <div class="vr-f"><label>Anything you want me to look at?</label><textarea id="vrNote" rows="2" placeholder="e.g. felt slow off the floor, missed it forward"></textarea></div>
    <div class="vr-prog" id="vrProg" hidden><i></i></div>
    <button class="btn primary block" id="vrSend" disabled>Send to coach</button>
    <p class="vr-tip">Keep each one short: just the lift, side on if you can. Up to ${MAXV} videos, 60 seconds each.</p></div>`;
  document.body.appendChild(ov);
  const close=()=>{ clips.forEach(c=>URL.revokeObjectURL(c.url)); ov.remove(); };
  ov.querySelector('.vr-x').onclick=close; ov.onclick=e=>{ if(e.target===ov) close(); };
  const clips=[]; // {file,dur,url,set}
  const setOpts=sel=>`<option value="">Not a specific set</option>${rows.map(r=>{ const v=`${r.n}|${r.kg}`; return `<option value="${v}" ${v===sel?'selected':''}>Set ${esc(r.lbl)}${r.kg!==''?` · ${esc(r.kg)} kg`:''}</option>`; }).join('')}`;
  const draw=()=>{
    ov.querySelector('#vrClips').innerHTML=clips.map((c,i)=>`<div class="vr-clip"><video src="${c.url}#t=0.1" playsinline muted preload="metadata"></video>
      <div class="vr-clip-r"><div class="vr-clip-m">Video ${i+1}${c.dur?` · ${Math.round(c.dur)} s`:''} · ${(c.file.size/1048576).toFixed(1)} MB</div>
        <select data-cset="${i}" aria-label="Which set">${setOpts(c.set)}</select></div>
      <button class="vr-clip-x" data-crm="${i}" aria-label="Remove">✕</button></div>`).join('');
    ov.querySelectorAll('[data-cset]').forEach(s=>s.onchange=()=>{ clips[+s.dataset.cset].set=s.value; });
    ov.querySelectorAll('[data-crm]').forEach(b=>b.onclick=()=>{ const [c]=clips.splice(+b.dataset.crm,1); URL.revokeObjectURL(c.url); draw(); });
    ov.querySelector('#vrPick').hidden=clips.length>=MAXV;
    ov.querySelector('#vrPickTxt').textContent=clips.length?'＋ Add another video':'🎥 Film or choose videos';
    const btn=ov.querySelector('#vrSend'); btn.disabled=!clips.length; btn.textContent=clips.length>1?`Send ${clips.length} videos to coach`:'Send to coach';
  };
  ov.querySelector('#vrFile').onchange=async e=>{ const fs=[...e.target.files]; e.target.value=''; let skipped=[];
    for(const f of fs){
      if(clips.length>=MAXV){ skipped.push(`only ${MAXV} at a time`); break; }
      if(f.size>50*1024*1024){ skipped.push('one is over 50 MB'); continue; }
      const m=await vidMeta(f); if(m.dur && m.dur>61){ URL.revokeObjectURL(m.url); skipped.push(`one is ${Math.round(m.dur)} seconds`); continue; }
      // a new clip defaults to the next set after the last one picked
      const last=clips.length?rows.findIndex(r=>`${r.n}|${r.kg}`===clips[clips.length-1].set):-1;
      clips.push({ file:f, dur:m.dur, url:m.url, set:last>=0&&rows[last+1]?`${rows[last+1].n}|${rows[last+1].kg}`:'' });
    }
    if(skipped.length) toast('Left out: '+[...new Set(skipped)].join(', ')+'. Trim videos to just the lift (under a minute).');
    draw(); };
  ov.querySelector('#vrSend').onclick=async()=>{ if(!clips.length) return; const btn=ov.querySelector('#vrSend'), bar=ov.querySelector('#vrProg');
    btn.disabled=true; bar.hidden=false; ov.querySelectorAll('[data-crm],[data-cset]').forEach(x=>x.disabled=true); ov.querySelector('#vrPick').hidden=true;
    const note=ov.querySelector('#vrNote').value.trim()||null, total=clips.reduce((a,c)=>a+c.file.size,0); let doneBytes=0, sent=0;
    try{
      while(clips.length){ const c=clips[0];
        btn.textContent=`Uploading ${sent+1} of ${sent+clips.length}…`;
        const ext=(c.file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'mp4';
        const path=`${S.user.id}/${crypto.randomUUID()}.${ext}`;
        await uploadReview(path, c.file, p=>{ bar.classList.toggle('ind',p==null); if(p!=null) bar.firstElementChild.style.width=Math.round((doneBytes+p*c.file.size)/total*100)+'%'; });
        const [sn,kg]=(c.set||'|').split('|');
        const rec={ session_id:sessionId||null, session_exercise_id:seId, exercise_id:se.exercise_id, set_number:sn?+sn:null, weight_kg:kg!==''&&kg!=null&&!isNaN(+kg)?+kg:null,
          note, video_path:path, duration_s:c.dur?Math.round(c.dur*10)/10:null, size_bytes:c.file.size };
        const { data, error } = await sb.from('video_reviews').insert(rec).select('id,session_id,session_exercise_id,exercise_id,set_number,weight_kg,note,video_path,status,coach_reply,reviewed_at,athlete_seen_at,created_at').single();
        if(error){ sb.storage.from('reviews').remove([path]).then(()=>{},()=>{}); throw error; }
        S.vids=[data,...(S.vids||[])]; doneBytes+=c.file.size; sent++; clips.shift(); URL.revokeObjectURL(c.url); draw(); btn.disabled=true;
      }
      close(); toast(sent>1?`${sent} videos sent to your coach 📹`:'Sent to your coach 📹'); renderToday();
    }catch(e){ ov.querySelectorAll('[data-crm],[data-cset]').forEach(x=>x.disabled=false); draw(); bar.hidden=true;
      if(sent) renderToday();
      toast((sent?`${sent} sent. `:'')+(isNetErr(e)?'No signal. The rest didn’t send. Try again when you have signal.':'Video didn’t send: '+e.message)); }
  };
  draw();
}

function renderNotes(){
  const notes=S.myNotes||[], F=S.notesFilter||'all';

  const counts={}; notes.forEach(n=>{ const k=n.exercise_id||'general'; counts[k]=(counts[k]||0)+1; });
  const keys=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||exName(a==='general'?null:a).localeCompare(exName(b==='general'?null:b)));

  h+= shown.length ? shown.map(n=>S.noteEdit===n.id
      ? `<div class="card note"><select data-eex="${n.id}" aria-label="Lift">${opts(n.exercise_id)}</select>
          <textarea data-ebody="${n.id}" rows="4" style="margin-top:8px">${esc(n.body)}</textarea>

      : `<div class="card note"><div class="note-h"><span class="tag ${n.exercise_id?'cat':''}">${esc(exName(n.exercise_id))}</span><span class="hint">${noteDate(n.created_at)}${n.updated_at&&new Date(n.updated_at)-new Date(n.created_at)>60000?' · edited':''}</span></div>
