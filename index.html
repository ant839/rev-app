/* ---------------- PAYMENTS ----------------
   Only for athletes whose membership is billed through the app (memberships.billing = 'app'). Card and bank details are entered
   on Stripe's own page (Checkout) and stay in Stripe; the app only shows the brand and last 4. Coming back from Stripe lands on
   ?pay=done&sid=... which is saved here and confirmed on the Payments screen. */
(()=>{ const q=new URLSearchParams(location.search), p=q.get('pay');
  if(p){ store.set('paysid', p==='done' ? (q.get('sid')||'') : null); store.set('payback', p); history.replaceState(null,'',location.pathname+(p?'#pay':'')); } })();
const money2 = c => '$' + (c/100).toLocaleString('en-AU',{minimumFractionDigits:c%100?2:0, maximumFractionDigits:2});
const dShortP = ds => new Date(ds+'T00:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short'});
const dWedP = ds => new Date(ds+'T00:00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long'});
async function checkPayMenu(){
  const { data } = await sb.from('memberships').select('id').eq('profile_id',S.user.id).eq('billing','app').limit(1);
  S.payOn = !!(data && data.length);
  const b=document.querySelector('[data-go="pay"]'); if(b) b.hidden=!S.payOn;
  S.payFail=[];
  if(S.payOn){
    if(!S.payModeA) S.payModeA=(await sb.functions.invoke('billing',{body:{action:'mode'}})).data?.mode||'test';
    const { data:f } = await sb.from('billing_charges').select('id,amount_cents,period_start,period_end,failure').eq('profile_id',S.user.id).eq('mode',S.payModeA).eq('status','failed').order('period_start');
    S.payFail=f||[];
  }
  const on=S.payFail.length>0;
  const t=$('payTag'); if(t) t.hidden=!on;
  $('meBtn')?.classList.toggle('alert',on);
  if(S.view==='home'){ const el=$('homePayFail'); if(on && !el) $('view').insertAdjacentHTML('afterbegin',payHomeHTML()); else if(!on && el) el.remove(); else if(on) el.outerHTML=payHomeHTML(); bindPayAgain($('view')); }
}
// Missed payment: red card at the top of Home. Most of the time there just wasn't enough in the account, so one tap runs it again.
function payHomeHTML(){
  const f=S.payFail||[]; if(!f.length) return '';
  const tot=f.reduce((a,c)=>a+c.amount_cents,0);
  const per = f.length===1 ? `for ${dShortP(f[0].period_start)} to ${dShortP(f[0].period_end)}` : `for ${f.length} fortnights`;
  return `<div class="pay-alert" id="homePayFail" role="alert"><div class="pa-ic">!</div><b>Your payment didn't go through</b>
    <span>${money2(tot)} ${per}. Usually it's just not enough in the account on the day. Once it's there, tap Run payment again.</span>
    <div class="pa-btns"><button class="btn red" data-payagain>Run payment again</button><button class="btn" data-gopay>Update card</button></div></div>`;
}
function bindPayAgain(root){
  root.querySelectorAll('[data-payagain]').forEach(b=>b.onclick=()=>runPayAgain(b));
  root.querySelectorAll('[data-gopay]').forEach(b=>b.onclick=()=>go('pay'));
}
async function runPayAgain(btn){
  const ids=(S.payFail||[]).map(c=>c.id); if(!ids.length) return;
  btn.disabled=true; const was=btn.textContent; btn.textContent='Running payment…';
  let ok=0, fail=null;
  for(const id of ids){
    const r=await sb.functions.invoke('billing',{body:{action:'retry',charge_id:id}});
    if(r.error){ fail=(await r.error.context?.json?.().catch(()=>null))?.error||'Something went wrong'; break; }
    if(r.data.status==='succeeded'||r.data.status==='processing') ok++; else { fail=r.data.failure||'Your bank declined it'; break; }
  }
  if(fail){ toast(`Still didn't go through: ${fail}. Check the money is in the account, or update your card.`); btn.disabled=false; btn.textContent=was; }
  else toast(ok>1?'Payments went through. Thanks!':'Payment went through. Thanks!');
  await checkPayMenu();
  if(!fail && S.view==='pay') loadPay();
}
async function loadPay(){
  const sid=store.get('paysid'), back=store.get('payback'); store.set('paysid',null); store.set('payback',null);
  let note='', noteCls='';
  const mode = (await sb.functions.invoke('billing',{body:{action:'mode'}})).data?.mode || 'test';
  if(sid){
    $('view').innerHTML='<div class="empty">Saving your card…</div>';
    const r=await sb.functions.invoke('billing',{body:{action:'confirm',sid}});
    const err = r.error ? ((await r.error.context?.json?.().catch(()=>null))?.error || 'Something went wrong saving your details') : null;
    if(err){ note=err; noteCls='err'; }
    else { const re=(r.data.retried||[]); note = 'Your card is saved.' + (re.some(x=>x.status==='succeeded') ? ' Your overdue payment has gone through.' : re.some(x=>x.status==='processing') ? ' Your overdue payment is on its way.' : ''); noteCls='ok'; }
  } else if(back==='cancel'){ note='Nothing was changed.'; }
  const today=new Date().toLocaleDateString('en-CA',{timeZone:'Australia/Perth'});
  const [{data:ms},{data:cus},{data:ch}] = await Promise.all([
    sb.from('memberships').select('id,billing,start_date,end_date').eq('profile_id',S.user.id).order('start_date',{ascending:false}),
    sb.from('billing_customers').select('*').eq('profile_id',S.user.id).eq('mode',mode).maybeSingle(),
    sb.from('billing_charges').select('*').eq('profile_id',S.user.id).eq('mode',mode).order('bill_date',{ascending:false}).limit(12)
  ]);
  const m=(ms||[]).find(x=>x.billing==='app' && (!x.end_date||x.end_date>=today));
  const next = m ? (await sb.rpc('billing_next',{p_membership:m.id})).data : null;
  const failed=(ch||[]).filter(c=>c.status==='failed');
  const pm=cus&&cus.pm_id ? cus : null;
  const pmLabel = !pm ? '' : pm.pm_type==='card' ? `${esc((pm.pm_brand||'Card').replace(/^\w/,c=>c.toUpperCase()))} ending ${esc(pm.pm_last4||'')}${pm.pm_exp?` · expires ${esc(pm.pm_exp)}`:''}` : `${esc(pm.pm_brand||'Bank account')} ending ${esc(pm.pm_last4||'')}`;
  const ST={succeeded:['Paid','ok'],processing:['Processing','proc'],pending:['Due','proc'],failed:['Failed','bad'],skipped:['Nothing due','dim'],refunded:['Refunded','dim']};
  let h=`<a class="back" href="#" id="payBack">‹ Home</a>`;
  if(mode==='test') h+=`<div class="pay-test"><b>Test mode.</b> No real money moves. Use card 4242 4242 4242 4242, any future date, any CVC.</div>`;
  if(note) h+=`<div class="pay-note ${noteCls}">${esc(note)}</div>`;
  if(failed.length) h+=`<div class="pay-fail"><b>Your last payment didn't go through</b><span>${money2(failed[0].amount_cents)} for ${dShortP(failed[0].period_start)} to ${dShortP(failed[0].period_end)}${failed[0].failure?` · ${esc(failed[0].failure)}`:''}. Usually it's just not enough in the account on the day. Once it's there, run it again, or update your card below and we'll try again straight away.</span><button class="btn red block pay-again" data-payagain>Run payment again</button></div>`;
  h+=`<div class="card"><div class="card-label"><span>Next payment</span></div>${
    !m ? '<div class="hint">Your membership isn’t billed through the app.</div>'
    : next && next.bill_date ? `<div class="pay-next"><b>${money2(next.amount_cents)}</b><span>${dWedP(next.bill_date)}</span></div>
        <div class="hint">For ${dShortP(next.period_start)} to ${dShortP(next.period_end)}${next.weeks<2?' (1 week, the other is on hold)':''}${next.plan_name?' · '+esc(next.plan_name):''}. Taken every second Wednesday.</div>`
    : next && next.ended ? '<div class="hint">No more payments. Your membership is ending.</div>'
    : '<div class="hint">Nothing scheduled.</div>'}</div>`;
  h+=`<div class="card"><div class="card-label"><span>Your card</span></div>
    ${pm ? `<div class="pay-pm"><span class="pay-ic">${pm.pm_type==='card'?'💳':'🏦'}</span><div><b>${pmLabel}</b><div class="hint">Kept securely by Stripe, not in the app.</div></div></div>`
         : '<div class="hint" style="margin-bottom:10px">No card saved yet. Add one so your membership can be paid.</div>'}
    <button class="btn primary block" id="payUpd" style="margin-top:12px">${pm?'Update card':'Add a card'}</button>
    <div class="hint" style="margin-top:8px;text-align:center">Opens Stripe's secure page.</div></div>`;
  if((ch||[]).length) h+=`<div class="card"><div class="card-label"><span>Payment history</span></div>${(ch||[]).map(c=>{ const [l,k]=ST[c.status]||[c.status,'dim'];
      return `<div class="pay-row"><div><b>${money2(c.amount_cents)}</b><div class="hint">${dShortP(c.period_start)} to ${dShortP(c.period_end)} · taken ${dShortP(c.bill_date)}</div></div><span class="pay-st ${k}">${l}</span></div>`; }).join('')}</div>`;
  $('view').innerHTML=h;
  $('payBack').onclick=e=>{ e.preventDefault(); go('home'); };
  S.payFail=failed; bindPayAgain($('view'));
  $('payUpd').onclick=async()=>{ const b=$('payUpd'); b.disabled=true; b.textContent='Opening Stripe…';
    const r=await sb.functions.invoke('billing',{body:{action:'setup',return_url:location.origin+location.pathname}});
    if(r.error||!r.data?.url){ b.disabled=false; b.textContent='Try again'; toast(((await r.error?.context?.json?.().catch(()=>null))?.error)||'Couldn’t open Stripe'); return; }
    location.href=r.data.url; };
  checkPayMenu();
}

/* ---------------- HOLD OR CANCEL ----------------
   Athletes ask for a hold or a cancellation here (profile menu). It needs 14 days' notice (checked here
   and again in the database) and shows as Pending until Coach Ant approves or declines it on the dashboard. */
const NOTICE_DAYS=14;
const dMid = ds => new Date(ds+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
const dLong = ds => new Date(ds+'T00:00').toLocaleDateString('en-AU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const plusDays = (ds,n) => { const d=new Date(ds+'T00:00'); d.setDate(d.getDate()+n); return ymd(d); };
const firstAllowed = () => { const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()+NOTICE_DAYS); return ymd(d); };
// Whole weeks only (Mon to Sun): holds start on a Monday at least 14 days out, cancellations finish on a Sunday at least 14 days out
function weekOptions(){
  const min=new Date(firstAllowed()+'T00:00');
  const mon=new Date(min); mon.setDate(mon.getDate()+((8-mon.getDay())%7));        // next Monday on or after the minimum
  const sun=new Date(min); sun.setDate(sun.getDate()+((7-sun.getDay())%7));        // next Sunday on or after the minimum
  const mons=[], suns=[];
  for(let i=0;i<26;i++){ const a=new Date(mon); a.setDate(a.getDate()+7*i); mons.push(ymd(a)); const z=new Date(sun); z.setDate(z.getDate()+7*i); suns.push(ymd(z)); }
  return {mons, suns};
}
const RQ_TXT={hold:'Hold',cancel:'Cancellation'}, RQ_ST={pending:'Pending',approved:'Approved',declined:'Declined',withdrawn:'Withdrawn'};
async function myRequests(){
  const { data, error } = await sb.from('membership_requests').select('*').eq('athlete_id',S.user.id).order('created_at',{ascending:false}).limit(10);
  return error ? null : (data||[]);
}
// Pending shows in the menu until Coach Ant decides; an approved request keeps its tag until its dates have passed
async function refreshHoldTag(){
  const rows=await myRequests(); const t=$('holdTag'); if(!t||!rows) return;
  const today=ymd(new Date());
  const p=rows.find(r=>r.status==='pending'), a=rows.find(r=>r.status==='approved' && (r.end_date||r.start_date)>=today);
  const r=p||a; t.hidden=!r; if(!r) return;
  t.className='mtag '+r.status; t.textContent=RQ_ST[r.status];
}
function rqSummary(r){
  return `<dl class="rq-sum"><dt>Type</dt><dd>${RQ_TXT[r.kind]}</dd>
    ${r.kind==='hold' ? `<dt>On hold from</dt><dd>${esc(dLong(r.start_date))}</dd><dt>Back from</dt><dd>${esc(dLong(r.end_date))}</dd>`
      : `<dt>Last day</dt><dd>${esc(dLong(r.start_date))} (end of that week)</dd>`}
    ${r.reason?`<dt>Reason</dt><dd style="white-space:pre-wrap">${esc(r.reason)}</dd>`:''}
    <dt>Sent</dt><dd>${esc(fmtDate(r.created_at))}</dd>
    ${r.coach_note?`<dt>Coach Ant</dt><dd style="white-space:pre-wrap">${esc(r.coach_note)}</dd>`:''}</dl>`;
}
async function loadHold(){
  const rows=await myRequests(); if(S.view!=='hold') return;
  if(rows==null){ $('view').innerHTML=`<a class="back" href="#" id="rqBack">‹ Home</a><div class="card"><div class="empty">Couldn’t load this right now. Try again in a minute.</div></div>`; $('rqBack').onclick=e=>{e.preventDefault();go('home');}; return; }
  const pend=rows.find(r=>r.status==='pending');
  const recent=rows.filter(r=>r!==pend).slice(0,5);
  const W=weekOptions();
  let h=`<a class="back" href="#" id="rqBack">‹ Home</a>`;
  if(pend){
    h+=`<div class="card"><div class="card-label"><span>Your request</span><span class="rq-st pending">Pending</span></div>
      <p class="hint">Sent to Coach Ant. It stays pending until he approves it, and you’ll get a notification when he does.</p>
      ${rqSummary(pend)}
      <button class="btn block" id="rqWithdraw">Withdraw this request</button></div>`;
  } else {
    h+=`<div class="card"><div class="card-label"><span>Hold or cancel your membership</span></div>
      <p class="hint" style="margin-bottom:10px">Memberships run in full weeks, Monday to Sunday. If you train any day in a week, you’re in for that whole week, so holds and cancellations always start and finish on a full week. You can’t hold for a week and a half or cancel partway through a week.</p>
      <div class="seg" id="rqKind"><button type="button" class="on" data-k="hold">Hold</button><button type="button" data-k="cancel">Cancel</button></div>
      <div class="rq-warn" id="rqNotice" style="margin-bottom:14px"></div>
      <div id="rqHoldW">
        <div class="rq-f"><label for="rqStartH">First week on hold</label><select id="rqStartH">${W.mons.map(m=>`<option value="${m}">Week starting ${esc(dMid(m))}</option>`).join('')}</select></div>
        <div class="rq-f"><label for="rqWeeks">How many weeks</label><select id="rqWeeks">${Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1} week${i?'s':''}</option>`).join('')}</select></div>
        <p class="hint" id="rqBackTxt" style="margin:-4px 0 14px"></p>
      </div>
      <div id="rqCancelW" hidden>
        <div class="rq-f"><label for="rqLast">Last week of your membership</label><select id="rqLast">${W.suns.map(d=>`<option value="${d}">Week ending ${esc(dMid(d))}</option>`).join('')}</select></div>
      </div>
      <div class="rq-f"><label for="rqReason" id="rqReasonL">Reason (optional)</label><textarea id="rqReason" maxlength="1000" placeholder="Travel, injury, work…"></textarea></div>
      <button class="btn primary block" id="rqSend">Send hold request</button></div>`;
  }
  if(recent.length) h+=`<div class="card"><div class="card-label"><span>Earlier requests</span></div>${recent.map(r=>`<div class="rq-old"><div><b>${RQ_TXT[r.kind]}</b> <span class="hint">${r.kind==='hold'?esc(fmtDate(r.start_date+'T00:00'))+' to '+esc(fmtDate(r.end_date+'T00:00')):'last day '+esc(fmtDate(r.start_date+'T00:00'))}</span>${r.coach_note?`<div class="hint">Coach Ant: ${esc(r.coach_note)}</div>`:''}</div><span class="rq-st ${r.status}">${RQ_ST[r.status]}</span></div>`).join('')}</div>`;
  $('view').innerHTML=h;
  $('rqBack').onclick=e=>{ e.preventDefault(); go('home'); };
  if(pend){
    $('rqWithdraw').onclick=async()=>{ const b=$('rqWithdraw');
      if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Tap again to withdraw'; setTimeout(()=>{ if(document.body.contains(b)){ b.dataset.sure=''; b.textContent='Withdraw this request'; } },4000); return; }
      b.disabled=true; const { error } = await sb.rpc('withdraw_hold_cancel',{p_id:pend.id});
      if(error){ b.disabled=false; toast(error.message); return; }
      toast('Request withdrawn'); refreshHoldTag(); loadHold(); };
    return;
  }
  let kind='hold';
  const notice = () => { $('rqNotice').textContent = kind==='hold'
      ? `${NOTICE_DAYS} days’ notice is required, so the earliest week you can hold from is the week starting ${dLong(W.mons[0])}.`
      : `${NOTICE_DAYS} days’ notice is required to cancel. That’s less than the maximum of 30 days allowed under the WA Fitness Industry Code of Practice. The earliest you can finish is the week ending ${dLong(W.suns[0])}.`; };
  const backTxt = () => { const back=plusDays($('rqStartH').value, 7*+$('rqWeeks').value);
    $('rqBackTxt').innerHTML = `On hold ${esc(dLong($('rqStartH').value))} to ${esc(dLong(plusDays(back,-1)))}. Back training <b>${esc(dLong(back))}</b>.`; return back; };
  $('rqStartH').onchange=backTxt; $('rqWeeks').onchange=backTxt; backTxt(); notice();
  $('rqKind').querySelectorAll('button').forEach(b=>b.onclick=()=>{ kind=b.dataset.k;
    $('rqKind').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    $('rqHoldW').hidden = kind!=='hold'; $('rqCancelW').hidden = kind==='hold';
    $('rqReasonL').textContent = kind==='hold' ? 'Reason (optional)' : 'Why are you leaving? (optional)';
    $('rqSend').textContent = kind==='hold' ? 'Send hold request' : 'Send cancellation request'; notice(); });
  $('rqSend').onclick=async()=>{
    const start = kind==='hold' ? $('rqStartH').value : $('rqLast').value, back = kind==='hold' ? backTxt() : null;
    const b=$('rqSend'); b.disabled=true; b.textContent='Sending…';
    const { error } = await sb.rpc('request_hold_cancel',{p_kind:kind, p_start:start, p_end:back, p_reason:$('rqReason').value.trim()||null});
    if(error){ b.disabled=false; b.textContent=kind==='hold'?'Send hold request':'Send cancellation request'; toast(error.message); return; }
    toast('Sent to Coach Ant'); refreshHoldTag(); loadHold();
  };
}

/* ---------------- FORMS ----------------
   Coach Ant sends forms from the dashboard. Each one is a form_requests row for this athlete; open ones pop up
   when the app opens, sit at the top of Home and live under Forms in the profile menu. Answers go in through
   submit_form. Typed answers are kept on the phone until sent, so leaving halfway loses nothing. */
const FORM_SEL='id,form_id,send_id,round_at,sent_at,closes_at,responded_at,answers,snapshot,forms(id,title,intro,questions)';
const formOpen=r=>!r.responded_at && (!r.closes_at || new Date(r.closes_at)>new Date());
async function fetchMyForms(limit){
  const { data, error } = await sb.from('form_requests').select(FORM_SEL).eq('athlete_id',S.user.id).order('sent_at',{ascending:false}).limit(limit||40);
  return error ? null : (data||[]).filter(r=>r.forms);
}
function formWhen(r){
  const sent='Sent '+timeAgo(r.sent_at);
  if(r.responded_at) return 'Sent back '+fmtDate(r.responded_at);
  if(r.closes_at && formOpen(r)) return sent+' · open until '+new Date(r.closes_at).toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'});
  return sent;
}
function formRowHTML(r){
  const n=(r.forms.questions||[]).length, open=formOpen(r);
  return `<button type="button" class="frm-row ${open?'':'done'}" data-form="${r.id}"><span class="frm-t">${esc(r.forms.title)}<small>${esc(formWhen(r))}${open&&n?` · ${n} question${n===1?'':'s'}`:''}</small></span>
    <span class="frm-go">${open?'Fill in ›':r.responded_at?'View':'Closed'}</span></button>`;
}
function bindFormRows(root){ (root||document).querySelectorAll('[data-form]').forEach(b=>b.onclick=()=>{ location.hash='form/'+b.dataset.form; }); }
// Home card (only when something is waiting)
async function formsCardHTML(){
  const rows=await fetchMyForms(20); S.openForms=(rows||[]).filter(formOpen); refreshFormTag();
  if(!S.openForms.length) return '';
  return `<div class="card frm-card"><div class="card-label"><span>From Coach Ant: forms to fill in</span><span class="frm-cnt">${S.openForms.length}</span></div>
    ${S.openForms.map(formRowHTML).join('')}</div>`;
}
function refreshFormTag(){ const t=$('formTag'); if(!t) return; const n=(S.openForms||[]).length; t.hidden=!n; t.textContent=n; }
// pop-up when the app opens (and again a few hours after "Later")
async function checkForms(){
  checkForms.last=Date.now();
  try{ await sb.rpc('forms_tick'); }catch(e){}
  const rows=await fetchMyForms(20); if(!rows) return;
  S.openForms=rows.filter(formOpen); refreshFormTag();
  const snooze=store.get('formSnooze')||{}, now=Date.now();
  const fresh=S.openForms.filter(r=>!(snooze[r.id]>now));
  if(!fresh.length || location.hash.startsWith('#form') || document.querySelector('.frm-ov')) return;
  const ov=document.createElement('div'); ov.className='frm-ov';
  ov.innerHTML=`<div class="frm-pop" role="dialog" aria-modal="true" aria-labelledby="frmPopH"><div class="frm-i">📝</div>
    <h3 id="frmPopH">${fresh.length===1?'Coach Ant sent you a form':'Coach Ant sent you '+fresh.length+' forms'}</h3>
    <div class="hint">It only takes a minute.</div>
    <ul>${fresh.slice(0,4).map(r=>`<li>${esc(r.forms.title)}<small>${esc(formWhen(r))}</small></li>`).join('')}</ul>
    <div class="frm-b"><button class="btn" id="frmLater">Later</button><button class="btn primary" id="frmGo">Fill it in</button></div></div>`;
  document.body.appendChild(ov);
  $('frmLater').onclick=()=>{ fresh.forEach(r=>snooze[r.id]=now+3*36e5); Object.keys(snooze).forEach(k=>{ if(snooze[k]<now) delete snooze[k]; }); store.set('formSnooze',snooze); ov.remove(); };
  $('frmGo').onclick=()=>{ ov.remove(); location.hash = fresh.length===1 ? 'form/'+fresh[0].id : 'forms'; };
}
// coming back to the app after a while (it stays open in the background on phones) checks again
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.user && Date.now()-(checkForms.last||0)>10*60e3){ checkForms.last=Date.now(); checkForms(); } });
async function loadForms(){
  setTitle('forms');
  const rows=await fetchMyForms(40); if(S.view!=='forms') return;
  const back=`<a class="back" href="#" id="frmBack">‹ Home</a>`;
  if(rows==null){ $('view').innerHTML=back+`<div class="card"><div class="empty">Couldn’t load your forms. Try again in a minute.</div></div>`; }
  else {
    const open=rows.filter(formOpen), past=rows.filter(r=>!formOpen(r));
    S.openForms=open; refreshFormTag();
    $('view').innerHTML=back+`<div class="card ${open.length?'frm-card':''}"><div class="card-label"><span>To fill in</span>${open.length?`<span class="frm-cnt">${open.length}</span>`:''}</div>
      ${open.length?open.map(formRowHTML).join(''):'<div class="empty">You’re all caught up.</div>'}</div>
      ${past.length?`<div class="card"><div class="card-label"><span>Earlier</span></div>${past.map(formRowHTML).join('')}</div>`:''}`;
    bindFormRows($('view'));
  }
  $('frmBack').onclick=e=>{ e.preventDefault(); if(location.hash) history.replaceState(null,'',location.pathname); go('home'); };
}
function fmtAnswer(q, v){
  if(v==null || v==='' || (Array.isArray(v)&&!v.length)) return null;
  if(q.type==='yesno') return v===true||v==='yes' ? 'Yes' : 'No';
  if(Array.isArray(v)) return v.join(', ');
  if(q.type==='date') return new Date(v+'T00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  if(q.type==='scale') return `${v} out of ${q.max||10}`;
  return String(v);
}
function formQHTML(q, v, ro){
  const lbl=`<div class="frm-l">${esc(q.label||'Question')}${q.required&&!ro?'<span class="req" aria-label="required">*</span>':''}</div>${q.help?`<div class="frm-h">${esc(q.help)}</div>`:''}`;
  if(ro){ const a=fmtAnswer(q,v); return `<div class="frm-q">${lbl}<div class="frm-ans ${a?'':'none'}">${a?esc(a):'No answer'}</div></div>`; }
  const id='fq_'+q.id;
  let body='';
  if(q.type==='long') body=`<textarea id="${id}" data-qi="${q.id}" maxlength="3000">${esc(v||'')}</textarea>`;
  else if(q.type==='number') body=`<input id="${id}" data-qi="${q.id}" type="number" inputmode="decimal" step="any" value="${v??''}">`;
  else if(q.type==='date') body=`<input id="${id}" data-qi="${q.id}" type="date" value="${esc(v||'')}">`;
  else if(q.type==='yesno') body=`<div class="frm-yn" data-qb="${q.id}">${[['yes','Yes'],['no','No']].map(([k,l])=>`<button type="button" data-v="${k}" class="${v===k?'on':''}">${l}</button>`).join('')}</div>`;
  else if(q.type==='scale'){ const lo=q.min!=null?+q.min:1, hi=q.max!=null?+q.max:10, n=[]; for(let i=lo;i<=hi;i++) n.push(i);
    body=`<div class="frm-scale" data-qb="${q.id}">${n.map(i=>`<button type="button" data-v="${i}" class="${+v===i?'on':''}" aria-label="${i}">${i}</button>`).join('')}</div>
      ${q.low||q.high?`<div class="frm-ends"><span>${esc(q.low||'')}</span><span>${esc(q.high||'')}</span></div>`:''}`; }
  else if(q.type==='choice'||q.type==='multi'){ const sel=Array.isArray(v)?v:(v!=null?[v]:[]);
    body=`<div class="frm-opts" data-qb="${q.id}">${(q.options||[]).map(o=>`<button type="button" class="frm-opt ${q.type==='multi'?'sq':''} ${sel.includes(o)?'on':''}" data-v="${esc(o)}" role="${q.type==='multi'?'checkbox':'radio'}" aria-checked="${sel.includes(o)}"><i></i>${esc(o)}</button>`).join('')}</div>`; }
  else body=`<input id="${id}" data-qi="${q.id}" type="text" maxlength="300" value="${esc(v||'')}">`;
  return `<div class="frm-q" data-q="${q.id}">${body.startsWith('<input')||body.startsWith('<textarea')?lbl.replace('<div class="frm-l">',`<label class="frm-l" for="${id}">`).replace('</div>','</label>'):lbl}${body}</div>`;
}
async function openForm(id){
  S.view='forms'; markTabs(); setTitle('forms');
  $('view').innerHTML='<div class="empty">Loading…</div>';
  const { data:r, error } = await sb.from('form_requests').select(FORM_SEL).eq('id',id).maybeSingle();
  const back=`<a class="back" href="#forms" id="frmBack">‹ Forms</a>`;
  if(error || !r || !r.forms){ $('view').innerHTML=back+`<div class="card"><div class="empty">This form isn’t available.</div></div>`; return; }
  const open=formOpen(r), qs=(r.responded_at ? (r.snapshot||r.forms.questions) : r.forms.questions)||[];
  if(!open){
    $('view').innerHTML=back+`<div class="card"><div class="card-label"><span>${esc(r.forms.title)}</span><span class="frm-done ${r.responded_at?'':'closed'}">${r.responded_at?'Sent':'Closed'}</span></div>
      <div class="hint">${r.responded_at?'You sent this back '+esc(fmtDate(r.responded_at))+'.':'This one closed before it was filled in.'}</div>
      ${r.responded_at?qs.map(q=>formQHTML(q,(r.answers||{})[q.id],true)).join(''):''}</div>`;
    return;
  }
  const key='form.'+r.id, A=Object.assign({}, store.get(key)||{});
  const draw=()=>{
    $('view').innerHTML=back+`<div class="card"><div class="card-label"><span>From Coach Ant</span><span>${esc(formWhen(r))}</span></div>
      <h2 style="font-size:20px;font-weight:500;margin-bottom:6px">${esc(r.forms.title)}</h2>
      ${r.forms.intro?`<div class="frm-intro">${esc(r.forms.intro)}</div>`:''}
      ${qs.some(q=>q.required)?'<div class="hint"><span style="color:var(--accent)">*</span> needs an answer</div>':''}
      ${qs.map(q=>formQHTML(q,A[q.id],false)).join('')}
      <button class="btn primary block frm-sub" id="frmSend">Send to Coach Ant</button></div>`;
    const save=()=>store.set(key,A);
    $('view').querySelectorAll('[data-qi]').forEach(inp=>inp.oninput=()=>{ const q=qs.find(x=>x.id===inp.dataset.qi);
      A[q.id] = q.type==='number' ? (inp.value===''?null:+inp.value) : inp.value; inp.closest('.frm-q').classList.remove('bad'); save(); });
    $('view').querySelectorAll('[data-qb]').forEach(box=>{ const q=qs.find(x=>x.id===box.dataset.qb);
      box.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{
        const val=b.dataset.v;
        if(q.type==='multi'){ const cur=new Set(A[q.id]||[]); cur.has(val)?cur.delete(val):cur.add(val); A[q.id]=(q.options||[]).filter(o=>cur.has(o)); }
        else if(q.type==='scale') A[q.id]= +A[q.id]===+val ? null : +val;
        else A[q.id]= A[q.id]===val ? null : val;
        box.querySelectorAll('[data-v]').forEach(x=>{ const on = q.type==='multi' ? (A[q.id]||[]).includes(x.dataset.v) : q.type==='scale' ? +x.dataset.v===A[q.id] : x.dataset.v===A[q.id];
          x.classList.toggle('on',on); if(x.hasAttribute('aria-checked')) x.setAttribute('aria-checked',on); });
        box.closest('.frm-q').classList.remove('bad'); save(); }); });
    $('frmSend').onclick=async()=>{
      const missing=qs.filter(q=>q.required && fmtAnswer(q,A[q.id])==null);
      $('view').querySelectorAll('.frm-q').forEach(el=>el.classList.toggle('bad', missing.some(q=>q.id===el.dataset.q)));
      if(missing.length){ toast(missing.length===1?'One question still needs an answer':missing.length+' questions still need an answer'); $('view').querySelector('.frm-q.bad').scrollIntoView({behavior:'smooth',block:'center'}); return; }
      const out={}; qs.forEach(q=>{ const v=A[q.id]; if(fmtAnswer(q,v)!=null) out[q.id] = typeof v==='string' ? v.trim() : v; });
      const b=$('frmSend'); b.disabled=true; b.textContent='Sending…';
      const { error } = await sb.rpc('submit_form',{p_request:r.id, p_answers:out});
      if(error){ b.disabled=false; b.textContent='Send to Coach Ant'; toast(error.message); return; }
      store.set(key,null); toast('Sent to Coach Ant');
      S.openForms=(S.openForms||[]).filter(x=>x.id!==r.id); refreshFormTag();
      location.hash = S.openForms.length ? 'forms' : '';
      if(!S.openForms.length){ history.replaceState(null,'',location.pathname); go('home'); }
    };
  };
  draw();
}

/* ---------------- PUSH NOTIFICATIONS ---------------- */
const VAPID_PUBLIC='BNZPCKwEgHDRLxXL25rSqz6nlitht0F5dEx-IRsFEIV7Bs3bJe2nnEehLVIFh5QmkfJQ5Bh3o9941y7GHfO2iRQ';
const pushSupported=()=>'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches || navigator.standalone===true;
function b64ToBytes(b){ const p='='.repeat((4-b.length%4)%4); const r=atob((b+p).replace(/-/g,'+').replace(/_/g,'/')); return Uint8Array.from(r,c=>c.charCodeAt(0)); }
let swReg=null;
async function registerSW(){ if(!('serviceWorker' in navigator)) return; try{ swReg=await navigator.serviceWorker.register('sw.js'); }catch(e){ console.warn('sw',e); } }
async function saveSub(sub){
  const j=sub.toJSON();
  const { error } = await sb.from('push_subscriptions').upsert({ profile_id:S.user.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0,200) },{ onConflict:'endpoint' });
  if(error) throw error;
}
async function enablePush(){
  if(!pushSupported()){ toast(isIOS()&&!isStandalone()?'Add Rev to your Home Screen first, then open it from there.':'This browser can’t do notifications.'); return false; }
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ toast('Notifications are blocked. Turn them on in your phone settings for Rev.'); return false; }
  const reg=swReg||await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC) });
  try{ await saveSub(sub); toast('Notifications on'); return true; }catch(e){ toast('Couldn’t save: '+e.message); return false; }
}
async function disablePush(){
  const reg=swReg||(await navigator.serviceWorker?.getRegistration());
  const sub=await reg?.pushManager.getSubscription();
  if(sub){ await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint); await sub.unsubscribe().catch(()=>{}); }
}
async function pushState(){
  if(!pushSupported()) return isIOS()&&!isStandalone() ? 'needs-install' : 'unsupported';
  if(Notification.permission==='denied') return 'blocked';
  const reg=swReg||(await navigator.serviceWorker.getRegistration());
  const sub=await reg?.pushManager.getSubscription();
  return sub && Notification.permission==='granted' ? 'on' : 'off';
}
// keep this device's subscription fresh in the database
async function refreshPush(){ try{ if(await pushState()==='on'){ const reg=swReg||await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub) await saveSub(sub); } }catch(e){} }
async function pushPromptHTML(){
  const st=await pushState(); if(store.get('pushDismissed') && st!=='needs-install') return '';
  if(st==='off') return `<div class="card push-card"><div class="pc-i">🔔</div><div style="flex:1"><b>Turn on notifications</b><div class="hint">Get a ping for messages from Coach Ant or your group, and new forum posts.</div></div>
    <div class="pc-b"><button class="btn primary sm" id="pushOn">Turn on</button><button class="btn sm" id="pushNo">Later</button></div></div>`;
  if(st==='needs-install') return `<div class="card push-card"><div class="pc-i">📲</div><div style="flex:1"><b>Install Rev on your phone</b><div class="hint">Tap the Share button, then <b>Add to Home Screen</b>. Open Rev from your home screen to turn on notifications.</div></div></div>`;
  return '';
}
function bindPushPrompt(){
  $('pushOn') && ($('pushOn').onclick=async()=>{ if(await enablePush()) $('pushOn').closest('.push-card').remove(); });
  $('pushNo') && ($('pushNo').onclick=()=>{ store.set('pushDismissed',true); $('pushNo').closest('.push-card').remove(); });
}

// Square crop from the centre, 480px JPEG
async function squareImage(file){
  const src=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  const s=Math.min(img.naturalWidth,img.naturalHeight), N=Math.min(480,s), c=document.createElement('canvas'); c.width=c.height=N;
  c.getContext('2d').drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,N,N); URL.revokeObjectURL(src);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85)); return { blob, url:URL.createObjectURL(blob) };
}

// Official team chats first (in this order), then everything else by most recent message
function sortConvos(cs){
  const rank=c=>{ if(c.kind!=='group') return 99; const i=TEAM_CHATS.findIndex(t=>t.key===String(c.title||'').trim().toLowerCase()); return i<0?99:i; };
  return cs.map((c,i)=>({c,i})).sort((x,y)=>(rank(x.c)-rank(y.c))||(x.i-y.i)).map(x=>x.c);
}

    h+=`<div class="msg ${mine?'me':''} ${m.author_role==='coach'?'coachmsg':''} ${first?'first':''}">
      ${!mine&&first&&S.chatKind==='group'?`<div class="mname">${S.av?.[m.author_id]?`<img class="mav" src="${S.av[m.author_id]}" alt="">`:''}${esc(m.author_name||'Athlete')}</div>`:''}

      ${rxPills(m)}${S.rxOpen===m.id?`<div class="rx-pick">${RX.map(e=>`<button data-rxadd="${m.id}|${e}" class="${S.reacts.some(r=>r.message_id===m.id&&r.profile_id===S.user.id&&r.emoji===e)?'on':''}">${e}</button>`).join('')}</div>`:''}
      ${mine||isCoach()?`<button class="mdel" data-delm="${m.id}" aria-label="Delete message">×</button>`:''}</div>`;
  });
  box.innerHTML=h;
  box.querySelectorAll('[data-delm]').forEach(b=>b.onclick=async()=>{ const id=b.dataset.delm, m=S.msgs.find(x=>x.id===id);
    const { error } = await sb.from('messages').delete().eq('id',id); if(error){ toast(error.message); return; }
    if(m?.image_path) sb.storage.from('chat').remove([m.image_path]).then(()=>{},()=>{});
    S.msgs=S.msgs.filter(x=>x.id!==id); drawMsgs(false); });
  // tap a message to react; tap a photo to see it full size
  box.querySelectorAll('[data-rxm]').forEach(b=>b.onclick=e=>{ if(e.target.closest('a,[data-view]')) return; S.rxOpen=S.rxOpen===b.dataset.rxm?null:b.dataset.rxm; drawMsgs(false); });
  box.querySelectorAll('[data-rxadd]').forEach(b=>b.onclick=()=>{ const [mid,em]=b.dataset.rxadd.split('|'); S.rxOpen=null; toggleReact(mid,em); });
  box.querySelectorAll('[data-rxt]').forEach(b=>b.onclick=()=>{ const [mid,em]=b.dataset.rxt.split('|'); toggleReact(mid,em); });
  box.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>viewImage(b.dataset.view));
  if(scroll) window.scrollTo(0,document.body.scrollHeight);
}
const RX=['👍','❤️','😂','🔥','💪','👏','😮','🏋️','😭','😈'];
S.imgUrls={}; S.reacts=[];
function rxPills(m){
  const rs=S.reacts.filter(r=>r.message_id===m.id); if(!rs.length) return '';
  const by={}; rs.forEach(r=>{ (by[r.emoji]=by[r.emoji]||[]).push(r.profile_id); });
  return `<div class="rx-row">${RX.filter(e=>by[e]).map(e=>`<button class="rxn ${by[e].includes(S.user.id)?'mine':''}" data-rxt="${m.id}|${e}">${e}${by[e].length>1?`<b>${by[e].length}</b>`:''}</button>`).join('')}</div>`;
}
async function toggleReact(mid, emoji){
  const mine=S.reacts.find(r=>r.message_id===mid&&r.profile_id===S.user.id&&r.emoji===emoji);
  if(mine){ S.reacts=S.reacts.filter(r=>r!==mine); drawMsgs(false);
    const { error } = await sb.from('message_reactions').delete().eq('message_id',mid).eq('profile_id',S.user.id).eq('emoji',emoji);
    if(error){ toast(error.message); S.reacts.push(mine); drawMsgs(false); } return; }
  const r={ message_id:mid, profile_id:S.user.id, emoji, conversation_id:S.chatId }; S.reacts.push(r); drawMsgs(false);
  const { error } = await sb.from('message_reactions').insert(r);
  if(error && !/duplicate/i.test(error.message)){ toast(error.message); S.reacts=S.reacts.filter(x=>x!==r); drawMsgs(false); }

// Private photos: short-lived signed links, fetched in one go for the messages on screen
async function signImages(){
  const need=[...new Set(S.msgs.map(m=>m.image_path).filter(p=>p&&!S.imgUrls[p]))]; if(!need.length) return;
  const { data } = await sb.storage.from('chat').createSignedUrls(need, 3600);
  (data||[]).forEach(d=>{ if(d.signedUrl) S.imgUrls[d.path]=d.signedUrl; });

function viewImage(path){ const u=S.imgUrls[path]; if(!u) return;
  const ov=document.createElement('div'); ov.className='img-view'; ov.innerHTML=`<img src="${u}" alt="Photo"><button aria-label="Close">✕</button>`;
  ov.onclick=()=>ov.remove(); document.body.appendChild(ov); }
// Shrink on the phone before upload: longest side 1600px, JPEG ~80% (a few hundred KB). Handles iPhone HEIC via the browser's own decoder.
async function shrinkImage(file){
  const src=URL.createObjectURL(file);
  const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=src; });
  const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)), w=Math.round(img.naturalWidth*k), h=Math.round(img.naturalHeight*k);
  const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h); URL.revokeObjectURL(src);
  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.8)); if(!blob) throw new Error('encode');
  return { blob, w, h, url:URL.createObjectURL(blob) };
}

    sb.from('sessions').select('program_id,week_number'),
  ]);
  const { data:codes } = await sb.from('invite_codes').select('code,group_id,active,also_group_ids');
  const { data:events } = await sb.from('events').select('id,title,event_date,event_time,theme,location,group_id,description,post_id').order('event_date').order('event_time',{nullsFirst:true});
  const gName=id=>groups.find(g=>g.id===id)?.name||'?';
  const pName=id=>{ const p=people.find(x=>x.id===id); return p?(p.full_name||p.email):'?'; };
  const weeksOf=id=>new Set((sc||[]).filter(s=>s.program_id===id).map(s=>s.week_number)).size;
  const daysOf=id=>(sc||[]).filter(s=>s.program_id===id).length;

  const todayStr=perthDate(Date.now());
  let h=`<div class="card"><div class="card-label"><span>Events</span><span>Shown on Home</span></div>`;
  (events||[]).forEach(e=>{
    const past=e.event_date<todayStr;
    h+=`<div class="row" style="${past?'opacity:.5':''}"><div class="l"><b>${esc(e.title)}</b>
      <span>${({comp:'Comp',party:'Party',other:'Event'})[e.theme]||'Event'} · ${new Date(e.event_date+'T00:00:00').toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}${e.event_time?' · '+e.event_time.slice(0,5):''}${e.location?' · '+esc(e.location):''}${e.group_id?' · '+esc(gName(e.group_id)):''}</span></div>
      <div class="inline">${e.post_id?`<a class="btn sm" href="#post/${e.post_id}">Post</a>`:''}<button class="btn sm" data-editevent="${e.id}">Edit</button><button class="btn sm" data-delevent="${e.id}">Remove</button></div></div>`;
  });
  h+=`<div class="chips-add" style="flex-wrap:wrap">
      <input id="evTitle" placeholder="Event name" style="flex:2;min-width:140px">
      <input id="evDate" type="date" style="flex:1;min-width:130px">
      <input id="evTime" type="time" style="flex:1;min-width:100px" aria-label="Start time">
      <select id="evTheme" style="flex:1;min-width:110px" aria-label="Banner style"><option value="comp">Comp banner</option><option value="party">Party banner</option><option value="other">Other</option></select>
      <input id="evLoc" placeholder="Location (optional)" style="flex:1;min-width:120px">
      <select id="evGroup" style="flex:1;min-width:120px"><option value="">Everyone</option>${groups.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
      <input id="evDesc" placeholder="Details for the forum post (optional)" style="flex-basis:100%">
      <button class="btn sm primary" id="evAdd">Add event</button><button class="btn sm" id="evCancel" hidden>Cancel</button></div>
      <p class="hint" style="margin-top:8px">Each event gets a forum post automatically. Editing an event updates its post, including who can see it.</p></div>`;

  h+=`<div class="card"><div class="card-label"><span>Programs</span></div>`;
  progs.forEach(p=>{
    const a=asg.filter(x=>x.program_id===p.id);
    h+=`<div style="padding:12px 0;border-bottom:1px solid var(--border);${p.status==='archived'?'opacity:.55':''}">
      <div class="prog-h"><span class="pill ${esc(p.kind)}">${esc(p.kind)}</span><b style="font-weight:500;flex:1">${esc(p.name)}</b>
        <span class="pill ${esc(p.status)}">${esc(p.status)}</span></div>
      <div class="hint">${daysOf(p.id)} sessions over ${weeksOf(p.id)} week${weeksOf(p.id)===1?'':'s'}${p.track?' · Track: '+esc(p.track):''}</div>
      <div>${a.map(x=>`<span class="chip">${x.group_id?esc(gName(x.group_id)):esc(pName(x.athlete_id))}<button data-unassign="${x.id}" aria-label="Remove">×</button></span>`).join('')||'<span class="hint">Not assigned</span>'}</div>
      <div class="chips-add"><select data-assignsel="${p.id}"><option value="">Assign to…</option>
        <optgroup label="Groups">${groups.map(g=>`<option value="g:${g.id}">${esc(g.name)}</option>`).join('')}</optgroup>
        <optgroup label="Athletes">${people.map(x=>`<option value="a:${x.id}">${esc(x.full_name||x.email)}</option>`).join('')}</optgroup></select>
        <button class="btn sm" data-assign="${p.id}">Add</button>
        <button class="btn sm ${p.status==='published'?'':'primary'}" data-pub="${p.id}" data-st="${p.status}">${p.status==='published'?'Unpublish':'Publish'}</button>
        <button class="btn sm danger-btn" data-delprog="${p.id}">Delete</button></div>
    </div>`;
  });
  h+=`<p class="hint" style="margin-top:10px">Drafts are only visible to you. Publish when you're happy and assigned athletes will see it.</p></div>`;

  h+=`<div class="card"><div class="card-label"><span>Groups</span><span>${groups.length}</span></div>
    ${groups.map(g=>`<div class="row"><div class="l"><b>${esc(g.name)}</b><span>${gm.filter(m=>m.group_id===g.id).length} member${gm.filter(m=>m.group_id===g.id).length===1?'':'s'}${g.name==='Whole Team'?' · everyone joins automatically':''}</span></div>
      ${g.name==='Whole Team'?'':`<button class="btn sm danger-btn" data-delgroup="${g.id}">Delete</button>`}</div>
      ${g.name==='Whole Team'?'':(()=>{ const c=(codes||[]).find(x=>x.group_id===g.id&&x.active); const url=c?joinUrl(c.code):'';
        return `<div class="chips-add" style="margin:-4px 0 6px">${c?`<input readonly value="${esc(url)}" style="flex:1;min-width:0;font-size:12px" aria-label="${esc(g.name)} join link"><button class="btn sm" data-copyjoin="${esc(url)}">Copy</button><button class="btn sm" data-newjoin="${g.id}" data-old="${esc(c.code)}">New link</button>`
          :`<span class="hint" style="flex:1">No join link yet</span><button class="btn sm" data-newjoin="${g.id}">Make join link</button>`}</div>
        ${c?`<div class="chips-add" style="margin:-2px 0 8px;flex-wrap:wrap"><span class="hint">Also adds to:</span>${(c.also_group_ids||[]).map(id=>`<span class="chip">${esc(gName(id))}<button data-alsodel="${esc(c.code)}|${id}" aria-label="Remove">×</button></span>`).join('')||'<span class="hint">nothing else</span>'}
          <select data-alsosel="${esc(c.code)}" style="flex:1;min-width:110px"><option value="">+ group…</option>${groups.filter(x=>x.id!==g.id&&x.name!=='Whole Team'&&!(c.also_group_ids||[]).includes(x.id)).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div>`:''}`; })()}`).join('')}
    <div class="chips-add"><input id="newGroup" placeholder="New group name" style="flex:1"><button class="btn sm" id="addGroup">Add group</button></div>
    <p class="hint" style="margin-top:8px">Anyone who signs up or signs in through a group\u2019s join link is added to that group. \u201cNew link\u201d switches the old one off. Deleting a group also deletes its group chat. Members stay in the app.</p></div>`;
  h+=`<div class="card"><div class="card-label"><span>Members</span><span>${people.length}</span></div>`;
  people.forEach(x=>{
    const mine=gm.filter(m=>m.profile_id===x.id);
    h+=`<div style="padding:10px 0;border-bottom:1px solid var(--border)"><b style="font-weight:500">${esc(x.full_name||x.email)}</b>
      <span class="hint"> ${esc(x.email||'')}${x.role==='coach'?' · Coach':''}</span>
      <div>${mine.map(m=>`<span class="chip">${esc(gName(m.group_id))}<button data-ungroup="${m.group_id}|${x.id}" aria-label="Remove">×</button></span>`).join('')}</div>
      <div class="chips-add"><select data-groupsel="${x.id}"><option value="">Add to group…</option>${groups.filter(g=>!mine.some(m=>m.group_id===g.id)).map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
      <button class="btn sm" data-addgroup="${x.id}">Add</button></div></div>`;
  });
  h+='</div>';
  $('view').innerHTML=h;

  const act=async(fn)=>{ const { error } = await fn(); if(error) toast(error.message); else loadCoach(); };
  document.querySelectorAll('[data-pub]').forEach(b=>b.onclick=()=>act(()=>sb.from('programs').update({status:b.dataset.st==='published'?'draft':'published'}).eq('id',b.dataset.pub)));
  document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>{
    const v=document.querySelector(`[data-assignsel="${b.dataset.assign}"]`).value; if(!v) return;
    const [t,id]=v.split(':'); act(()=>sb.from('program_assignments').insert({program_id:b.dataset.assign, [t==='g'?'group_id':'athlete_id']:id}));
  });
  document.querySelectorAll('[data-unassign]').forEach(b=>b.onclick=()=>act(()=>sb.from('program_assignments').delete().eq('id',b.dataset.unassign)));
  document.querySelectorAll('[data-addgroup]').forEach(b=>b.onclick=()=>{
    const g=document.querySelector(`[data-groupsel="${b.dataset.addgroup}"]`).value; if(!g) return;
    act(()=>sb.from('group_members').insert({group_id:g, profile_id:b.dataset.addgroup}));
  });
  document.querySelectorAll('[data-ungroup]').forEach(b=>b.onclick=()=>{ const [g,p]=b.dataset.ungroup.split('|');
    act(()=>sb.from('group_members').delete().eq('group_id',g).eq('profile_id',p)); });
  const twoTap=(b,fn)=>{ if(b.dataset.sure!=='1'){ b.dataset.sure='1'; b.textContent='Tap again to delete'; setTimeout(()=>{ if(document.body.contains(b)){ b.dataset.sure=''; b.textContent='Delete'; } },4000); return; } fn(); };
  document.querySelectorAll('[data-delprog]').forEach(b=>b.onclick=()=>twoTap(b,()=>act(()=>sb.from('programs').delete().eq('id',b.dataset.delprog))));
  document.querySelectorAll('[data-delgroup]').forEach(b=>b.onclick=()=>twoTap(b,()=>act(()=>sb.from('groups').delete().eq('id',b.dataset.delgroup))));
  $('addGroup').onclick=async()=>{ const name=$('newGroup').value.trim(); if(!name){ toast('Name the group'); return; }
    const { data:g, error } = await sb.from('groups').insert({ name, sort:groups.length }).select('id').single();
    if(error){ toast(error.message); return; }
    await sb.from('conversations').insert({ kind:'group', group_id:g.id }); loadCoach(); };
  document.querySelectorAll('[data-copyjoin]').forEach(b=>b.onclick=async()=>{ try{ await navigator.clipboard.writeText(b.dataset.copyjoin); toast('Join link copied'); }catch(e){ toast(b.dataset.copyjoin); } });
  const alsoOf=code=>(codes||[]).find(x=>x.code===code)?.also_group_ids||[];
  document.querySelectorAll('[data-alsosel]').forEach(sel=>sel.onchange=()=>{ if(!sel.value) return; const code=sel.dataset.alsosel;
    act(()=>sb.from('invite_codes').update({ also_group_ids:[...alsoOf(code),sel.value] }).eq('code',code)); });
  document.querySelectorAll('[data-alsodel]').forEach(b=>b.onclick=()=>{ const [code,id]=b.dataset.alsodel.split('|');
    act(()=>sb.from('invite_codes').update({ also_group_ids:alsoOf(code).filter(x=>x!==id) }).eq('code',code)); });
  document.querySelectorAll('[data-newjoin]').forEach(b=>b.onclick=async()=>{
    const g=groups.find(x=>x.id===b.dataset.newjoin); const slug=(g?.name||'team').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,10)||'team';
    const rnd=[...crypto.getRandomValues(new Uint8Array(4))].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,6);
    if(b.dataset.old){ const { error } = await sb.from('invite_codes').update({active:false}).eq('code',b.dataset.old); if(error){ toast(error.message); return; } }
    act(()=>sb.from('invite_codes').insert({ code:slug+'-'+rnd, group_id:b.dataset.newjoin, also_group_ids:b.dataset.old?alsoOf(b.dataset.old):[] })); });
  document.querySelectorAll('[data-delevent]').forEach(b=>b.onclick=()=>act(()=>sb.from('events').delete().eq('id',b.dataset.delevent)));
  let evEdit=null;
  document.querySelectorAll('[data-editevent]').forEach(b=>b.onclick=()=>{ const e=(events||[]).find(x=>x.id===b.dataset.editevent); if(!e) return;
    evEdit=e.id; $('evTitle').value=e.title; $('evDate').value=e.event_date; $('evTime').value=(e.event_time||'').slice(0,5);
    $('evTheme').value=e.theme||'other'; $('evLoc').value=e.location||''; $('evGroup').value=e.group_id||''; $('evDesc').value=e.description||'';
    $('evAdd').textContent='Save changes'; $('evCancel').hidden=false; $('evTitle').scrollIntoView({behavior:'smooth',block:'center'}); });
  $('evCancel').onclick=()=>loadCoach();
  $('evAdd').onclick=()=>{
    const title=$('evTitle').value.trim(), event_date=$('evDate').value;
    if(!title||!event_date){ toast('Add a name and a date'); return; }
    const rec={ title, event_date, event_time:$('evTime').value||null, theme:$('evTheme').value, location:$('evLoc').value.trim()||null, group_id:$('evGroup').value||null, description:$('evDesc').value.trim()||null };
    act(()=> evEdit ? sb.from('events').update(rec).eq('id',evEdit) : sb.from('events').insert(rec));
    toast(evEdit?'Event and its post updated':'Event added and posted to the forum');
  };
}

/* Keyboard vs the fixed bottom menu (mostly iPhone): hide the menu while typing so it can't ride up on the keyboard,
   and nudge the page after the keyboard closes so iOS puts fixed bars back where they belong. */
(()=>{ const editable=el=>el&&el.matches&&el.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]');
  let t; const settle=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(!editable(document.activeElement)){ document.body.classList.remove('kb'); window.scrollTo(window.scrollX, window.scrollY); } },120); };
  document.addEventListener('focusin',e=>{ if(editable(e.target)){ clearTimeout(t); document.body.classList.add('kb'); } });
  document.addEventListener('focusout',settle);
  const vv=window.visualViewport; if(vv) vv.addEventListener('resize',()=>{ if(vv.height>window.innerHeight*0.85) settle(); });
  window.addEventListener('pageshow',()=>window.scrollTo(window.scrollX, window.scrollY));
})();

/* New version check: the app compares the server's copy of this page with the one it loaded (ETag) whenever it's reopened,
   and offers a one-tap refresh, so home-screen apps don't sit on an old version. */
(()=>{ let base=null; const page=location.pathname.endsWith('.html')?location.pathname:location.pathname+'index.html';
  const tag=async()=>{ try{ const r=await fetch(page,{method:'HEAD',cache:'no-store'}); return r.headers.get('etag')||r.headers.get('last-modified'); }catch(e){ return null; } };
  const check=async()=>{ const t=await tag(); if(!t) return; if(base===null){ base=t; return; }
    if(t!==base && !document.querySelector('.upd-bar')){ const b=document.createElement('button'); b.className='upd-bar'; b.textContent='A new version of the app is ready. Tap to update.'; b.onclick=()=>location.reload(); document.body.appendChild(b); } };
  check(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); }); setInterval(check, 10*60*1000);
})();
</script>
</body>
