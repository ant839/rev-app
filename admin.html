<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="admin.webmanifest">
<link rel="apple-touch-icon" href="icons/coach-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="REV Admin">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>REV Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* REV Admin: membership and booking admin, kept apart from Rev Coach. Same palette as the other two apps. */
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21; --surface3:#26262a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#55554f;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12); --accent-ink:#141a05;
  --red:#ff5a5a; --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --radius:10px; --radius-sm:6px;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark;height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;height:100%;font-variant-numeric:tabular-nums}
#root{height:100%}
input,select,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;outline:none;width:100%;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--border2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);border-color:var(--border)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)} .small{font-size:12px}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.beta{background:var(--amber-dim);color:var(--amber)}
.pill.next{background:var(--blue-dim);color:var(--blue)}
.pill.later{background:var(--surface3);color:var(--muted)}
.pill.live{background:var(--accent-dim);color:var(--accent)}
.err{color:var(--red);font-size:12.5px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13px;line-height:1.5}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;max-width:calc(100% - 32px)}

.center{display:grid;place-items:center;height:100%;padding:24px}
.login{width:min(360px,100%);display:grid;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.login h1{font-size:22px;font-weight:400}

.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:600;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--amber);display:grid;place-items:center;color:#1a1000;font-weight:700;font-size:12px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.appsw{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:14px 12px 0;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.appsw a{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;min-width:0}
.appsw a:hover{color:var(--text)}
.appsw a.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.appsw .mk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--surface3);color:var(--muted)}
.appsw a.on .mk.c{background:var(--accent);color:var(--accent-ink)}
.appsw a.on .mk.a{background:var(--amber);color:#1a1000}
.who{padding:7px 16px 12px;font-size:11px;color:var(--muted)}
.snav{display:flex;flex-direction:column;gap:4px;padding:0 12px 12px}
.snav button{border:1px solid var(--border);background:transparent;border-radius:8px;padding:8px 10px;color:var(--muted);font-weight:500;font-size:13px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.snav button.on{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.side .grow{flex:1}
.side .links{padding:10px 12px;display:grid;gap:4px;border-top:1px solid var(--border)}
.side .links a{padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:500;display:flex;justify-content:space-between}
.side .links a:hover{background:var(--surface2)}
.side .foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

.main{overflow-y:auto;min-width:0}
.page{max-width:880px;padding:22px 24px 40px;display:grid;gap:16px}
.ph h1{font-size:24px;font-weight:400;letter-spacing:-.01em}
.ph p{color:var(--muted);margin-top:4px;line-height:1.5}
.betanote{display:flex;gap:10px;align-items:flex-start;background:var(--amber-dim);border:1px solid rgba(245,166,35,.35);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5}
.betanote b{font-weight:600;color:var(--amber)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.panel h2{font-size:15px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.steps{display:grid;gap:0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--border)}
.step:last-child{border-bottom:0}
.step .n{width:24px;height:24px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.step b{font-weight:500;display:block}
.step span.d{font-size:12.5px;color:var(--muted);line-height:1.45}
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:0}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0}
.prow .nm{flex:1;min-width:0}
.prow .nm b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .nm span{font-size:11.5px;color:var(--muted)}
.addbox{display:grid;gap:8px;margin-top:12px}
.picks{max-height:260px;overflow-y:auto;border:1px solid var(--border);border-radius:8px}
.picks button{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:9px 10px;text-align:left;font-size:13px}
.picks button:last-child{border-bottom:0}
.picks button:hover{background:var(--surface2)}

.page.wide{max-width:1240px}
.ph.row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{display:flex;flex-direction:column;gap:6px;min-width:0}
.dh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;padding:0 2px 2px}
.dh span{font-family:var(--mono);color:var(--dim)}
.none{font-size:12px;color:var(--dim);border:1px dashed var(--border);border-radius:8px;padding:10px;text-align:center}
.tc{display:grid;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--dim);border-radius:8px;padding:8px 9px;min-width:0;color:var(--text)}
.tc:hover{border-color:var(--border2)}
.tc.fndn{border-left-color:var(--blue)} .tc.barbell{border-left-color:var(--accent)}
.tc .tt{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tc b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc .tm{font-size:11.5px;color:var(--muted)}
.tc .tw{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:min(580px,100%);max-height:84vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal .mh h3{font-size:16px;font-weight:500}
.modal .mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.mf{display:flex;justify-content:flex-end;gap:8px}
.fl{display:grid;gap:5px;font-size:12px;color:var(--muted);font-weight:500}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid{display:grid;grid-template-columns:1.2fr 1.1fr 1.1fr .8fr;gap:10px}
.gchk{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--text);font-size:13px;font-weight:400}
.gchk label,.chk{display:flex;align-items:center;gap:6px}
.gchk input,.chk input{width:auto;accent-color:var(--accent)}
.chk{font-size:13px}
.chk.span{grid-column:1/-1;color:var(--text);font-weight:400}
.tc .keep{color:var(--accent)}
.wkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wkbar b{font-weight:500;min-width:190px;text-align:center}
.panel.today{border-color:rgba(200,240,106,.4)}
details.bc{border-bottom:1px solid var(--border)} details.bc:last-child{border-bottom:0}
details.bc summary{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;cursor:pointer;list-style:none}
details.bc summary::-webkit-details-marker{display:none}
details.bc summary b{font-weight:500}
.bt{font-family:var(--mono);font-size:12px;color:var(--muted)}
.bn{font-family:var(--mono);font-size:12px;padding:2px 8px;border-radius:20px;background:var(--surface3);color:var(--muted)}
.bn.some{background:var(--accent-dim);color:var(--accent)} .bn.full{background:var(--amber-dim);color:var(--amber)} .bn.off{background:var(--surface3);color:var(--red);font-family:inherit;font-weight:600;font-size:11px}
details.bc.cx summary b,details.bc.cx .bt{opacity:.5;text-decoration:line-through}
.brow{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.note{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 14px;line-height:1.5}
.bl{padding:0 0 12px 72px;display:grid;gap:4px;justify-items:start}
.bl .prow{width:100%}
@media (max-width:1000px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.week{grid-template-columns:minmax(0,1fr)} .ovl{align-items:flex-end;padding:0} .modal{width:100%;max-height:92dvh;border-radius:16px 16px 0 0;padding-bottom:env(safe-area-inset-bottom)} .fgrid{grid-template-columns:1fr 1fr} .bl{padding-left:0}}
.linkrow{display:flex;gap:6px;align-items:center}
.linkrow input{font-family:var(--mono);font-size:12px}
textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;outline:none;width:100%;font:inherit;font-size:13px;color:var(--text);line-height:1.5;resize:vertical}
textarea:focus{border-color:var(--accent)}
.di{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
.di:last-child{border-bottom:0}
.di-m{display:grid;gap:2px;min-width:0}
.di-m b{font-weight:500}
.di.cx{opacity:.55}
.code{font-family:var(--mono);font-size:15px;letter-spacing:.12em;color:var(--accent);min-width:52px;text-align:right}
.nb{background:var(--amber);color:#1a1000;font-family:var(--mono);font-size:10.5px;font-weight:700;border-radius:20px;padding:0 7px;line-height:17px;margin-left:6px}
.mtabs .tb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--amber);color:#1a1000;font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:20px;padding:0 5px;line-height:15px}
.mtabs button{position:relative}
.mitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:13px 4px;font-size:15px;color:var(--text);text-align:left}
.mitem svg{width:20px;height:20px;color:var(--muted)}
.pill.off{background:var(--surface3);color:var(--red)} .pill.cxl{background:rgba(255,90,90,.12);color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;text-align:left;color:var(--text);display:grid;gap:2px}
button.stat:hover{border-color:var(--border2)}
.stat b{font-size:22px;font-weight:500;font-family:var(--mono)}
.stat span{font-size:11.5px;color:var(--muted)}
.mtools{display:grid;gap:8px;margin-bottom:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:transparent;border-radius:20px;padding:4px 11px;font-size:12px;color:var(--muted)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.mlist{display:grid}
.mrow{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:10px 2px;text-align:left;color:var(--text)}
.mrow:last-child{border-bottom:0}
.mrow:hover{background:var(--surface2)}
.mn{flex:1;min-width:0}
.mn b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn span{font-size:11.5px;color:var(--muted)}
.mp{font-family:var(--mono);font-size:13px;min-width:62px;text-align:right}
.mp small{color:var(--muted);font-size:10px}
.rqp{border-color:rgba(245,166,35,.45);background:linear-gradient(180deg,rgba(245,166,35,.06),var(--surface))}
.rqrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:12px;padding:12px 0;border-top:1px solid var(--border)}
.rqm{display:grid;gap:3px}
.rqm b{font-weight:500}
.rqc{display:grid;gap:6px;align-content:start}
.rqk{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;margin-left:4px;background:var(--blue-dim);color:var(--blue)}
.rqk.cancel{background:rgba(255,90,90,.12);color:var(--red)}
.rqs{font-size:11px;text-transform:capitalize;color:var(--muted)} .rqs.approved{color:var(--accent)} .rqs.declined{color:var(--red)}
details.rqhist summary{cursor:pointer;font-weight:500;font-size:14px}
details.rqhist[open] summary{margin-bottom:8px}
.linkb{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font:inherit}
.modal.wide{width:min(760px,100%)}
.mstate{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.msec{border-top:1px solid var(--border);padding-top:12px;display:grid;gap:10px}
.msec h4{font-size:14px;font-weight:500}
.seg2{display:flex;gap:8px}
.plrow{display:grid;grid-template-columns:1.4fr .9fr .6fr 1.6fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))} .rqrow{grid-template-columns:minmax(0,1fr)} .plrow{grid-template-columns:1fr 1fr} .mp{display:none} .mrow .pill.beta{display:none}}
.mtabs{display:none}
.upd-bar{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:300;background:var(--accent);color:#0b0d05;border:0;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,.5)}

@media (max-width:760px){
  html,body{overflow:hidden}
  input,select{font-size:16px}
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;height:100dvh}
  .side{display:none}
  .main{padding-top:env(safe-area-inset-top)}
  .page{padding:16px 16px 28px}
  .mtabs{display:grid;grid-template-columns:repeat(5,1fr);background:rgba(22,22,24,.96);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .mtabs button,.mtabs a{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:10.5px;font-weight:500;-webkit-tap-highlight-color:transparent}
  .mtabs svg{width:22px;height:22px}
  .mtabs .on{color:var(--accent)}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
}
</style>

  testers:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3M7.5 14h9"/>',
  coach:'<path d="M15 5l-7 7 7 7"/>'
};
const icon = k => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;
const VIEWS = [['overview','Overview'],['memberships','Memberships'],['timetable','Timetable'],['bookings','Bookings'],['signin','Sign-in'],['dropins','Drop-ins'],['testers','Beta testers']];
const MTABS = ['memberships','bookings','signin','dropins'];

/* ---------- Boot and sign in (same account as Rev Coach) ---------- */
sb.auth.onAuthStateChange((_e, session) => {
  const u = session && session.user;
  if(u && (!S.user || S.user.id !== u.id)){ S.user = u; start(); }
  if(!u){ S.user = null; renderLogin(); }
});
function renderLogin(msg){
  $('root').innerHTML = `<div class="center"><form class="login" id="lf">
    <div class="brand" style="padding:0"><span class="mark">RA</span><div>REV Admin<small>Timetable, bookings and memberships</small></div></div>
    <h1>Sign in</h1>
    <input id="le" type="email" placeholder="Email" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>

    <a class="small" href="coach.html">Open Rev Coach instead</a>
  </form></div>`;
  $('lf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email:$('le').value.trim(), password:$('lp').value });
    if(error) renderLogin(error.message);
  };
}
async function start(){
  const { data:p } = await sb.from('profiles').select('id,full_name,email,role').eq('id', S.user.id).single();
  S.me = p;
  if(!p || p.role !== 'coach'){
    $('root').innerHTML = `<div class="center"><div class="login"><h1>Coaches only</h1><p class="muted">REV Admin is for coaches. Your training is in the athlete app.</p><a class="btn pri" href="./" style="justify-content:center">Open the app</a><button class="btn ghost" id="so">Sign out</button></div></div>`;
    $('so').onclick = () => sb.auth.signOut();
    return;
  }
  const h = location.hash.slice(1); if(VIEWS.some(([k]) => k === h)) S.view = h; else if(!h) S.view = 'memberships';
  renderShell(); setView(S.view); watchRequests();
}
// Hold and cancel requests: badge count, and a live listener so a new one shows straight away
async function refreshReqN(){
  const { count, error } = await sb.from('membership_requests').select('id', {count:'exact', head:true}).eq('status', 'pending');
  if(error) return; const was = S.reqN; S.reqN = count || 0; if(S.reqN !== was) renderNav();
}
function watchRequests(){
  refreshReqN();
  sb.channel('admin-requests').on('postgres_changes', {event:'*', schema:'public', table:'membership_requests'}, pl => {
    refreshReqN();
    if(pl.eventType === 'INSERT' && pl.new.status === 'pending') toast('New ' + (pl.new.kind === 'hold' ? 'hold' : 'cancellation') + ' request. It\u2019s in Memberships.');
    if(S.view === 'memberships') renderMemberships();
  }).subscribe();
}

function setView(v){

const betaNote = () => `<div class="betanote"><span class="pill beta">Beta</span><span><b>Bookings are in beta.</b> Only coaches and the Beta Testers group can see or book classes in the athlete app. Everyone else keeps booking through Gymdesk.</span></div>`;

/* ---------- Shared: classes, groups, dates (Perth time) ---------- */
const DOW = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const DOW_LONG = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const PROG = {fndn:'FNDN', barbell:'Barbell Club', open:'Open session'};
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const perthToday = () => { const p = new Date().toLocaleDateString('en-CA', {timeZone:'Australia/Perth'}); return new Date(p + 'T00:00:00'); };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const hm = t => { if(!t) return ''; const [h, m] = t.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2,'0')}${h < 12 ? 'am' : 'pm'}`; };
const t5 = t => (t || '').slice(0, 5);
const fmtDay = d => d.toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});

async function loadClassData(){
  const [c, g] = await Promise.all([
    sb.from('classes').select('*').order('dow').order('start_time').order('sort'),
    sb.from('groups').select('id,name,sort').order('sort')
  ]);
  if(c.error || g.error) throw (c.error || g.error);
  S.classes = c.data || []; S.groups = g.data || [];
}
const gName = id => (S.groups.find(g => g.id === id) || {}).name || '?';
const whoCan = c => c.group_ids.map(gName).join(', ') || 'Nobody yet';

function modal(title, inner){
  document.querySelectorAll('.ovl').forEach(x => x.remove());
  const ov = document.createElement('div'); ov.className = 'ovl';
  ov.innerHTML = `<div class="modal" role="dialog" aria-label="${esc(title)}"><div class="mh"><h3>${esc(title)}</h3><button class="btn ghost sm" data-x aria-label="Close">✕</button></div><div class="mb">${inner}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener('click', e => { if(e.target === ov || e.target.closest('[data-x]')) ov.remove(); });
  return ov;
}

/* ---------- Timetable ---------- */
async function renderTimetable(){
  $('main').innerHTML = `<div class="page"><div class="empty"><span class="spin"></span> Loading</div></div>`;
  try { await loadClassData(); } catch(e){ $('main').innerHTML = `<div class="page"><div class="empty err">${esc(e.message)}</div></div>`; return; }
  const live = S.classes.filter(c => !c.open_session && c.active);
  const open = S.classes.filter(c => c.open_session && c.active);
  const off = S.classes.filter(c => !c.active);
  const card = c => `<button class="tc ${c.program}" data-c="${c.id}">
      <span class="tt">${hm(t5(c.start_time))} to ${hm(t5(c.end_time))}</span>
      <b>${esc(c.name)}</b>
      <span class="tm">${c.capacity ? 'Cap ' + c.capacity : 'No cap'}${c.coach ? ' · ' + esc(c.coach) : ''}${c.auto_cancel === false ? ' · <span class="keep" title="Never cancelled automatically">Always on</span>' : ''}</span>
      <span class="tw">${esc(whoCan(c))}</span></button>`;
  $('main').innerHTML = `<div class="page wide">
    <div class="ph row"><div><h1>Timetable</h1><p>The weekly classes athletes book. Tap a class to change it.</p></div><button class="btn pri" id="addC">+ Add class</button></div>
    ${betaNote()}
    <div class="week">${[1,2,3,4,5,6,7].map(d => {
      const cs = live.filter(c => c.dow === d);
      return `<div class="day"><div class="dh">${DOW_LONG[d-1]}<span>${cs.length || ''}</span></div>${cs.map(card).join('') || '<div class="none">No classes</div>'}</div>`;
    }).join('')}</div>
    <div class="panel"><h2>Open sessions <span class="muted small">no set time, athletes sign in when they arrive</span></h2>
      ${open.map(c => `<div class="prow"><span class="nm"><b>${esc(c.name)}</b><span>${esc(whoCan(c))}</span></span><button class="btn sm" data-c="${c.id}">Edit</button></div>`).join('') || '<div class="empty">None</div>'}
    </div>
    ${off.length ? `<div class="panel"><h2>Turned off <span class="muted small">${off.length}</span></h2>${off.map(c => `<div class="prow"><span class="nm"><b>${esc(c.name)}</b><span>${c.open_session ? 'Open session' : DOW[c.dow-1] + ' ' + hm(t5(c.start_time))}</span></span><button class="btn sm" data-c="${c.id}">Edit</button></div>`).join('')}</div>` : ''}
  </div>`;
  $('main').querySelectorAll('[data-c]').forEach(b => b.onclick = () => editClass(S.classes.find(c => c.id === b.dataset.c)));
  $('addC').onclick = () => editClass(null);
}

function editClass(c){
  const isNew = !c;
  c = c || {name:'', program:'fndn', dow:1, start_time:'06:00', end_time:'07:00', capacity:12, coach:'', group_ids:[], open_session:false, active:true, auto_cancel:true, trial_ok:true};
  const bookable = S.groups.filter(g => !['beta testers','video review'].includes(g.name.trim().toLowerCase()));
  const ov = modal(isNew ? 'Add a class' : 'Edit class', `
    <label class="fl">Name<input id="cN" value="${esc(c.name)}" placeholder="FNDN Strength"></label>
    <div class="f2">
      <label class="fl">Type<select id="cP">${Object.entries(PROG).map(([k, l]) => `<option value="${k}" ${c.program === k ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
      <label class="fl">Coach (optional)<input id="cCo" value="${esc(c.coach || '')}"></label>
    </div>
    <div id="timed" class="fgrid">
      <label class="fl">Day<select id="cD">${DOW_LONG.map((d, i) => `<option value="${i+1}" ${c.dow === i+1 ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
      <label class="fl">Start<input id="cS" type="time" value="${t5(c.start_time)}"></label>
      <label class="fl">End<input id="cE" type="time" value="${t5(c.end_time)}"></label>
      <label class="fl">Capacity<input id="cCap" type="number" min="1" inputmode="numeric" value="${c.capacity ?? ''}"></label>
      <label class="chk span"><input type="checkbox" id="cAuto" ${c.auto_cancel !== false ? 'checked' : ''}> Cancel automatically if nobody has booked by 7pm the night before</label>
      <label class="chk span"><input type="checkbox" id="cTrial" ${c.trial_ok !== false ? 'checked' : ''}> Free trials and drop-ins can book this class</label>
    </div>
    <div class="fl">Who can book<div class="gchk">${bookable.map(g => `<label><input type="checkbox" data-g="${g.id}" ${c.group_ids.includes(g.id) ? 'checked' : ''}> ${esc(g.name)}</label>`).join('')}</div></div>
    ${isNew ? '' : `<label class="chk"><input type="checkbox" id="cA" ${c.active ? 'checked' : ''}> On the timetable <span class="muted small">(untick to turn it off, existing bookings stay)</span></label>`}
    <div class="err" id="cErr"></div>
    <div class="mf"><button class="btn ghost" data-x>Cancel</button><button class="btn pri" id="cSave">${isNew ? 'Add class' : 'Save'}</button></div>`);
  const syncOpen = () => { ov.querySelector('#timed').hidden = ov.querySelector('#cP').value === 'open'; };
  ov.querySelector('#cP').onchange = syncOpen; syncOpen();
  ov.querySelector('#cSave').onclick = async () => {
    const v = id => ov.querySelector(id).value.trim();
    const open = v('#cP') === 'open';
    const row = {
      name: v('#cN'), program: v('#cP'), coach: v('#cCo') || null, open_session: open,
      dow: open ? null : +v('#cD'), start_time: open ? null : v('#cS'), end_time: open ? null : v('#cE'),
      capacity: open || !v('#cCap') ? null : +v('#cCap'),
      auto_cancel: open ? true : ov.querySelector('#cAuto').checked,
      trial_ok: open ? false : ov.querySelector('#cTrial').checked,
      group_ids: [...ov.querySelectorAll('[data-g]:checked')].map(x => x.dataset.g),
      updated_at: new Date().toISOString()
    };
    if(!isNew) row.active = ov.querySelector('#cA').checked;
    const err = m => ov.querySelector('#cErr').textContent = m;
    if(!row.name) return err('Give the class a name');
    if(!open && (!row.start_time || !row.end_time || row.end_time <= row.start_time)) return err('End time needs to be after the start time');
    if(!row.group_ids.length) return err('Tick at least one group that can book it');
    const b = ov.querySelector('#cSave'); b.disabled = true;
    const { error } = isNew ? await sb.from('classes').insert(row) : await sb.from('classes').update(row).eq('id', c.id);
    if(error){ b.disabled = false; return err(error.message); }
    ov.remove(); toast(isNew ? 'Class added' : 'Class saved'); renderTimetable();
  };
}

/* ---------- Bookings: who is in each class, by week ---------- */
async function renderBookings(){
  if(!S.bw) S.bw = mondayOf(perthToday());
  $('main').innerHTML = `<div class="page"><div class="empty"><span class="spin"></span> Loading</div></div>`;
  const from = ymd(S.bw), to = ymd(addDays(S.bw, 6));
  let bk, people;
  try {
    await loadClassData();
    const [b, p, x, di] = await Promise.all([
      sb.from('class_bookings').select('id,class_id,class_date,profile_id,status,created_at').eq('status', 'booked').gte('class_date', from).lte('class_date', to),
      sb.from('profiles').select('id,full_name,email,role,active').order('full_name'),
      sb.from('class_cancellations').select('class_id,class_date,reason,note,status').eq('status', 'cancelled').gte('class_date', from).lte('class_date', to),
      sb.from('drop_ins').select('id,class_id,class_date,full_name,phone,kind').eq('status', 'booked').gte('class_date', from).lte('class_date', to)
    ]);
    if(b.error || p.error || x.error || di.error) throw (b.error || p.error || x.error || di.error);
    bk = b.data || []; people = p.data || []; S.cx = x.data || []; S.di = di.data || [];
  } catch(e){ $('main').innerHTML = `<div class="page"><div class="empty err">${esc(e.message)}</div></div>`; return; }
  S.people = people;
  const pname = id => { const p = people.find(x => x.id === id); return p ? (p.full_name || p.email) : 'Athlete'; };
  const today = ymd(perthToday());
  const timed = S.classes.filter(c => !c.open_session && c.active);
  const total = bk.length;
  const days = [0,1,2,3,4,5,6].map(i => {
    const d = addDays(S.bw, i), ds = ymd(d), dow = i + 1;
    const cs = timed.filter(c => c.dow === dow);
    if(!cs.length) return '';
    return `<div class="panel ${ds === today ? 'today' : ''}"><h2>${fmtDay(d)}${ds === today ? ' <span class="pill live">Today</span>' : ''}</h2>${cs.map(c => {
      const ins = bk.filter(b => b.class_id === c.id && b.class_date === ds).sort((a, b) => pname(a.profile_id).localeCompare(pname(b.profile_id)));
      const dis = S.di.filter(x => x.class_id === c.id && x.class_date === ds);
      const tot = ins.length + dis.length;
      const full = c.capacity && tot >= c.capacity;
      const cx = S.cx.find(x => x.class_id === c.id && x.class_date === ds);
      const k = c.id + '|' + ds;
      const badge = cx ? `<span class="bn off">Cancelled</span>` : `<span class="bn ${full ? 'full' : tot ? 'some' : ''}">${tot}${c.capacity ? '/' + c.capacity : ''}</span>`;
      const body = cx
        ? `<div class="small muted" style="padding:6px 0">${cx.reason === 'no_bookings' ? 'Cancelled automatically: no bookings by 7pm the night before.' : 'Cancelled by a coach.'}${cx.note ? ' ' + esc(cx.note) : ''}</div>
           <button class="btn sm" data-reopen="${k}">Put it back on</button>`
        : `${ins.map(b => `<div class="prow"><span class="av">${esc(initials(pname(b.profile_id)))}</span><span class="nm"><b>${esc(pname(b.profile_id))}</b></span><button class="btn sm danger" data-cx="${b.id}">Cancel</button></div>`).join('')}${dis.map(x => `<div class="prow"><span class="av">${esc(initials(x.full_name))}</span><span class="nm"><b>${esc(x.full_name)}</b><span>${x.kind === 'trial' ? 'Free trial' : 'Drop-in'} · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></span></span></div>`).join('')}${tot ? '' : '<div class="small muted" style="padding:8px 0">Nobody booked yet</div>'}
           <div class="brow"><button class="btn sm" data-addb="${c.id}" data-d="${ds}">+ Book someone in</button><button class="btn sm ghost danger" data-ccl="${k}">Cancel class</button></div>`;
      return `<details class="bc ${cx ? 'cx' : ''}" ${S.bopen && S.bopen === c.id + ds ? 'open' : ''} data-k="${c.id + ds}"><summary><span class="bt">${hm(t5(c.start_time))}</span><b>${esc(c.name)}</b>${badge}</summary>
        <div class="bl">${body}</div></details>`;
    }).join('')}</div>`;
  }).join('');
  $('main').innerHTML = `<div class="page">
    <div class="ph"><h1>Bookings</h1><p>Who is booked into each class. Only Beta Testers can book in the app for now.</p></div>
    <div class="note">At 7pm each night, tomorrow's classes with no bookings are cancelled automatically and you get a notification. Classes marked Always on (PM Barbell Club) are never cancelled. You can put one back on below.</div>
    <div class="wkbar"><button class="btn sm" id="wPrev" aria-label="Previous week">‹</button><b>${fmtDay(S.bw)} to ${fmtDay(addDays(S.bw, 6))}</b><button class="btn sm" id="wNext" aria-label="Next week">›</button><button class="btn ghost sm" id="wNow">This week</button><span class="muted small" style="margin-left:auto">${total} booking${total === 1 ? '' : 's'}</span></div>
    ${days}
  </div>`;
  $('wPrev').onclick = () => { S.bw = addDays(S.bw, -7); renderBookings(); };
  $('wNext').onclick = () => { S.bw = addDays(S.bw, 7); renderBookings(); };
  $('wNow').onclick = () => { S.bw = mondayOf(perthToday()); renderBookings(); };
  $('main').querySelectorAll('details.bc').forEach(d => d.addEventListener('toggle', () => { if(d.open) S.bopen = d.dataset.k; }));
  $('main').querySelectorAll('[data-cx]').forEach(b => b.onclick = async () => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap to confirm'; return; }
    b.disabled = true;
    const { error } = await sb.rpc('cancel_booking', { p_booking: b.dataset.cx });
    if(error){ toast(error.message); b.disabled = false; return; }
    toast('Booking cancelled'); renderBookings();
  });
  $('main').querySelectorAll('[data-addb]').forEach(b => b.onclick = () => bookFor(S.classes.find(c => c.id === b.dataset.addb), b.dataset.d, bk));
  $('main').querySelectorAll('[data-reopen]').forEach(b => b.onclick = async () => {
    const [cid, ds] = b.dataset.reopen.split('|'); b.disabled = true;
    const { error } = await sb.rpc('coach_reopen_class', { p_class: cid, p_date: ds });
    if(error){ toast(error.message); b.disabled = false; return; }
    S.bopen = cid + ds; toast('Class is back on'); renderBookings();
  });
  $('main').querySelectorAll('[data-ccl]').forEach(b => b.onclick = () => {
    const [cid, ds] = b.dataset.ccl.split('|'), c = S.classes.find(x => x.id === cid);

      const { data, error } = await sb.rpc('coach_new_checkin_code', { p_profile:b.dataset.newc });
      if(error){ toast(error.message); b.disabled = false; return; }
      const row = codes.find(c => c.profile_id === b.dataset.newc); if(row) row.code = data; else codes.push({profile_id:b.dataset.newc, code:data});

      <div class="small muted" style="margin-top:8px;line-height:1.5">Open the link on the tablet, sign in once, then add it to the home screen. Double tap the Rev logo on the tablet to sign it out.
      ${kiosks.length ? `Front desk login: <b>${kiosks.map(k => esc(pname(k.profile_id))).join(', ')}</b>.` : 'For now it runs on your coach login. A separate front desk login is safer, so nobody at the desk can reach Rev Coach: create an account in the athlete app (for example frontdesk@revbbc.com.au), then pick it below.'}</div>
      <div class="addbox"><input id="kq" placeholder="Make an account the front desk login: search by name or email" aria-label="Find the front desk account"><div class="picks" id="kpicks" hidden></div></div>
    </div>
    <div class="panel"><h2>Signed in today <span class="muted small">${log.length}</span></h2>
      ${log.map(l => `<div class="prow"><span class="bt">${new Date(l.t).toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'})}</span><span class="nm"><b>${esc(l.who)}</b><span>${esc(l.what)}${l.tag ? ' · ' + l.tag : ''}</span></span></div>`).join('') || '<div class="empty">Nobody yet today</div>'}</div>
    <div class="panel"><h2>Sign-in codes</h2>
      <div class="small muted" style="margin-bottom:8px">Every athlete gets a 4-digit code automatically. Beta Testers see theirs on the Book a class screen in the app.</div>
      <input id="cq" placeholder="Search by name or code" value="${esc(S.si.q)}" aria-label="Search codes" style="margin-bottom:6px">
      <div id="codes"></div></div>
  </div>`;
  drawCodes();
  $('cq').oninput = e => { S.si.q = e.target.value; drawCodes(); };
  $('kCopy').onclick = async () => { try { await navigator.clipboard.writeText(KIOSK_URL()); toast('Link copied'); } catch(e){} };
  $('kq').oninput = e => {
    const q = e.target.value.trim().toLowerCase(), el = $('kpicks');
    if(q.length < 2){ el.hidden = true; return; }
    const list = people.filter(p => p.role !== 'coach' && !kioskIds.has(p.id) && ((p.full_name || '') + ' ' + (p.email || '')).toLowerCase().includes(q)).slice(0, 10);
    el.hidden = false;
    el.innerHTML = list.map(p => `<button data-k="${p.id}"><span>${esc(p.full_name || p.email)} <span class="muted small">${esc(p.email || '')}</span></span><span class="muted small">Make front desk</span></button>`).join('') || '<div class="empty" style="padding:14px">No match</div>';
    el.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      const { error } = await sb.from('kiosk_accounts').insert({ profile_id:b.dataset.k });
      if(error){ toast(error.message); b.disabled = false; return; }
      toast('Front desk login set'); renderSignin();
    });
  };
}

const money = n => '$' + (Math.round(n * 100) / 100).toLocaleString('en-AU', {minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2});
const PROGRAM_LABEL = {barbell:'Barbell Club', fndn:'FNDN', pt:'PT', other:'Other'};
const dLong = ds => new Date(ds + 'T00:00:00').toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
const dShort = ds => new Date(ds + 'T00:00:00').toLocaleDateString('en-AU', {day:'numeric', month:'short'});
const nextMondays = (n, from) => { let d = mondayOf(from || perthToday()); if(d < (from || perthToday())) d = addDays(d, 7); return [...Array(n)].map((_, i) => addDays(d, 7 * i)); };
const sundaysFrom = (n, from) => { let d = from || perthToday(); while(d.getDay() !== 0) d = addDays(d, 1); return [...Array(n)].map((_, i) => addDays(d, 7 * i)); };

async function loadMemberData(){
  const [p, m, pl, rq, g, gm] = await Promise.all([
    sb.from('profiles').select('id,full_name,email,role,active,created_at').order('full_name'),
    sb.from('memberships').select('*').order('start_date', {ascending:false}),
    sb.from('membership_plans').select('*').order('sort'),
    sb.from('membership_requests').select('*').order('created_at', {ascending:false}).limit(500),
    sb.from('groups').select('id,name'),
    sb.from('group_members').select('group_id,profile_id')
  ]);
  const e = p.error || m.error || pl.error || rq.error || g.error || gm.error; if(e) throw e;
  const kiosk = await sb.from('kiosk_accounts').select('profile_id');
  const kIds = new Set((kiosk.data || []).map(k => k.profile_id));
  S.M = { people:(p.data || []).filter(x => !kIds.has(x.id)), mems:m.data || [], plans:pl.data || [], reqs:rq.data || [], groups:g.data || [], gm:gm.data || [] };
  S.reqN = S.M.reqs.filter(r => r.status === 'pending').length;

const pName = id => { const x = (S.M.people || []).find(p => p.id === id); return x ? (x.full_name || x.email) : 'Athlete'; };
const planOf = id => S.M.plans.find(p => p.id === id) || {name:'Plan', weekly_price:0, program:'other'};
const groupsOf = pid => S.M.gm.filter(x => x.profile_id === pid).map(x => (S.M.groups.find(g => g.id === x.group_id) || {}).name).filter(Boolean);

// Where an athlete stands today
function memberState(pid){
  const today = ymd(perthToday());
  const ms = S.M.mems.filter(m => m.profile_id === pid);
  const cur = ms.find(m => !m.end_date || m.end_date >= today) || null;
  const last = cur || ms[0] || null;
  const holds = S.M.reqs.filter(r => r.athlete_id === pid && r.kind === 'hold' && r.status === 'approved' && r.end_date > today).sort((a, b) => a.start_date.localeCompare(b.start_date));
  const onHold = holds.find(h => h.start_date <= today);
  const pending = S.M.reqs.find(r => r.athlete_id === pid && r.status === 'pending');
  let st, label, cls;
  if(!last){ st = 'none'; label = 'No plan set'; cls = 'later'; }
  else if(!cur){ st = 'cancelled'; label = 'Cancelled ' + dShort(last.end_date); cls = 'off'; }
  else if(cur.start_date > today){ st = 'starting'; label = 'Starts ' + dShort(cur.start_date); cls = 'next'; }
  else if(onHold){ st = 'hold'; label = 'On hold until ' + dShort(onHold.end_date); cls = 'beta'; }
  else if(cur.end_date){ st = 'cancelling'; label = 'Last day ' + dShort(cur.end_date); cls = 'cxl'; }
  else { st = 'active'; label = holds.length ? 'Active · hold from ' + dShort(holds[0].start_date) : 'Active'; cls = 'live'; }
  const price = cur ? (cur.weekly_price != null ? +cur.weekly_price : +planOf(cur.plan_id).weekly_price) : 0;
  return { cur, last, st, label, cls, price, pending, holds, onHold };
}

async function quickSetup(noPlan){
  const P = S.M.plans, bb = P.find(p => p.program === 'barbell' && p.name === 'Barbell Club'), fn = P.find(p => p.program === 'fndn');
  const rows = noPlan.map(r => { const g = r.g; const plan = g.includes('Barbell Club') ? bb : g.includes('FNDN') ? fn : null; return plan ? { r, plan } : null; }).filter(Boolean);
  const skip = noPlan.length - rows.length;
  const ov = modal('Quick set up', `<div class="small">This gives <b>${rows.length}</b> athlete${rows.length === 1 ? '' : 's'} the standard plan for their group, starting the day they joined the app:</div>
    <div class="small muted">${bb ? `${rows.filter(x => x.plan === bb).length} on ${esc(bb.name)} (${money(+bb.weekly_price)}/wk)` : ''}${fn ? `, ${rows.filter(x => x.plan === fn).length} on ${esc(fn.name)} (${money(+fn.weekly_price)}/wk)` : ''}.${skip ? ` ${skip} with no Barbell Club or FNDN group are left for you to set (PT clients, trials).` : ''}</div>

    if(error){ toast(error.message); ov.querySelector('#qsGo').disabled = false; return; }
    ov.remove(); toast(rows.length + ' memberships set up'); renderMemberships();
  };
}

function memberSheet(pid){
  const s = memberState(pid), P = S.M.plans.filter(p => p.active || (s.cur && p.id === s.cur.plan_id)), name = pName(pid), first = name.split(' ')[0];
  const cur = s.cur, today = ymd(perthToday());
  const hist = S.M.mems.filter(m => m.profile_id === pid && (!cur || m.id !== cur.id));
  const reqs = S.M.reqs.filter(r => r.athlete_id === pid && r.status !== 'withdrawn').slice(0, 8);
  const mondays = nextMondays(26), sundays = sundaysFrom(26);
  const ov = modal(name, `
    <div class="mstate"><span class="pill ${s.cls}">${esc(s.label)}</span>${cur ? `<span class="muted small">${money(s.price)} a week · billed in Gymdesk</span>` : ''}</div>
    <div class="msec"><h4>${cur ? 'Membership' : 'Set their membership'}</h4>
      <div class="f2">
        <label class="fl">Plan<select id="mpPlan">${cur ? '' : '<option value="">Pick a plan</option>'}${P.map(p => `<option value="${p.id}" ${cur && cur.plan_id === p.id ? 'selected' : ''}>${esc(p.name)} · ${money(+p.weekly_price)}/wk</option>`).join('')}</select></label>
        <label class="fl">${cur ? 'Started' : 'Start date'}<input id="mpStart" type="date" value="${cur ? cur.start_date : today}"></label>
      </div>
      <div class="f2">
        <label class="fl">Weekly price if different (optional)<input id="mpPrice" type="number" min="0" step="0.5" inputmode="decimal" placeholder="${cur ? money(+planOf(cur.plan_id).weekly_price) : 'Plan price'}" value="${cur && cur.weekly_price != null ? cur.weekly_price : ''}"></label>
        <label class="fl">Notes (coaches only)<input id="mpNotes" value="${esc(cur ? cur.notes || '' : '')}" placeholder="e.g. family discount"></label>
      </div>
      <div id="mpFrom" class="fl" hidden>Change plan from<select id="mpFromD">${nextMondays(12).map(d => `<option value="${ymd(d)}">${fmtDay(d)}</option>`).join('')}</select><span class="small muted">Their current plan ends the Sunday before. Leave the plan as is to just fix a mistake.</span></div>
      <div class="err" id="mpErr"></div>
      <div class="mf"><button class="btn pri" id="mpSave">${cur ? 'Save' : 'Save membership'}</button></div>
    </div>
    ${cur ? `<div class="msec"><h4>Hold or cancel</h4>
      <div class="small muted" style="margin-bottom:8px">Use this when ${esc(first)} asks in person. It's approved straight away (no 14 days' notice) and they're not notified. Whole weeks only.</div>
      <div class="seg2"><button class="btn sm" data-hk="hold">Add a hold</button><button class="btn sm" data-hk="cancel">Cancel membership</button></div>
      <div id="hkBox" hidden>
        <div id="hkHold" class="f2"><label class="fl">First week on hold<select id="hkStart">${mondays.map(d => `<option value="${ymd(d)}">${fmtDay(d)}</option>`).join('')}</select></label>
          <label class="fl">How many weeks<select id="hkWeeks">${[...Array(12)].map((_, i) => `<option value="${i + 1}">${i + 1} week${i ? 's' : ''}</option>`).join('')}</select></label></div>
        <div id="hkCancel" hidden><label class="fl">Last day (a Sunday)<select id="hkLast">${sundays.map(d => `<option value="${ymd(d)}">${fmtDay(d)}</option>`).join('')}</select></label></div>
        <label class="fl">Note <span class="muted">(optional)</span><input id="hkNote" maxlength="300"></label>
        <div class="err" id="hkErr"></div>
        <div class="mf"><button class="btn ghost" id="hkX">Never mind</button><button class="btn pri" id="hkGo">Confirm</button></div>
      </div></div>` : ''}
    ${reqs.length ? `<div class="msec"><h4>Holds and cancellations</h4>${reqs.map(r => `<div class="prow"><span class="nm"><b><span class="rqk ${r.kind}">${r.kind === 'hold' ? 'Hold' : 'Cancel'}</span> ${r.kind === 'hold' ? dShort(r.start_date) + ' to ' + dShort(r.end_date) : 'last day ' + dShort(r.start_date)}</b><span>${esc(r.reason || '')}${r.coach_note ? ' · “' + esc(r.coach_note) + '”' : ''}</span></span><span class="rqs ${r.status}">${esc(r.status)}</span>${r.status === 'approved' && (r.end_date || r.start_date) >= today ? `<button class="btn sm ghost" data-undo="${r.id}">Undo</button>` : ''}</div>`).join('')}</div>` : ''}
    ${hist.length ? `<div class="msec"><h4>Earlier plans</h4>${hist.map(m => `<div class="prow"><span class="nm"><b>${esc(planOf(m.plan_id).name)}</b><span>${dShort(m.start_date)} to ${m.end_date ? dShort(m.end_date) : 'now'}</span></span></div>`).join('')}</div>` : ''}
  `);
  ov.querySelector('.modal').classList.add('wide');
  const planSel = ov.querySelector('#mpPlan');
  planSel.onchange = () => { ov.querySelector('#mpFrom').hidden = !(cur && cur.start_date < today && planSel.value !== cur.plan_id); };
  ov.querySelector('#mpSave').onclick = async () => {
    const err = m => ov.querySelector('#mpErr').textContent = m;
    const plan = planSel.value, start = ov.querySelector('#mpStart').value, priceV = ov.querySelector('#mpPrice').value, notes = ov.querySelector('#mpNotes').value.trim() || null;
    if(!plan) return err('Pick a plan'); if(!start) return err('Pick a start date');
    const price = priceV === '' ? null : +priceV;
    const b = ov.querySelector('#mpSave'); b.disabled = true;
    let error;
    if(!cur){
      ({ error } = await sb.from('memberships').insert({ profile_id:pid, plan_id:plan, start_date:start, weekly_price:price, notes, created_by:S.user.id }));
    } else if(!ov.querySelector('#mpFrom').hidden){
      const from = ov.querySelector('#mpFromD').value, endOld = ymd(addDays(new Date(from + 'T00:00:00'), -1));
      ({ error } = await sb.from('memberships').update({ end_date:endOld, updated_at:new Date().toISOString() }).eq('id', cur.id));
      if(!error) ({ error } = await sb.from('memberships').insert({ profile_id:pid, plan_id:plan, start_date:from, end_date:cur.end_date, weekly_price:price, notes, created_by:S.user.id }));
    } else {
      ({ error } = await sb.from('memberships').update({ plan_id:plan, start_date:start, weekly_price:price, notes, updated_at:new Date().toISOString() }).eq('id', cur.id));
    }
    if(error){ b.disabled = false; return err(error.message); }
    ov.remove(); toast('Saved'); renderMemberships();
  };
  if(cur){
    let kind = null;
    ov.querySelectorAll('[data-hk]').forEach(b => b.onclick = () => { kind = b.dataset.hk; ov.querySelector('#hkBox').hidden = false; ov.querySelector('#hkHold').hidden = kind !== 'hold'; ov.querySelector('#hkCancel').hidden = kind !== 'cancel'; ov.querySelector('#hkGo').textContent = kind === 'hold' ? 'Add hold' : 'Cancel membership'; });
    ov.querySelector('#hkX').onclick = () => { ov.querySelector('#hkBox').hidden = true; };
    ov.querySelector('#hkGo').onclick = async () => {
      const b = ov.querySelector('#hkGo'), note = ov.querySelector('#hkNote').value;
      let start, end = null;
      if(kind === 'hold'){ start = ov.querySelector('#hkStart').value; end = ymd(addDays(new Date(start + 'T00:00:00'), 7 * +ov.querySelector('#hkWeeks').value)); }
      else start = ov.querySelector('#hkLast').value;
      b.disabled = true;
      const { error } = await sb.rpc('coach_add_request', { p_athlete:pid, p_kind:kind, p_start:start, p_end:end, p_note:note });
      if(error){ b.disabled = false; ov.querySelector('#hkErr').textContent = error.message; return; }
      ov.remove(); toast((kind === 'hold' ? 'Hold added. Pause' : 'Cancellation saved. Cancel') + ' their billing in Gymdesk too.'); renderMemberships();
    };
  }
  ov.querySelectorAll('[data-undo]').forEach(b => b.onclick = async () => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap to confirm'; return; }
    b.disabled = true;
    const { error } = await sb.rpc('coach_undo_request', { p_id:b.dataset.undo });
    if(error){ toast(error.message); b.disabled = false; return; }
    ov.remove(); toast('Undone. Check Gymdesk matches.'); renderMemberships();
  });
}

function editPlans(){
  const P = S.M.plans, inUse = id => S.M.mems.filter(m => m.plan_id === id && (!m.end_date || m.end_date >= ymd(perthToday()))).length;
  const ov = modal('Plans and prices', `<div class="small muted">Weekly prices. Changing a price here changes it for everyone on that plan who doesn't have their own price set.</div>
    <div id="plRows">${P.map(p => `<div class="plrow" data-pl="${p.id}">
      <input data-k="name" value="${esc(p.name)}" aria-label="Plan name">
      <select data-k="program" aria-label="Program">${Object.entries(PROGRAM_LABEL).map(([k, l]) => `<option value="${k}" ${p.program === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
      <input data-k="weekly_price" type="number" min="0" step="0.5" inputmode="decimal" value="${p.weekly_price}" aria-label="Weekly price">
      <input data-k="description" value="${esc(p.description || '')}" placeholder="What's included" aria-label="Description">
      <label class="chk small"><input type="checkbox" data-k="active" ${p.active ? 'checked' : ''}> On offer</label>
      <span class="small muted">${inUse(p.id)} on it</span></div>`).join('')}</div>
    <button class="btn sm" id="plAdd">+ Add a plan</button>
    <div class="err" id="plErr"></div>
    <div class="mf"><button class="btn ghost" data-x>Close</button><button class="btn pri" id="plSave">Save plans</button></div>`);
  ov.querySelector('.modal').classList.add('wide');
  ov.querySelector('#plAdd').onclick = () => {
    const d = document.createElement('div'); d.className = 'plrow'; d.dataset.pl = 'new';
    d.innerHTML = `<input data-k="name" placeholder="Plan name" aria-label="Plan name"><select data-k="program" aria-label="Program">${Object.entries(PROGRAM_LABEL).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select><input data-k="weekly_price" type="number" min="0" step="0.5" placeholder="$/wk" aria-label="Weekly price"><input data-k="description" placeholder="What's included" aria-label="Description"><label class="chk small"><input type="checkbox" data-k="active" checked> On offer</label><span></span>`;
    ov.querySelector('#plRows').appendChild(d); d.querySelector('input').focus();
  };
  ov.querySelector('#plSave').onclick = async () => {
    const b = ov.querySelector('#plSave'); b.disabled = true;
    for(const row of ov.querySelectorAll('.plrow')){
      const v = k => row.querySelector(`[data-k="${k}"]`);
      const rec = { name:v('name').value.trim(), program:v('program').value, weekly_price:+v('weekly_price').value || 0, description:v('description').value.trim() || null, active:v('active').checked };
      if(!rec.name){ if(row.dataset.pl === 'new') continue; ov.querySelector('#plErr').textContent = 'Every plan needs a name'; b.disabled = false; return; }
      const { error } = row.dataset.pl === 'new'
        ? await sb.from('membership_plans').insert({ ...rec, sort:(S.M.plans.length + 1) * 10 })
        : await sb.from('membership_plans').update(rec).eq('id', row.dataset.pl);
      if(error){ ov.querySelector('#plErr').textContent = error.message; b.disabled = false; return; }
    }
    ov.remove(); toast('Plans saved'); renderMemberships();
  };
}

/* ---------- Drop-ins and free trials: public page trial.html, no account ---------- */
const TRIAL_URL = () => location.origin + location.pathname.replace(/[^/]*$/, '') + 'trial.html';
async function renderDropins(){
  $('main').innerHTML = `<div class="page"><div class="empty"><span class="spin"></span> Loading</div></div>`;
  const since = ymd(addDays(perthToday(), -30));
  let rows, waiver;
  try {
    await loadClassData();
    const [d, w] = await Promise.all([
      sb.from('drop_ins').select('*').gte('class_date', since).order('class_date', {ascending:false}).limit(300),
      sb.from('waivers').select('*').eq('active', true).maybeSingle()
    ]);
    if(d.error || w.error) throw (d.error || w.error);
    rows = d.data || []; waiver = w.data;
  } catch(e){ $('main').innerHTML = `<div class="page"><div class="empty err">${esc(e.message)}</div></div>`; return; }
  const today = ymd(perthToday());
  const cls = id => S.classes.find(c => c.id === id) || {name:'Class', start_time:'00:00'};
  const up = rows.filter(r => r.class_date >= today && r.status === 'booked').sort((a, b) => a.class_date.localeCompare(b.class_date) || cls(a.class_id).start_time.localeCompare(cls(b.class_id).start_time));
  const past = rows.filter(r => !(r.class_date >= today && r.status === 'booked'));
  const row = r => { const c = cls(r.class_id);
    return `<div class="di ${r.status === 'cancelled' ? 'cx' : ''}">
      <div class="di-m"><b>${esc(r.full_name)}</b> <span class="pill ${r.kind === 'trial' ? 'live' : 'next'}">${r.kind === 'trial' ? 'Free trial' : 'Drop-in'}</span>${r.profile_id ? ' <span class="pill later">Has account</span>' : ''}${r.status === 'cancelled' ? ' <span class="pill beta">Cancelled</span>' : ''}
        <div class="small muted">${r.program === 'barbell' ? 'Barbell Club' : r.program === 'fndn' ? 'FNDN' : ''}${r.program ? ': ' : ''}${esc(c.name)}, ${fmtDay(new Date(r.class_date + 'T00:00:00'))} ${hm(t5(c.start_time))}</div>
        <div class="small"><a href="tel:${esc(r.phone)}">${esc(r.phone)}</a> · <a href="mailto:${esc(r.email)}">${esc(r.email)}</a></div>
        <div class="small muted">Waiver v${r.waiver_version} signed ${new Date(r.signed_at).toLocaleString('en-AU', {day:'numeric', month:'short', hour:'numeric', minute:'2-digit'})}</div></div>
      ${r.status === 'booked' && r.class_date >= today ? `<button class="btn sm danger" data-dcx="${r.id}">Cancel</button>` : ''}</div>`; };
  $('main').innerHTML = `<div class="page">
    <div class="ph"><h1>Drop-ins</h1><p>Free trials and drop-ins book on a public page: name, email, mobile, pick a class, sign the waiver. No account needed. They count toward class numbers.</p></div>
    <div class="panel"><h2>Booking page</h2>
      <div class="linkrow"><input readonly value="${esc(TRIAL_URL())}" id="tUrl" aria-label="Booking page link"><button class="btn sm" id="tCopy">Copy</button><a class="btn sm" href="trial.html" target="_blank" rel="noopener">Open</a></div>
      <div class="small muted" style="margin-top:8px">Add <b>?program=fndn</b> or <b>?program=barbell</b> to the end to preselect what they're trying (handy for ads), and <b>&amp;type=dropin</b> for drop-ins. Not linked anywhere yet, so only people you send it to will find it.</div></div>
    <div class="panel"><h2>Coming up <span class="muted small">${up.length}</span></h2>${up.map(row).join('') || '<div class="empty">No drop-ins booked</div>'}</div>
    <div class="panel"><h2>Waiver <span class="muted small">${waiver ? 'Version ' + waiver.version : 'None set'}</span></h2>
      <div class="small muted" style="margin-bottom:8px">Shown before every drop-in booking. Saving makes a new version; past signatures keep the version they signed.</div>
      <input id="wT" value="${esc(waiver ? waiver.title : 'Waiver and release')}" aria-label="Waiver title" style="margin-bottom:8px">
      <textarea id="wB" rows="14" aria-label="Waiver text">${esc(waiver ? waiver.body : '')}</textarea>
      <div class="mf" style="margin-top:8px"><button class="btn pri" id="wSave">Save new version</button></div></div>
    ${past.length ? `<div class="panel"><h2>Last 30 days <span class="muted small">${past.length}</span></h2>${past.map(row).join('')}</div>` : ''}
  </div>`;
  $('tCopy').onclick = async () => { try { await navigator.clipboard.writeText(TRIAL_URL()); toast('Link copied'); } catch(e){ $('tUrl').select(); } };
  $('main').querySelectorAll('[data-dcx]').forEach(b => b.onclick = async () => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap to confirm'; return; }
    b.disabled = true;
    const { error } = await sb.from('drop_ins').update({ status:'cancelled', cancelled_at:new Date().toISOString() }).eq('id', b.dataset.dcx);
    if(error){ toast(error.message); b.disabled = false; return; }
    toast('Drop-in cancelled. Give them a call to let them know.'); renderDropins();
  });
  $('wSave').onclick = async () => {
    const title = $('wT').value.trim(), body = $('wB').value.trim();
    if(body.length < 40){ toast('The waiver text looks too short'); return; }
    if(waiver && title === waiver.title && body === waiver.body){ toast('No changes to save'); return; }
    $('wSave').disabled = true;
    if(waiver){ const { error } = await sb.from('waivers').update({ active:false }).eq('id', waiver.id); if(error){ toast(error.message); $('wSave').disabled = false; return; } }
    const { error } = await sb.from('waivers').insert({ version:(waiver ? waiver.version : 0) + 1, title, body, active:true, created_by:S.user.id });
    if(error){ toast(error.message); if(waiver) await sb.from('waivers').update({ active:true }).eq('id', waiver.id); $('wSave').disabled = false; return; }
    toast('Waiver saved'); renderDropins();
  };
}

/* ---------- Beta testers: members of the Beta Testers group ---------- */
async function loadTesters(){
  $('main').innerHTML = `<div class="page"><div class="empty"><span class="spin"></span> Loading</div></div>`;
  const [{ data:groups, error:ge }, { data:people, error:pe }] = await Promise.all([
    sb.from('groups').select('id,name'),
    sb.from('profiles').select('id,full_name,email,role,active').order('full_name')
  ]);
  if(ge || pe){ $('main').innerHTML = `<div class="page"><div class="empty err">${esc((ge || pe).message)}</div></div>`; return; }
  const g = (groups || []).find(x => x.name.trim().toLowerCase() === BETA_GROUP.toLowerCase());
  if(!g){ $('main').innerHTML = `<div class="page"><div class="empty">The ${esc(BETA_GROUP)} group is missing.</div></div>`; return; }
  const { data:mem, error:me } = await sb.from('group_members').select('profile_id').eq('group_id', g.id);
  if(me){ $('main').innerHTML = `<div class="page"><div class="empty err">${esc(me.message)}</div></div>`; return; }
  S.beta = { gid:g.id, people:people || [], ids:new Set((mem || []).map(m => m.profile_id)), q:'' };
  renderTesters();
}
function renderTesters(){
  const B = S.beta;
  const name = p => p.full_name || p.email || 'Athlete';
  const ins = B.people.filter(p => B.ids.has(p.id));
  $('main').innerHTML = `<div class="page">
    <div class="ph"><h1>Beta testers</h1><p>People in this group see beta features (bookings first) in the athlete app. Nobody else does.</p></div>
    <div class="panel"><h2>In the group <span class="muted small">${ins.length}</span></h2>
      ${ins.map(p => `<div class="prow"><span class="av">${esc(initials(name(p)))}</span><span class="nm"><b>${esc(name(p))}</b><span>${p.role === 'coach' ? 'Coach' : esc(p.email || '')}</span></span><button class="btn sm danger" data-rm="${p.id}">Remove</button></div>`).join('') || '<div class="empty">Nobody yet</div>'}
      <div class="addbox"><input id="tq" placeholder="Add an athlete: search by name" value="${esc(B.q)}" aria-label="Search athletes"><div class="picks" id="picks" hidden></div></div>
    </div>
  </div>`;
  const drawPicks = () => {
    const q = B.q.trim().toLowerCase(), el = $('picks');
    if(!q){ el.hidden = true; return; }
    const outs = B.people.filter(p => !B.ids.has(p.id) && p.active !== false && name(p).toLowerCase().includes(q)).slice(0, 30);
    el.hidden = false;
    el.innerHTML = outs.map(p => `<button data-add="${p.id}"><span>${esc(name(p))}</span><span class="muted small">Add</span></button>`).join('') || '<div class="empty" style="padding:14px">No match</div>';
    el.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
      b.disabled = true;
      const { error } = await sb.from('group_members').insert({ group_id:B.gid, profile_id:b.dataset.add });
      if(error){ toast(error.message); b.disabled = false; return; }
      B.ids.add(b.dataset.add); B.q = ''; renderTesters();
      toast('Added to Beta Testers');
    });
  };
  $('tq').oninput = e => { B.q = e.target.value; drawPicks(); };
  drawPicks();
  $('main').querySelectorAll('[data-rm]').forEach(b => b.onclick = async () => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Tap to confirm'; return; }
    b.disabled = true;
    const { error } = await sb.from('group_members').delete().eq('group_id', B.gid).eq('profile_id', b.dataset.rm);
    if(error){ toast(error.message); b.disabled = false; return; }
    B.ids.delete(b.dataset.rm); renderTesters();
    toast('Removed from Beta Testers');
  });
}

/* New version check, same as the other apps: offers a one-tap refresh when this page has been updated. */
(()=>{ let base=null; const page=location.pathname;
  const tag=async()=>{ try{ const r=await fetch(page,{method:'HEAD',cache:'no-store'}); return r.headers.get('etag')||r.headers.get('last-modified'); }catch(e){ return null; } };
  const check=async()=>{ const t=await tag(); if(!t) return; if(base===null){ base=t; return; }
    if(t!==base && !document.querySelector('.upd-bar')){ const b=document.createElement('button'); b.className='upd-bar'; b.textContent='A new version of the app is ready. Tap to update.'; b.onclick=()=>location.reload(); document.body.appendChild(b); } };
  check(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); }); setInterval(check, 10*60*1000);
})();
</script>
