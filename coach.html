<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="coach.webmanifest">
<link rel="apple-touch-icon" href="icons/coach-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rev Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0e0f">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<title>Rev Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Coach dashboard: athlete list | month calendar | day drawer. Same palette as the member app. */
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21; --surface3:#26262a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#55554f;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12); --accent-ink:#141a05;
  --red:#ff5a5a; --red-dim:rgba(255,90,90,0.14);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --purple:#b08fff; --purple-dim:rgba(176,143,255,0.13);
  --radius:10px; --radius-sm:6px;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
#root{height:100%}
html{color-scheme:dark;height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;height:100%;font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:54px}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--border2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);border-color:var(--border)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.num{font-family:var(--mono)}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.technical{background:var(--blue-dim);color:var(--blue)}
.pill.strength{background:var(--purple-dim);color:var(--purple)}
.pill.other,.pill.accessory{background:var(--surface3);color:var(--muted)}
.pill.draft{background:var(--amber-dim);color:var(--amber)}
.pill.personal{background:var(--accent-dim);color:var(--accent)}

/* Layout */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
.app.drawer-open{grid-template-columns:268px minmax(0,1fr) 480px}
@media (max-width:1180px){.app.drawer-open{grid-template-columns:268px minmax(0,1fr)} .drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);z-index:20;box-shadow:-20px 0 40px rgba(0,0,0,.5)}}
@media (max-width:760px){.app,.app.drawer-open{grid-template-columns:minmax(0,1fr)} .side{display:none} .app.list .side{display:flex} .app.list .main{display:none}}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:600;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:13px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.side .search{padding:0 12px 10px;display:grid;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:transparent;border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.alist{overflow-y:auto;flex:1;padding:4px 8px 12px}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px}
.arow:hover{background:var(--surface2)}
.arow.on{background:var(--surface2);border-color:var(--border2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.arow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk{display:flex;gap:2px}
.wk i{width:6px;height:16px;border-radius:2px;background:var(--surface3)}
.wk i.on{background:var(--accent)}
.side .foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto}
.ahead{padding:18px 24px 12px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.ahead h1{font-size:24px;font-weight:400;letter-spacing:-.01em}
.ahead .progs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptag{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:4px 9px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.ptag b{font-weight:500}
.ptag .psel{font-size:12px;padding:1px 4px;border-radius:6px;width:auto;background:var(--surface2)}
.rost{padding:10px 0 4px;border-bottom:1px solid var(--border)}
.rost-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.rost-h b{font-weight:500}
.rtbl select{font-size:12px;padding:3px 6px;width:auto}
.maxes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.mx{font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 9px}
.mx span{color:var(--muted);margin-right:6px}
.calbar{display:flex;align-items:center;gap:10px;padding:14px 24px 8px;flex-wrap:wrap}
.calbar h2{font-size:17px;font-weight:500;min-width:150px}
.legend{display:flex;gap:12px;margin-left:auto;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.cal{padding:0 24px 24px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.dow span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{min-height:104px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.cell.out{opacity:.38}
.cell.today{border-color:var(--accent)}
.cell.sel{box-shadow:inset 0 0 0 1px var(--text);border-color:var(--text)}
.cell:hover{border-color:var(--border2)}
.cell .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cell .dn b{font-weight:500;color:var(--text)}
.cell .wkl{font-size:10px;color:var(--dim);font-family:var(--mono)}
.ev{font-size:11.5px;border-radius:5px;padding:3px 6px;background:var(--surface2);border-left:3px solid var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.done{border-left-color:var(--accent)}
.ev.part{border-left-color:var(--amber)}
.ev.miss{border-left-color:var(--red)}
.ev.up{border-left-color:var(--blue)}
.ev .pers{color:var(--accent);margin-left:3px}
.ev.rm{opacity:.45;text-decoration:line-through;border-left-color:var(--dim);background:transparent;border:1px dashed var(--border2);border-left:3px solid var(--dim)}
.mode{margin:0 24px 8px;padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--accent-dim);border:1px solid rgba(200,240,106,.35)}
.mode b{font-weight:600}
.cell{cursor:pointer;color:inherit;font:inherit}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ev[draggable="true"]{cursor:grab}
.ev[draggable="true"]:hover{background:var(--border)}
.ev.dragging{opacity:.4}
.grid.dragging .cell{transition:background .1s}
.cell.drop{border-color:var(--accent);background:var(--accent-dim)}
.cell.drop.nope{border-color:var(--red);background:transparent}
.grid.busy{pointer-events:none;opacity:.6}
.ev.hid{opacity:.55;background:transparent;border:1px dashed var(--border2);border-left-width:3px}
.ev .hidm{color:var(--amber);margin-left:4px}
.pill.hidden{background:rgba(245,166,35,.14);color:var(--amber)}
.ptx{background:transparent;border:0;color:var(--dim);font-size:14px;line-height:1;padding:0 2px;margin-left:2px}
.ptx:hover{color:var(--red)} .ptx.sure{color:var(--red);font-size:11.5px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal .mh h3{font-size:16px;font-weight:500}
.modal .mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.prow:hover{border-color:var(--accent)}
.prow .pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .pn b{font-weight:500}
.prow .pill{margin-left:4px}
.pill.live{background:var(--accent-dim);color:var(--accent)}
.fsec h4{font-size:15px;font-weight:500;margin-bottom:2px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:auto}
.fnote{font-size:12.5px;color:var(--muted);line-height:1.45}
.fact{display:flex;justify-content:flex-end}
.snav button:first-child{grid-column:1/-1}
.snav button:nth-of-type(even):last-of-type{grid-column:1/-1}
.snav-build{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding:8px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px}
.snav-build:hover{background:#d6ff70}
.home{padding:22px 26px 40px;display:flex;flex-direction:column;gap:14px}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.greet{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.hday{font-size:28px;font-weight:300;letter-spacing:-.02em}
.hdate{font-size:13px;color:var(--muted);margin-top:2px}
.hright{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-size:26px;letter-spacing:-.02em}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;text-align:left;display:flex;flex-direction:column;gap:3px}
button.metric:hover{border-color:var(--border2)}
.metric.alert{border-color:rgba(245,166,35,.35)} .metric.alert .mv{color:var(--amber)}
.ml{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.mv{font-size:22px;font-weight:500}
.mof{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.ms{font-size:11.5px;color:var(--muted)}
.ms .good{color:var(--accent)} .amber{color:var(--amber)}
.mbar,.mini{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin:3px 0 1px}
.mbar i,.mini i{display:block;height:100%;background:var(--accent);border-radius:2px}
.mini{width:90px;margin-top:5px}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.hmain,.hside{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.clabel{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.csub{font-size:11px;color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none}
.tpill{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.t-base{background:var(--blue-dim);color:var(--blue)} .t-competitive{background:var(--purple-dim);color:var(--purple)} .t-fndn{background:rgba(61,214,181,.12);color:#3dd6b5}
.itab{width:100%;border-collapse:collapse;font-size:13px}
.ilst{margin:0 -4px}
.irw{display:grid;grid-template-columns:minmax(120px,1.4fr) 44px minmax(120px,1.2fr) 110px 96px 48px 96px;gap:10px;align-items:center;padding:8px 4px;border-top:1px solid var(--border)}
.irw:first-child{border-top:0}
.irw.ihr{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding-block:4px 6px}
.irw.ihr+.irw{border-top:0}
.irw .aname{font-size:13px}
.ipl{display:flex;align-items:center;gap:6px;min-width:0}
.ipl .selw{min-width:0}
.ist{font-size:12.5px;display:flex;flex-direction:column;gap:3px;white-space:nowrap}
.ist .mini{display:block;width:90px;margin:0}
.irw .adate{font-size:12.5px;white-space:nowrap}
.irw .adate.iov{color:var(--accent)}
.irw .adays{min-width:34px;font-size:12px;padding:2px 5px}
.irw .asent{font-size:11.5px;padding:4px 8px}
@media (max-width:1400px){.irw{grid-template-columns:minmax(110px,1.4fr) minmax(110px,1.2fr) 100px 92px 44px 96px} .irw .iwk{display:none}}
.itab td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.itab tr:last-child td{border-bottom:0}
.alink{background:none;border:0;padding:0;color:var(--text);font-weight:500;text-align:left}
.alink:hover{color:var(--accent)}
.feed{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:8px 0;text-align:left}
.feed:last-child{border-bottom:0}
.feed:hover b{color:var(--accent)}
.feed .av{width:28px;height:28px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0}
.feed .av.dim{background:var(--surface2);color:var(--muted)}
.fb{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.fb b{font-weight:500;font-size:13px}
.fb .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{font-size:11px;color:var(--dim);flex-shrink:0;font-family:var(--mono)}
.mxv{font-size:12px;color:var(--muted);flex-shrink:0;display:flex;align-items:baseline;gap:4px}
.mxv b{color:var(--text);font-size:14px}
.mxv .up{color:var(--accent);font-size:11px;font-family:var(--mono)}
.evrow{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)} .evrow:last-child{border-bottom:0}
.evd{width:40px;flex-shrink:0;text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.evd b{display:block;font-size:18px;color:var(--text);font-weight:500;letter-spacing:0}
@media (max-width:1150px){.hgrid{grid-template-columns:minmax(0,1fr)} .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nabox{padding:18px 20px}
.nabox.has{border-color:rgba(200,240,106,.35);background:linear-gradient(180deg,rgba(200,240,106,.05),transparent 120px),var(--surface)}
.nahead h2{font-size:20px;font-weight:400;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.nacount{font-family:var(--mono);font-size:13px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 9px;font-weight:600}
.nahead p{margin-top:3px}
.nalist{margin-top:12px;display:flex;flex-direction:column}
.narow{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap;transition:opacity .3s}
.narow.done{opacity:.35;pointer-events:none}
.narow .nawho{border:0;padding:0;flex:1 1 220px;min-width:200px}
.nactl{display:flex;gap:6px;align-items:center;flex:2 1 420px;justify-content:flex-end}
.nactl select{width:auto;max-width:280px;padding:5px 8px;font-size:12.5px}
.nactl select[data-naplan]{flex:1;min-width:180px}
.naor{font-size:11.5px;color:var(--dim)}
.nactl select.nagrp{flex:0 1 160px;min-width:130px}
.nabuild{border-color:rgba(200,240,106,.35);color:var(--accent)}
.nabuild:hover{background:var(--accent-dim)}
.rqbox.has{border-color:rgba(245,166,35,.45);background:linear-gradient(180deg,rgba(245,166,35,.07),transparent 120px),var(--surface)}
.rqbox .nacount{background:var(--amber);color:#1a1000}
.rqbox.slim{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.rqrow{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--border);flex-wrap:wrap;align-items:flex-start;transition:opacity .3s}
.rqrow.done{opacity:.35;pointer-events:none}
.rqwho{border:0;padding:0;flex:1 1 260px;min-width:220px;align-items:flex-start}
.rqwhat{font-size:13.5px;margin-top:3px} .rqwhy{font-size:12.5px;color:var(--muted);margin-top:4px;white-space:pre-wrap}
.rqctl{display:flex;gap:6px;align-items:center;flex:1 1 340px;justify-content:flex-end;flex-wrap:wrap}
.rqctl input{flex:1 1 180px;min-width:150px;padding:5px 8px;font-size:12.5px}
.rqk{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;margin-left:6px;vertical-align:1px}
.rqk.hold{background:var(--blue-dim);color:var(--blue)} .rqk.cancel{background:var(--red-dim);color:var(--red)}
.rqs{font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:20px;white-space:nowrap}
.rqs.approved{background:var(--accent-dim);color:var(--accent)} .rqs.declined{background:var(--red-dim);color:var(--red)} .rqs.withdrawn{background:var(--surface3);color:var(--muted)}
.rqhist summary{cursor:pointer;font-size:12.5px;color:var(--muted);margin-top:10px}
.rqh{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--border);font-size:12.5px;align-items:center}
.nbadge.amb{background:var(--amber);color:#1a1000}
.fcoach{border-color:rgba(200,240,106,.28);border-left:3px solid var(--accent);background:linear-gradient(180deg,rgba(200,240,106,.06),transparent 120px),var(--surface)}
.fck{color:var(--accent);font-family:var(--mono);letter-spacing:.14em}
.fc-now{margin-bottom:12px}

.ctab{width:100%;border-collapse:collapse;font-size:13px}

.pbar{display:inline-block;width:70px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;vertical-align:middle;margin-right:8px}

.pbar i.g{background:var(--accent)} .pbar i.ok{background:#9ccf55} .pbar i.am{background:var(--amber)} .pbar i.r{background:var(--red)}
.tr{font-size:10px;margin-left:6px} .tr.up{color:var(--accent)} .tr.down{color:var(--red)}
.ctab td.lt{white-space:nowrap;padding-right:18px}
.nbadge{background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:10px!important;font-weight:700;border-radius:20px;padding:0 6px;margin-left:6px;line-height:16px}
.split{display:grid;grid-template-columns:360px minmax(0,1fr);height:100vh;min-height:0}
.sp-l{border-right:1px solid var(--border);display:flex;flex-direction:column;gap:10px;padding:18px 16px;min-height:0}
.sp-head{display:flex;justify-content:space-between;align-items:center}

.fm-item{display:flex;flex-direction:column;gap:4px;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 12px}
.fm-item:hover{border-color:var(--border2)} .fm-item.on{border-color:var(--accent);background:var(--surface2)}

.fm-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ftag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--surface2);color:var(--muted);letter-spacing:.03em}
.fpost{display:flex;flex-direction:column;gap:12px;max-width:760px}

.fp-b,.cm-b{line-height:1.6;font-size:14px} .fp-b p,.cm-b p{margin:0 0 10px} .fp-b h3{font-size:16px;font-weight:600;margin:14px 0 6px} .fp-b ul{margin:0 0 10px 18px}
.yt{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.spacer{flex:1}
.cms{display:flex;flex-direction:column;gap:2px;margin-bottom:12px}
.cm{padding:9px 0;border-bottom:1px solid var(--border)} .cm:last-child{border-bottom:0}
.cm.coach .cm-h b{color:var(--accent)}
.cm-h{display:flex;gap:8px;align-items:baseline;font-size:13px} .cm-h span{color:var(--dim);font-size:11.5px}
.cm-b{font-size:13.5px;margin-top:2px}
.cm-act{display:flex;gap:4px}
.cm-act .lnk{margin-left:0;margin-right:8px}
.cm-kids{margin-left:18px;border-left:2px solid var(--border);padding-left:12px}
.cm-new{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.fed{display:flex;flex-direction:column;gap:8px;max-width:760px}
.row-act{display:flex;gap:8px;align-items:center}
.chat .sp-r{padding:0;gap:0}
.crow{display:flex;gap:10px;align-items:center;text-align:left;background:none;border:1px solid transparent;border-radius:9px;padding:8px 10px;width:100%}
.crow:hover{background:var(--surface)} .crow.on{background:var(--surface2);border-color:var(--border2)}
.crow .fb .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow.unread b{color:var(--accent)}
.ctop{display:flex;justify-content:space-between;gap:8px}
.cav{width:32px;height:32px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex-shrink:0}
.cav.grp{background:none;border-radius:10px;width:36px;height:36px} .cav.grp svg.gicon{width:100%;height:100%;display:block}
.sp-list .clabel{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 10px 4px}
.sp-list .clabel:first-child{margin-top:4px}
.cun{background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;border-radius:20px;padding:1px 7px;font-family:var(--mono)}
.th-head{display:flex;gap:10px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--border)}
.th-head b{font-weight:500;font-size:15px}
.msgs{flex:1;overflow-y:auto;padding:16px 22px;display:flex;flex-direction:column;gap:2px;min-height:0}
.mday{align-self:center;font-size:11px;color:var(--dim);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.06em}
.msg{display:flex;flex-direction:column;align-items:flex-start;max-width:70%;position:relative}
.msg.first{margin-top:8px}
.msg.me{align-self:flex-end;align-items:flex-end}
.mname{font-size:11px;color:var(--muted);margin:0 0 2px 10px}
.bub{background:var(--surface2);border:1px solid var(--border);padding:7px 11px;border-radius:12px;font-size:13.5px;line-height:1.5;word-break:break-word}
.msg.me .bub{background:var(--accent-dim);border-color:rgba(200,240,106,.25)}
.mt{font-size:10px;color:var(--dim);margin-left:8px;font-family:var(--mono)}
.mdel{position:absolute;top:2px;right:-22px;background:none;border:0;color:var(--dim);opacity:0;font-size:13px}
.msg.me .mdel{right:auto;left:-22px}
.msg:hover .mdel{opacity:1} .mdel.sure{opacity:1;color:var(--red);font-size:11px;left:-52px}
.th-comp{display:flex;gap:8px;padding:12px 22px;border-top:1px solid var(--border);align-items:flex-end}
.th-comp textarea{resize:none;min-height:40px;max-height:160px}
.ng-list{display:grid;grid-template-columns:1fr 1fr;gap:4px;max-height:180px;overflow:auto}
.chat .sp-r{display:flex;flex-direction:column;height:100%}
.agl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.gtag{display:inline-flex;align-items:center;gap:2px;font-size:11.5px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:1px 3px 1px 9px}

.gtag button:hover,.gtag button.sure{color:var(--red)} .gtag button.sure{font-size:11px}
.agl select{width:auto;padding:2px 6px;font-size:11.5px;border-radius:20px}
.gdet summary{cursor:pointer;display:flex;flex-direction:column;gap:1px;list-style:none}

.gdet[open] summary b::after{content:' ▾'}
.glist{display:flex;flex-direction:column;gap:2px;margin:8px 0 2px 2px;padding-left:10px;border-left:2px solid var(--border)}
.glink{background:none;border:0;padding:3px 0;text-align:left;color:var(--text);font-size:13px}
.glink:hover{color:var(--accent)}
.ev.picked{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-dim)}
.cell{position:relative}
.cell .wkr{display:flex;align-items:center;gap:6px}

.wkcp:hover{color:var(--text);border-color:var(--border2)}
.wkmenu{position:absolute;top:26px;left:6px;z-index:20;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.4)}

.cell.land{border-color:var(--accent);background:var(--accent-dim)}

.grid.r1 .cell{min-height:calc(100vh - 290px)}
.grid.r2 .cell{min-height:220px}
.grid.r4 .cell{min-height:118px}
.ev.rich{white-space:normal;display:flex;flex-direction:column;gap:2px;padding:5px 7px}

.calhint{font-size:11.5px;color:var(--dim);margin:-2px 24px 8px}

.scard.removed{opacity:.6;border-style:dashed}

/* Drawer */
.drawer{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h3{font-size:17px;font-weight:500}
.dbody{overflow-y:auto;padding:14px 18px 24px;display:grid;gap:14px;align-content:start}
.scard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px}

.snotes{font-size:12.5px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
.lift{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}

.rx .wu{color:var(--dim);font-size:11.5px}
.logged{margin:6px 0 0 24px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px}
.logged span{font-family:var(--mono);background:var(--accent-dim);border-radius:4px;padding:1px 6px}
.logged span.x{background:var(--red-dim);color:var(--red)}
.cnote{font-size:12px;color:var(--muted);margin:4px 0 0 24px}
.pill.cond{background:var(--amber-dim);color:var(--amber)}
.cbody{font-size:12.5px;line-height:1.55;white-space:pre-wrap;margin:6px 0 0 24px;color:var(--text)}
.cscore{margin:6px 0 0 24px;font-size:12px;color:var(--muted)}
.cscore b{font-family:var(--mono);font-weight:500;color:var(--text);background:var(--accent-dim);border-radius:4px;padding:1px 6px}
.eli.cond{border-color:rgba(245,166,35,.35)}
.eli .ctop{display:grid;grid-template-columns:40px minmax(0,1fr) 150px auto;gap:6px;align-items:center}

.sact{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.optset{font-size:11.5px;color:var(--muted);margin-top:-6px}

/* Editor */
.ed{display:grid;gap:10px}
.ed .row{display:grid;gap:6px}
.eli{border:1px solid var(--border);border-radius:9px;padding:10px;display:grid;gap:8px;background:var(--surface)}
.eli .top{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px;align-items:center}
.eli .top input:first-child{text-align:center;font-weight:600}
.eli .meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px}
.pof{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2)}
.pof span{font-size:11px;font-weight:700;color:var(--accent);padding:0 2px 0 8px;white-space:nowrap}
.pof input{border:0;background:transparent}
.lines{display:grid;gap:4px}
.lhd,.lrow{display:grid;grid-template-columns:44px 54px 56px 56px 50px minmax(0,1fr) 22px;gap:4px;align-items:center}
.lhd{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.lrow input{padding:5px 6px;font-size:12px}
.lrow input.c{text-align:center;font-family:var(--mono)}
.lrow .rm{border:0;background:transparent;color:var(--dim);font-size:16px}
.lrow .rm:hover{color:var(--red)}
.scope{border:1px solid var(--border2);border-radius:9px;padding:10px;display:grid;gap:8px;background:var(--surface2)}
.scope label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.scope input{width:auto;margin-top:3px}
.scope .hint{font-size:11.5px;color:var(--muted)}
.err{color:var(--red);font-size:12.5px}

.appsw{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin:14px 12px 0;padding:3px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.appsw a{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:7px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap;min-width:0}
.appsw a:hover{color:var(--text)}
.appsw a.on{background:var(--surface2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border2)}
.appsw .mk{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:700;flex-shrink:0;background:var(--surface3);color:var(--muted)}
.appsw a.on .mk.c{background:var(--accent);color:var(--accent-ink)}
.appsw a.on .mk.a{background:var(--amber);color:#1a1000}
.who{padding:7px 16px 12px;font-size:11px;color:var(--muted)}
.snav{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 12px 12px}
.snav button{border:1px solid var(--border);background:transparent;border-radius:8px;padding:7px 8px;color:var(--muted);font-weight:500;font-size:12.5px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.snav button.on{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.snav button span{font-size:11px;color:var(--dim);font-family:var(--mono)}
.page{padding:20px 24px 40px;display:grid;gap:16px;align-content:start;max-width:1200px}
.page h1{font-size:24px;font-weight:400}
.page .intro{color:var(--muted);font-size:13px;margin-top:4px;max-width:75ch}
.tn-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.tn-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.tn-who{background:none;border:0;padding:0;color:var(--text);font-weight:500;font-size:14px;cursor:pointer}
.tn-who:hover{color:var(--accent)}
.tn-b{white-space:pre-wrap;line-height:1.45;font-size:13.5px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.panel h2{font-size:15px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.past td{opacity:.5}

.pz-cell.ph.deload,.pz-cell.ph.dtm{background:repeating-linear-gradient(135deg,var(--pc) 0 5px,color-mix(in srgb,var(--pc) 72%,#000) 5px 10px)}

.selw::after{content:"▾";position:absolute;right:7px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:9px}
.selw.static::after{content:none}
.selw select,.selw>span{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:inherit;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 20px 4px 9px;border-radius:5px;max-width:100%;width:auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.selw>span{padding-right:9px;cursor:default}
.selw select:disabled{cursor:default}
.selw select option{background:var(--surface2);color:var(--text);text-transform:none}
.adash{color:var(--dim)}
.adate{font-size:13px;display:flex;flex-direction:column;line-height:1.25}
.adate small{font-size:10.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alines{display:flex;flex-direction:column;gap:6px}
.alines>div{min-height:26px;display:flex;align-items:center}
.arw.multi{align-items:start}
.arw.multi .c-check,.arw.multi .c-name,.arw.multi .c-wk{min-height:26px;display:flex;align-items:center}
.adate.soon{font-weight:600}
.adwrap{display:inline-flex;align-items:center;gap:2px;position:relative;max-width:100%}
.adbox{position:relative;display:inline-flex;align-items:center;border:1px solid transparent;border-radius:var(--radius-sm);padding:4px 6px;font-size:13px;cursor:pointer;white-space:nowrap}
.adbox:hover{border-color:var(--border);background:var(--surface2)}
.adbox.soon{font-weight:600}
.adbox.ov{color:var(--accent)}
.adbox.empty{color:var(--muted)}
.adbox.empty:hover span::after{content:' · set date';color:var(--dim)}
.adin{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.arst{border:0;background:none;color:var(--dim);font-size:13px;padding:0 3px}
.arst:hover{color:var(--accent)}
.bkd{display:inline-flex;gap:6px;align-items:center}
.bkd input{width:auto}
button.selw.apl{border:0;padding:0;cursor:pointer}
button.selw.apl span{cursor:pointer}
button.selw.apl:hover{filter:brightness(1.15)}
.adays{display:inline-block;min-width:40px;text-align:center;padding:3px 6px;border-radius:5px;font:500 13px var(--mono)}
.d-over{background:var(--red-dim);color:var(--red)} .d-week{background:var(--amber-dim);color:var(--amber)} .d-next{background:var(--accent-dim);color:var(--accent)} .d-later,.d-none{background:var(--surface2);color:var(--muted)}
.asent{border:1px solid var(--border);background:var(--surface2);border-radius:var(--radius-sm);padding:5px 9px;font-size:12px;white-space:nowrap;color:var(--text);display:inline-block}
.asent:hover{border-color:var(--accent);color:var(--accent)}
.aempty{padding:36px 20px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--border2);border-radius:var(--radius);font-size:13px}
.aempty b{display:block;color:var(--text);font-weight:500;font-size:15px;margin-bottom:4px}
.t-individual{background:#3f5f9e;color:#fff} .t-base3{background:#4fbf7f;color:#08250f} .t-base4{background:#2c7a4f;color:#fff}
.t-nationals{background:#e8bb2f;color:#2c2100} .t-class{background:#3b4d57;color:#d7e7ee} .t-sc{background:#b24a60;color:#fff} .t-onboarding{background:#7c5ac9;color:#fff} .t-other{background:var(--surface2);color:var(--muted)}
.s-general{background:#2d66cf;color:#fff} .s-squat{background:#e3b52c;color:#2c2100} .s-upper{background:#e0803f;color:#261103} .s-pulling{background:#2f9a94;color:#fff}
.s-custom{background:#55b88e;color:#0a2519} .s-other{background:var(--surface2);color:var(--muted)}
.abulk{position:fixed;left:calc(50% + 134px);transform:translateX(-50%);bottom:16px;z-index:15;background:var(--surface2);border:1px solid var(--border2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.5);padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;width:min(900px,calc(100% - 300px))}
.abulk b{font-size:13px;font-weight:600;color:var(--accent)}
.abulk select{width:auto}
.abulk .spacer{flex:1}
.inv{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-bottom:1px solid var(--border)}
.inv b{font-weight:500}
.inv-r{display:flex;gap:6px}
.inv-r input{font-size:12px;font-family:var(--mono)}
/* full periodisation page */
.pzp{max-width:1400px}
.pzp .pz-ctl .btn{padding:6px 11px}
.pzp .pz{padding:16px 18px}
.pz-h{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin:4px 0 8px;display:flex;gap:10px;align-items:baseline}
.pz-h span{color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none;font-size:11px}
.pz-fold{background:none;border:0;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;display:inline-flex;align-items:center;gap:5px;cursor:pointer}
.pz-fold:hover{color:var(--text)}
.pz-caret{font-size:10px;width:10px}
.pz-h .pz-foldl{margin-left:auto;font-size:11px;letter-spacing:0;text-transform:none}
.pz-mini{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.pz-chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:5px 11px 5px 9px;font-size:12px;color:var(--text)}
.pz-chip:hover{border-color:var(--border2)}
.pz-chip i{width:8px;height:8px;border-radius:50%;background:var(--tc);flex-shrink:0}
.pz-chip b{font-weight:500}
.pz-chip span{color:var(--muted);font-family:var(--mono);font-size:11px}
.pz-chip.warn{border-color:rgba(245,166,35,.45)} .pz-chip.warn span{color:var(--amber)}
.pzp{--plate:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;--gold:#f7c948}
.pz-cd{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:linear-gradient(100deg,rgba(247,201,72,.13),rgba(247,201,72,.02) 60%),var(--surface);border:1px solid rgba(247,201,72,.25);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.pz-trophy{width:36px;height:36px;color:var(--gold);flex-shrink:0}
.pz-cdnum{font-family:var(--plate);font-size:52px;line-height:.85;font-weight:700;color:var(--gold)}
.pz-cdu{font-family:var(--plate);font-size:18px;font-weight:600;color:var(--gold);text-transform:uppercase;letter-spacing:.06em;margin-left:5px}
.pz-cdb{flex:1;min-width:200px}
.pz-cdt{font-size:15px;font-weight:500}
.pz-cds{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.pz-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:20px}
.pz-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px 12px 17px;overflow:hidden;display:flex;flex-direction:column;gap:7px;min-height:160px;text-align:left;color:var(--text)}
.pz-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--tc)}
.pz-card:hover{border-color:var(--border2)}
.pz-card.warn{border-color:rgba(245,166,35,.4)}
.pz-cname{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.pz-cname>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pz-big{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap}
.pz-wk{font-family:var(--plate);font-weight:700;font-size:42px;line-height:.9;color:var(--tc);white-space:nowrap}
.pz-of{font-size:12px;color:var(--muted)}
.pz-tag{font-family:var(--plate);font-weight:700;font-size:28px;line-height:1;letter-spacing:.03em;color:var(--text)}
.pz-tag.off{color:var(--dim);font-size:24px}
.pz-phase{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--pc);color:var(--pt)}
.pz-segs{display:flex;gap:2px;height:6px}
.pz-segs span{flex:1;border-radius:2px;background:rgba(255,255,255,.08)}
.pz-segs span.ph{background:var(--pc);opacity:.25}
.pz-segs span.ph.done{opacity:.6}
.pz-segs span.ph.cur{opacity:1;box-shadow:0 0 0 1px var(--text)}
.pz-segs span.ph.unw{background:transparent;box-shadow:inset 0 0 0 1px var(--pc);opacity:.7}
.pz-next{font-size:11.5px;color:var(--muted);line-height:1.5}
.pz-next b{color:var(--text);font-weight:500}
.pz-next.amber,.pz-next.amber b{color:var(--amber)}
.pz-foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:auto;padding-top:7px;border-top:1px solid var(--border)}
.pz-foot b{color:var(--text);font-weight:600}
.pz-tl.z-s{--pzw:28px} .pz-tl.z-s .pz-cell{font-size:12px;height:32px} .pz-tl.z-s .pz-date{font-size:9px}
.pz-tl.z-l{--pzw:60px} .pz-tl.z-l .pz-cell{font-size:19px;height:46px}
button.pz-cell{border:0;width:calc(100% - 2px);cursor:pointer;padding:0}
.pz-cell.w-draft{opacity:.78;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45);background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px)}
.pz-cell.ph.w-no{background:transparent;box-shadow:inset 0 0 0 1.5px var(--pc);color:var(--pc)}
.pz-cell.ph.w-no.past{opacity:.35}
.pz-dot{position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--text);box-shadow:0 0 0 1.5px rgba(0,0,0,.4)}
.pz-lg.unw{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.pz-lg.drf{background:repeating-linear-gradient(135deg,var(--muted) 0 3px,var(--dim) 3px 5px)}
.pz-lg.note{width:8px;height:8px;border-radius:50%;background:var(--text);vertical-align:0}
.pz-tbs{overflow:auto;max-height:70vh;border:1px solid var(--border);border-radius:8px}
.pz-tb{border-collapse:separate;border-spacing:0;font-size:12px;width:100%}
.pz-tb th{position:sticky;top:0;background:var(--surface2);z-index:2;text-align:left;font-size:10.5px;font-weight:600;color:var(--muted);padding:8px;white-space:nowrap;border-bottom:1px solid var(--border)}
.pz-tb th i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tc);margin-right:6px}
.pz-tb td{padding:3px 4px;border-bottom:1px solid var(--border);vertical-align:middle;min-width:130px}
.pz-tb td.pz-tw{position:sticky;left:0;background:var(--surface);z-index:1;font-family:var(--mono);font-size:11.5px;color:var(--muted);min-width:96px;white-space:nowrap;padding-left:10px}
.pz-tb td.pz-tw span{margin-left:6px;background:var(--accent);color:#000;font:700 9px 'DM Sans',sans-serif;letter-spacing:.08em;padding:1px 5px;border-radius:4px}
.pz-tb tr.now td{background:rgba(200,240,106,.06)} .pz-tb tr.now td.pz-tw{color:var(--accent)}
.pz-tb tr.past td{opacity:.5}
.pz-te{min-width:150px!important;font-size:11.5px;color:var(--muted)}
.pz-te span{display:block} .pz-te span.cmp{color:var(--gold);font-weight:600}
.pz-tc{width:100%;border:0;border-radius:6px;padding:5px 8px;text-align:left;background:var(--pc);color:var(--pt);display:flex;flex-direction:column;position:relative;cursor:pointer}
.pz-tc b{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-tc span{font-size:10.5px;opacity:.85}
.pz-tc.w-no{background:transparent;box-shadow:inset 0 0 0 1.5px var(--pc);color:var(--text)}
.pz-tc.w-draft{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(0,0,0,.18) 6px 8px)}
.pzsheet{width:min(600px,100%)}
.pzw{display:flex;flex-direction:column;gap:10px}
.pzw-d{font-size:12.5px;color:var(--muted)}
.pzw-b{background:var(--pc);color:var(--pt);border-radius:9px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.pzw-b b{font-size:15px;font-weight:600}
.pzw-b span{font-size:12.5px;opacity:.9}
.pzw-s{font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center}
.pzw-s::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--dim)}
.pzw-s.w-pub::before{background:var(--accent)} .pzw-s.w-draft::before{background:var(--amber)} .pzw-s.w-no::before{background:var(--red)}
.pzw-s:empty{display:none}
.pzw-l{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.pzw-l li{display:flex;gap:8px;align-items:center;background:var(--surface2);border-radius:6px;padding:6px 9px}
.pzw-l li span:first-child{flex:1;color:var(--muted)}
.pzw-l li b{font-weight:500;font-family:var(--mono);font-size:12px}
.pzw-ph{display:flex;flex-wrap:wrap;gap:5px}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:4px 10px 4px 5px;font-size:12px;color:var(--text)}
.pchip i{width:14px;height:14px;border-radius:50%;background:var(--pc);flex-shrink:0}
.pchip[data-phase=""]{padding-left:10px}
.pchip.on{background:var(--pc,var(--surface3));color:var(--pt,var(--text));border-color:var(--pc,var(--border2));font-weight:600}
.pzw-a{display:flex;flex-wrap:wrap;gap:2px 14px;max-height:160px;overflow:auto}
@media (max-width:1100px){.arw{grid-template-columns:24px minmax(0,1.6fr) 44px 140px 130px 110px 50px 112px}}
@media (max-width:760px){
  .ap{padding:12px 16px 40px}
  .ahd h1{font-size:24px}
  .amet{grid-template-columns:repeat(2,minmax(0,1fr))}
  .arw.ahr{display:none}
  .arw{display:flex;flex-wrap:wrap;gap:6px 8px;padding:10px 12px}
  .c-check{order:0} .c-name{flex:1 1 40%;min-width:0;order:1} .c-wk{order:2} .c-days{order:3}
  .c-type{order:4;margin-left:30px} .c-focus{order:5} .c-date{order:6;margin-left:auto} .c-sent{order:7;flex-basis:100%;margin-left:30px}
  .abulk{left:50%;width:calc(100% - 24px);bottom:calc(76px + env(safe-area-inset-bottom))}
  .arw.multi{display:grid;grid-template-columns:24px minmax(0,1fr) auto auto;gap:6px 10px;align-items:center}
  .arw.multi .c-check{grid-column:1;grid-row:1} .arw.multi .c-name{grid-column:2 / 4;grid-row:1} .arw.multi .c-wk{grid-column:4;grid-row:1}
  .arw.multi .c-type{grid-column:2;grid-row:2;margin-left:0} .arw.multi .c-date{grid-column:3;grid-row:2;margin-left:0} .arw.multi .c-days{grid-column:4;grid-row:2}
  .arw.multi .c-focus,.arw.multi .c-sent{display:none}
  .abulk .spacer{display:none}
  .pz-cd{padding:12px 14px}
  .pz-cdnum{font-size:40px}
  .pz-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pz-wk{font-size:34px}
  .pzp .pz-tl{grid-template-columns:120px repeat(var(--pzn),var(--pzw))!important}
}
/* Forms page: replies, form builder, send window (frm- prefix) */
.frm-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.frm-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border)}
.frm-tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;font-size:13px;font-weight:500;margin-bottom:-1px}
.frm-tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
.frm-tabs .nbadge{margin-left:6px}
.frm-sec{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:6px 0 -6px}
.frm-list{display:grid;gap:8px}
.frm-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:13px 16px;color:var(--text)}
button.frm-item:hover{border-color:var(--border2)}
.frm-item .t{font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.frm-item .m{font-size:12px;color:var(--muted);grid-column:1}
.frm-item .r{grid-column:2;grid-row:1 / span 2;display:flex;align-items:center;gap:10px}
.frm-prog{width:120px;display:grid;gap:4px;text-align:right;font-size:12px;color:var(--muted)}
.frm-prog b{color:var(--text);font-weight:500;font-family:var(--mono)}
.frm-bar{height:5px;border-radius:3px;background:var(--surface3);overflow:hidden}
.frm-bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.pill.f-active{background:var(--accent-dim);color:var(--accent)} .pill.f-sched{background:var(--blue-dim);color:var(--blue)}
.pill.f-paused{background:var(--amber-dim);color:var(--amber)} .pill.f-sent,.pill.f-ended,.pill.f-pub{background:var(--surface3);color:var(--muted)}
.frm-acts{display:flex;gap:6px;flex-wrap:wrap}
.frm-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.frm-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;border-left:3px solid var(--dim)}
.frm-tile .l{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px}
.frm-tile .v{display:block;font-size:19px;font-weight:500}
.frm-tile.g{border-left-color:var(--accent)} .frm-tile.a{border-left-color:var(--amber)} .frm-tile.b{border-left-color:var(--blue)}
.frm-cols{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:16px;align-items:start}
.frm-qs{display:grid;gap:12px}
.frm-qh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;margin-bottom:10px}
.frm-qh b{font-size:14px;font-weight:500}
.frm-qh span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.frm-hb{display:grid;grid-template-columns:minmax(80px,max-content) minmax(0,1fr) 34px;gap:6px 10px;align-items:center;font-size:12.5px}
.frm-hb .bar{height:8px;border-radius:4px;background:var(--surface3);overflow:hidden}
.frm-hb .bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.frm-hb .n{font-family:var(--mono);color:var(--muted);text-align:right}
.frm-avg{display:flex;gap:18px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.frm-avg b{display:block;font-size:20px;color:var(--text);font-weight:500;font-family:var(--mono)}
.frm-txt{display:grid;gap:6px;max-height:340px;overflow:auto}
.frm-txt div{background:var(--surface2);border-radius:8px;padding:8px 10px;font-size:13px;white-space:pre-wrap;line-height:1.45}
.frm-who{background:none;border:0;padding:0;color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;display:block;margin-bottom:2px}
.frm-who:hover{color:var(--accent)}
.frm-wait{display:grid;gap:4px}
.frm-wrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.frm-wrow:last-child{border-bottom:0}
.frm-wrow .nm{flex:1;min-width:0;background:none;border:0;padding:0;color:var(--text);text-align:left;font-size:13px}
.frm-wrow .nm small{display:block;color:var(--dim);font-size:11px}
.frm-ath{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));align-items:start}
.frm-ath dl{display:grid;gap:8px;margin-top:8px}
.frm-ath dt{font-size:11.5px;color:var(--muted)}
.frm-ath dd{font-size:13px;white-space:pre-wrap}
.frm-ath dd.none{color:var(--dim)}
.frm-ed{display:grid;gap:12px;max-width:820px}
.frm-ed .fld{display:grid;gap:5px}

<script>

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const KORDER = {technical:0, strength:1, accessory:2, other:3};
const KEY_LIFTS = ['Snatch','Clean & Jerk','Clean','Jerk','Back Squat','Front Squat'];
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numOrNull = v => (v === '' || v == null || isNaN(+v)) ? null : +v;

const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7));

const S = {
  user:null, me:null, athletes:[], groups:[], members:[], weekDone:{}, filter:'all', q:'',

/* ---------- Boot and sign in ---------- */
sb.auth.onAuthStateChange((_e, session) => {
  const u = session && session.user;
  if(u && (!S.user || S.user.id !== u.id)){ S.user = u; start(); }
  if(!u){ S.user = null; renderLogin(); }
});
function renderLogin(msg){
  $('root').innerHTML = `<div class="center"><form class="login" id="lf">
    <div class="brand" style="padding:0"><span class="mark">R</span><div>Rev Coach<small>Coach dashboard</small></div></div>
    <h1>Sign in</h1>
    <input id="le" type="email" placeholder="Email" autocomplete="username" required>
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <button class="btn pri" type="submit" style="justify-content:center">Sign in</button>
    <a class="small" href="./">Open the athlete app instead</a>
  </form></div>`;
  $('lf').onsubmit = async e => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email:$('le').value.trim(), password:$('lp').value });
    if(error) renderLogin(error.message);
  };
}
async function start(){
  const { data:p } = await sb.from('profiles').select('id,full_name,email,role').eq('id', S.user.id).single();
  S.me = p;
  if(!p || p.role !== 'coach'){
    $('root').innerHTML = `<div class="center"><div class="login"><h1>Coaches only</h1><p class="muted">This dashboard is for coaches. Your training is in the athlete app.</p><a class="btn pri" href="./" style="justify-content:center">Open the app</a><button class="btn ghost" id="so">Sign out</button></div></div>`;
    $('so').onclick = () => sb.auth.signOut();
    return;
  }
  const mon = mondayOf(new Date());
  const [pr, gr, gm, ex, wl] = await Promise.all([
    sb.from('profiles').select('id,full_name,email,role,active,created_at,avatar_path').order('full_name'),
    sb.from('groups').select('id,name,sort').order('sort'),
    sb.from('group_members').select('group_id,profile_id'),
    sb.from('exercises').select('id,name,default_percent_of,youtube_url,category').order('name'),
    sb.from('workout_logs').select('athlete_id,completed_at').not('completed_at','is',null).gte('completed_at', ymd(mon))
  ]);
  S.athletes = (pr.data || []).filter(a => a.active !== false).map(a => ({...a, name: a.full_name || a.email || 'Athlete'}));
  S.groups = gr.data || []; S.members = gm.data || [];
  S.exList = ex.data || []; S.ex = Object.fromEntries(S.exList.map(e => [e.id, e]));
  $('exlist') && ($('exlist').innerHTML = S.exList.map(e => `<option value="${esc(e.name)}"></option>`).join(''));
  S.weekDone = {};
  (wl.data || []).forEach(l => { const d = ymd(new Date(l.completed_at)); (S.weekDone[l.athlete_id] ||= new Set()).add(d); });
  S.month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  S.wk = mondayOf(new Date());

  const first = S.athletes.find(a => a.id === saved) || S.athletes.find(a => a.role !== 'coach') || S.athletes[0];
  if(first) S.aid = first.id;
  try { const t = localStorage.getItem('rc-atab'); if(t === 'list' || t === 'period') S.ath.tab = t; const v = JSON.parse(localStorage.getItem('rc-pzv') || 'null'); if(v && v.show) Object.assign(S.pzv, v); } catch(e){}
  S.view = 'home';
  renderShell();

}

const VAPID_PUBLIC = 'BNZPCKwEgHDRLxXL25rSqz6nlitht0F5dEx-IRsFEIV7Bs3bJe2nnEehLVIFh5QmkfJQ5Bh3o9941y7GHfO2iRQ';

const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const b64ToBytes = b => { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
let swReg = null;
async function registerSW(){ if(!('serviceWorker' in navigator)) return; try { swReg = await navigator.serviceWorker.register('sw.js'); } catch(e){ console.warn('sw', e); } }
async function currentSub(){ if(!pushSupported()) return null; const reg = swReg || await navigator.serviceWorker.getRegistration(); return reg ? reg.pushManager.getSubscription() : null; }
async function pushState(){
  if(!pushSupported()) return isIOS() && !isStandalone() ? 'needs-install' : 'unsupported';
  if(Notification.permission === 'denied') return 'blocked';
  const sub = await currentSub();
  return sub && Notification.permission === 'granted' ? 'on' : 'off';
}
async function coachPushOn(){ try { if(await pushState() !== 'on') return false; const sub = await currentSub(); if(!sub) return false;
  const { data } = await sb.from('push_subscriptions').select('app').eq('endpoint', sub.endpoint).maybeSingle(); return !!(data && data.app === 'coach'); } catch(e){ return false; } }
async function saveCoachSub(sub, prefs){
  const j = sub.toJSON();
  const row = {profile_id:S.user.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0, 200), app:'coach'};
  if(prefs) row.prefs = prefs;
  const { error } = await sb.from('push_subscriptions').upsert(row, {onConflict:'endpoint'});
  if(error) throw error;
}
async function enableCoachPush(){
  if(!pushSupported()){ toast(isIOS() && !isStandalone() ? 'Add Rev Coach to your Home Screen first, then open it from there.' : 'This browser can\'t do notifications.'); return false; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ toast('Notifications are blocked. Turn them on in your phone\'s settings for Rev Coach.'); return false; }
  const reg = swReg || await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
  try { await saveCoachSub(sub); return true; } catch(e){ toast('Couldn\'t save: ' + e.message); return false; }
}
// keep this device's subscription fresh, but only if it was turned on from the coach app (a desktop browser
// that has the athlete app's notifications on keeps them as they are)
async function refreshCoachPush(){ try { if(await pushState() !== 'on') return; const sub = await currentSub(); if(!sub) return;
  const { data } = await sb.from('push_subscriptions').select('app').eq('endpoint', sub.endpoint).maybeSingle();
  if(data && data.app === 'coach') await saveCoachSub(sub); } catch(e){} }
async function openNotifications(){
  const ov = sheet('Notifications', '<div class="nset" id="nSet"><div class="empty"><span class="spin"></span></div></div>');
  const draw = async () => {
    let st = await pushState(), sub = st === 'on' ? await currentSub() : null;
    let prefs = {};
    if(sub){ const { data } = await sb.from('push_subscriptions').select('prefs,app').eq('endpoint', sub.endpoint).maybeSingle();
      if(!data || data.app !== 'coach'){ st = 'off'; sub = null; } else prefs = data.prefs || {}; }
    const msg = {
      'on':['🔔', 'On for this phone', 'Pick what you want a ping for.'],
      'off':['🔕', 'Off on this phone', 'Turn them on to get a ping for messages, new athletes and forum comments.'],
      'needs-install':['📲', 'Install Rev Coach first', 'On iPhone, tap Share then Add to Home Screen, open Rev Coach from your home screen, then come back here.'],
      'blocked':['⛔', 'Blocked', 'Notifications are turned off for this app in your phone\'s settings. Turn them on there, then come back.'],
      'unsupported':['⚠️', 'Not available here', 'This browser can\'t do notifications. Open Rev Coach from your home screen.']}[st];
    const el = ov.querySelector('#nSet'); if(!el) return;
    el.innerHTML = `<div class="nstat"><span>${msg[0]}</span><div><b>${msg[1]}</b>${msg[2]}</div></div>
      ${NOTE_KINDS.map(([k, l, h]) => `<label class="tgl"><span>${l}<small>${h}</small></span><input type="checkbox" data-nk="${k}" ${prefs[k] !== false ? 'checked' : ''} ${st === 'on' ? '' : 'disabled'}></label>`).join('')}
      <div class="row-act" style="margin-top:6px">${st === 'off' ? '<button class="btn pri" id="nOn">Turn on notifications</button>' : ''}
        ${st === 'on' ? '<button class="btn" id="nTest">Send a test</button><button class="btn ghost danger" id="nOff">Turn off on this phone</button>' : ''}</div>
      <p class="fnote">Each phone or computer is set up on its own. The athlete app keeps its own notifications.</p>`;
    el.querySelectorAll('[data-nk]').forEach(cb => cb.onchange = async () => {
      const s2 = await currentSub(); if(!s2) return;
      prefs[cb.dataset.nk] = cb.checked;
      try { await saveCoachSub(s2, prefs); } catch(e){ toast(e.message); cb.checked = !cb.checked; }
    });
    if(el.querySelector('#nOn')) el.querySelector('#nOn').onclick = async () => { if(await enableCoachPush()){ toast('Notifications on'); draw(); } };
    if(el.querySelector('#nOff')) el.querySelector('#nOff').onclick = async () => {
      const s2 = await currentSub();
      if(s2){ await sb.from('push_subscriptions').delete().eq('endpoint', s2.endpoint); await s2.unsubscribe().catch(() => {}); }
      toast('Notifications off on this phone'); draw();
    };
    if(el.querySelector('#nTest')) el.querySelector('#nTest').onclick = async () => {
      const { data, error } = await sb.rpc('coach_test_push');
      toast(error ? error.message : 'Sent. It should arrive in a few seconds.');
    };
  };
  draw();
}

// swipe left / right on the calendar to change week or month (phone only)
function bindSwipe(el, step){
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if(x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, {passive:true});
}

/* ---------- Data for one athlete ---------- */
async function loadAthlete(id){
  const gids = S.members.filter(m => m.profile_id === id).map(m => m.group_id);
  let q = sb.from('program_assignments').select('program_id,group_id,athlete_id,created_at');
  q = gids.length ? q.or(`athlete_id.eq.${id},group_id.in.(${gids.join(',')})`) : q.eq('athlete_id', id);
  const { data:asg, error:e1 } = await q;
  if(e1) throw e1;
  const pids = [...new Set((asg || []).map(a => a.program_id))];
  const A = {id, gids, asg: asg || [], programs:[], plans:{}, sessions:[], removed:[], weeks:{}, logs:{}, maxes:{}, allAsg:[], hidden:new Set()};
  const [mx, lg, hd, pf] = await Promise.all([
    sb.from('athlete_maxes').select('exercise_id,weight_kg,recorded_on,created_at,kind').eq('athlete_id', id).order('recorded_on', {ascending:false}).order('created_at', {ascending:false}),
    sb.from('workout_logs').select('id,session_id,started_at,completed_at,set_logs(session_exercise_id,set_number,weight_kg,reps,made,notes)').eq('athlete_id', id),
    sb.from('session_hidden').select('session_id').eq('athlete_id', id),
    sb.from('profiles').select('working_max_pct').eq('id', id).maybeSingle()
  ]);
  if(!hd.error) (hd.data || []).forEach(h => A.hidden.add(h.session_id));
  // A.maxes = working maxes (what the athlete's percentages use): one set by hand, else all-time minus their % reduction. A.maxAll = all-time.
  const wPct = +((pf && pf.data && pf.data.working_max_pct) || 0), wHand = {}; A.maxAll = {}; A.wPct = wPct;
  (mx.data || []).forEach(m => { const k = m.kind === 'working' ? wHand : A.maxAll; if(k[m.exercise_id] == null) k[m.exercise_id] = +m.weight_kg; });
  new Set([...Object.keys(A.maxAll), ...Object.keys(wHand)]).forEach(e => { A.maxes[e] = wHand[e] != null ? wHand[e] : Math.round(A.maxAll[e] * (1 - wPct / 100) * 2) / 2; });
  (lg.data || []).forEach(l => { A.logs[l.session_id] = l; });
  if(!pids.length) return A;
  const [pg, ss, aa] = await Promise.all([
    sb.from('programs').select('id,name,kind,track,phase,status,start_date,plan_id,week_offset,is_option,days_version,is_select').in('id', pids).neq('status','archived'),
    sb.from('sessions').select('id,program_id,week_number,day_number,title,notes,code,scheduled_date,override_athlete_id,override_kind,session_exercises(*,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,rpe,load_text,warmup,notes))').in('program_id', pids),
    sb.from('program_assignments').select('program_id,group_id,athlete_id').in('program_id', pids)
  ]);
  if(pg.error) throw pg.error; if(ss.error) throw ss.error;
  A.programs = pg.data || []; A.allAsg = aa.data || [];
  const planIds = [...new Set(A.programs.map(p => p.plan_id).filter(Boolean))];
  if(planIds.length){
    const { data:pl } = await sb.from('program_plans').select('id,name,plan_type,start_date,versions,roster,blocks').in('id', planIds);
    (pl || []).forEach(p => A.plans[p.id] = p);
  }
  const progById = Object.fromEntries(A.programs.map(p => [p.id, p]));
  // how many weeks each program runs, from its shared sessions
  A.weeks = {};
  (ss.data || []).forEach(s => { if(!s.override_athlete_id) A.weeks[s.program_id] = Math.max(A.weeks[s.program_id] || 0, s.week_number); });
  let sess = (ss.data || []).filter(s => progById[s.program_id] && (!s.override_athlete_id || s.override_athlete_id === id));
  // the athlete's own version (or removal) of a programmed session hides the shared one; added sessions sit alongside
  const kind = s => s.override_athlete_id ? (s.override_kind || 'replace') : 'shared';
  const mine = new Set(sess.filter(s => kind(s) === 'replace' || kind(s) === 'removed').map(s => s.program_id + '|' + s.week_number + '|' + s.day_number));
  sess = sess.filter(s => s.override_athlete_id || !mine.has(s.program_id + '|' + s.week_number + '|' + s.day_number));
  sess.forEach(s => { s.kind = kind(s); });
  sess.forEach(s => {
    s.session_exercises.sort((a,b) => a.sort - b.sort);
    s.session_exercises.forEach(se => se.prescriptions.sort((a,b) => a.sort - b.sort));
    s.p = progById[s.program_id];
    s.date = sessionDate(s, A);
  });
  A.removed = sess.filter(s => s.date && s.kind === 'removed');
  A.sessions = sess.filter(s => s.date && s.kind !== 'removed');
  return A;
}
function sessionDate(s, A){
  if(s.scheduled_date) return s.scheduled_date;
  const p = s.p; let base = null;
  if(p.start_date) base = parseD(p.start_date);
  else {
    // no start date (e.g. an Individual program): week 1 is the week it was assigned; later blocks follow on
    const a = A.asg.filter(x => x.program_id === p.id).map(x => x.created_at).sort()[0];
    if(a) base = addDays(mondayOf(new Date(a)), (p.week_offset || 0) * 7);
  }
  if(!base) return null;
  return ymd(addDays(base, (s.week_number - 1) * 7 + (s.day_number - 1)));
}
const isShared = p => {
  const plan = p.plan_id && S.A.plans[p.plan_id];
  if(plan && plan.plan_type !== 'INDIVIDUAL') return true;
  const rows = S.A.allAsg.filter(a => a.program_id === p.id);
  return rows.some(a => a.group_id) || new Set(rows.map(a => a.athlete_id)).size > 1;
};
const athleteName = id => (S.athletes.find(a => a.id === id) || {}).name || 'Athlete';
// Profile photos (public 'avatars' bucket). Falls back to initials.
const avUrl = id => { const p = (S.athletes.find(a => a.id === id) || {}).avatar_path || (S.avExtra || {})[id]; return !p ? '' : /^https?:\/\//.test(p) ? p : sb.storage.from('avatars').getPublicUrl(p).data.publicUrl; };
const avIn = (id, name) => { const u = id && avUrl(id); return u ? `<img class="avimg" src="${u}" alt="" loading="lazy" data-i="${esc(initials(name))}" onerror="this.replaceWith(document.createTextNode(this.dataset.i))">` : esc(initials(name)); };
const planLabel = p => (p.plan_id && S.A.plans[p.plan_id] ? S.A.plans[p.plan_id].name : String(p.name).split(' · ')[0]);
const trackLabel = p => p.track || (p.kind === 'other' ? 'Program' : p.kind[0].toUpperCase() + p.kind.slice(1));

/* Group a day's sessions the way the athlete sees them: one card per plan and day option */
function dayGroups(date){
  const items = S.A.sessions.filter(s => s.date === date);
  const by = new Map();
  items.forEach(s => { const k = (s.p.plan_id || s.p.id) + '|' + (s.p.days_version || ''); if(!by.has(k)) by.set(k, []); by.get(k).push(s); });
  return [...by.values()].map(list => {
    list.sort((a,b) => (a.p.is_option ? 1 : 0) - (b.p.is_option ? 1 : 0) || (KORDER[a.p.kind] - KORDER[b.p.kind]) || (a.p.track || '').localeCompare(b.p.track || ''));
    const opts = list.filter(s => s.p.is_option);
    return {list, opts, p:list[0].p};
  });
}
function groupState(g, date){
  const done = s => !!(S.A.logs[s.id] && S.A.logs[s.id].completed_at);
  const choice = g.opts.length > 1;                       // FNDN style: do one of the options
  const required = g.list.filter(s => !(choice && s.p.is_option));
  if(required.every(done) && (!choice || g.opts.some(done))) return 'done';
  if(g.list.some(s => S.A.logs[s.id])) return 'part';
  return date < ymd(new Date()) ? 'miss' : 'up';
}

async function selectAthlete(id){
  S.athList = false;
  if(S.view && S.view !== 'athletes'){ S.view = 'athletes'; renderNav(); $('sbox').hidden = false; $('alist').hidden = false; }
  S.aid = id; S.sel = null; S.edit = null; S.moving = null; S.pick = new Set(); if(S.mclip && S.mclip.mode === 'move') S.mclip = null;   // a copied session stays on the clipboard so it can be pasted for another athlete
  try { localStorage.setItem('rc-aid', id); } catch(e){}
  renderList(); closeDrawer();
  $('main').innerHTML = '<div class="empty"><span class="spin"></span> Loading</div>';
  try { S.A = await loadAthlete(id); }
  catch(e){ $('main').innerHTML = `<div class="empty">Could not load this athlete: ${esc(e.message || e)}</div>`; return; }
  // jump to the month the athlete's program is running in, if it isn't this month
  const dates = S.A.sessions.map(s => s.date).sort();
  const today = ymd(new Date());
  if(dates.length && !dates.some(d => d.slice(0,7) === today.slice(0,7))){
    const next = dates.find(d => d >= today) || dates[dates.length-1];
    S.month = new Date(+next.slice(0,4), +next.slice(5,7) - 1, 1);
    S.wk = mondayOf(parseD(next));
  }
  renderMain();
}

function renderMain(){
  const a = S.athletes.find(x => x.id === S.aid); const A = S.A;
  // programs they're on, grouped by plan
  const byPlan = new Map();
  A.programs.forEach(p => { const k = p.plan_id || p.id; if(!byPlan.has(k)) byPlan.set(k, []); byPlan.get(k).push(p); });
  const ptags = [...byPlan.values()].map(ps => {
    const p = ps[0], plan = p.plan_id && A.plans[p.plan_id];
    const tracks = [...new Set(ps.map(trackLabel))].join(' + ');
    const days = [...new Set(ps.map(x => x.days_version).filter(Boolean))];
    const live = ps.some(x => x.status === 'published');

function setRange(r){
  if(r === S.range) return;
  const today = new Date(), wasMonth = S.range === 'm';
  if(r === 'm'){
    // open today's month if today is on screen, otherwise the month the middle of the window falls in
    const n = (+S.range) * 7, end = addDays(S.wk, n - 1);
    const pick = today >= S.wk && today <= addDays(end, 1) ? today : addDays(S.wk, Math.floor(n / 2));
    S.month = new Date(pick.getFullYear(), pick.getMonth(), 1);
  } else if(wasMonth){
    // start at this week if it's in the month on screen, otherwise the month's first week (or the selected day's)
    const inMonth = today.getMonth() === S.month.getMonth() && today.getFullYear() === S.month.getFullYear();
    S.wk = S.sel && parseD(S.sel).getMonth() === S.month.getMonth() ? mondayOf(parseD(S.sel)) : inMonth ? mondayOf(today) : mondayOf(S.month);
  }
  S.range = r; try { localStorage.setItem('rc-range', r); } catch(e){}
  renderMain();
}

}

/* Conditioning pieces: a row on the "Conditioning" exercise with guide.cond = {title, score}; the workout is in its notes.

const condNote = n => String(n ?? '').replace(/^(Rx|Scaled)\s*(·\s*)?/i, '').trim();

const COND_UNIT = {reps:'reps', cals:'cal', dist:'m', load:'kg'};

function condScoreText(score, v){

function warmupLines(it){
  // build-up lines saved on the session are kept as written until the first working set changes
  if(Array.isArray(it.wuLines) && it.wuLines.length) return it.wuLines;
  const first = it.sets[0]; if(!first) return [];
  const reps = String(first.reps || '1').trim(); const simple = /^\d+$/.test(reps); const r = simple ? +reps : 0;
  const out = [{sets:1, reps: simple ? String(Math.min(Math.max(r, 3), 5)) : reps, percent:null, percent_max:null, load_text:'Bar', warmup:true}];
  const P = numOrNull(first.percent);
  if(P == null){ out.push({sets:1, reps: simple ? String(Math.max(1, Math.min(r, 3))) : reps, percent:null, percent_max:null, load_text:'Build up in comfortable jumps', warmup:true}); return out; }
  const steps = [50,60,70,75,80,85,90].filter(x => x <= P - 5);
  const pick = steps.length > 4 ? [steps[0], ...steps.slice(-3)] : steps;
  pick.forEach(x => out.push({sets:1, reps: simple ? String(x < 70 ? Math.min(r, 5) : Math.min(r, 3)) : reps, percent:x, percent_max:null, load_text:'', warmup:true}));
  return out;
}

// Which of the athlete's programs runs on a given date (and its week/day there), preferring the session's own program
function progBase(p){
  if(p.start_date) return parseD(p.start_date);
  const a = S.A.asg.filter(x => x.program_id === p.id).map(x => x.created_at).sort()[0];
  return a ? addDays(mondayOf(new Date(a)), (p.week_offset || 0) * 7) : null;
}
function hostFor(ds, pref){
  const d = parseD(ds);
  const c = S.A.programs.filter(p => p.status !== 'archived').map(p => {
    const b = progBase(p); if(!b) return null;
    const diff = Math.round((d - b) / 864e5), week = Math.floor(diff / 7) + 1;
    if(diff < 0 || week > (S.A.weeks[p.id] || 1)) return null;
    return {p, week, day:(d.getDay() + 6) % 7 + 1};
  }).filter(Boolean);
  const rank = x => !pref ? 3 : x.p.id === pref.id ? 0
    : (x.p.plan_id && x.p.plan_id === pref.plan_id && x.p.track === pref.track && x.p.days_version === pref.days_version) ? 1
    : (x.p.plan_id && x.p.plan_id === pref.plan_id) ? 2 : 3;
  return c.sort((a,b) => rank(a) - rank(b))[0] || null;
}

/* ---------- Drag and drop on the calendar ----------
   Dragging a chip moves every session in that card (e.g. Technical + Strength) that the athlete
   hasn't logged. Holding Alt on drop copies instead. Uses the same coach_session_action RPC as
   the drawer's Move and Paste, so it's still athlete-only. */
function bindDrag(){
  const grid = document.querySelector('#main .grid'); if(!grid) return;
  const clear = () => grid.querySelectorAll('.cell.drop').forEach(x => x.classList.remove('drop', 'nope'));
  grid.querySelectorAll('.ev[data-dg]').forEach(ev => {
    ev.addEventListener('dragstart', e => {
      const from = ev.closest('.cell').dataset.d;
      S.drag = {from, gi:+ev.dataset.dg};
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setData('text/plain', from + '|' + ev.dataset.dg);
      ev.classList.add('dragging'); grid.classList.add('dragging');
    });
    ev.addEventListener('dragend', () => { ev.classList.remove('dragging'); grid.classList.remove('dragging'); clear(); S.drag = null; });
  });
  grid.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('dragover', e => {
      if(!S.drag) return;
      e.preventDefault();
      const ok = c.dataset.d !== S.drag.from && !!hostFor(c.dataset.d);
      e.dataTransfer.dropEffect = !ok ? 'none' : e.altKey ? 'copy' : 'move';
      if(!c.classList.contains('drop')){ clear(); c.classList.add('drop'); }
      c.classList.toggle('nope', !ok);
    });
    c.addEventListener('dragleave', e => { if(!c.contains(e.relatedTarget)) c.classList.remove('drop', 'nope'); });
    c.addEventListener('drop', e => {
      e.preventDefault(); clear();
      const d = S.drag; S.drag = null;
      if(d) dropGroup(d.from, d.gi, c.dataset.d, e.altKey);
    });
  });
}
async function dropGroup(from, gi, to, copy){

// Block names are free text in the builder, so the colour comes from what the name says (Accumulation,
// Volume, Strength, Intensity, Deload, Taper, Test/Comp). Anything else ("Block 1") gets its own colour.
const PZ_PH = [
  ['deload',   /deload|unload|recover|active rest/i, 'Deload',       '#34c96a', '#03220f'],
  ['dtm',      /taper|\bdtm\b|days to meet/i,        'Taper',        '#34c96a', '#03220f'],
  ['comp',     /\bcomp|meet|test(ing)? week|champs?/i,'Comp / test', '#d4a72c', '#1e1600'],
  ['intensity',/intens|peak|heavy|\d\s*rm\b|max(es)?\b|realis/i, 'Intensity', '#ff5252', '#ffffff'],
  ['strength', /strength|strong|transmut/i,          'Strength',     '#4d9fff', '#051a36'],
  ['volume',   /volume|hypertroph|work capacity/i,   'Volume',       '#ffd84d', '#221c00'],
  ['accumulation',/accum|gpp|general|prep|intro|foundation|technique/i,'Accumulation','#ff8a3d','#241100'],
];
const PZ_PAL = [['#b08fff','#1a0f33'],['#3dd6b5','#03211b'],['#ff8ac9','#2a0a1c'],['#c8f06a','#141a05'],['#9db4c8','#0e1720']];
const pzPhase = (name, i) => {
  const hit = PZ_PH.find(p => p[1].test(name || ''));
  if(hit) return {k:hit[0], n:hit[2], c:hit[3], t:hit[4]};
  const [c, t] = PZ_PAL[i % PZ_PAL.length];
  return {k:'b' + (i % PZ_PAL.length), n:name || 'Block ' + (i + 1), c, t};
};
const pzSty = ph => `--pc:${ph.c};--pt:${ph.t}`;
const PZ_TYPE_COL = {BASE:'#5ab4ff', COMPETITIVE:'#b08fff', FNDN:'#3dd6b5', INDIVIDUAL:'#c8f06a'};
const PZ_TROPHY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>';
const isComp = e => /\bcomp|meet|champs?|open\b|nationals|states/i.test(e.title || '');
