<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0e0f">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Rev Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Coach dashboard: athlete list | month calendar | day drawer. Same palette as the member app. */
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21; --surface3:#26262a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#55554f;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12); --accent-ink:#141a05;
  --red:#ff5a5a; --red-dim:rgba(255,90,90,0.14);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --purple:#b08fff; --purple-dim:rgba(176,143,255,0.13);
  --radius:10px; --radius-sm:6px;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{color-scheme:dark;height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;height:100%;font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:54px}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--border2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);border-color:var(--border)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.num{font-family:var(--mono)}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.technical{background:var(--blue-dim);color:var(--blue)}
.pill.strength{background:var(--purple-dim);color:var(--purple)}
.pill.other,.pill.accessory{background:var(--surface3);color:var(--muted)}
.pill.draft{background:var(--amber-dim);color:var(--amber)}
.pill.personal{background:var(--accent-dim);color:var(--accent)}

/* Layout */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
.app.drawer-open{grid-template-columns:268px minmax(0,1fr) 480px}
@media (max-width:1180px){.app.drawer-open{grid-template-columns:268px minmax(0,1fr)} .drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);z-index:20;box-shadow:-20px 0 40px rgba(0,0,0,.5)}}
@media (max-width:760px){.app,.app.drawer-open{grid-template-columns:minmax(0,1fr)} .side{display:none} .app.list .side{display:flex} .app.list .main{display:none}}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:600;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:13px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.side .search{padding:0 12px 10px;display:grid;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:transparent;border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.alist{overflow-y:auto;flex:1;padding:4px 8px 12px}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px}
.arow:hover{background:var(--surface2)}
.arow.on{background:var(--surface2);border-color:var(--border2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.arow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk{display:flex;gap:2px}
.wk i{width:6px;height:16px;border-radius:2px;background:var(--surface3)}
.wk i.on{background:var(--accent)}
.side .foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto}
.ahead{padding:18px 24px 12px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.ahead h1{font-size:24px;font-weight:400;letter-spacing:-.01em}
.ahead .progs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptag{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:4px 9px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.ptag b{font-weight:500}
.maxes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.mx{font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 9px}
.mx span{color:var(--muted);margin-right:6px}
.calbar{display:flex;align-items:center;gap:10px;padding:14px 24px 8px;flex-wrap:wrap}
.calbar h2{font-size:17px;font-weight:500;min-width:150px}
.legend{display:flex;gap:12px;margin-left:auto;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.cal{padding:0 24px 24px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.dow span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{min-height:104px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.cell.out{opacity:.38}
.cell.today{border-color:var(--accent)}
.cell.sel{box-shadow:inset 0 0 0 1px var(--text);border-color:var(--text)}
.cell:hover{border-color:var(--border2)}
.cell .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cell .dn b{font-weight:500;color:var(--text)}
.cell .wkl{font-size:10px;color:var(--dim);font-family:var(--mono)}
.ev{font-size:11.5px;border-radius:5px;padding:3px 6px;background:var(--surface2);border-left:3px solid var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.done{border-left-color:var(--accent)}
.ev.part{border-left-color:var(--amber)}
.ev.miss{border-left-color:var(--red)}
.ev.up{border-left-color:var(--blue)}
.ev .pers{color:var(--accent);margin-left:3px}
.ev.rm{opacity:.45;text-decoration:line-through;border-left-color:var(--dim);background:transparent;border:1px dashed var(--border2);border-left:3px solid var(--dim)}
.mode{margin:0 24px 8px;padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--accent-dim);border:1px solid rgba(200,240,106,.35)}
.mode b{font-weight:600}
.cell{cursor:pointer;color:inherit;font:inherit}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ev[draggable="true"]{cursor:grab}
.ev[draggable="true"]:hover{background:var(--border)}
.ev.dragging{opacity:.4}
.grid.dragging .cell{transition:background .1s}
.cell.drop{border-color:var(--accent);background:var(--accent-dim)}
.cell.drop.nope{border-color:var(--red);background:transparent}
.grid.busy{pointer-events:none;opacity:.6}
.ev.hid{opacity:.55;background:transparent;border:1px dashed var(--border2);border-left-width:3px}
.ev .hidm{color:var(--amber);margin-left:4px}
.pill.hidden{background:rgba(245,166,35,.14);color:var(--amber)}
.ev.picked{outline:2px solid var(--accent);outline-offset:-1px;background:var(--accent-dim)}
.cell{position:relative}
.cell .wkr{display:flex;align-items:center;gap:6px}
.wkcp{font-size:10.5px;color:var(--dim);border:1px solid transparent;border-radius:5px;padding:0 5px;opacity:0;transition:opacity .1s}
.cell:hover .wkcp,.wkcp:focus-visible{opacity:1}
.wkcp:hover{color:var(--text);border-color:var(--border2)}
.wkmenu{position:absolute;top:26px;left:6px;z-index:20;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:4px;display:flex;flex-direction:column;min-width:170px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.wkmenu button{background:transparent;border:0;color:var(--text);font:inherit;font-size:12.5px;text-align:left;padding:7px 10px;border-radius:5px;cursor:pointer}
.wkmenu button:hover{background:var(--border)}
.cell.land{border-color:var(--accent);background:var(--accent-dim)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{background:transparent;border:0;color:var(--muted);font:inherit;font-size:12px;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface2);color:var(--text)}
.grid.r1 .cell{min-height:calc(100vh - 290px)}
.grid.r2 .cell{min-height:220px}
.grid.r4 .cell{min-height:118px}
.ev.rich{white-space:normal;display:flex;flex-direction:column;gap:2px;padding:5px 7px}
.ev .evt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.ev .evl{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .evl b{font-family:var(--mono);font-weight:500;color:var(--dim);margin-right:5px}
.grid.r1 .ev .evl{white-space:normal}
.ev .evrx{display:block;color:var(--dim);font-family:var(--mono);font-size:10.5px;padding-left:16px}
.calhint{font-size:11.5px;color:var(--dim);margin:-2px 24px 8px}
.grid.picking .cell{cursor:copy}
.grid.picking .cell:hover{border-color:var(--accent);background:var(--accent-dim)}
.scard.removed{opacity:.6;border-style:dashed}
.pastebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-dim);border:1px solid rgba(200,240,106,.35);border-radius:10px;padding:10px 12px;font-size:13px}

/* Drawer */
.drawer{border-left:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.dhead{padding:16px 18px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dhead h3{font-size:17px;font-weight:500}
.dbody{overflow-y:auto;padding:14px 18px 24px;display:grid;gap:14px;align-content:start}
.scard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.scard .sh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.scard .sh h4{font-size:15px;font-weight:500;margin-right:auto}
.scard .sub{font-size:12px;color:var(--muted);margin-top:4px}
.state{font-size:12px;margin-top:8px;display:flex;gap:6px;align-items:center}
.state i{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.state.done i{background:var(--accent)} .state.part i{background:var(--amber)} .state.miss i{background:var(--red)} .state.up i{background:var(--blue)}
.snotes{font-size:12.5px;color:var(--muted);margin-top:8px;white-space:pre-wrap}
.lift{border-top:1px solid var(--border);margin-top:12px;padding-top:10px}
.lift .lh{display:flex;gap:8px;align-items:baseline}
.slot{font-size:11px;font-weight:600;color:var(--muted);min-width:16px}
.lift .ln{font-weight:500}
.rx{font-size:12.5px;line-height:1.6;margin-top:4px;padding-left:24px}
.rx .r{display:flex;gap:8px;flex-wrap:wrap}
.rx .sr{font-family:var(--mono);color:var(--muted);min-width:52px}
.rx .kg{color:var(--accent)}
.rx .wu{color:var(--dim);font-size:11.5px}
.logged{margin:6px 0 0 24px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px}
.logged span{font-family:var(--mono);background:var(--accent-dim);border-radius:4px;padding:1px 6px}
.logged span.x{background:var(--red-dim);color:var(--red)}
.cnote{font-size:12px;color:var(--muted);margin:4px 0 0 24px}
.sact{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.optset{font-size:11.5px;color:var(--muted);margin-top:-6px}

/* Editor */
.ed{display:grid;gap:10px}
.ed .row{display:grid;gap:6px}
.eli{border:1px solid var(--border);border-radius:9px;padding:10px;display:grid;gap:8px;background:var(--surface)}
.eli .top{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:6px;align-items:center}
.eli .top input:first-child{text-align:center;font-weight:600}
.eli .meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:6px}
.pof{display:flex;align-items:center;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2)}
.pof span{font-size:11px;font-weight:700;color:var(--accent);padding:0 2px 0 8px;white-space:nowrap}
.pof input{border:0;background:transparent}
.lines{display:grid;gap:4px}
.lhd,.lrow{display:grid;grid-template-columns:44px 54px 56px 56px 50px minmax(0,1fr) 22px;gap:4px;align-items:center}
.lhd{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.lrow input{padding:5px 6px;font-size:12px}
.lrow input.c{text-align:center;font-family:var(--mono)}
.lrow .rm{border:0;background:transparent;color:var(--dim);font-size:16px}
.lrow .rm:hover{color:var(--red)}
.scope{border:1px solid var(--border2);border-radius:9px;padding:10px;display:grid;gap:8px;background:var(--surface2)}
.scope label{display:flex;gap:8px;align-items:flex-start;font-size:13px;cursor:pointer}
.scope input{width:auto;margin-top:3px}
.scope .hint{font-size:11.5px;color:var(--muted)}
.err{color:var(--red);font-size:12.5px}

.snav{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:0 12px 12px}
.snav button{border:1px solid var(--border);background:transparent;border-radius:8px;padding:7px 8px;color:var(--muted);font-weight:500;font-size:12.5px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.snav button.on{background:var(--surface2);border-color:var(--border2);color:var(--text)}
.snav button span{font-size:11px;color:var(--dim);font-family:var(--mono)}
.page{padding:20px 24px 40px;display:grid;gap:16px;align-content:start;max-width:1200px}
.page h1{font-size:24px;font-weight:400}
.page .intro{color:var(--muted);font-size:13px;margin-top:4px;max-width:75ch}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px}
.panel h2{font-size:15px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.past td{opacity:.5}
.tscroll{overflow-x:auto}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:2px 4px 2px 9px;margin:2px 4px 2px 0}
.tag button{border:0;background:transparent;color:var(--dim);font-size:14px;line-height:1;padding:0 4px}
.tag button:hover{color:var(--red)}
.addrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.addrow select,.addrow input{width:auto;min-width:150px;flex:1}
.prow{padding:12px 0;border-bottom:1px solid var(--border);display:grid;gap:6px}
.prow:last-child{border-bottom:0}
.prow .t{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.prow .t b{font-weight:500;margin-right:auto}
.pill.published{background:var(--accent-dim);color:var(--accent)}
.pill.archived{background:var(--surface3);color:var(--dim)}
.plan{border:1px solid var(--border);border-radius:12px;padding:4px 16px;background:var(--surface)}
.plan .ph{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--border)}
.plan .ph h3{font-size:15px;font-weight:500;margin-right:auto}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.3fr 1fr auto;gap:6px;align-items:center}
@media (max-width:1100px){.form{grid-template-columns:1fr 1fr}}
.center{display:grid;place-items:center;height:100%;padding:24px}
.login{width:min(360px,100%);display:grid;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px}
.login h1{font-size:22px;font-weight:400}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:50;max-width:calc(100% - 32px)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" class="toast" hidden></div>
<datalist id="exlist"></datalist>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://kaehtivwphtwoiaeszui.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dO4G2c-8mo3Zh3aol276ZQ_em98zjeC'; // publishable key, safe in the browser
const BUILDER_URL = 'https://claude.ai/artifact/96SuRM9pcC9ZAQuFTdAiqA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const KORDER = {technical:0, strength:1, accessory:2, other:3};
const KEY_LIFTS = ['Snatch','Clean & Jerk','Clean','Jerk','Back Squat','Front Squat'];
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const numOrNull = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
const clone = o => JSON.parse(JSON.stringify(o));
const ymd = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parseD = s => new Date(s + 'T00:00:00');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(new Date(d.getFullYear(), d.getMonth(), d.getDate()), -((d.getDay() + 6) % 7));
const initials = n => String(n || '?').split(/\s+/).filter(Boolean).slice(0,2).map(x => x[0].toUpperCase()).join('');
const fmtDate = s => new Date(s).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});

const S = {
  user:null, me:null, athletes:[], groups:[], members:[], weekDone:{}, filter:'all', q:'',
  ex:{}, exList:[], aid:null, A:null, month:null, wk:null, range:'m', sel:null, pick:new Set(), mclip:null, edit:null, saving:false, loading:false

/* ---------- Boot and sign in ---------- */

async function start(){
  const { data:p } = await sb.from('profiles').select('id,full_name,email,role').eq('id', S.user.id).single();
  S.me = p;
  if(!p || p.role !== 'coach'){
    $('root').innerHTML = `<div class="center"><div class="login"><h1>Coaches only</h1><p class="muted">This dashboard is for coaches. Your training is in the member app.</p><a class="btn pri" href="./" style="justify-content:center">Open the app</a><button class="btn ghost" id="so">Sign out</button></div></div>`;
    $('so').onclick = () => sb.auth.signOut();
    return;
  }
  const mon = mondayOf(new Date());
  const [pr, gr, gm, ex, wl] = await Promise.all([
    sb.from('profiles').select('id,full_name,email,role,active').order('full_name'),
    sb.from('groups').select('id,name,sort').order('sort'),
    sb.from('group_members').select('group_id,profile_id'),
    sb.from('exercises').select('id,name,default_percent_of,youtube_url').order('name'),
    sb.from('workout_logs').select('athlete_id,completed_at').not('completed_at','is',null).gte('completed_at', ymd(mon))
  ]);
  S.athletes = (pr.data || []).filter(a => a.active !== false).map(a => ({...a, name: a.full_name || a.email || 'Athlete'}));
  S.groups = gr.data || []; S.members = gm.data || [];
  S.exList = ex.data || []; S.ex = Object.fromEntries(S.exList.map(e => [e.id, e]));
  $('exlist') && ($('exlist').innerHTML = S.exList.map(e => `<option value="${esc(e.name)}"></option>`).join(''));
  S.weekDone = {};
  (wl.data || []).forEach(l => { const d = ymd(new Date(l.completed_at)); (S.weekDone[l.athlete_id] ||= new Set()).add(d); });
  S.month = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
  S.wk = mondayOf(new Date());
  try { const r = localStorage.getItem('rc-range'); if(['1','2','4','m'].includes(r)) S.range = r; } catch(e){}
  const saved = (() => { try { return localStorage.getItem('rc-aid'); } catch(e){ return null; } })();
  const first = S.athletes.find(a => a.id === saved) || S.athletes.find(a => a.role !== 'coach') || S.athletes[0];
  renderShell();
  if(first) selectAthlete(first.id);
}

/* ---------- Data for one athlete ---------- */
async function loadAthlete(id){
  const gids = S.members.filter(m => m.profile_id === id).map(m => m.group_id);
  let q = sb.from('program_assignments').select('program_id,group_id,athlete_id,created_at');
  q = gids.length ? q.or(`athlete_id.eq.${id},group_id.in.(${gids.join(',')})`) : q.eq('athlete_id', id);
  const { data:asg, error:e1 } = await q;
  if(e1) throw e1;
  const pids = [...new Set((asg || []).map(a => a.program_id))];
  const A = {id, gids, asg: asg || [], programs:[], plans:{}, sessions:[], removed:[], weeks:{}, logs:{}, maxes:{}, allAsg:[], hidden:new Set()};
  const [mx, lg, hd] = await Promise.all([
    sb.from('athlete_maxes').select('exercise_id,weight_kg,recorded_on,created_at').eq('athlete_id', id).order('recorded_on', {ascending:false}).order('created_at', {ascending:false}),
    sb.from('workout_logs').select('id,session_id,started_at,completed_at,set_logs(session_exercise_id,set_number,weight_kg,reps,made)').eq('athlete_id', id),
    sb.from('session_hidden').select('session_id').eq('athlete_id', id)
  ]);
  if(!hd.error) (hd.data || []).forEach(h => A.hidden.add(h.session_id));
  (mx.data || []).forEach(m => { if(!A.maxes[m.exercise_id]) A.maxes[m.exercise_id] = +m.weight_kg; });
  (lg.data || []).forEach(l => { A.logs[l.session_id] = l; });
  if(!pids.length) return A;
  const [pg, ss, aa] = await Promise.all([
    sb.from('programs').select('id,name,kind,track,phase,status,start_date,plan_id,week_offset,is_option,days_version,is_select').in('id', pids).neq('status','archived'),
    sb.from('sessions').select('id,program_id,week_number,day_number,title,notes,code,scheduled_date,override_athlete_id,override_kind,session_exercises(id,label,sort,notes,percent_of,exercise_id,hold_load,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,rpe,load_text,warmup,notes))').in('program_id', pids),
    sb.from('program_assignments').select('program_id,group_id,athlete_id').in('program_id', pids)
  ]);
  if(pg.error) throw pg.error; if(ss.error) throw ss.error;
  A.programs = pg.data || []; A.allAsg = aa.data || [];
  const planIds = [...new Set(A.programs.map(p => p.plan_id).filter(Boolean))];
  if(planIds.length){
    const { data:pl } = await sb.from('program_plans').select('id,name,plan_type,start_date,versions,roster').in('id', planIds);
    (pl || []).forEach(p => A.plans[p.id] = p);
  }
  const progById = Object.fromEntries(A.programs.map(p => [p.id, p]));
  // how many weeks each program runs, from its shared sessions
  A.weeks = {};
  (ss.data || []).forEach(s => { if(!s.override_athlete_id) A.weeks[s.program_id] = Math.max(A.weeks[s.program_id] || 0, s.week_number); });
  let sess = (ss.data || []).filter(s => progById[s.program_id] && (!s.override_athlete_id || s.override_athlete_id === id));
  // the athlete's own version (or removal) of a programmed session hides the shared one; added sessions sit alongside
  const kind = s => s.override_athlete_id ? (s.override_kind || 'replace') : 'shared';
  const mine = new Set(sess.filter(s => kind(s) === 'replace' || kind(s) === 'removed').map(s => s.program_id + '|' + s.week_number + '|' + s.day_number));
  sess = sess.filter(s => s.override_athlete_id || !mine.has(s.program_id + '|' + s.week_number + '|' + s.day_number));
  sess.forEach(s => { s.kind = kind(s); });
  sess.forEach(s => {
    s.session_exercises.sort((a,b) => a.sort - b.sort);
    s.session_exercises.forEach(se => se.prescriptions.sort((a,b) => a.sort - b.sort));
    s.p = progById[s.program_id];
    s.date = sessionDate(s, A);
  });
  A.removed = sess.filter(s => s.date && s.kind === 'removed');
  A.sessions = sess.filter(s => s.date && s.kind !== 'removed');
  return A;
}
function sessionDate(s, A){
  if(s.scheduled_date) return s.scheduled_date;
  const p = s.p; let base = null;
  if(p.start_date) base = parseD(p.start_date);
  else {
    // no start date (e.g. an Individual program): week 1 is the week it was assigned; later blocks follow on
    const a = A.asg.filter(x => x.program_id === p.id).map(x => x.created_at).sort()[0];
    if(a) base = addDays(mondayOf(new Date(a)), (p.week_offset || 0) * 7);
  }
  if(!base) return null;
  return ymd(addDays(base, (s.week_number - 1) * 7 + (s.day_number - 1)));
}
const isShared = p => {
  const plan = p.plan_id && S.A.plans[p.plan_id];
  if(plan && plan.plan_type !== 'INDIVIDUAL') return true;
  const rows = S.A.allAsg.filter(a => a.program_id === p.id);
  return rows.some(a => a.group_id) || new Set(rows.map(a => a.athlete_id)).size > 1;
};
const athleteName = id => (S.athletes.find(a => a.id === id) || {}).name || 'Athlete';
const planLabel = p => (p.plan_id && S.A.plans[p.plan_id] ? S.A.plans[p.plan_id].name : String(p.name).split(' · ')[0]);
const trackLabel = p => p.track || (p.kind === 'other' ? 'Program' : p.kind[0].toUpperCase() + p.kind.slice(1));

/* Group a day's sessions the way the athlete sees them: one card per plan and day option */
function dayGroups(date){
  const items = S.A.sessions.filter(s => s.date === date);
  const by = new Map();
  items.forEach(s => { const k = (s.p.plan_id || s.p.id) + '|' + (s.p.days_version || ''); if(!by.has(k)) by.set(k, []); by.get(k).push(s); });
  return [...by.values()].map(list => {
    list.sort((a,b) => (a.p.is_option ? 1 : 0) - (b.p.is_option ? 1 : 0) || (KORDER[a.p.kind] - KORDER[b.p.kind]) || (a.p.track || '').localeCompare(b.p.track || ''));
    const opts = list.filter(s => s.p.is_option);
    return {list, opts, p:list[0].p};
  });
}
function groupState(g, date){
  const done = s => !!(S.A.logs[s.id] && S.A.logs[s.id].completed_at);
  const choice = g.opts.length > 1;                       // FNDN style: do one of the options
  const required = g.list.filter(s => !(choice && s.p.is_option));
  if(required.every(done) && (!choice || g.opts.some(done))) return 'done';
  if(g.list.some(s => S.A.logs[s.id])) return 'part';
  return date < ymd(new Date()) ? 'miss' : 'up';
}
const STATE_TXT = {done:'Completed', part:'Started, not finished', miss:'Not done', up:'Coming up'};

const VIEWS = [['athletes','Athletes'],['programs','Programs'],['members','Members & groups'],['events','Events']];
function renderNav(){

}
function renderList(){
  const groupsUsed = S.groups.filter(g => S.members.some(m => m.group_id === g.id));

      <span class="wk" title="${n} day${n === 1 ? '' : 's'} trained this week">${[0,1,2,3,4].map(i => `<i class="${i < n ? 'on' : ''}"></i>`).join('')}</span></button>`;
  }).join('') || '<div class="empty">No athletes match.</div>';

}
async function selectAthlete(id){
  if(S.view && S.view !== 'athletes'){ S.view = 'athletes'; renderNav(); $('sbox').hidden = false; $('alist').hidden = false; }
  S.aid = id; S.sel = null; S.edit = null; S.moving = null; S.pick = new Set(); if(S.mclip && S.mclip.mode === 'move') S.mclip = null;   // a copied session stays on the clipboard so it can be pasted for another athlete
  try { localStorage.setItem('rc-aid', id); } catch(e){}
  renderList(); closeDrawer();
  $('main').innerHTML = '<div class="empty"><span class="spin"></span> Loading</div>';
  try { S.A = await loadAthlete(id); }
  catch(e){ $('main').innerHTML = `<div class="empty">Could not load this athlete: ${esc(e.message || e)}</div>`; return; }
  // jump to the month the athlete's program is running in, if it isn't this month
  const dates = S.A.sessions.map(s => s.date).sort();
  const today = ymd(new Date());
  if(dates.length && !dates.some(d => d.slice(0,7) === today.slice(0,7))){
    const next = dates.find(d => d >= today) || dates[dates.length-1];
    S.month = new Date(+next.slice(0,4), +next.slice(5,7) - 1, 1);
    S.wk = mondayOf(parseD(next));
  }
  renderMain();
}
async function reloadAthlete(){
  const keep = S.sel;
  try { S.A = await loadAthlete(S.aid); } catch(e){ toast('Could not reload: ' + (e.message || e)); return; }
  renderMain(); if(keep) openDay(keep);
}

function renderMain(){
  const a = S.athletes.find(x => x.id === S.aid); const A = S.A;
  // programs they're on, grouped by plan
  const byPlan = new Map();
  A.programs.forEach(p => { const k = p.plan_id || p.id; if(!byPlan.has(k)) byPlan.set(k, []); byPlan.get(k).push(p); });
  const ptags = [...byPlan.values()].map(ps => {
    const p = ps[0], plan = p.plan_id && A.plans[p.plan_id];
    const tracks = [...new Set(ps.map(trackLabel))].join(' + ');
    const days = [...new Set(ps.map(x => x.days_version).filter(Boolean))];
    const live = ps.some(x => x.status === 'published');
    return `<span class="ptag"><b>${esc(planLabel(p))}</b>${days.length ? `<span class="muted">${days.join('/')} day</span>` : ''}<span class="muted">${esc(tracks)}</span>${live ? '' : '<span class="pill draft">Draft</span>'}</span>`;
  }).join('') || '<span class="muted small">Not on any program yet. Add them from the program builder.</span>';
  const mx = KEY_LIFTS.map(n => S.exList.find(e => e.name === n)).filter(e => e && A.maxes[e.id]).map(e => `<span class="mx"><span>${esc(e.name)}</span><b class="num">${A.maxes[e.id]}</b></span>`).join('');
  const m = S.month, R = S.range, isMonth = R === 'm', today = ymd(new Date());
  const first = isMonth ? mondayOf(m) : S.wk, nDays = isMonth ? 42 : (+R) * 7;
  const rich = R === '1' ? 'full' : R === '2' ? 'lifts' : '';
  let cells = '';
  for(let i = 0; i < nDays; i++){
    const d = addDays(first, i), ds = ymd(d);
    if(isMonth && i >= 35 && d.getMonth() !== m.getMonth()) break;
    const gs = dayGroups(ds);
    const evs = gs.map((g, gi) => {
      const st = groupState(g, ds);
      const canDrag = !inMode() && g.list.some(s => !S.A.logs[s.id]);
      const picked = S.pick.has(ds + '|' + gi);
      const shown = g.opts.length > 1 ? g.list.filter(s => !s.p.is_option) : g.list;
      const code = g.list.map(s => s.code).find(Boolean);
      const label = code || (shown[0] ? (shown[0].title || DAYS[shown[0].day_number-1]) : 'Session');
      const opt = g.opts.length > 1 ? ' · ' + g.opts.map(s => trackLabel(s.p)).join('/') : '';
      const pers = g.list.some(s => s.override_athlete_id);
      const nHid = g.list.filter(isHid).length, hid = nHid && nHid === g.list.length;
      const detail = rich ? chipDetail(shown, rich) : '';
      return `<div class="ev ${st}${rich ? ' rich' : ''}${picked ? ' picked' : ''}${hid ? ' hid' : ''}" data-gi="${gi}" ${canDrag ? `draggable="true" data-dg="${gi}"` : ''} title="${esc(planLabel(g.p))}: ${esc(STATE_TXT[st])}${nHid ? (hid ? '. Unpublished for this athlete' : '. Partly unpublished') : ''}${canDrag ? '. Drag to move, hold Alt to copy' : ''}. Shift-click to select"><span class="evt">${esc(label)}${esc(opt)}${pers ? '<span class="pers">✎</span>' : ''}${nHid ? '<span class="hidm">⊘</span>' : ''}</span>${detail}</div>`;
    }).join('') + S.A.removed.filter(x => x.date === ds).map(x => `<div class="ev rm" title="Removed for this athlete">${esc(x.code || x.title || 'Session')}</div>`).join('');
    const wkLabel = d.getDay() === 1 ? weekLabel(ds) : '';
    cells += `<div role="button" tabindex="0" class="cell ${isMonth && d.getMonth() !== m.getMonth() ? 'out' : ''} ${ds === today ? 'today' : ''} ${ds === S.sel ? 'sel' : ''}" data-d="${ds}">
      <span class="dn"><b>${!isMonth && (i === 0 || d.getDate() === 1) ? d.getDate() + ' ' + MONTHS[d.getMonth()].slice(0,3) : d.getDate()}</b><span class="wkr">${d.getDay() === 1 && !inMode() ? `<span class="wkcp" role="button" tabindex="0" data-wk="${ds}" title="Copy or move this whole week">⧉ Week</span>` : ''}<span class="wkl">${esc(wkLabel)}</span></span></span>${evs}</div>`;
  }
  $('main').innerHTML = `<div class="ahead">
      <div><div class="lbl">Athlete</div><h1>${esc(a ? a.name : '')}</h1><div class="progs">${ptags}</div></div>
      <div class="maxes">${mx || '<span class="muted small">No maxes recorded</span>'}</div>
    </div>
    <div class="calbar">
      <button class="btn sm" id="mPrev" aria-label="Previous">‹</button>
      <h2>${isMonth ? MONTHS[m.getMonth()] + ' ' + m.getFullYear() : rangeTitle(first, nDays)}</h2>
      <button class="btn sm" id="mNext" aria-label="Next">›</button>
      <button class="btn ghost sm" id="mToday">Today</button>
      <div class="seg" role="group" aria-label="Calendar view">${[['1','1 week'],['2','2 weeks'],['4','4 weeks'],['m','Month']].map(([k,t]) => `<button class="${R === k ? 'on' : ''}" data-range="${k}" aria-pressed="${R === k}">${t}</button>`).join('')}</div>
      <div class="legend"><span><i style="background:var(--accent)"></i>Done</span><span><i style="background:var(--amber)"></i>Started</span><span><i style="background:var(--red)"></i>Missed</span><span><i style="background:var(--blue)"></i>Coming up</span><span><span style="color:var(--accent)">✎</span> Personal</span><span><span style="color:var(--amber)">⊘</span> Unpublished</span></div>
    </div>
    ${modeBanner()}
    ${!inMode() && !S.pick.size ? '<div class="calhint">Drag a session to move it (hold Alt / Option to copy). Shift-click sessions to select several, or use ⧉ Week on a Monday to copy or move a whole week.</div>' : ''}
    <div class="cal"><div class="dow">${DAYS.map(d => `<span>${d}</span>`).join('')}</div><div class="grid r${R} ${inMode() ? 'picking' : ''}">${cells}</div></div>`;
  const step = dir => {
    if(isMonth) S.month = new Date(m.getFullYear(), m.getMonth() + dir, 1);
    else S.wk = addDays(S.wk, dir * nDays);
    renderMain();
  };
  $('mPrev').onclick = () => step(-1);
  $('mNext').onclick = () => step(1);
  $('mToday').onclick = () => { S.month = new Date(new Date().getFullYear(), new Date().getMonth(), 1); S.wk = mondayOf(new Date()); renderMain(); };
  $('main').querySelectorAll('[data-range]').forEach(b => b.onclick = () => setRange(b.dataset.range));
  $('main').querySelectorAll('[data-d]').forEach(c => {
    c.onclick = () => {
      if(S.mclip) return doMulti(c.dataset.d);
      if(S.moving) return doMove(c.dataset.d);
      if(S.clip) return doPaste(c.dataset.d);
      openDay(c.dataset.d);
    };
    c.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); c.click(); } };
  });
  bindDrag(); bindPick();
  if($('mCancel')) $('mCancel').onclick = () => { S.moving = null; S.clip = null; S.mclip = null; renderMain(); if(S.sel) openDay(S.sel); };
}
function setRange(r){
  if(r === S.range) return;
  const today = new Date(), wasMonth = S.range === 'm';
  if(r === 'm'){
    // open today's month if today is on screen, otherwise the month the middle of the window falls in
    const n = (+S.range) * 7, end = addDays(S.wk, n - 1);

  toast('Saved for ' + first + ' only');
  S.edit = null;
  if(items.some(it => it.new_exercise)){ const { data:ex } = await sb.from('exercises').select('id,name,default_percent_of,youtube_url').order('name'); S.exList = ex || S.exList; S.ex = Object.fromEntries(S.exList.map(x => [x.id, x])); $('exlist').innerHTML = S.exList.map(x => `<option value="${esc(x.name)}"></option>`).join(''); }
  await reloadAthlete();
}
// Which of the athlete's programs runs on a given date (and its week/day there), preferring the session's own program
function progBase(p){
  if(p.start_date) return parseD(p.start_date);
  const a = S.A.asg.filter(x => x.program_id === p.id).map(x => x.created_at).sort()[0];
  return a ? addDays(mondayOf(new Date(a)), (p.week_offset || 0) * 7) : null;
}
function hostFor(ds, pref){
  const d = parseD(ds);
  const c = S.A.programs.filter(p => p.status !== 'archived').map(p => {
    const b = progBase(p); if(!b) return null;
    const diff = Math.round((d - b) / 864e5), week = Math.floor(diff / 7) + 1;
    if(diff < 0 || week > (S.A.weeks[p.id] || 1)) return null;
    return {p, week, day:(d.getDay() + 6) % 7 + 1};
  }).filter(Boolean);
  const rank = x => !pref ? 3 : x.p.id === pref.id ? 0
    : (x.p.plan_id && x.p.plan_id === pref.plan_id && x.p.track === pref.track && x.p.days_version === pref.days_version) ? 1
    : (x.p.plan_id && x.p.plan_id === pref.plan_id) ? 2 : 3;
  return c.sort((a,b) => rank(a) - rank(b))[0] || null;
}
async function sessionAction(doc, msg, after){
  doc.athlete_id = doc.athlete_id || S.aid;
  const { error } = await rpcAct(doc);
  if(error){ toast(error.message); return false; }
  toast(msg); await reloadAthlete(); if(after) after(); return true;
}
async function doMove(ds){
  const m = S.moving; const h = hostFor(ds, m.p);
  if(!h){ toast(athleteName(S.aid).split(' ')[0] + ' is not on a program that week, so there is nowhere to put it'); return; }
  S.moving = null;
  const ok = await sessionAction({action:'move', session_id:m.sid, program_id:h.p.id, week:h.week, day:h.day, date:ds}, 'Moved to ' + parseD(ds).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'}));
  if(ok) openDay(ds); else renderMain();
}
async function doPaste(ds){
  const c = S.clip; const h = hostFor(ds, c.fromId === S.aid ? c.p : null);
  if(!h){ toast(athleteName(S.aid).split(' ')[0] + ' is not on a program that week. Add them to one first.'); return; }
  await sessionAction({action:'paste', session_id:c.sid, program_id:h.p.id, week:h.week, day:h.day, date:ds}, 'Pasted for ' + athleteName(S.aid).split(' ')[0] + ' on ' + parseD(ds).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'}));
}
/* ---------- Drag and drop on the calendar ----------
   Dragging a chip moves every session in that card (e.g. Technical + Strength) that the athlete
   hasn't logged. Holding Alt on drop copies instead. Uses the same coach_session_action RPC as
   the drawer's Move and Paste, so it's still athlete-only. */
function bindDrag(){
  const grid = document.querySelector('#main .grid'); if(!grid) return;
  const clear = () => grid.querySelectorAll('.cell.drop').forEach(x => x.classList.remove('drop', 'nope'));
  grid.querySelectorAll('.ev[data-dg]').forEach(ev => {
    ev.addEventListener('dragstart', e => {
      const from = ev.closest('.cell').dataset.d;
      S.drag = {from, gi:+ev.dataset.dg};
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setData('text/plain', from + '|' + ev.dataset.dg);
      ev.classList.add('dragging'); grid.classList.add('dragging');
    });
    ev.addEventListener('dragend', () => { ev.classList.remove('dragging'); grid.classList.remove('dragging'); clear(); S.drag = null; });
  });
  grid.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('dragover', e => {
      if(!S.drag) return;
      e.preventDefault();
      const ok = c.dataset.d !== S.drag.from && !!hostFor(c.dataset.d);
      e.dataTransfer.dropEffect = !ok ? 'none' : e.altKey ? 'copy' : 'move';
      if(!c.classList.contains('drop')){ clear(); c.classList.add('drop'); }
      c.classList.toggle('nope', !ok);
    });
    c.addEventListener('dragleave', e => { if(!c.contains(e.relatedTarget)) c.classList.remove('drop', 'nope'); });
    c.addEventListener('drop', e => {
      e.preventDefault(); clear();
      const d = S.drag; S.drag = null;
      if(d) dropGroup(d.from, d.gi, c.dataset.d, e.altKey);
    });
  });
}
async function dropGroup(from, gi, to, copy){
  if(from === to) return;
  const g = dayGroups(from)[gi]; if(!g) return;
  const first = athleteName(S.aid).split(' ')[0];
  const list = copy ? g.list : g.list.filter(s => !S.A.logs[s.id]);
  if(!list.length) return;
  const docs = [];
  for(const s of list){
    const h = hostFor(to, s.p);
    if(!h){ toast(first + ' is not on a program that week, so there is nowhere to put it'); return; }
    docs.push({athlete_id:S.aid, action:copy ? 'paste' : 'move', session_id:s.id, program_id:h.p.id, week:h.week, day:h.day, date:to});
  }
  const grid = document.querySelector('#main .grid'); if(grid) grid.classList.add('busy');
  let done = 0, err = null;
  for(const doc of docs){
    const { error } = await rpcAct(doc);
    if(error){ err = error; break; }
    done++;
  }
  const when = parseD(to).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});
  const skipped = !copy ? g.list.length - list.length : 0;
  if(err) toast((done ? done + ' of ' + docs.length + ' done, then: ' : '') + err.message);
  else toast((copy ? 'Copied to ' : 'Moved to ') + when + (skipped ? '. ' + skipped + ' logged session' + (skipped > 1 ? 's' : '') + ' left where ' + first + ' did ' + (skipped > 1 ? 'them' : 'it') : ''));
  await reloadAthlete();
  if(!err) openDay(to);
}
/* ---------- Copy / move several sessions or a whole week ----------
   Select with shift-click (or ⧉ Week on a Monday), then Copy or Move and click a target day.
   Sessions keep their spacing. A week lands in the week you click, day for day. Copies stay on
   the clipboard so they can be pasted again or for other athletes; moves are one athlete only.
   Every write goes through coach_session_action, so it's athlete-only like the drawer. */
const inMode = () => !!(S.moving || S.clip || S.mclip);
const dayDiff = (a, b) => Math.round((parseD(a) - parseD(b)) / 864e5);
const isHidId = id => !!(S.A && S.A.hidden && S.A.hidden.has(id));
const isHid = s => isHidId(s.id);
/* coach_session_action, but a moved or pasted copy of an unpublished session stays unpublished */
async function rpcAct(doc){
  const res = await sb.rpc('coach_session_action', { doc });
  if(!res.error && (doc.action === 'move' || doc.action === 'paste') && isHidId(doc.session_id) && res.data && res.data.session_id){
    await sb.rpc('coach_set_hidden', { doc:{athlete_id:doc.athlete_id || S.aid, session_ids:[res.data.session_id], hidden:true} });
  }
  return res;
}
async function setHidden(ids, hidden){
  if(!ids.length) return;
  const first = athleteName(S.aid).split(' ')[0];
  const { data, error } = await sb.rpc('coach_set_hidden', { doc:{athlete_id:S.aid, session_ids:ids, hidden} });
  if(error){ toast(/coach_set_hidden|function|schema cache/i.test(error.message) ? 'Publishing sessions needs the database update first' : error.message); return; }
  const n = data && data.changed != null ? data.changed : ids.length, sk = data && data.skipped || 0;
  S.pick = new Set();
  toast((hidden ? 'Unpublished ' : 'Published ') + n + ' session' + (n === 1 ? '' : 's') + (hidden ? '. ' + first + ' can\'t see ' + (n === 1 ? 'it' : 'them') + ' until you publish' : ' for ' + first) + (sk ? '. ' + sk + ' already logged, left as is' : ''));
  await reloadAthlete();
}
async function deleteMany(items){
  const grid = document.querySelector('#main .grid'); if(grid) grid.classList.add('busy');
  let done = 0, err = null;
  for(const x of items){
    const { error } = await rpcAct({athlete_id:S.aid, action:'delete', session_id:x.sid});
    if(error){ err = error; break; }
    done++;
  }
  S.pick = new Set();
  toast(err ? 'Deleted ' + done + ' of ' + items.length + ', then: ' + err.message : 'Removed ' + done + ' session' + (done === 1 ? '' : 's') + ' for ' + athleteName(S.aid).split(' ')[0] + '. Restore any of them from the day drawer.');
  await reloadAthlete();
}
function groupItems(ds, g){ return g.list.map(s => ({sid:s.id, date:ds, p:s.p, logged:!!S.A.logs[s.id], title:s.title || s.code || 'Session'})); }
function pickedItems(){
  const out = [];
  [...S.pick].forEach(k => { const [ds, gi] = k.split('|'); const g = dayGroups(ds)[+gi]; if(g) out.push(...groupItems(ds, g)); });
  return out.sort((a,b) => a.date.localeCompare(b.date));
}
function weekItems(mon){
  const out = [];
  for(let i = 0; i < 7; i++){ const ds = ymd(addDays(parseD(mon), i)); dayGroups(ds).forEach(g => out.push(...groupItems(ds, g))); }
  return out;
}
function startMulti(items, kind, mode, anchor){
  if(!items.length){ toast('Nothing to ' + mode + ' there'); return; }
  const fmt = ds => parseD(ds).toLocaleDateString('en-AU', {day:'numeric', month:'short'});
  const days = new Set(items.map(x => x.date)).size;
  S.mclip = {mode, kind, items, anchor, fromId:S.aid, from:athleteName(S.aid).split(' ')[0],
    label: kind === 'week' ? 'week of ' + fmt(anchor) : items.length + ' session' + (items.length > 1 ? 's' : '') + ' over ' + days + ' day' + (days > 1 ? 's' : '')};
  S.pick = new Set(); S.moving = null; S.clip = null;
  closeDrawer(); renderMain();
}
function multiTargets(ds){
  const c = S.mclip; if(!c) return [];
  const off = c.kind === 'week' ? dayDiff(ymd(mondayOf(parseD(ds))), c.anchor) : dayDiff(ds, c.anchor);
  return c.items.map(x => ({...x, to: ymd(addDays(parseD(x.date), off)), off}));
}
function bindPick(){
  const grid = document.querySelector('#main .grid'); if(!grid) return;
  grid.querySelectorAll('.ev[data-gi]').forEach(ev => ev.addEventListener('click', e => {
    if(inMode() || !(e.shiftKey || e.metaKey || e.ctrlKey)) return;
    e.stopPropagation(); e.preventDefault();
    const k = ev.closest('.cell').dataset.d + '|' + ev.dataset.gi;
    S.pick.has(k) ? S.pick.delete(k) : S.pick.add(k);
    renderMain();
  }));
  grid.querySelectorAll('[data-wk]').forEach(b => {
    const go = e => { e.stopPropagation(); e.preventDefault(); weekMenu(b); };
    b.addEventListener('click', go);
    b.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') go(e); });
  });
  if($('pkCopy')) $('pkCopy').onclick = () => { const it = pickedItems(); startMulti(it, 'sel', 'copy', it[0] && it[0].date); };
  if($('pkMove')) $('pkMove').onclick = () => { const it = pickedItems().filter(x => !x.logged); startMulti(it, 'sel', 'move', it[0] && it[0].date); };
  if($('pkClear')) $('pkClear').onclick = () => { S.pick = new Set(); renderMain(); };
  if($('pkHide')) $('pkHide').onclick = () => setHidden(pickedItems().filter(x => !x.logged && !isHidId(x.sid)).map(x => x.sid), true);
  if($('pkShow')) $('pkShow').onclick = () => setHidden(pickedItems().filter(x => isHidId(x.sid)).map(x => x.sid), false);
  if($('pkDel')) $('pkDel').onclick = e => {
    const b = e.currentTarget, it = pickedItems().filter(x => !x.logged);
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Click again to delete ' + it.length; setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = 'Delete'; } }, 4000); return; }
    deleteMany(it);
  };
  // show where things will land while hovering in copy/move mode
  if(S.mclip){
    const clearG = () => grid.querySelectorAll('.cell.land').forEach(x => x.classList.remove('land'));
    grid.querySelectorAll('.cell').forEach(c => c.addEventListener('mouseenter', () => {
      clearG(); const set = new Set(multiTargets(c.dataset.d).map(x => x.to));
      grid.querySelectorAll('.cell').forEach(x => { if(set.has(x.dataset.d)) x.classList.add('land'); });
    }));
    grid.addEventListener('mouseleave', clearG);
  }
}
function weekMenu(btn){
  document.querySelectorAll('.wkmenu').forEach(x => x.remove());
  const mon = btn.dataset.wk, items = weekItems(mon), movable = items.filter(x => !x.logged);
  const m = document.createElement('div'); m.className = 'wkmenu';
  m.innerHTML = items.length
    ? `<button data-a="copy">Copy week (${items.length})</button>${movable.length ? `<button data-a="move">Move week (${movable.length})</button>` : ''}${items.some(x => !x.logged && !isHidId(x.sid)) ? `<button data-a="hide">Unpublish week</button>` : ''}${items.some(x => isHidId(x.sid)) ? `<button data-a="show">Publish week</button>` : ''}<button data-a="select">Select sessions…</button>`
    : '<span class="muted small" style="padding:6px 10px">Nothing this week</span>';
  btn.closest('.cell').appendChild(m);
  m.addEventListener('click', e => {
    e.stopPropagation(); const a = e.target.dataset && e.target.dataset.a; if(!a) return; m.remove();
    if(a === 'copy') startMulti(items, 'week', 'copy', mon);
    if(a === 'move') startMulti(movable, 'week', 'move', mon);
    if(a === 'hide') setHidden(items.filter(x => !x.logged && !isHidId(x.sid)).map(x => x.sid), true);
    if(a === 'show') setHidden(items.filter(x => isHidId(x.sid)).map(x => x.sid), false);
    if(a === 'select'){
      for(let i = 0; i < 7; i++){ const ds = ymd(addDays(parseD(mon), i)); dayGroups(ds).forEach((g, gi) => S.pick.add(ds + '|' + gi)); }
      renderMain();
    }
  });
  setTimeout(() => document.addEventListener('click', function off(){ m.remove(); document.removeEventListener('click', off); }), 0);
}
async function doMulti(ds){
  const c = S.mclip, first = athleteName(S.aid).split(' ')[0], same = c.fromId === S.aid;
  const t = multiTargets(ds);
  if(c.mode === 'move' && t[0] && t[0].off === 0) return;
  const docs = [], skipped = [];
  for(const x of t){
    if(c.mode === 'move' && x.logged) continue;
    const h = hostFor(x.to, same ? x.p : null);
    if(!h){ skipped.push(x); continue; }
    docs.push({athlete_id:S.aid, action:c.mode === 'move' ? 'move' : 'paste', session_id:x.sid, program_id:h.p.id, week:h.week, day:h.day, date:x.to});
  }
  if(!docs.length){ toast(first + ' is not on a program on those days, so there is nowhere to put them'); return; }
  const grid = document.querySelector('#main .grid'); if(grid) grid.classList.add('busy');
  let done = 0, err = null;
  for(const doc of docs){
    const { error } = await rpcAct(doc);
    if(error){ err = error; break; }
    done++;
  }
  if(c.mode === 'move') S.mclip = null;
  const verb = c.mode === 'move' ? 'Moved' : 'Pasted';
  if(err) toast(verb + ' ' + done + ' of ' + docs.length + ', then: ' + err.message);
  else toast(verb + ' ' + done + ' session' + (done > 1 ? 's' : '') + (same ? '' : ' for ' + first) + (skipped.length ? '. ' + skipped.length + ' skipped (no program on that day)' : ''));
  await reloadAthlete();
}
async function resetPersonal(sid, btn){

  const { error } = await sb.rpc('coach_reset_session', { sid });
  if(error){ toast(error.message); return; }
  toast('Back to the program session'); await reloadAthlete();
}

    return `<tr><td><button class="btn ghost sm" style="padding-left:0;color:var(--text);font-weight:500" data-open="${x.id}">${esc(x.full_name || x.email)}</button>
        <div class="small muted">${esc(x.email || '')}${x.role === 'coach' ? ' · Coach' : ''}</div></td>
      <td>${mine.map(m => `<span class="tag">${esc(gName(m.group_id))}<button data-ungroup="${m.group_id}|${x.id}" aria-label="Remove from ${esc(gName(m.group_id))}">×</button></span>`).join('') || '<span class="small muted">No groups</span>'}</td>
      <td>${avail.length ? `<div class="addrow" style="margin:0"><select data-groupsel="${x.id}" aria-label="Add to group"><option value="">Add to group…</option>${avail.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><button class="btn sm" data-addgroup="${x.id}">Add</button></div>` : ''}</td></tr>`; }).join('');
  return `<div class="page"><div><h1>Members & groups</h1><p class="intro">Groups decide which group chats, events and group-assigned programs people get. Click a name to open their calendar.</p></div>
    <div class="cols">
      <div class="panel"><h2>Groups <span class="small muted">${M.groups.length}</span></h2>
        <table class="tbl"><tbody>${groups}</tbody></table>
        <div class="addrow"><input id="newGroup" placeholder="New group name"><button class="btn sm" id="addGroup">Add group</button></div>
        <p class="small muted" style="margin-top:8px">Deleting a group also deletes its group chat. Members stay in the app.</p></div>
      <div class="panel"><h2>Members <span class="small muted">${M.people.length}</span></h2>
        <div class="tscroll"><table class="tbl"><thead><tr><th>Member</th><th>Groups</th><th></th></tr></thead><tbody>${people}</tbody></table></div></div>
    </div></div>`;
}
function viewEvents(){
  const M = S.M, today = ymd(new Date());
  const THEME = {comp:'Comp', party:'Party', other:'Event'};
  const rows = M.events.map(e => `<tr class="${e.event_date < today ? 'past' : ''}"><td><b style="font-weight:500">${esc(e.title)}</b></td>
      <td>${parseD(e.event_date).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'})}${e.event_time ? ' · ' + esc(e.event_time.slice(0,5)) : ''}</td>
      <td>${esc(THEME[e.theme] || 'Event')}</td><td>${esc(e.location || '')}</td><td>${esc(e.group_id ? gName(e.group_id) : 'Everyone')}</td>
      <td style="text-align:right"><button class="btn sm" data-delevent="${e.id}">Remove</button></td></tr>`).join('');
  return `<div class="page"><div><h1>Events</h1><p class="intro">Events show in the banner carousel on the Home screen, for everyone or just one group. Past events fade out here and drop off Home.</p></div>
    <div class="panel"><h2>Add an event</h2>
      <div class="form">
        <input id="evTitle" placeholder="Event name" aria-label="Event name">
        <input id="evDate" type="date" aria-label="Date">
        <input id="evTime" type="time" aria-label="Start time">
        <select id="evTheme" aria-label="Banner style"><option value="comp">Comp banner</option><option value="party">Party banner</option><option value="other">Other</option></select>
        <input id="evLoc" placeholder="Location (optional)" aria-label="Location">
        <select id="evGroup" aria-label="Who sees it"><option value="">Everyone</option>${M.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
        <button class="btn pri" id="evAdd">Add event</button>
      </div></div>
    <div class="panel"><h2>All events <span class="small muted">${M.events.length}</span></h2>
      ${M.events.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>Event</th><th>When</th><th>Banner</th><th>Location</th><th>For</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">No events yet.</div>'}</div>
  </div>`;
}
function bindAdmin(){
  const root = $('main');
  const act = async (fn, msg) => { const { error } = await fn(); if(error){ toast(error.message); return; } if(msg) toast(msg); await loadAdmin(); };
  const twoTap = (b, label, fn) => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; const old = b.textContent; b.textContent = label;
      setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = old; } }, 4000); return; }
    fn();
  };
  root.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => act(() => sb.from('programs').update({status: b.dataset.st === 'published' ? 'draft' : 'published'}).eq('id', b.dataset.pub), b.dataset.st === 'published' ? 'Unpublished' : 'Published'));
  root.querySelectorAll('[data-pubplan]').forEach(b => b.onclick = () => {
    const ids = S.M.programs.filter(p => p.plan_id === b.dataset.pubplan && p.status !== 'archived').map(p => p.id);
    act(() => sb.from('programs').update({status: b.dataset.to}).in('id', ids), b.dataset.to === 'published' ? 'All published' : 'All unpublished');
  });
  root.querySelectorAll('[data-assign]').forEach(b => b.onclick = () => {
    const v = root.querySelector(`[data-assignsel="${b.dataset.assign}"]`).value; if(!v){ toast('Pick a group or athlete'); return; }
    const [t, id] = v.split(':');
    act(() => sb.from('program_assignments').insert({program_id: b.dataset.assign, [t === 'g' ? 'group_id' : 'athlete_id']: id}), 'Assigned');
  });
  root.querySelectorAll('[data-unassign]').forEach(b => b.onclick = () => act(() => sb.from('program_assignments').delete().eq('id', b.dataset.unassign), 'Removed'));
  root.querySelectorAll('[data-delprog]').forEach(b => b.onclick = () => twoTap(b, 'Click again to delete', () => act(() => sb.from('programs').delete().eq('id', b.dataset.delprog), 'Program deleted')));
  root.querySelectorAll('[data-addgroup]').forEach(b => b.onclick = () => {
    const g = root.querySelector(`[data-groupsel="${b.dataset.addgroup}"]`).value; if(!g){ toast('Pick a group'); return; }
    act(() => sb.from('group_members').insert({group_id: g, profile_id: b.dataset.addgroup}), 'Added to ' + gName(g));
  });
  root.querySelectorAll('[data-ungroup]').forEach(b => b.onclick = () => { const [g, pid] = b.dataset.ungroup.split('|');
    act(() => sb.from('group_members').delete().eq('group_id', g).eq('profile_id', pid), 'Removed from ' + gName(g)); });
  root.querySelectorAll('[data-delgroup]').forEach(b => b.onclick = () => twoTap(b, 'Click again to delete', () => act(() => sb.from('groups').delete().eq('id', b.dataset.delgroup), 'Group deleted')));
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => selectAthlete(b.dataset.open));
  if($('addGroup')) $('addGroup').onclick = async () => {
    const name = $('newGroup').value.trim(); if(!name){ toast('Name the group'); return; }
    const { data:g, error } = await sb.from('groups').insert({name, sort: S.M.groups.length}).select('id').single();
    if(error){ toast(error.message); return; }
    await sb.from('conversations').insert({kind:'group', group_id:g.id});   // every group gets its chat, as in the app
    toast('Group added'); loadAdmin();
  };
  root.querySelectorAll('[data-delevent]').forEach(b => b.onclick = () => act(() => sb.from('events').delete().eq('id', b.dataset.delevent), 'Event removed'));
  if($('evAdd')) $('evAdd').onclick = () => {
    const title = $('evTitle').value.trim(), event_date = $('evDate').value;
    if(!title || !event_date){ toast('Add a name and a date'); return; }
    act(() => sb.from('events').insert({title, event_date, event_time: $('evTime').value || null, theme: $('evTheme').value, location: $('evLoc').value.trim() || null, group_id: $('evGroup').value || null}), 'Event added');
  };
}

let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
</script>
</body>
