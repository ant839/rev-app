<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="coach.webmanifest">
<link rel="apple-touch-icon" href="icons/coach-apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rev Coach">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0e0e0f">
<link rel="icon" type="image/png" href="icons/icon-192.png?v=2">
<title>Rev Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Coach dashboard: athlete list | month calendar | day drawer. Same palette as the member app. */
:root{
  --bg:#0e0e0f; --surface:#161618; --surface2:#1e1e21; --surface3:#26262a;
  --border:rgba(255,255,255,0.07); --border2:rgba(255,255,255,0.14);
  --text:#f0efe8; --muted:#888884; --dim:#55554f;
  --accent:#c8f06a; --accent-dim:rgba(200,240,106,0.12); --accent-ink:#141a05;
  --red:#ff5a5a; --red-dim:rgba(255,90,90,0.14);
  --amber:#f5a623; --amber-dim:rgba(245,166,35,0.14);
  --blue:#5ab4ff; --blue-dim:rgba(90,180,255,0.12);
  --purple:#b08fff; --purple-dim:rgba(176,143,255,0.13);
  --radius:10px; --radius-sm:6px;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
#root{height:100%}
html{color-scheme:dark;height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',system-ui,sans-serif;font-size:14px;height:100%;font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:inherit;font-size:13px;color:var(--text)}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 10px;outline:none;min-width:0;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:54px}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:7px 12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:500}
.btn:hover{border-color:var(--border2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)} .btn.ghost:hover{color:var(--text);border-color:var(--border)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.lbl{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12px}
.num{font-family:var(--mono)}
.pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.pill.technical{background:var(--blue-dim);color:var(--blue)}
.pill.strength{background:var(--purple-dim);color:var(--purple)}
.pill.other,.pill.accessory{background:var(--surface3);color:var(--muted)}
.pill.draft{background:var(--amber-dim);color:var(--amber)}
.pill.personal{background:var(--accent-dim);color:var(--accent)}

/* Layout */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:100%}
.app.drawer-open{grid-template-columns:268px minmax(0,1fr) 480px}
@media (max-width:1180px){.app.drawer-open{grid-template-columns:268px minmax(0,1fr)} .drawer{position:fixed;right:0;top:0;bottom:0;width:min(480px,100%);z-index:20;box-shadow:-20px 0 40px rgba(0,0,0,.5)}}
@media (max-width:760px){.app,.app.drawer-open{grid-template-columns:minmax(0,1fr)} .side{display:none} .app.list .side{display:flex} .app.list .main{display:none}}
.side{border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;font-weight:600;font-size:15px}
.brand .mark{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:13px}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.side .search{padding:0 12px 10px;display:grid;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{border:1px solid var(--border);background:transparent;border-radius:20px;padding:3px 10px;font-size:11.5px;color:var(--muted)}
.chip.on{background:var(--accent-dim);border-color:var(--accent);color:var(--text)}
.alist{overflow-y:auto;flex:1;padding:4px 8px 12px}
.arow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;padding:8px}
.arow:hover{background:var(--surface2)}
.arow.on{background:var(--surface2);border-color:var(--border2)}
.av{width:30px;height:30px;border-radius:50%;background:var(--surface3);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--muted)}
.arow b{font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arow .meta{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wk{display:flex;gap:2px}
.wk i{width:6px;height:16px;border-radius:2px;background:var(--surface3)}
.wk i.on{background:var(--accent)}
.side .foot{border-top:1px solid var(--border);padding:10px 14px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow-y:auto}
.ahead{padding:18px 24px 12px;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.ahead h1{font-size:24px;font-weight:400;letter-spacing:-.01em}
.ahead .progs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ptag{font-size:12px;border:1px solid var(--border);border-radius:8px;padding:4px 9px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.ptag b{font-weight:500}
.ptag .psel{font-size:12px;padding:1px 4px;border-radius:6px;width:auto;background:var(--surface2)}
.rost{padding:10px 0 4px;border-bottom:1px solid var(--border)}
.rost-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.rost-h b{font-weight:500}
.rtbl select{font-size:12px;padding:3px 6px;width:auto}
.maxes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:520px}
.mx{font-size:12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:5px 9px}
.mx span{color:var(--muted);margin-right:6px}
.calbar{display:flex;align-items:center;gap:10px;padding:14px 24px 8px;flex-wrap:wrap}
.calbar h2{font-size:17px;font-weight:500;min-width:150px}
.legend{display:flex;gap:12px;margin-left:auto;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:0}
.cal{padding:0 24px 24px}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.dow span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;padding-left:4px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cell{min-height:104px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:6px;display:flex;flex-direction:column;gap:4px;text-align:left;min-width:0}
.cell.out{opacity:.38}
.cell.today{border-color:var(--accent)}
.cell.sel{box-shadow:inset 0 0 0 1px var(--text);border-color:var(--text)}
.cell:hover{border-color:var(--border2)}
.cell .dn{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.cell .dn b{font-weight:500;color:var(--text)}
.cell .wkl{font-size:10px;color:var(--dim);font-family:var(--mono)}
.ev{font-size:11.5px;border-radius:5px;padding:3px 6px;background:var(--surface2);border-left:3px solid var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.done{border-left-color:var(--accent)}
.ev.part{border-left-color:var(--amber)}
.ev.miss{border-left-color:var(--red)}
.ev.up{border-left-color:var(--blue)}
.ev .pers{color:var(--accent);margin-left:3px}
.ev.rm{opacity:.45;text-decoration:line-through;border-left-color:var(--dim);background:transparent;border:1px dashed var(--border2);border-left:3px solid var(--dim)}
.mode{margin:0 24px 8px;padding:10px 14px;border-radius:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;background:var(--accent-dim);border:1px solid rgba(200,240,106,.35)}
.mode b{font-weight:600}
.cell{cursor:pointer;color:inherit;font:inherit}
.cell:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ev[draggable="true"]{cursor:grab}
.ev[draggable="true"]:hover{background:var(--border)}
.ev.dragging{opacity:.4}
.grid.dragging .cell{transition:background .1s}
.cell.drop{border-color:var(--accent);background:var(--accent-dim)}
.cell.drop.nope{border-color:var(--red);background:transparent}
.grid.busy{pointer-events:none;opacity:.6}
.ev.hid{opacity:.55;background:transparent;border:1px dashed var(--border2);border-left-width:3px}
.ev .hidm{color:var(--amber);margin-left:4px}
.pill.hidden{background:rgba(245,166,35,.14);color:var(--amber)}
.ptx{background:transparent;border:0;color:var(--dim);font-size:14px;line-height:1;padding:0 2px;margin-left:2px}
.ptx:hover{color:var(--red)} .ptx.sure{color:var(--red);font-size:11.5px}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:8vh 16px}
.modal{background:var(--surface);border:1px solid var(--border2);border-radius:12px;width:min(560px,100%);max-height:80vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.modal .mh h3{font-size:16px;font-weight:500}
.modal .mb{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:9px 11px}
.prow:hover{border-color:var(--accent)}
.prow .pn{display:flex;flex-direction:column;gap:2px;min-width:0}
.prow .pn b{font-weight:500}
.prow .pill{margin-left:4px}
.pill.live{background:var(--accent-dim);color:var(--accent)}
.fsec h4{font-size:15px;font-weight:500;margin-bottom:2px}
.fl{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px}
.chk input{width:auto}
.fnote{font-size:12.5px;color:var(--muted);line-height:1.45}
.fact{display:flex;justify-content:flex-end}
.snav button:first-child{grid-column:1/-1}
.snav-build{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;margin-top:2px;padding:8px 10px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:12.5px}
.snav-build:hover{background:#d6ff70}
.home{padding:22px 26px 40px;display:flex;flex-direction:column;gap:14px}
.hhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.greet{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.hday{font-size:28px;font-weight:300;letter-spacing:-.02em}
.hdate{font-size:13px;color:var(--muted);margin-top:2px}
.hright{display:flex;align-items:center;gap:14px}
.clock{font-family:var(--mono);font-size:26px;letter-spacing:-.02em}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 14px;text-align:left;display:flex;flex-direction:column;gap:3px}
button.metric:hover{border-color:var(--border2)}
.metric.alert{border-color:rgba(245,166,35,.35)} .metric.alert .mv{color:var(--amber)}
.ml{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.mv{font-size:22px;font-weight:500}
.mof{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.ms{font-size:11.5px;color:var(--muted)}
.ms .good{color:var(--accent)} .amber{color:var(--amber)}
.mbar,.mini{height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;margin:3px 0 1px}
.mbar i,.mini i{display:block;height:100%;background:var(--accent);border-radius:2px}
.mini{width:90px;margin-top:5px}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px;align-items:start}
.hmain,.hside{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px}
.clabel{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.csub{font-size:11px;color:var(--dim);font-weight:400;letter-spacing:0;text-transform:none}
.tpill{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase}
.t-base{background:var(--blue-dim);color:var(--blue)} .t-competitive{background:var(--purple-dim);color:var(--purple)} .t-fndn{background:rgba(61,214,181,.12);color:#3dd6b5}
.itab{width:100%;border-collapse:collapse;font-size:13px}
.itab td{padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top}
.itab tr:last-child td{border-bottom:0}
.alink{background:none;border:0;padding:0;color:var(--text);font-weight:500;text-align:left}
.alink:hover{color:var(--accent)}
.feed{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:8px 0;text-align:left}
.feed:last-child{border-bottom:0}
.feed:hover b{color:var(--accent)}
.feed .av{width:28px;height:28px;border-radius:50%;background:var(--accent-dim);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:600;flex-shrink:0}
.feed .av.dim{background:var(--surface2);color:var(--muted)}
.fb{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.fb b{font-weight:500;font-size:13px}
.fb .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ft{font-size:11px;color:var(--dim);flex-shrink:0;font-family:var(--mono)}
.mxv{font-size:12px;color:var(--muted);flex-shrink:0;display:flex;align-items:baseline;gap:4px}
.mxv b{color:var(--text);font-size:14px}
.mxv .up{color:var(--accent);font-size:11px;font-family:var(--mono)}
.evrow{display:flex;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)} .evrow:last-child{border-bottom:0}
.evd{width:40px;flex-shrink:0;text-align:center;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;line-height:1.1}
.evd b{display:block;font-size:18px;color:var(--text);font-weight:500;letter-spacing:0}
@media (max-width:1150px){.hgrid{grid-template-columns:minmax(0,1fr)} .metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.nabox{padding:18px 20px}
.nabox.has{border-color:rgba(200,240,106,.35);background:linear-gradient(180deg,rgba(200,240,106,.05),transparent 120px),var(--surface)}
.nahead h2{font-size:20px;font-weight:400;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.nacount{font-family:var(--mono);font-size:13px;background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:1px 9px;font-weight:600}
.nahead p{margin-top:3px}
.nalist{margin-top:12px;display:flex;flex-direction:column}
.narow{display:flex;align-items:center;gap:14px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap;transition:opacity .3s}
.narow.done{opacity:.35;pointer-events:none}
.narow .nawho{border:0;padding:0;flex:1 1 220px;min-width:200px}
.nactl{display:flex;gap:6px;align-items:center;flex:2 1 420px;justify-content:flex-end}
.nactl select{width:auto;max-width:280px;padding:5px 8px;font-size:12.5px}
.nactl select[data-naplan]{flex:1;min-width:180px}
.naor{font-size:11.5px;color:var(--dim)}
.nactl select.nagrp{flex:0 1 160px;min-width:130px}
.nabuild{border-color:rgba(200,240,106,.35);color:var(--accent)}
.nabuild:hover{background:var(--accent-dim)}
.fcoach{border-color:rgba(200,240,106,.28);border-left:3px solid var(--accent);background:linear-gradient(180deg,rgba(200,240,106,.06),transparent 120px),var(--surface)}
.fck{color:var(--accent);font-family:var(--mono);letter-spacing:.14em}
.fc-now{margin-bottom:12px}
.fc-meta{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ktag{font-size:10px;font-weight:600;padding:1px 7px;border-radius:20px;letter-spacing:.05em;text-transform:uppercase;background:var(--surface2);color:var(--muted)}
.k-reminder{background:var(--amber-dim);color:var(--amber)} .k-focus{background:var(--accent-dim);color:var(--accent)} .k-note{background:var(--blue-dim);color:var(--blue)}
.fc-t{font-size:15px;font-weight:500;margin-bottom:3px}
.fc-b{font-size:13px;line-height:1.55;white-space:pre-line}
.fc-act{display:flex;gap:6px;margin-top:8px}
.fc-comp{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--border);padding-top:12px}
.fc-row{display:flex;gap:6px;align-items:center}
.fc-row select{width:auto;flex:1;min-width:0;padding:5px 8px;font-size:12.5px}
.fc-row .chk{gap:5px;flex-shrink:0;color:var(--muted)}
.fc-old{margin-top:10px;font-size:12.5px}
.fc-old summary{cursor:pointer;color:var(--muted);font-size:12px}
.fc-oldrow{border-top:1px solid var(--border);padding:8px 0}
.fc-oldrow p{white-space:pre-line;line-height:1.5;margin-top:2px}
.lnk{background:none;border:0;color:var(--dim);font-size:11.5px;padding:0;margin-left:6px;text-decoration:underline}
.lnk:hover{color:var(--text)} .lnk.danger:hover,.btn.danger:hover{color:var(--red)}
.addsess{width:100%;margin-top:10px;background:transparent;border:1px dashed var(--border2);border-radius:var(--radius);padding:11px;color:var(--muted);font-weight:500;display:flex;gap:8px;justify-content:center;align-items:center}
.addsess span{color:var(--accent);font-size:16px;line-height:1}
.addsess:hover{border-color:var(--accent);color:var(--text)}
.cmp{padding:22px 26px 40px;display:flex;flex-direction:column;gap:14px}
.cmp-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap}
.cmp-head h1{font-size:24px;font-weight:400}
.cmp-head .intro{max-width:520px;margin-top:4px;color:var(--muted);font-size:13px}
.cmp-m{grid-template-columns:repeat(3,minmax(140px,1fr));min-width:min(520px,100%)}
.cmp-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cmp-bar input{width:200px} .cmp-bar select{width:auto}
.cmp-bar .legend{margin-left:auto}
.cmp-card{padding:4px 0;overflow-x:auto}
.ctab{width:100%;border-collapse:collapse;font-size:13px}
.ctab th{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:10px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.ctab th.cwk{text-align:center;font-family:var(--mono);letter-spacing:0;text-transform:none;font-size:11px}
.ctab th.cwk span{display:block;font-size:9px;color:var(--accent);font-family:'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.ctab th.who,.ctab td.who{padding-left:18px;min-width:220px}

.pz-now::after{content:'NOW';position:absolute;top:-2px;left:50%;transform:translate(-50%,-100%);background:var(--accent);color:#000;font-size:9px;font-weight:700;letter-spacing:.08em;padding:1px 5px;border-radius:4px 4px 0 0}

.pz-lg.comp{background:var(--gold)} .pz-lg.now{background:transparent;border:2px solid var(--accent)}
@media (prefers-reduced-motion:reduce){.pz-scroll{scroll-behavior:auto}}

/* ---------- Phone (coach app). Everything below only applies on screens 760px wide or less. ---------- */

  input,select,textarea{font-size:16px}

  .donly{display:none!important}
  /* bottom tabs */
  .mtabs{display:grid;grid-template-columns:repeat(5,1fr);grid-row:2;background:rgba(22,22,24,.96);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom));z-index:30;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}

  .mtabs .tb{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:9.5px;font-weight:700;border-radius:20px;padding:0 5px;line-height:15px;min-width:15px;text-align:center}
  .toast{bottom:calc(76px + env(safe-area-inset-bottom))}
  .back{background:none;border:0;color:var(--accent);font-size:15px;font-weight:500;padding:4px 0;display:inline-flex;align-items:center;gap:4px}
  .back svg{width:18px;height:18px}
  /* sheets (More, Notifications, modals) slide up from the bottom */
  .ovl{align-items:flex-end;padding:0}
  .modal{width:100%;max-height:92dvh;border-radius:16px 16px 0 0;border-bottom:0;padding-bottom:env(safe-area-inset-bottom)}
  .msheet .mb{gap:4px}
  .mitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid var(--border);padding:13px 4px;font-size:15px;color:var(--text);text-align:left}
  .mitem:last-child{border-bottom:0}

  .mitem .mi-r{margin-left:auto;color:var(--dim);font-size:13px}

  .mitem.out{color:var(--red)} .mitem.out svg{color:var(--red)}
  .nset{display:flex;flex-direction:column;gap:10px}
  .nstat{display:flex;gap:10px;align-items:flex-start;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px;font-size:13.5px;line-height:1.45}
  .nstat b{display:block;font-weight:600;margin-bottom:2px}
  .tgl{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border);font-size:15px}
  .tgl small{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .tgl input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:20px;background:var(--surface3);border:0;padding:0;position:relative;flex-shrink:0;transition:background .15s}
  .tgl input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
  .tgl input:checked{background:var(--accent)} .tgl input:checked::after{transform:translateX(18px)}
  .tgl input:disabled{opacity:.4;background:var(--surface3)} .tgl input:disabled::after{transform:none}
  /* athlete list page */
  .mlist{padding:16px 16px 24px;display:flex;flex-direction:column;gap:10px}
  .mlist h1{font-size:26px;font-weight:400}
  .mlist .alist{padding:0;overflow:visible}
  .mlist .arow{padding:10px 6px}
  /* home */
  .home{padding:14px 16px 28px;gap:12px}
  .hday{font-size:24px} .clock{font-size:20px} .hright .btn{display:none}
  .metrics{gap:8px} .metric{padding:10px 12px} .mv{font-size:20px}
  .card{padding:14px}
  .nabox{padding:14px}
  .nahead h2{font-size:18px}
  .narow{gap:8px;padding:12px 0}
  .narow .nawho{flex:1 1 100%;min-width:0}
  .nactl{flex:1 1 100%;flex-wrap:wrap;justify-content:flex-start}
  .nactl select,.nactl select[data-naplan],.nactl select.nagrp{flex:1 1 100%;max-width:none;min-width:0;width:100%;font-size:16px;padding:8px 10px}
  .nactl .btn{flex:1;justify-content:center;padding:9px 10px}
  .naor{display:none}
  .pz-top{gap:8px} .pz-seg button{padding:6px 9px}
  .pz-tl{grid-template-columns:120px repeat(var(--pzn),var(--pzw))!important}
  .pz-name small{display:none}
  .pz-legend .pz-dim{display:none}
  .itab td:nth-child(2){display:none}
  /* athlete calendar */
  .ahead{padding:10px 16px 12px;gap:10px}
  .ahead h1{font-size:22px}
  .ahead .lbl{display:none}
  .maxes{justify-content:flex-start;max-width:none}
  .calbar{padding:10px 16px 6px;gap:8px}
  .calbar h2{font-size:15px;min-width:0;flex:1;text-align:center;order:2}
  #mPrev{order:1} #mNext{order:3} #mToday{order:4}
  .calbar .seg{order:5;margin-left:auto}
  .calbar .seg [data-range="2"],.calbar .seg [data-range="4"]{display:none}
  .calbar .legend,.calhint{display:none}
  .mode{margin:0 16px 8px;font-size:13px}
  .cal{padding:0 12px 20px}
  .grid.r1 .cell .wkcp,.wkcp{opacity:1}
  /* week: one day per row */
  .grid.r1{grid-template-columns:minmax(0,1fr);gap:6px}
  .cal .dow:has(+ .grid.r1){display:none}
  .grid.r1 .cell{min-height:58px;padding:9px 10px}

  .grid.r1 .cell .dn{font-size:13px}
  .grid.r1 .ev{font-size:13px;padding:6px 8px}
  .grid.r1 .ev .evl{font-size:12px}
  /* month: dots */
  .dow{gap:3px} .dow span{font-size:10px;padding:0;text-align:center}
  .grid.rm{gap:3px}
  .grid.rm .cell{min-height:58px;padding:4px 3px;gap:3px;border-radius:7px}
  .grid.rm .cell .dn{justify-content:center;font-size:11px}
  .grid.rm .cell .wkr{display:none}
  .grid.rm .ev{font-size:0;height:5px;padding:0;border:0;border-radius:3px;background:var(--dim)}
  .grid.rm .ev.done{background:var(--accent)} .grid.rm .ev.part{background:var(--amber)} .grid.rm .ev.miss{background:var(--red)} .grid.rm .ev.up{background:var(--blue)}
  .grid.rm .ev.rm,.grid.rm .ev.hid{background:transparent;border:1px dashed var(--dim);height:5px}
  /* day drawer becomes a full screen sheet */
  .drawer,.app.drawer-open .drawer{position:fixed;inset:0;width:100%;z-index:40;border:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);box-shadow:none}
  .dhead{padding:12px 16px}
  .dbody{padding:12px 14px 28px}
  .lhd,.lrow{grid-template-columns:38px 46px 50px 50px 44px minmax(0,1fr) 22px}
  .eli .meta{grid-template-columns:minmax(0,1fr)}
  .eli .ctop{grid-template-columns:40px minmax(0,1fr)}
  /* compliance */
  .cmp{padding:14px 16px 28px}
  .cmp-head h1{font-size:22px}
  .cmp-m{grid-template-columns:repeat(3,minmax(0,1fr));min-width:0}
  .cmp-bar input,.cmp-bar select{width:100%;flex:1 1 140px}
  .cmp-bar .legend{display:none}
  .ctab th.who,.ctab td.who{position:sticky;left:0;background:var(--surface);z-index:1;min-width:130px;max-width:150px;padding-left:12px}
  .ctab td.who .small{display:none}
  .ctab td.lt{display:none}
  /* chat and forum: list first, then the open one full screen */
  .split{grid-template-columns:minmax(0,1fr);height:100%}
  .sp-l{border-right:0;padding:14px 16px}
  .split.open .sp-l{display:none}
  .split:not(.open) .sp-r{display:none}
  .sp-r{padding:12px 16px 24px}
  .chat .sp-r{padding:0}
  .th-head{padding:10px 14px;gap:8px}
  .msgs{padding:12px 14px}
  .msg{max-width:84%}
  .mdel{display:none}
  .th-comp{padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:6px}
  .th-comp .btn{padding:10px 14px}
  .fpost h2{font-size:21px}
  .fm-meta .spacer{display:none}
  .row-act{flex-wrap:wrap}
  /* programs, groups, events */
  .page{padding:14px 16px 28px}
  .page h1{font-size:22px}
  .form{grid-template-columns:minmax(0,1fr)}
  .addrow select,.addrow input{min-width:0;flex:1 1 100%}
  .panel{padding:14px}
  .tbl{font-size:13px}
  .page{grid-template-columns:minmax(0,1fr)}
  .page>*,.cols>*{min-width:0}
  .cols .tbl thead{display:none}
  .cols .tbl tr{display:block;border-bottom:1px solid var(--border);padding:8px 0}
  .cols .tbl tr:last-child{border-bottom:0}

  .cols .tbl td .addrow select{min-width:0;flex:1}
  .cols .tbl td .addrow .btn{flex:0 0 auto}
  .cols .tbl td .addrow{flex-wrap:nowrap}
  .hhead{align-items:flex-start}
}

const S = {

/* ---------- Boot and sign in ---------- */

  const u = session && session.user;

async function start(){
  const { data:p } = await sb.from('profiles').select('id,full_name,email,role').eq('id', S.user.id).single();
  S.me = p;
  if(!p || p.role !== 'coach'){

const b64ToBytes = b => { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(r, c => c.charCodeAt(0)); };
let swReg = null;
async function registerSW(){ if(!('serviceWorker' in navigator)) return; try { swReg = await navigator.serviceWorker.register('sw.js'); } catch(e){ console.warn('sw', e); } }
async function currentSub(){ if(!pushSupported()) return null; const reg = swReg || await navigator.serviceWorker.getRegistration(); return reg ? reg.pushManager.getSubscription() : null; }
async function pushState(){
  if(!pushSupported()) return isIOS() && !isStandalone() ? 'needs-install' : 'unsupported';
  if(Notification.permission === 'denied') return 'blocked';
  const sub = await currentSub();
  return sub && Notification.permission === 'granted' ? 'on' : 'off';
}
async function coachPushOn(){ try { if(await pushState() !== 'on') return false; const sub = await currentSub(); if(!sub) return false;
  const { data } = await sb.from('push_subscriptions').select('app').eq('endpoint', sub.endpoint).maybeSingle(); return !!(data && data.app === 'coach'); } catch(e){ return false; } }
async function saveCoachSub(sub, prefs){
  const j = sub.toJSON();
  const row = {profile_id:S.user.id, endpoint:j.endpoint, p256dh:j.keys.p256dh, auth:j.keys.auth, user_agent:navigator.userAgent.slice(0, 200), app:'coach'};
  if(prefs) row.prefs = prefs;
  const { error } = await sb.from('push_subscriptions').upsert(row, {onConflict:'endpoint'});
  if(error) throw error;
}
async function enableCoachPush(){
  if(!pushSupported()){ toast(isIOS() && !isStandalone() ? 'Add Rev Coach to your Home Screen first, then open it from there.' : 'This browser can\'t do notifications.'); return false; }
  const perm = await Notification.requestPermission();
  if(perm !== 'granted'){ toast('Notifications are blocked. Turn them on in your phone\'s settings for Rev Coach.'); return false; }
  const reg = swReg || await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToBytes(VAPID_PUBLIC)});
  try { await saveCoachSub(sub); return true; } catch(e){ toast('Couldn\'t save: ' + e.message); return false; }
}
// keep this device's subscription fresh, but only if it was turned on from the coach app (a desktop browser
// that has the athlete app's notifications on keeps them as they are)
async function refreshCoachPush(){ try { if(await pushState() !== 'on') return; const sub = await currentSub(); if(!sub) return;
  const { data } = await sb.from('push_subscriptions').select('app').eq('endpoint', sub.endpoint).maybeSingle();
  if(data && data.app === 'coach') await saveCoachSub(sub); } catch(e){} }

      <div class="row-act" style="margin-top:6px">${st === 'off' ? '<button class="btn pri" id="nOn">Turn on notifications</button>' : ''}
        ${st === 'on' ? '<button class="btn" id="nTest">Send a test</button><button class="btn ghost danger" id="nOff">Turn off on this phone</button>' : ''}</div>

// swipe left / right on the calendar to change week or month (phone only)
function bindSwipe(el, step){
  let x0 = null, y0 = null;
  el.addEventListener('touchstart', e => { const t = e.touches[0]; x0 = t.clientX; y0 = t.clientY; }, {passive:true});
  el.addEventListener('touchend', e => {
    if(x0 == null) return; const t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0; x0 = null;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) step(dx < 0 ? 1 : -1);
  }, {passive:true});
}

/* ---------- Data for one athlete ---------- */
async function loadAthlete(id){
  const gids = S.members.filter(m => m.profile_id === id).map(m => m.group_id);
  let q = sb.from('program_assignments').select('program_id,group_id,athlete_id,created_at');
  q = gids.length ? q.or(`athlete_id.eq.${id},group_id.in.(${gids.join(',')})`) : q.eq('athlete_id', id);
  const { data:asg, error:e1 } = await q;
  if(e1) throw e1;
  const pids = [...new Set((asg || []).map(a => a.program_id))];
  const A = {id, gids, asg: asg || [], programs:[], plans:{}, sessions:[], removed:[], weeks:{}, logs:{}, maxes:{}, allAsg:[], hidden:new Set()};
  const [mx, lg, hd] = await Promise.all([
    sb.from('athlete_maxes').select('exercise_id,weight_kg,recorded_on,created_at').eq('athlete_id', id).order('recorded_on', {ascending:false}).order('created_at', {ascending:false}),
    sb.from('workout_logs').select('id,session_id,started_at,completed_at,set_logs(session_exercise_id,set_number,weight_kg,reps,made,notes)').eq('athlete_id', id),
    sb.from('session_hidden').select('session_id').eq('athlete_id', id)
  ]);
  if(!hd.error) (hd.data || []).forEach(h => A.hidden.add(h.session_id));
  (mx.data || []).forEach(m => { if(!A.maxes[m.exercise_id]) A.maxes[m.exercise_id] = +m.weight_kg; });
  (lg.data || []).forEach(l => { A.logs[l.session_id] = l; });
  if(!pids.length) return A;
  const [pg, ss, aa] = await Promise.all([
    sb.from('programs').select('id,name,kind,track,phase,status,start_date,plan_id,week_offset,is_option,days_version,is_select').in('id', pids).neq('status','archived'),
    sb.from('sessions').select('id,program_id,week_number,day_number,title,notes,code,scheduled_date,override_athlete_id,override_kind,session_exercises(*,prescriptions(id,sort,sets,reps,percent,percent_max,load_kg,rpe,load_text,warmup,notes))').in('program_id', pids),
    sb.from('program_assignments').select('program_id,group_id,athlete_id').in('program_id', pids)
  ]);
  if(pg.error) throw pg.error; if(ss.error) throw ss.error;
  A.programs = pg.data || []; A.allAsg = aa.data || [];
  const planIds = [...new Set(A.programs.map(p => p.plan_id).filter(Boolean))];
  if(planIds.length){
    const { data:pl } = await sb.from('program_plans').select('id,name,plan_type,start_date,versions,roster,blocks').in('id', planIds);
    (pl || []).forEach(p => A.plans[p.id] = p);
  }
  const progById = Object.fromEntries(A.programs.map(p => [p.id, p]));
  // how many weeks each program runs, from its shared sessions
  A.weeks = {};
  (ss.data || []).forEach(s => { if(!s.override_athlete_id) A.weeks[s.program_id] = Math.max(A.weeks[s.program_id] || 0, s.week_number); });
  let sess = (ss.data || []).filter(s => progById[s.program_id] && (!s.override_athlete_id || s.override_athlete_id === id));
  // the athlete's own version (or removal) of a programmed session hides the shared one; added sessions sit alongside
  const kind = s => s.override_athlete_id ? (s.override_kind || 'replace') : 'shared';
  const mine = new Set(sess.filter(s => kind(s) === 'replace' || kind(s) === 'removed').map(s => s.program_id + '|' + s.week_number + '|' + s.day_number));
  sess = sess.filter(s => s.override_athlete_id || !mine.has(s.program_id + '|' + s.week_number + '|' + s.day_number));
  sess.forEach(s => { s.kind = kind(s); });
  sess.forEach(s => {
    s.session_exercises.sort((a,b) => a.sort - b.sort);
    s.session_exercises.forEach(se => se.prescriptions.sort((a,b) => a.sort - b.sort));
    s.p = progById[s.program_id];
    s.date = sessionDate(s, A);
  });
  A.removed = sess.filter(s => s.date && s.kind === 'removed');
  A.sessions = sess.filter(s => s.date && s.kind !== 'removed');
  return A;
}
function sessionDate(s, A){
  if(s.scheduled_date) return s.scheduled_date;
  const p = s.p; let base = null;
  if(p.start_date) base = parseD(p.start_date);
  else {
    // no start date (e.g. an Individual program): week 1 is the week it was assigned; later blocks follow on
    const a = A.asg.filter(x => x.program_id === p.id).map(x => x.created_at).sort()[0];
    if(a) base = addDays(mondayOf(new Date(a)), (p.week_offset || 0) * 7);
  }
  if(!base) return null;
  return ymd(addDays(base, (s.week_number - 1) * 7 + (s.day_number - 1)));
}
const isShared = p => {
  const plan = p.plan_id && S.A.plans[p.plan_id];
  if(plan && plan.plan_type !== 'INDIVIDUAL') return true;
  const rows = S.A.allAsg.filter(a => a.program_id === p.id);
  return rows.some(a => a.group_id) || new Set(rows.map(a => a.athlete_id)).size > 1;
};
const athleteName = id => (S.athletes.find(a => a.id === id) || {}).name || 'Athlete';
const planLabel = p => (p.plan_id && S.A.plans[p.plan_id] ? S.A.plans[p.plan_id].name : String(p.name).split(' · ')[0]);
const trackLabel = p => p.track || (p.kind === 'other' ? 'Program' : p.kind[0].toUpperCase() + p.kind.slice(1));

/* Group a day's sessions the way the athlete sees them: one card per plan and day option */
function dayGroups(date){
  const items = S.A.sessions.filter(s => s.date === date);
  const by = new Map();
  items.forEach(s => { const k = (s.p.plan_id || s.p.id) + '|' + (s.p.days_version || ''); if(!by.has(k)) by.set(k, []); by.get(k).push(s); });
  return [...by.values()].map(list => {
    list.sort((a,b) => (a.p.is_option ? 1 : 0) - (b.p.is_option ? 1 : 0) || (KORDER[a.p.kind] - KORDER[b.p.kind]) || (a.p.track || '').localeCompare(b.p.track || ''));
    const opts = list.filter(s => s.p.is_option);
    return {list, opts, p:list[0].p};
  });
}
function groupState(g, date){
  const done = s => !!(S.A.logs[s.id] && S.A.logs[s.id].completed_at);
  const choice = g.opts.length > 1;                       // FNDN style: do one of the options
  const required = g.list.filter(s => !(choice && s.p.is_option));
  if(required.every(done) && (!choice || g.opts.some(done))) return 'done';
  if(g.list.some(s => S.A.logs[s.id])) return 'part';
  return date < ymd(new Date()) ? 'miss' : 'up';
}

  A.programs.forEach(p => { const k = p.plan_id || p.id; if(!byPlan.has(k)) byPlan.set(k, []); byPlan.get(k).push(p); });
  const ptags = [...byPlan.values()].map(ps => {
    const p = ps[0], plan = p.plan_id && A.plans[p.plan_id];
    const tracks = [...new Set(ps.map(trackLabel))].join(' + ');
    const days = [...new Set(ps.map(x => x.days_version).filter(Boolean))];

      ${live ? '' : '<span class="pill draft">Draft</span>'}${rmBtn}</span>`;
    return `<span class="ptag"><b>${esc(planLabel(p))}</b>${days.length ? `<span class="muted">${days.join('/')} day</span>` : ''}<span class="muted">${esc(tracks)}</span>${live ? '' : '<span class="pill draft">Draft</span>'}${viaGroup ? '<span class="muted small" title="On this through a group. Change it in Groups">via group</span>' : ''}${rmBtn}</span>`;
  }).join('') || '<span class="muted small">Not on any program yet.</span>';
  const mx = KEY_LIFTS.map(n => S.exList.find(e => e.name === n)).filter(e => e && A.maxes[e.id]).map(e => `<span class="mx"><span>${esc(e.name)}</span><b class="num">${A.maxes[e.id]}</b></span>`).join('');
  const m = S.month, R = isPhone() && (S.range === '2' || S.range === '4') ? '1' : S.range, isMonth = R === 'm', today = ymd(new Date());
  const first = isMonth ? mondayOf(m) : S.wk, nDays = isMonth ? 42 : (+R) * 7;
  const rich = R === '1' ? 'full' : R === '2' ? 'lifts' : '';
  let cells = '';
  for(let i = 0; i < nDays; i++){
    const d = addDays(first, i), ds = ymd(d);
    if(isMonth && i >= 35 && d.getMonth() !== m.getMonth()) break;
    const gs = dayGroups(ds);
    const evs = gs.map((g, gi) => {
      const st = groupState(g, ds);

function setRange(r){
  if(r === S.range) return;
  const today = new Date(), wasMonth = S.range === 'm';
  if(r === 'm'){
    // open today's month if today is on screen, otherwise the month the middle of the window falls in
    const n = (+S.range) * 7, end = addDays(S.wk, n - 1);
    const pick = today >= S.wk && today <= addDays(end, 1) ? today : addDays(S.wk, Math.floor(n / 2));
    S.month = new Date(pick.getFullYear(), pick.getMonth(), 1);
  } else if(wasMonth){
    // start at this week if it's in the month on screen, otherwise the month's first week (or the selected day's)
    const inMonth = today.getMonth() === S.month.getMonth() && today.getFullYear() === S.month.getFullYear();
    S.wk = S.sel && parseD(S.sel).getMonth() === S.month.getMonth() ? mondayOf(parseD(S.sel)) : inMonth ? mondayOf(today) : mondayOf(S.month);
  }
  S.range = r; try { localStorage.setItem('rc-range', r); } catch(e){}
  renderMain();
}
function rangeTitle(first, n){

  return f(first) + ' – ' + f(last) + ' ' + last.getFullYear();
}

    let rx = '';

function kgFor(se, pr){
  const ex = S.ex[se.exercise_id] || {};
  const base = se.percent_of || ex.default_percent_of || se.exercise_id;
  const mx = S.A.maxes[base];
  if(!mx || pr.percent == null) return '';
  const lo = Math.round(mx * pr.percent / 100), hi = pr.percent_max != null ? Math.round(mx * pr.percent_max / 100) : null;
  return (hi ? lo + '–' + hi : lo) + ' kg';
}
function rxLine(se, pr){
  const parts = [];
  if(pr.percent != null) parts.push((pr.percent_max != null ? `${+pr.percent}–${+pr.percent_max}%` : `${+pr.percent}%`) + (kgFor(se, pr) ? ` <span class="kg">${kgFor(se, pr)}</span>` : ''));
  if(pr.load_kg != null) parts.push(`<span class="kg">${+pr.load_kg} kg</span>`);
  if(pr.rpe != null) parts.push('RPE ' + +pr.rpe);
  if(pr.load_text) parts.push(esc(pr.load_text));

}
/* Conditioning pieces: a row on the "Conditioning" exercise with guide.cond = {title, score}; the workout is in its notes.
   Athletes log one score (set_logs set 1: reps = score text, notes = their note, e.g. weights used; older logs start with Rx / Scaled). */
const condNote = n => String(n ?? '').replace(/^(Rx|Scaled)\s*(·\s*)?/i, '').trim();
const COND_SCORES = {rounds:'Rounds + reps', time:'Time', reps:'Total reps', cals:'Calories', dist:'Distance (m)', load:'Heaviest load (kg)', text:'Free text', done:'Just tick it off'};
const COND_UNIT = {reps:'reps', cals:'cal', dist:'m', load:'kg'};
const condEx = () => S.exList.find(e => (e.category || '') === 'conditioning') || findEx('Conditioning');
const isCond = se => !!(se.guide && se.guide.cond) || ((S.ex[se.exercise_id] || {}).category === 'conditioning');
function condOf(se){
  const c = (se.guide && se.guide.cond) || {}, line = (se.prescriptions || se.sets || []).find(p => !p.warmup);
  return {title: c.title || (line && line.load_text) || 'Conditioning', score: COND_SCORES[c.score] ? c.score : 'text'};
}
function condScoreText(score, v){
  v = String(v ?? '').trim(); if(!v) return '';
  if(score === 'done' || v === 'done') return 'Done';
  if(score === 'rounds'){ const m = v.match(/^(\d+)\s*\+\s*(\d+)$/); if(m) return m[1] + ' rounds + ' + m[2]; if(/^\d+$/.test(v)) return v + ' rounds'; return v; }
  if(score === 'time'){ const m = v.match(/^CAP\s*(\d+)$/i); return m ? 'Capped, ' + m[1] + ' reps' : v; }
  if(COND_UNIT[score] && /^\d+(\.\d+)?$/.test(v)) return v + ' ' + COND_UNIT[score];
  return v;
}

function warmupLines(it){
  // build-up lines saved on the session are kept as written until the first working set changes
  if(Array.isArray(it.wuLines) && it.wuLines.length) return it.wuLines;
  const first = it.sets[0]; if(!first) return [];
  const reps = String(first.reps || '1').trim(); const simple = /^\d+$/.test(reps); const r = simple ? +reps : 0;
  const out = [{sets:1, reps: simple ? String(Math.min(Math.max(r, 3), 5)) : reps, percent:null, percent_max:null, load_text:'Bar', warmup:true}];
  const P = numOrNull(first.percent);
  if(P == null){ out.push({sets:1, reps: simple ? String(Math.max(1, Math.min(r, 3))) : reps, percent:null, percent_max:null, load_text:'Build up in comfortable jumps', warmup:true}); return out; }
  const steps = [50,60,70,75,80,85,90].filter(x => x <= P - 5);
  const pick = steps.length > 4 ? [steps[0], ...steps.slice(-3)] : steps;
  pick.forEach(x => out.push({sets:1, reps: simple ? String(x < 70 ? Math.min(r, 5) : Math.min(r, 3)) : reps, percent:x, percent_max:null, load_text:'', warmup:true}));

// Which of the athlete's programs runs on a given date (and its week/day there), preferring the session's own program
function progBase(p){
  if(p.start_date) return parseD(p.start_date);
  const a = S.A.asg.filter(x => x.program_id === p.id).map(x => x.created_at).sort()[0];
  return a ? addDays(mondayOf(new Date(a)), (p.week_offset || 0) * 7) : null;
}
function hostFor(ds, pref){
  const d = parseD(ds);
  const c = S.A.programs.filter(p => p.status !== 'archived').map(p => {
    const b = progBase(p); if(!b) return null;
    const diff = Math.round((d - b) / 864e5), week = Math.floor(diff / 7) + 1;
    if(diff < 0 || week > (S.A.weeks[p.id] || 1)) return null;
    return {p, week, day:(d.getDay() + 6) % 7 + 1};
  }).filter(Boolean);
  const rank = x => !pref ? 3 : x.p.id === pref.id ? 0
    : (x.p.plan_id && x.p.plan_id === pref.plan_id && x.p.track === pref.track && x.p.days_version === pref.days_version) ? 1
    : (x.p.plan_id && x.p.plan_id === pref.plan_id) ? 2 : 3;
  return c.sort((a,b) => rank(a) - rank(b))[0] || null;
}

/* ---------- Drag and drop on the calendar ----------
   Dragging a chip moves every session in that card (e.g. Technical + Strength) that the athlete
   hasn't logged. Holding Alt on drop copies instead. Uses the same coach_session_action RPC as
   the drawer's Move and Paste, so it's still athlete-only. */
function bindDrag(){
  const grid = document.querySelector('#main .grid'); if(!grid) return;
  const clear = () => grid.querySelectorAll('.cell.drop').forEach(x => x.classList.remove('drop', 'nope'));
  grid.querySelectorAll('.ev[data-dg]').forEach(ev => {
    ev.addEventListener('dragstart', e => {
      const from = ev.closest('.cell').dataset.d;
      S.drag = {from, gi:+ev.dataset.dg};
      e.dataTransfer.effectAllowed = 'copyMove';
      e.dataTransfer.setData('text/plain', from + '|' + ev.dataset.dg);
      ev.classList.add('dragging'); grid.classList.add('dragging');
    });
    ev.addEventListener('dragend', () => { ev.classList.remove('dragging'); grid.classList.remove('dragging'); clear(); S.drag = null; });
  });
  grid.querySelectorAll('.cell').forEach(c => {
    c.addEventListener('dragover', e => {
      if(!S.drag) return;
      e.preventDefault();
      const ok = c.dataset.d !== S.drag.from && !!hostFor(c.dataset.d);
      e.dataTransfer.dropEffect = !ok ? 'none' : e.altKey ? 'copy' : 'move';
      if(!c.classList.contains('drop')){ clear(); c.classList.add('drop'); }
      c.classList.toggle('nope', !ok);
    });
    c.addEventListener('dragleave', e => { if(!c.contains(e.relatedTarget)) c.classList.remove('drop', 'nope'); });
    c.addEventListener('drop', e => {
      e.preventDefault(); clear();
      const d = S.drag; S.drag = null;
      if(d) dropGroup(d.from, d.gi, c.dataset.d, e.altKey);
    });
  });

  }).join('');

  const body = rows.map(cellsFor).join('');
  const legend = [...usedPh.values()].map(p => `<span><i class="pz-lg ${p.k}" style="${pzSty(p)}"></i>${esc(p.n)}</span>`).join('')
    + (comp || Object.keys(evByWk).length ? `<span><i class="pz-lg comp"></i>Comp</span>` : '') + (ni >= 0 ? '<span><i class="pz-lg now"></i>This week</span>' : '');
  const timeline = rows.length ? `<div class="pz-scroll" id="pzScroll"><div class="pz-tl" style="--pzn:${ws.length};grid-template-columns:184px repeat(${ws.length},var(--pzw))">

  return `<div class="pz-top">
      <div class="pz-title">Programs running<span class="csub" style="margin-left:8px">${auto.length} group program${auto.length === 1 ? '' : 's'}${indiv.length ? ` · ${indiv.length} individual` : ''}</span></div>

        <button class="btn sm" id="pzFull">Full view →</button>

    </div>
    ${timeline}
    ${rows.length ? `<div class="pz-legend">${legend}<span class="pz-dim">Numbers are the week of each block. Hover a week for details.</span></div>` : ''}`;
}

/* ---------- Athletes page: the list (styled like the Programming page in Ant's personal dashboard)
   and the full Periodisation view. The Home timeline is the preview of the second one. ---------- */
S.ath = {tab:'list', q:'', type:'', grp:'', bucket:'', archived:false, coaches:false, sel:new Set()};
S.pzv = {view:'timeline', range:26, zoom:'m', show:{BASE:true, COMPETITIVE:true, FNDN:true, INDIVIDUAL:false}};
S.pzSet = S.pzSet || {phases:{}, notes:{}};
const RTYPES = [['INDIVIDUAL','t-individual','Individual'],['BASE 4','t-base4','Base 4'],['BASE 3','t-base3','Base 3'],['BASE','t-base4','Base'],['COMPETITIVE','t-nationals','Competitive'],['FNDN','t-sc','FNDN'],['ONBOARDING','t-onboarding','No program']];
const rtClass = label => { const n = String(label || ''); const hit = RTYPES.find(t => t[0] === n) || RTYPES.find(t => n.startsWith(t[0])); return hit ? hit[1] : 't-other'; };
const focusClass = n => { n = String(n || '').toLowerCase(); return !n ? 's-other' : /squat|leg/.test(n) ? 's-squat' : /upper|press|bench/.test(n) ? 's-upper' : /pull/.test(n) ? 's-pulling' : /general/.test(n) ? 's-general' : 's-custom'; };
const T_ORDER = {COMPETITIVE:0, BASE:1, INDIVIDUAL:2, FNDN:3};
const PZ_PICK = [['accumulation','Accumulation','#ff8a3d','#241100'],['volume','Volume','#ffd84d','#221c00'],['strength','Strength','#4d9fff','#051a36'],['intensity','Intensity','#ff5252','#ffffff'],['deload','Deload','#34c96a','#03220f'],['dtm','Taper','#34c96a','#03220f'],['comp','Comp / test','#d4a72c','#1e1600']];
// a block's colour: the coach's pick (saved in app_settings 'periodisation'), else from its name
function blockPhase(planId, bi, name){
  const k = ((S.pzSet.phases || {})[planId] || {})[bi];
  const hit = k && PZ_PICK.find(p => p[0] === k);
  if(hit) return {k:hit[0], n:hit[1], c:hit[2], t:hit[3]};
  return pzPhase(name, bi);
}
async function loadPzSettings(){
  const { data } = await sb.from('app_settings').select('value').eq('key', 'periodisation').maybeSingle();

}
async function savePzSettings(mut){

  mut(fresh);
  const { error } = await sb.from('app_settings').upsert({key:'periodisation', value:fresh, updated_at:new Date().toISOString()}, {onConflict:'key'});

async function loadRoster(force){
  if(S.R && !force && Date.now() - S.R.at < 45000) return S.R;
  const [pr, gm, pl, pg, as, ss, ev, , dov] = await Promise.all([
    sb.from('profiles').select('id,full_name,email,role,active,created_at').order('full_name'),
    sb.from('group_members').select('group_id,profile_id'),
    sb.from('program_plans').select('id,name,plan_type,status,start_date,total_weeks,athlete_id,roster,blocks,versions').neq('status','archived'),
    sb.from('programs').select('id,name,plan_id,status,start_date,week_offset,block_index,track,days_version,kind,is_option').neq('status','archived'),
    sb.from('program_assignments').select('program_id,group_id,athlete_id,created_at'),
    fetchAll(() => sb.from('sessions').select('id,program_id,week_number').is('override_athlete_id', null).order('id')),
    sb.from('events').select('id,title,event_date,event_time,location').gte('event_date', ymd(addDays(mondayOf(new Date()), -7 * 30))).order('event_date').limit(400),
    loadPzSettings(),
    sb.from('app_settings').select('value').eq('key', 'due_overrides').maybeSingle()
  ]);
  const bad = [pr, gm, pl, pg, as, ss].find(x => x.error);
  if(bad) throw bad.error;
  S.R = {at:Date.now(), people:pr.data || [], gm:gm.data || [], plans:pl.data || [], progs:pg.data || [], asg:as.data || [], sess:ss.data || [], events:ev.data || []};
  S.members = S.R.gm;
  S.R.dueOv = (dov && dov.data && dov.data.value) || {};
  S.athletes = S.R.people.filter(a => a.active !== false).map(a => ({...a, name:a.full_name || a.email || 'Athlete'}));
  S.R.C = computeRoster(S.R);
  return S.R;
}
function computeRoster(R){
  const plans = Object.fromEntries(R.plans.map(p => [p.id, p]));
  const progs = Object.fromEntries(R.progs.map(p => [p.id, p]));
  const firstAsg = {};
  R.asg.forEach(a => { const p = progs[a.program_id]; if(!p || !p.plan_id || !a.created_at) return; if(!firstAsg[p.plan_id] || a.created_at < firstAsg[p.plan_id]) firstAsg[p.plan_id] = a.created_at; });
  const planStart = pl => pl.start_date ? mondayOf(parseD(pl.start_date)) : firstAsg[pl.id] ? mondayOf(new Date(firstAsg[pl.id])) : null;
  const progBase = p => { const pl = plans[p.plan_id]; if(p.start_date) return mondayOf(parseD(p.start_date)); const s = pl && planStart(pl); return s ? addDays(s, (p.week_offset || 0) * 7) : null; };
  // which Mondays have sessions written, per plan (published or still draft), and how many per program
  const wk = {};
  R.sess.forEach(s => { const p = progs[s.program_id]; if(!p || !p.plan_id) return; const b = progBase(p); if(!b) return;
    const m = ymd(addDays(b, (s.week_number - 1) * 7)), M = (wk[p.plan_id] ||= {}), e = (M[m] ||= {pub:0, draft:0, progs:{}});
    if(p.status === 'published') e.pub++; else e.draft++; e.progs[p.id] = (e.progs[p.id] || 0) + 1; });
  const runOut = {}, writtenTo = {};
  Object.entries(wk).forEach(([pid, M]) => { const ms = Object.keys(M).sort(), pub = ms.filter(m => M[m].pub);
    if(pub.length) runOut[pid] = ymd(addDays(parseD(pub[pub.length - 1]), 6));
    if(ms.length) writtenTo[pid] = ymd(addDays(parseD(ms[ms.length - 1]), 6)); });
  const members = gid => R.gm.filter(m => m.group_id === gid).map(m => m.profile_id);
  const onPlan = {};
  R.asg.forEach(a => { const p = progs[a.program_id]; if(!p || !p.plan_id || !plans[p.plan_id]) return;
    (a.athlete_id ? [a.athlete_id] : a.group_id ? members(a.group_id) : []).forEach(x => (onPlan[p.plan_id] ||= new Set()).add(x)); });
  const plansOf = {};
  Object.entries(onPlan).forEach(([pid, set]) => set.forEach(a => (plansOf[a] ||= []).push(plans[pid])));
  Object.values(plansOf).forEach(l => l.sort((x, y) => (T_ORDER[x.plan_type] ?? 9) - (T_ORDER[y.plan_type] ?? 9) || x.name.localeCompare(y.name)));
  // where a plan is up to (same maths as the Home preview)
  const pos = {};
  R.plans.forEach(pl => {
    const blocks = Array.isArray(pl.blocks) ? pl.blocks.filter(b => +b.weeks > 0) : [];
    const total = pl.total_weeks || blocks.reduce((t, b) => t + (+b.weeks), 0) || 1;
    const start = planStart(pl);
    const week = start ? Math.floor(dayDiff(ymd(mondayOf(new Date())), ymd(start)) / 7) + 1 : null;
    pos[pl.id] = {total, blocks, start, week, end:start ? addDays(start, total * 7 - 1) : null};
  });
  return {plans, progs, planStart, wk, runOut, writtenTo, onPlan, plansOf, pos};
}
// next due for one athlete on one program: the coach's date if set (app_settings 'due_overrides'), else where published sessions run out
const dueOf = (aid, pid) => (S.R.dueOv || {})[aid + '|' + (pid || '_')] || (pid ? S.R.C.runOut[pid] : null) || null;
async function setDueOverride(aid, pid, date){
  const { data } = await sb.from('app_settings').select('value').eq('key', 'due_overrides').maybeSingle();
  const v = (data && data.value) || {}, k = aid + '|' + (pid || '_');
  if(date) v[k] = date; else delete v[k];
  const { error } = await sb.from('app_settings').upsert({key:'due_overrides', value:v, updated_at:new Date().toISOString()}, {onConflict:'key'});
  if(error){ toast(error.message); return false; }
  S.R.dueOv = v; return true;
}
const rDays = ds => ds ? dayDiff(ds, ymd(new Date())) : null;
const rBucket = n => n == null ? 'none' : n < 0 ? 'over' : n <= 7 ? 'week' : n <= 14 ? 'next' : 'later';
function athleteModel(a){
  const C = S.R.C, pls = (C.plansOf[a.id] || []).filter(Boolean), prim = pls[0] || null;
  const mem = prim ? rosterOf(prim).find(m => m.athlete_id === a.id) : null;
  let type = 'ONBOARDING';
  if(prim){ const d = (mem && mem.days) || planDays(prim)[0];
    type = prim.plan_type === 'BASE' ? (d ? 'BASE ' + d : 'BASE') : prim.plan_type === 'COMPETITIVE' ? 'COMPETITIVE' + (d ? ' ' + d : '') : prim.plan_type === 'FNDN' ? 'FNDN' : 'INDIVIDUAL'; }
  // next due: the soonest of their programs to run out of published training
  let due = null, dueFrom = null;
  pls.forEach(pl => { const r = dueOf(a.id, pl.id); if(r && (!due || r < due)){ due = r; dueFrom = pl; } });
  if(!pls.length && S.R.dueOv[a.id + '|_']) due = S.R.dueOv[a.id + '|_'];
  const n = rDays(due);
  const groups = S.R.gm.filter(m => m.profile_id === a.id).map(m => (S.groups.find(g => g.id === m.group_id) || {}).name).filter(Boolean);
  return {a, pls, prim, mem, type, due, dueFrom, n, bucket:rBucket(n), groups, draft:pls.length && !due};
}

function athRow(m){

function bindAthList(models){

/* ---- Periodisation: the full view ---- */
function pzRows(){
  const R = S.R, C = R.C, show = S.pzv.show;
  const rows = R.plans.filter(pl => show[pl.plan_type] && (pl.plan_type !== 'INDIVIDUAL' || (C.onPlan[pl.id] && C.onPlan[pl.id].size) || pl.athlete_id) && R.progs.some(p => p.plan_id === pl.id))
    .sort((x, y) => (T_ORDER[x.plan_type] ?? 9) - (T_ORDER[y.plan_type] ?? 9) || x.name.localeCompare(y.name));
  return rows.map(pl => {
    const who = [...(C.onPlan[pl.id] || [])];
    const label = pl.plan_type === 'INDIVIDUAL' ? athleteName(who[0] || pl.athlete_id) : pl.name;
    return {pl, pos:C.pos[pl.id], who, label, sub:pl.plan_type === 'INDIVIDUAL' ? pl.name : (TYPE_TXT[pl.plan_type] || '') + (who.length ? ' · ' + who.length : '')};
  });
}
function pzCellInfo(r, w){
  const x = pzWeek(r.pos, w); if(!x) return null;
  const p = x.bi >= 0 ? blockPhase(r.pl.id, x.bi, x.name) : {k:'none', c:'#3a3a3f', t:'#ddd', n:'Unplanned'};
  const e = ((S.R.C.wk[r.pl.id] || {})[w]) || null;
  return {...x, p, written:e ? (e.pub ? 'pub' : 'draft') : 'no', e, note:(S.pzSet.notes || {})[r.pl.id + '|' + w] || ''};
}
function renderPeriodPage(){
  const R = S.R, C = R.C, V = S.pzv, now = new Date(), monS = ymd(mondayOf(now));
  const rows = pzRows();
  const fmtD = (d, o) => parseD(d).toLocaleDateString('en-AU', o);
  const wks = n => n + ' week' + (n === 1 ? '' : 's');
  // next comp
  const comps = R.events.filter(e => e.event_date >= monS && isComp(e));
  const comp = comps[0], compMon = comp ? ymd(mondayOf(parseD(comp.event_date))) : null;
  let countdown = '';
  if(comp){
    const cw = Math.round(dayDiff(compMon, monS) / 7), cd = dayDiff(comp.event_date, ymd(now));
    const notes = rows.filter(r => r.pl.plan_type !== 'INDIVIDUAL').map(r => { const to = C.runOut[r.pl.id];
      return to ? (to >= comp.event_date ? `${esc(r.label)} is written past it` : `${esc(r.label)} is written to ${esc(fmtD(to, {day:'numeric', month:'short'}))}`) : `${esc(r.label)} has nothing published`; });
    countdown = `<div class="pz-cd">${PZ_TROPHY.replace('<svg', '<svg class="pz-trophy"')}
      <div class="pz-cdn">${cw >= 2 ? `<span class="pz-cdnum">${cw}</span><span class="pz-cdu">weeks</span>` : `<span class="pz-cdnum">${Math.max(0, cd)}</span><span class="pz-cdu">day${cd === 1 ? '' : 's'}</span>`}</div>
      <div class="pz-cdb"><div class="pz-cdt">${esc(comp.title)}</div><div class="pz-cds">${esc(fmtD(comp.event_date, {weekday:'long', day:'numeric', month:'long'}))}${comp.location ? ' · ' + esc(comp.location) : ''}${comps.length > 1 ? ' · then ' + esc(comps.slice(1, 3).map(c => c.title).join(', ')) : ''}</div>
        ${notes.length ? `<div class="pz-cds">${notes.join(' · ')}</div>` : ''}</div></div>`;
  }
  // this week cards
  const card = r => {
    const pl = r.pl, pos = r.pos, x = pzCellInfo(r, monS), who = r.who;
    const ps = R.progs.filter(q => q.plan_id === pl.id);
    const live = ps.length && ps.every(q => q.status === 'published'), part = !live && ps.some(q => q.status === 'published');
    const tc = x ? x.p.c : PZ_TYPE_COL[pl.plan_type] || '#888';
    let big, next = '', warn = false;
    if(pos.week == null) big = '<span class="pz-tag off">No start date</span>';

    else if(pos.week > pos.total){ big = '<span class="pz-tag off">FINISHED</span>'; next = 'Ended ' + esc(dShort(ymd(pos.end))); warn = who.length > 0; if(warn) next += ' · <b>athletes still on it</b>'; }
    else {
      big = `<span class="pz-wk">WK ${pos.week}</span><span class="pz-of">of ${pos.total}</span>`;
      const nb = (() => { let acc = 0; for(let i = 0; i < pos.blocks.length; i++){ acc += +pos.blocks[i].weeks; if(acc >= pos.week && acc < pos.total) return {i, at:ymd(addDays(pos.start, acc * 7))}; } return null; })();
      if(nb) next = `Next: <b>${esc(pos.blocks[nb.i + 1].name || 'Block ' + (nb.i + 2))}</b> from ${esc(fmtD(nb.at, {day:'numeric', month:'short'}))}`;
      else { next = 'Ends <b>' + esc(fmtD(ymd(pos.end), {day:'numeric', month:'short'})) + '</b>'; if(Math.ceil((pos.end - now) / 864e5) <= 14){ warn = true; next += ' · plan the next one'; } }
    }

    const wr = to ? `Written to <b>${esc(fmtD(to, {day:'numeric', month:'short'}))}</b>` : '<b>Nothing published</b>';
    if(to && left != null && left <= 14 && pos.week != null && pos.week <= pos.total) warn = true;
    const segs = pos.start && pos.total ? `<div class="pz-segs" aria-hidden="true">${Array.from({length:Math.min(pos.total, 60)}, (_, i) => {
      const w = ymd(addDays(pos.start, i * 7)), c = pzCellInfo(r, w);

    const tr = who.filter(a => S.weekDone[a] && S.weekDone[a].size).length, running = pos.week >= 1 && pos.week <= pos.total;
    return `<button class="pz-card ${warn ? 'warn' : ''}" style="--tc:${tc}" data-pzcell="${pl.id}|${monS}">
      <div class="pz-cname"><span>${esc(r.label)}</span>${live ? '' : `<span class="pill draft">${part ? 'Partly live' : 'Draft'}</span>`}</div>
      <div class="pz-big">${big}</div>
      ${x && x.bi >= 0 ? `<div class="pz-phase" style="${pzSty(x.p)}">${esc(x.name)} · wk ${x.wib}/${x.bw}</div>` : ''}
      ${segs}

  const ws = Array.from({length:nW}, (_, i) => ymd(addDays(parseD(from), i * 7)));
  const ni = ws.indexOf(monS);
  const evByWk = {}; R.events.forEach(e => { const k = ymd(mondayOf(parseD(e.event_date))); (evByWk[k] ||= []).push(e); });
  const used = new Map();
  rows.forEach((r, i) => r.ri = i);
  const cellHtml = (r, w) => {

    if(!c) return `<div class="pz-cell"></div>`;

          return `<td><button class="pz-tc w-${c.written} ${c.p.k}" style="${pzSty(c.p)}" data-pzcell="${r.pl.id}|${w}"><b>${esc(c.name || 'Week')}</b><span>wk ${c.wib}/${c.bw}${c.written === 'no' ? ' · not written' : c.written === 'draft' ? ' · draft' : ''}</span>${c.note ? '<i class="pz-dot"></i>' : ''}</button></td>`; }).join('')}</tr>`).join('')}

  } else {

    ws.forEach((w, i) => { const mm = w.slice(0, 7); if(mm !== lastM){ let span = 0; for(let j = i; j < ws.length && ws[j].slice(0, 7) === mm; j++) span++; months += `<div class="pz-month" style="grid-row:1;grid-column:${i + 2} / span ${span}">${span > 1 ? MONTHS[parseD(w).getMonth()] : MONTHS[parseD(w).getMonth()].slice(0, 3)}</div>`; lastM = mm; } });

    const names = rows.map(r => `<${r.pl.plan_type === 'INDIVIDUAL' ? `button data-open="${r.who[0] || r.pl.athlete_id}"` : 'div'} class="pz-name" style="--tc:${PZ_TYPE_COL[r.pl.plan_type] || '#888'};grid-row:${r.ri + 4};grid-column:1" title="${esc(r.label + ' · ' + r.sub)}"><i></i><span><b>${esc(r.label)}</b><small>${esc(r.sub)}</small></span></${r.pl.plan_type === 'INDIVIDUAL' ? 'button' : 'div'}>`).join('');
    const body = rows.map(r => ws.map((w, wi) => `<div style="grid-row:${r.ri + 4};grid-column:${wi + 2}">${cellHtml(r, w)}</div>`).join('')).join('');

  }
  const legend = [...used.values()].filter(p => p.k !== 'none').map(p => `<span><i class="pz-lg ${p.k}" style="${pzSty(p)}"></i>${esc(p.n)}</span>`).join('')
    + '<span><i class="pz-lg unw"></i>Not written yet</span><span><i class="pz-lg drf"></i>Draft</span><span><i class="pz-lg comp"></i>Comp</span><span><i class="pz-lg now"></i>This week</span><span><i class="pz-lg note"></i>Note</span>';
  const seg = (id, opts, cur) => `<div class="pz-seg" role="group">${opts.map(([v, l]) => `<button data-${id}="${v}" aria-pressed="${String(cur) === String(v)}">${l}</button>`).join('')}</div>`;

  $('main').innerHTML = `<div class="ap pzp">
    ${athTabs()}

      <div class="pz-ctl">${ni >= 0 && V.view === 'timeline' && rows.length ? '<button class="btn" id="pzJump">Jump to now</button>' : ''}<a class="btn" href="${BUILDER_URL}" target="revbuilder" rel="noopener">Program builder ↗</a></div></div>

        <div class="pz-ctl">

  $('main').querySelectorAll('[data-pzrange]').forEach(b => b.onclick = () => { V.range = +b.dataset.pzrange; re(); });
  $('main').querySelectorAll('[data-pzzoom]').forEach(b => b.onclick = () => { V.zoom = b.dataset.pzzoom; re(); });
  $('main').querySelectorAll('[data-pzview]').forEach(b => b.onclick = () => { V.view = b.dataset.pzview; re(); });
  $('main').querySelectorAll('[data-pzcell]').forEach(b => b.onclick = () => { const [pid, w] = b.dataset.pzcell.split('|'); openPzWeek(pid, w); });
  $('main').querySelectorAll('[data-open]').forEach(b => b.onclick = () => selectAthlete(b.dataset.open));
  if($('pzJump')) $('pzJump').onclick = () => pzJump(true);
  try { localStorage.setItem('rc-pzv', JSON.stringify(V)); } catch(e){}
  pzJump(false);
}
function openPzWeek(planId, w){
  const R = S.R, C = R.C, pl = C.plans[planId]; if(!pl) return;
  const r = pzRows().find(x => x.pl.id === planId) || {pl, pos:C.pos[planId], who:[...(C.onPlan[planId] || [])], label:pl.name};
  const c = pzCellInfo(r, w);
  const fmtD = (d, o) => parseD(d).toLocaleDateString('en-AU', o);
  const title = (r.label || pl.name) + (c ? ' · week ' + c.n : '');
  const progs = R.progs.filter(p => p.plan_id === planId);
  const byProg = c && c.e ? Object.entries(c.e.progs).map(([pid, n]) => { const p = C.progs[pid]; return `<li><span>${esc([p.track || trackLabel(p), p.days_version ? p.days_version + ' day' : ''].filter(Boolean).join(' · '))}</span><b>${n} session${n === 1 ? '' : 's'}</b>${p.status === 'published' ? '' : '<span class="pill draft">Draft</span>'}</li>`; }).join('') : '';
  const block = c && c.bi >= 0 ? (r.pos.blocks[c.bi] || {}) : null;
  const curK = c && c.bi >= 0 ? (((S.pzSet.phases || {})[planId] || {})[c.bi] || '') : '';
  const who = r.who.slice().sort((a, b) => athleteName(a).localeCompare(athleteName(b)));
  const ov = sheet(title, `<div class="pzw">
    <div class="pzw-d">w/c ${esc(fmtD(w, {weekday:'short', day:'numeric', month:'long', year:'numeric'}))}${c ? ` · program week ${c.n} of ${r.pos.total}` : ''}</div>
    ${c && c.bi >= 0 ? `<div class="pzw-b" style="${pzSty(c.p)}"><b>${esc(c.name)}</b><span>Week ${c.wib} of ${c.bw}${block && block.focus ? ' · ' + esc(block.focus) : ''}</span></div>` : c ? '<div class="muted small">This week isn\'t in any block.</div>' : '<div class="muted small">This program isn\'t running this week.</div>'}
    <div class="pzw-s ${c ? 'w-' + c.written : ''}">${!c ? '' : c.written === 'pub' ? 'Written and published' : c.written === 'draft' ? 'Written, still a draft. Athletes can\'t see it yet.' : 'Not written yet'}</div>
    ${byProg ? `<ul class="pzw-l">${byProg}</ul>` : ''}
    ${c && c.bi >= 0 ? `<div class="clabel" style="margin:6px 0 0">Block colour<span class="csub">applies to all of ${esc(c.name)}</span></div>
      <div class="pzw-ph"><button class="pchip ${curK ? '' : 'on'}" data-phase="">Auto</button>${PZ_PICK.map(([k, n, col, t]) => `<button class="pchip ${curK === k ? 'on' : ''}" data-phase="${k}" style="--pc:${col};--pt:${t}"><i></i>${n}</button>`).join('')}</div>` : ''}
    ${c ? `<div class="clabel" style="margin:6px 0 0">Note for this week</div>
      <textarea id="pzNote" rows="3" placeholder="e.g. Test week, comp prep, gym closed Friday">${esc(c.note)}</textarea>
      <div class="row-act"><button class="btn pri sm" id="pzNoteSave">Save note</button>${c.note ? '<button class="btn ghost sm danger" id="pzNoteDel">Remove</button>' : ''}</div>` : ''}
    ${who.length ? `<div class="clabel" style="margin:6px 0 0">Athletes on it<span class="csub">${who.length}</span></div><div class="pzw-a">${who.map(a => `<button class="glink" data-open="${a}">${esc(athleteName(a))}</button>`).join('')}</div>` : ''}
    <div class="row-act"><a class="btn" href="${BUILDER_URL}" target="revbuilder" rel="noopener">Open in the builder ↗</a><span class="muted small">${progs.length} block${progs.length === 1 ? '' : 's'} × tracks · ${esc(TYPE_TXT[pl.plan_type] || '')}</span></div>
  </div>`, 'pzsheet');
  ov.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { ov.remove(); selectAthlete(b.dataset.open); });
  ov.querySelectorAll('[data-phase]').forEach(b => b.onclick = async () => {
    const k = b.dataset.phase;
    if(await savePzSettings(s => { s.phases ||= {}; s.phases[planId] ||= {}; if(k) s.phases[planId][c.bi] = k; else delete s.phases[planId][c.bi]; })){
      toast(k ? c.name + ' is ' + PZ_PICK.find(p => p[0] === k)[1] + ' now' : c.name + ' back to its automatic colour'); ov.remove(); renderPeriodPage(); }
  });
  const saveNote = async txt => { if(await savePzSettings(s => { s.notes ||= {}; if(txt) s.notes[planId + '|' + w] = txt; else delete s.notes[planId + '|' + w]; })){ toast(txt ? 'Note saved' : 'Note removed'); ov.remove(); renderPeriodPage(); } };
  if(ov.querySelector('#pzNoteSave')) ov.querySelector('#pzNoteSave').onclick = () => saveNote(ov.querySelector('#pzNote').value.trim());
  if(ov.querySelector('#pzNoteDel')) ov.querySelector('#pzNoteDel').onclick = () => saveNote('');
}

function renderHome(){
  const H = S.H, now = new Date(), mon = mondayOf(now), monS = ymd(mon);
  const athletes = S.athletes.filter(a => a.role !== 'coach');
  const ids = new Set(athletes.map(a => a.id));
  const groupMembers = gid => S.members.filter(m => m.group_id === gid).map(m => m.profile_id);
  // who is on which plan (resolving groups)
  const progPlan = Object.fromEntries(H.progs.map(p => [p.id, p]));
  const onPlan = {};      // plan_id -> Set(athlete)
  const onLive = new Set();
  H.asg.forEach(a => {
    const p = progPlan[a.program_id]; if(!p) return;
    const who = a.athlete_id ? [a.athlete_id] : a.group_id ? groupMembers(a.group_id) : [];
    who.filter(x => ids.has(x)).forEach(x => { (onPlan[p.plan_id] ||= new Set()).add(x); if(p.status === 'published') onLive.add(x); });
  });
  // training
  const thisWeek = H.logs.filter(l => l.completed_at >= monS);
  const trainedWk = new Set(thisWeek.map(l => l.athlete_id).filter(x => ids.has(x)));
  const lastWeekSame = H.logs.filter(l => { const d = new Date(l.completed_at); return d >= addDays(mon, -7) && d < addDays(now, -7); }).length;
  const lastTrained = {}; H.logs.forEach(l => { if(!lastTrained[l.athlete_id]) lastTrained[l.athlete_id] = l.completed_at; });
  const noProg = athletes.filter(a => !onLive.has(a.id));
  const liveCount = athletes.filter(a => onLive.has(a.id)).length;
  // group breakdown for the athletes tile
  const gCounts = S.groups.map(g => [g.name, groupMembers(g.id).filter(x => ids.has(x)).length]).filter(x => x[1]).sort((a,b) => b[1] - a[1]).slice(0, 3);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const hr = now.getHours(), greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const firstName = String(S.me.full_name || 'Coach').split(' ')[0];

  // program position
  const planPos = pl => {
    const blocks = Array.isArray(pl.blocks) ? pl.blocks.filter(b => +b.weeks > 0) : [];
    const total = pl.total_weeks || blocks.reduce((t,b) => t + (+b.weeks), 0) || 1;
    let start = pl.start_date ? parseD(pl.start_date) : null;
    if(!start){
      const pids = H.progs.filter(p => p.plan_id === pl.id).map(p => p.id);
      const first = H.asg.filter(a => pids.includes(a.program_id)).map(a => a.created_at).filter(Boolean).sort()[0];
      if(first) start = mondayOf(new Date(first));
    }
    if(!start) return {total, blocks, week:null};
    const week = Math.floor(dayDiff(monS, ymd(start)) / 7) + 1;
    let acc = 0, bi = -1, wib = 0;
    blocks.forEach((b, i) => { if(bi < 0 && week <= acc + (+b.weeks)){ bi = i; wib = week - acc; } acc += +b.weeks; });
    const end = addDays(start, total * 7 - 1);
    let nextBlock = null, a2 = 0;
    for(const b of blocks){ a2 += +b.weeks; if(a2 >= week && a2 < total){ nextBlock = addDays(start, a2 * 7); break; } }
    return {total, blocks, week, start, end, bi, wib, nextBlock};
  };
  const TYPE_ORDER = {BASE:0, COMPETITIVE:1, FNDN:2};
  const auto = H.plans.filter(p => p.plan_type !== 'INDIVIDUAL' && H.progs.some(q => q.plan_id === p.id))
    .sort((a,b) => (TYPE_ORDER[a.plan_type] ?? 9) - (TYPE_ORDER[b.plan_type] ?? 9) || a.name.localeCompare(b.name));
  const indiv = H.plans.filter(p => p.plan_type === 'INDIVIDUAL' && H.progs.some(q => q.plan_id === p.id)).map(pl => ({pl, pos:planPos(pl), who:[...(onPlan[pl.id] || [])]}))
    .filter(x => x.who.length || x.pl.athlete_id)
    .sort((a,b) => (a.pos.end ? a.pos.end : 9e15) - (b.pos.end ? b.pos.end : 9e15));
  const indivRows = indiv.map(({pl, pos, who}) => {
    const aid = who[0] || pl.athlete_id, live = H.progs.some(q => q.plan_id === pl.id && q.status === 'published');
    const left = pos.end ? Math.ceil((pos.end - now) / 864e5) : null;
    const st = pos.week == null ? 'Not started' : pos.week < 1 ? 'Starts ' + dShort(ymd(pos.start)) : pos.week > pos.total ? 'Finished' : `Week ${pos.week} of ${pos.total}`;
    const soon = left != null && left >= 0 && left <= 14;
    return `<tr><td><button class="alink" data-ath="${aid}">${esc(athleteName(aid))}</button></td><td class="muted">${esc(pl.name)}</td>
      <td>${esc(st)}${pos.week >= 1 && pos.week <= pos.total ? `<div class="mini"><i style="width:${pct(pos.week, pos.total)}%"></i></div>` : ''}</td>
      <td class="${soon ? 'amber' : 'muted'}">${pos.end ? (left < 0 ? 'Ended ' : 'Ends ') + dShort(ymd(pos.end)) : ''}</td>
      <td>${live ? '' : '<span class="pill draft">Draft</span>'}</td></tr>`;
  }).join('');
  const pzHtml = periodisation({auto, indiv, planPos, onPlan, trainedWk, monS, now});
  const latest = H.logs.slice(0, 12).map(l => `<button class="feed" data-ath="${l.athlete_id}"><span class="av">${esc(initials(athleteName(l.athlete_id)))}</span>
      <span class="fb"><b>${esc(athleteName(l.athlete_id))}</b><span class="muted small">${esc((l.sessions && (l.sessions.code || l.sessions.title)) || 'Session')}${l.sessions && l.sessions.code && l.sessions.title ? ' · ' + esc(l.sessions.title) : ''}</span></span>
      <span class="ft">${esc(relTime(l.completed_at))}</span></button>`).join('');
  const quiet = athletes.filter(a => onLive.has(a.id) && !trainedWk.has(a.id))
    .sort((a,b) => (lastTrained[a.id] || '').localeCompare(lastTrained[b.id] || ''));
  const quietRows = quiet.slice(0, 10).map(a => `<button class="feed" data-ath="${a.id}"><span class="av dim">${esc(initials(a.name))}</span>
      <span class="fb"><b>${esc(a.name)}</b><span class="muted small">${lastTrained[a.id] ? 'Last trained ' + relTime(lastTrained[a.id]) : 'Nothing logged in 3 weeks'}</span></span></button>`).join('');
  // maxes: latest entry per athlete+lift in the last 30 days, with the previous best
  const cutoff = ymd(addDays(now, -30)), seen = new Set(), newMax = [];
  H.maxes.forEach(m => {
    const k = m.athlete_id + '|' + m.exercise_id; if(seen.has(k)) return; seen.add(k);
    if((m.recorded_on || '') < cutoff || !ids.has(m.athlete_id)) return;
    const prev = H.maxes.filter(x => x.athlete_id === m.athlete_id && x.exercise_id === m.exercise_id && x !== m && (x.recorded_on || '') <= (m.recorded_on || '')).map(x => +x.weight_kg);
    const best = prev.length ? Math.max(...prev) : null;
    newMax.push({...m, up: best != null ? +m.weight_kg - best : null});
  });
  const maxRows = newMax.slice(0, 8).map(m => `<button class="feed" data-ath="${m.athlete_id}"><span class="fb"><b>${esc(athleteName(m.athlete_id))}</b><span class="muted small">${esc((S.ex[m.exercise_id] || {}).name || 'Lift')} · ${esc(dShort(m.recorded_on))}</span></span>
      <span class="mxv"><b class="num">${+m.weight_kg}</b> kg${m.up > 0 ? `<span class="up">+${+m.up.toFixed(1)}</span>` : ''}</span></button>`).join('');
  const evRows = H.events.slice(0, 4).map(e => `<div class="evrow"><span class="evd"><b>${parseD(e.event_date).getDate()}</b>${MONTHS[parseD(e.event_date).getMonth()].slice(0,3)}</span>
      <span class="fb"><b>${esc(e.title)}</b><span class="muted small">${esc(parseD(e.event_date).toLocaleDateString('en-AU', {weekday:'long'}))}${e.event_time ? ' · ' + esc(e.event_time.slice(0,5)) : ''}${e.location ? ' · ' + esc(e.location) : ''}</span></span></div>`).join('');

  // new athletes: signed up, not on any program yet
  const onAny = new Set(); Object.values(onPlan).forEach(set => set.forEach(x => onAny.add(x)));
  const newAth = athletes.filter(a => !onAny.has(a.id)).sort((a,b) => (b.created_at || '').localeCompare(a.created_at || ''));
  const assignable = H.plans.filter(p => p.plan_type !== 'INDIVIDUAL' && H.progs.some(q => q.plan_id === p.id))
    .sort((a,b) => (TYPE_ORDER[a.plan_type] ?? 9) - (TYPE_ORDER[b.plan_type] ?? 9) || a.name.localeCompare(b.name));
  const hasIndiv = H.plans.some(p => p.plan_type === 'INDIVIDUAL');
  const planOpts = ['BASE','COMPETITIVE','FNDN'].map(t => {
    const ps = assignable.filter(p => p.plan_type === t); if(!ps.length) return '';
    return `<optgroup label="${TYPE_TXT[t]}">${ps.map(p => { const live = H.progs.some(q => q.plan_id === p.id && q.status === 'published'); const pos = planPos(p);
      return `<option value="${p.id}">${esc(p.name)}${pos.week >= 1 && pos.week <= pos.total ? ' · wk ' + pos.week : pos.week != null && pos.week < 1 ? ' · starts ' + dShort(ymd(pos.start)) : ''}${live ? '' : ' (draft)'}</option>`; }).join('')}</optgroup>`;
  }).join('');
  const newRows = newAth.map(a => {
