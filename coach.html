/* ---------- Forms: build a form, send it to groups or athletes (now, scheduled, repeating), read the replies ----------
   forms (questions as JSON), form_sends (who / when / repeat), form_requests (one per athlete per round, answers on it).
   Anything Claude drafts is status 'draft' and only goes out when sent from here (coach_send_form). */
const FQ_TYPES = [['short','Short answer'],['long','Long answer'],['choice','Multiple choice'],['multi','Checkboxes'],['scale','Scale'],['yesno','Yes / No'],['number','Number'],['date','Date']];
const FQ_NAME = Object.fromEntries(FQ_TYPES);
const F_REPEAT = {none:'Once', daily:'Every day', weekly:'Every week', fortnightly:'Every fortnight', monthly:'Every month'};
S.FM = {tab:'replies', sel:null, round:null, mode:'summary', edit:null};
const fmtPerth = (t, o) => new Date(t).toLocaleString('en-AU', Object.assign({timeZone:'Australia/Perth', weekday:'short', day:'numeric', month:'short', hour:'numeric', minute:'2-digit'}, o || {})).replace(/:00(?= ?[ap]m)/i, '');
const fAgo = t => { const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? 'just now' : s < 3600 ? Math.round(s / 60) + 'm ago' : s < 86400 ? Math.round(s / 3600) + 'h ago' : Math.round(s / 86400) + 'd ago'; };
const perthISO = (date, time) => date + 'T' + (time || '00:00') + ':00+08:00';   // Perth has no daylight saving
const qid = () => 'q' + Math.random().toString(36).slice(2, 8);
function formsSeen(){ try { return localStorage.getItem('rc-forms-seen') || '1970-01-01'; } catch(e){ return '1970-01-01'; } }
async function refreshFormsBadge(){
  const { count, error } = await sb.from('form_requests').select('id', {count:'exact', head:true}).gt('responded_at', formsSeen());
  S.formN = error ? 0 : (count || 0); if(S.view !== 'forms') renderNav();
}
async function loadFormsPage(){
  const F = S.FM;
  if(!F.data) $('main').innerHTML = '<div class="empty"><span class="spin"></span> Loading forms</div>';
  const [f, s, r] = await Promise.all([
    sb.from('forms').select('*').order('updated_at', {ascending:false}),
    sb.from('form_sends').select('*').order('created_at', {ascending:false}),
    fetchAll(() => sb.from('form_requests').select('id,send_id,form_id,athlete_id,round_at,sent_at,closes_at,nudged_at,responded_at,answers,snapshot').order('round_at', {ascending:false}))
  ]);
  if(S.view !== 'forms') return;
  const err = f.error || s.error || r.error;
  if(err){ $('main').innerHTML = `<div class="empty">Could not load forms: ${esc(err.message)}${/relation|does not exist/.test(err.message) ? '<br>The forms database update (update 9) needs to be run first.' : ''}</div>`; return; }
  F.data = {forms: f.data || [], sends: s.data || [], reqs: r.data || []};
  F.byForm = Object.fromEntries(F.data.forms.map(x => [x.id, x]));
  try { localStorage.setItem('rc-forms-seen', new Date().toISOString()); } catch(e){}
  S.formN = 0; renderNav();
  renderFormsPage();
}
function sendStatus(s){
  if(s.status === 'draft') return ['Draft', 'draft'];
  if(s.status === 'active' && !s.last_round_at) return ['Scheduled', 'f-sched'];
  if(s.status === 'active') return [s.repeat === 'none' ? 'Sending' : 'Repeating', 'f-active'];
  return ({paused:['Paused','f-paused'], sent:['Sent','f-sent'], ended:['Ended','f-ended']})[s.status] || [s.status, 'f-sent'];
}
function sendAudience(s){
  const g = (s.group_ids || []).map(id => (S.groups.find(x => x.id === id) || {}).name).filter(Boolean);
  const a = (s.athlete_ids || []).map(athleteName);
  const parts = g.concat(a.length > 3 ? [a.slice(0, 2).join(', ') + ' + ' + (a.length - 2) + ' more'] : a);
  return parts.join(', ') || 'Nobody picked yet';
}
function sendWhen(s){
  const rep = s.repeat !== 'none' ? F_REPEAT[s.repeat] + (s.ends_on ? ' until ' + new Date(s.ends_on + 'T00:00').toLocaleDateString('en-AU', {day:'numeric', month:'short'}) : '') : '';
  if(s.status === 'draft') return (s.first_at ? 'Planned for ' + fmtPerth(s.first_at) : 'Not sent') + (rep ? ' · ' + rep : '');
  if(s.status === 'active' && s.next_at) return (s.last_round_at ? 'Last sent ' + fmtPerth(s.last_round_at) + ' · next ' : 'Goes out ') + fmtPerth(s.next_at) + (rep ? ' · ' + rep : '');
  return (s.last_round_at ? 'Sent ' + fmtPerth(s.last_round_at) : '') + (rep ? ' · ' + rep : '') + (s.status === 'paused' ? ' · paused' : '');
}
function roundsOf(sid){ return [...new Set(S.FM.data.reqs.filter(r => r.send_id === sid).map(r => r.round_at))].sort().reverse(); }
function renderFormsPage(){
  const F = S.FM;
  if(F.edit) return renderFormEditor();
  if(F.sel && F.data.sends.some(s => s.id === F.sel)) return renderSendDetail();
  F.sel = null;
  const D = F.data;
  const newCnt = D.reqs.filter(r => r.responded_at && new Date(r.responded_at) > Date.now() - 864e5).length;
  let body = '';
  if(F.tab === 'replies'){
    const waiting = D.sends.filter(s => s.status === 'draft' || (s.status === 'active' && !s.last_round_at));
    const rest = D.sends.filter(s => !waiting.includes(s)).map(s => {
      const reqs = D.reqs.filter(r => r.send_id === s.id), last = reqs.reduce((m, r) => r.responded_at && r.responded_at > m ? r.responded_at : m, s.last_round_at || s.created_at);
      return {s, last};
    }).sort((a, b) => b.last.localeCompare(a.last)).map(x => x.s);
    const item = s => {
      const form = F.byForm[s.form_id] || {title:'(deleted form)'}, [st, cls] = sendStatus(s);
      const cur = s.last_round_at ? D.reqs.filter(r => r.send_id === s.id && r.round_at === s.last_round_at) : [];
      const done = cur.filter(r => r.responded_at).length;
      return `<button class="frm-item" data-fs="${s.id}"><span class="t">${esc(form.title)}<span class="pill ${cls}">${st}</span></span>
        <span class="m">${esc(sendAudience(s))} · ${esc(sendWhen(s))}</span>
        <span class="r">${cur.length ? `<span class="frm-prog"><span><b>${done}/${cur.length}</b> replied</span><span class="frm-bar"><i style="width:${Math.round(done / cur.length * 100)}%"></i></span></span>`
          : `<span class="small muted">${s.status === 'draft' ? 'Review and send ›' : ''}</span>`}</span></button>`;
    };
    body = (waiting.length ? `<div class="frm-sec">Waiting to go out</div><div class="frm-list">${waiting.map(item).join('')}</div>` : '')
      + (rest.length ? `<div class="frm-sec">Sent</div><div class="frm-list">${rest.map(item).join('')}</div>` : '')
      + (!D.sends.length ? `<div class="panel empty">Nothing sent yet. Build a form under Forms, then press Send.</div>` : '');
  } else {
    const live = D.forms.filter(f => f.status !== 'archived');
    body = live.length ? `<div class="frm-list">${live.map(f => {
      const sends = D.sends.filter(s => s.form_id === f.id), replies = D.reqs.filter(r => r.form_id === f.id && r.responded_at).length;
      return `<div class="frm-item"><span class="t">${esc(f.title)}<span class="pill ${f.status === 'draft' ? 'draft' : 'f-pub'}">${f.status === 'draft' ? 'Draft' : 'Ready'}</span></span>
        <span class="m">${(f.questions || []).length} question${(f.questions || []).length === 1 ? '' : 's'} · ${sends.length ? 'sent ' + sends.filter(s => s.status !== 'draft').length + '×, ' + replies + ' repl' + (replies === 1 ? 'y' : 'ies') : 'not sent yet'} · edited ${fAgo(f.updated_at)}</span>
        <span class="r frm-acts"><button class="btn sm" data-fe="${f.id}">Edit</button><button class="btn sm" data-fdup="${f.id}">Duplicate</button><button class="btn sm ghost danger" data-fdel="${f.id}">Delete</button><button class="btn pri sm" data-fsend="${f.id}">Send…</button></span></div>`;
    }).join('')}</div>` : `<div class="panel empty">No forms yet. Start one with New form, or ask Claude to draft one for you.</div>`;
  }
  $('main').innerHTML = `<div class="page"><div class="frm-top"><div><h1>Forms</h1><p class="intro">Send a form to a group or to athletes. It pops up in their app and on their phone, and the answers land here.</p></div>
      <button class="btn pri" id="fNew">+ New form</button></div>
    <div class="frm-tabs"><button class="${F.tab === 'replies' ? 'on' : ''}" data-ft="replies">Replies${newCnt ? `<span class="nbadge">${newCnt}</span>` : ''}</button><button class="${F.tab === 'forms' ? 'on' : ''}" data-ft="forms">Forms</button></div>
    ${body}</div>`;
  $('main').querySelectorAll('[data-ft]').forEach(b => b.onclick = () => { F.tab = b.dataset.ft; renderFormsPage(); });
  $('fNew').onclick = () => { F.edit = {title:'', intro:'', questions:[{id:qid(), type:'scale', label:'', required:true, min:1, max:10}], status:'draft'}; renderFormsPage(); };
  $('main').querySelectorAll('[data-fs]').forEach(b => b.onclick = () => {
    const s = D.sends.find(x => x.id === b.dataset.fs);
    if(s.status === 'draft') return openSendForm(F.byForm[s.form_id], s);
    F.sel = s.id; F.round = null; renderFormsPage(); });
  $('main').querySelectorAll('[data-fe]').forEach(b => b.onclick = () => { F.edit = JSON.parse(JSON.stringify(F.byForm[b.dataset.fe])); renderFormsPage(); });
  $('main').querySelectorAll('[data-fsend]').forEach(b => b.onclick = () => openSendForm(F.byForm[b.dataset.fsend]));
  $('main').querySelectorAll('[data-fdup]').forEach(b => b.onclick = () => { const o = F.byForm[b.dataset.fdup];
    F.edit = {title: o.title + ' (copy)', intro: o.intro, questions: JSON.parse(JSON.stringify(o.questions || [])), status:'draft'}; renderFormsPage(); });
  $('main').querySelectorAll('[data-fdel]').forEach(b => b.onclick = async () => {
    const f = F.byForm[b.dataset.fdel], has = D.reqs.some(r => r.form_id === f.id);
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Confirm delete'; toast(has ? 'It has been sent, so it will be hidden and its replies kept.' : 'This deletes the form for good.'); setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = 'Delete'; } }, 4000); return; }
    b.disabled = true;
    if(has){
      const live = D.sends.filter(s => s.form_id === f.id && (s.status === 'active' || s.status === 'paused'));
      for(const s of live) await sb.rpc('coach_form_send_action', {p_send:s.id, p_action:'end'});
    }
    const { error } = has ? await sb.from('forms').update({status:'archived'}).eq('id', f.id) : await sb.from('forms').delete().eq('id', f.id);
    if(error){ b.disabled = false; return toast(error.message); }
    toast(has ? 'Form hidden. Replies are still under Replies.' : 'Form deleted'); loadFormsPage(); });
}

/* reply detail for one send */
function fAnswer(q, v){
  if(v == null || v === '' || (Array.isArray(v) && !v.length)) return null;
  if(q.type === 'yesno') return v === true || v === 'yes' ? 'Yes' : 'No';
  if(Array.isArray(v)) return v.join(', ');
  if(q.type === 'date') return new Date(v + 'T00:00').toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short'});
  if(q.type === 'scale') return v + ' / ' + (q.max || 10);
  return String(v);
}
function questionSummary(q, done){
  const vals = done.map(r => ({r, v:(r.answers || {})[q.id]})).filter(x => fAnswer(q, x.v) != null);
  const head = `<div class="frm-qh"><b>${esc(q.label || 'Question')}</b><span>${FQ_NAME[q.type] || ''} · ${vals.length} answer${vals.length === 1 ? '' : 's'}</span></div>`;
  if(!vals.length) return `<div class="panel">${head}<div class="small muted">No answers yet.</div></div>`;
  const bars = (rows) => { const max = Math.max(1, ...rows.map(x => x[1]));
    return `<div class="frm-hb">${rows.map(([l, n]) => `<span>${esc(l)}</span><span class="bar"><i style="width:${n / max * 100}%"></i></span><span class="n">${n}</span>`).join('')}</div>`; };
  if(q.type === 'choice' || q.type === 'multi' || q.type === 'yesno'){
    const opts = q.type === 'yesno' ? ['Yes', 'No'] : (q.options || []);
    const cnt = Object.fromEntries(opts.map(o => [o, 0]));
    vals.forEach(({v}) => (Array.isArray(v) ? v : [q.type === 'yesno' ? fAnswer(q, v) : v]).forEach(o => cnt[o] = (cnt[o] || 0) + 1));
    return `<div class="panel">${head}${bars(Object.entries(cnt))}</div>`;
  }
  if(q.type === 'scale' || q.type === 'number'){
    const ns = vals.map(x => +x.v).filter(n => !isNaN(n)), avg = ns.reduce((a, b) => a + b, 0) / ns.length;
    const r1 = n => Math.round(n * 10) / 10;
    let dist = '';
    const lo = q.min != null ? +q.min : 1, hi = q.max != null ? +q.max : 10;
    if(q.type === 'scale'){ const rows = []; for(let i = lo; i <= hi; i++) rows.push([String(i) + (i === lo && q.low ? ' ' + q.low : i === hi && q.high ? ' ' + q.high : ''), ns.filter(n => n === i).length]); dist = bars(rows); }
    const low = q.type === 'scale' ? vals.filter(x => +x.v <= lo + Math.floor((hi - lo) * 0.3)) : [];
    return `<div class="panel">${head}<div class="frm-avg"><span><b>${r1(avg)}</b>average</span><span><b>${r1(Math.min(...ns))}</b>lowest</span><span><b>${r1(Math.max(...ns))}</b>highest</span></div>${dist}
      ${low.length ? `<div class="small muted" style="margin-top:8px">Low scores: ${low.map(x => `<button class="frm-who" style="display:inline" data-fa="${x.r.athlete_id}">${esc(athleteName(x.r.athlete_id))} (${x.v})</button>`).join(', ')}</div>` : ''}</div>`;
  }
  return `<div class="panel">${head}<div class="frm-txt">${vals.map(({r, v}) => `<div><button class="frm-who" data-fa="${r.athlete_id}">${esc(athleteName(r.athlete_id))}</button>${esc(fAnswer(q, v))}</div>`).join('')}</div></div>`;
}
function renderSendDetail(){
  const F = S.FM, D = F.data, s = D.sends.find(x => x.id === F.sel), form = F.byForm[s.form_id] || {title:'(deleted form)', questions:[]};
  const rounds = roundsOf(s.id);
  if(!F.round || !rounds.includes(F.round)) F.round = rounds[0] || null;
  const reqs = D.reqs.filter(r => r.send_id === s.id && r.round_at === F.round);
  const done = reqs.filter(r => r.responded_at).sort((a, b) => b.responded_at.localeCompare(a.responded_at));
  const open = reqs.filter(r => !r.responded_at && (!r.closes_at || new Date(r.closes_at) > new Date()));
  const missed = reqs.filter(r => !r.responded_at && r.closes_at && new Date(r.closes_at) <= new Date());
  const qs = (done[0] && done[0].snapshot) || form.questions || [];
  // questions answered on an older version of the form still show
  const allQ = qs.slice(); done.forEach(r => (r.snapshot || []).forEach(q => { if(!allQ.some(x => x.id === q.id)) allQ.push(q); }));
  const [st, cls] = sendStatus(s);
  const acts = [];
  if(s.status === 'active' && s.repeat !== 'none') acts.push(`<button class="btn sm" data-fx="pause">Pause</button>`);
  if(s.status === 'active' && !s.last_round_at) acts.push(`<button class="btn sm" data-fx="end">Cancel send</button>`);
  if(s.status === 'paused') acts.push(`<button class="btn sm pri" data-fx="resume">Resume</button>`);
  if((s.status === 'active' || s.status === 'paused') && s.repeat !== 'none' && s.last_round_at) acts.push(`<button class="btn sm ghost danger" data-fx="end">Stop repeating</button>`);
  if(open.length && F.round === rounds[0]) acts.push(`<button class="btn sm ghost" data-fx="close" title="Stop taking replies to this round">Close replies</button>`);
  acts.push(`<button class="btn sm" id="fEditForm">Edit form</button>`, `<button class="btn sm" id="fAgain">Send again</button>`);
  if(done.length) acts.push(`<button class="btn sm" id="fCsv">Download CSV</button>`);
  const lastReply = done[0] ? fAgo(done[0].responded_at) : '–';
  $('main').innerHTML = `<div class="page">
    <div><button class="btn ghost sm" id="fBack" style="margin-left:-8px">‹ All replies</button>
      <div class="frm-top" style="margin-top:6px"><div><h1>${esc(form.title)} <span class="pill ${cls}" style="vertical-align:middle">${st}</span></h1>
        <p class="intro">${esc(sendAudience(s))} · ${esc(sendWhen(s))}</p></div>
        ${rounds.length > 1 ? `<label class="small muted" style="display:flex;gap:8px;align-items:center">Round <select id="fRound" style="width:auto">${rounds.map((r, i) => `<option value="${r}" ${r === F.round ? 'selected' : ''}>${fmtPerth(r, {hour:undefined, minute:undefined})}${i ? '' : ' (latest)'}</option>`).join('')}</select></label>` : ''}</div>
      <div class="frm-acts" style="margin-top:10px">${acts.join('')}</div></div>
    ${rounds.length ? `<div class="frm-tiles">
      <div class="frm-tile g"><span class="l">Replied</span><span class="v">${done.length} / ${reqs.length}</span></div>
      <div class="frm-tile a"><span class="l">${missed.length ? 'Missed' : 'Waiting'}</span><span class="v">${missed.length ? missed.length : open.length}</span></div>
      <div class="frm-tile b"><span class="l">Last reply</span><span class="v">${lastReply}</span></div>
      <div class="frm-tile"><span class="l">${s.next_at && s.status === 'active' ? 'Next round' : 'Sent'}</span><span class="v" style="font-size:15px">${s.next_at && s.status === 'active' ? fmtPerth(s.next_at) : F.round ? fmtPerth(F.round) : '–'}</span></div></div>
    <div class="frm-cols"><div>
      <div class="frm-tabs" style="margin-bottom:12px"><button class="${F.mode === 'summary' ? 'on' : ''}" data-fm="summary">Summary</button><button class="${F.mode === 'athletes' ? 'on' : ''}" data-fm="athletes">By athlete</button></div>
      ${!done.length ? '<div class="panel empty">No replies yet.</div>' : F.mode === 'summary' ? `<div class="frm-qs">${allQ.map(q => questionSummary(q, done)).join('')}</div>`
        : `<div class="frm-ath">${done.map(r => `<div class="panel"><div class="frm-qh"><button class="frm-who" style="color:var(--text);font-size:14px" data-fa="${r.athlete_id}">${esc(athleteName(r.athlete_id))}</button><span>${fmtPerth(r.responded_at)}</span></div>
          <dl>${(r.snapshot || qs).map(q => { const a = fAnswer(q, (r.answers || {})[q.id]); return `<dt>${esc(q.label)}</dt><dd class="${a ? '' : 'none'}">${a ? esc(a) : 'No answer'}</dd>`; }).join('')}</dl></div>`).join('')}</div>`}
    </div>
    <div class="panel"><h2>${missed.length && !open.length ? 'Didn\'t reply' : 'Waiting on'} <span class="small muted">${open.length + missed.length}</span></h2>
      ${open.length ? `<button class="btn sm pri" id="fNudgeAll" style="margin-bottom:8px">Nudge all ${open.length}</button>` : ''}
      <div class="frm-wait">${open.concat(missed).sort((a, b) => athleteName(a.athlete_id).localeCompare(athleteName(b.athlete_id))).map(r => `<div class="frm-wrow">
        <button class="nm" data-fa="${r.athlete_id}">${esc(athleteName(r.athlete_id))}<small>${r.nudged_at ? 'Nudged ' + fAgo(r.nudged_at) : 'Sent ' + fAgo(r.sent_at)}${open.includes(r) ? '' : ' · closed'}</small></button>
        ${open.includes(r) ? `<button class="btn sm ghost" data-fn="${r.id}">Nudge</button>` : ''}</div>`).join('') || '<div class="small muted">Everyone has replied. 🎉</div>'}</div></div></div>`
    : `<div class="panel empty">${s.next_at ? 'Goes out ' + fmtPerth(s.next_at) + '.' : 'Nothing sent yet.'}</div>`}
  </div>`;
  $('fBack').onclick = () => { F.sel = null; renderFormsPage(); };
  $('fRound') && ($('fRound').onchange = e => { F.round = e.target.value; renderSendDetail(); });
  $('main').querySelectorAll('[data-fm]').forEach(b => b.onclick = () => { F.mode = b.dataset.fm; renderSendDetail(); });
  $('main').querySelectorAll('[data-fa]').forEach(b => b.onclick = () => { if(S.athletes.some(a => a.id === b.dataset.fa)) selectAthlete(b.dataset.fa); });
  $('fEditForm').onclick = () => { if(!F.byForm[s.form_id]) return toast('That form was deleted'); F.edit = JSON.parse(JSON.stringify(F.byForm[s.form_id])); renderFormsPage(); };
  $('fAgain').onclick = () => { if(!F.byForm[s.form_id]) return toast('That form was deleted'); openSendForm(F.byForm[s.form_id], {group_ids:s.group_ids, athlete_ids:s.athlete_ids, late_joiners:s.late_joiners, repeat:'none'}); };
  $('main').querySelectorAll('[data-fx]').forEach(b => b.onclick = async () => {
    const act = b.dataset.fx;
    if((act === 'end' || act === 'close') && b.dataset.sure !== '1'){ b.dataset.sure = '1'; const t = b.textContent; b.textContent = 'Tap again to confirm'; setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = t; } }, 4000); return; }
    b.disabled = true;
    const { error } = await sb.rpc('coach_form_send_action', {p_send:s.id, p_action:act});
    if(error){ b.disabled = false; return toast(error.message); }
    toast({pause:'Paused. No new rounds until you resume.', resume:'Resumed', end:'Stopped', close:'Replies closed for this round'}[act]); loadFormsPage(); });
  const nudge = async (ids, btn) => { btn.disabled = true; const { data, error } = await sb.rpc('coach_nudge_form', {p_ids:ids});
    if(error){ btn.disabled = false; return toast(error.message); } toast(data ? `Nudged ${data} athlete${data === 1 ? '' : 's'}` : 'Nobody left to nudge'); loadFormsPage(); };
  $('fNudgeAll') && ($('fNudgeAll').onclick = e => nudge(open.map(r => r.id), e.currentTarget));
  $('main').querySelectorAll('[data-fn]').forEach(b => b.onclick = () => nudge([b.dataset.fn], b));
  $('fCsv') && ($('fCsv').onclick = () => {
    const cell = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const lines = [['Athlete', 'Sent back'].concat(allQ.map(q => q.label)).map(cell).join(',')]
      .concat(done.map(r => [athleteName(r.athlete_id), fmtPerth(r.responded_at)].concat(allQ.map(q => fAnswer(q, (r.answers || {})[q.id]) || '')).map(cell).join(',')));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + lines.join('\n')], {type:'text/csv'}));
    a.download = (form.title || 'form').replace(/[^\w\- ]+/g, '').trim() + ' ' + (F.round || '').slice(0, 10) + '.csv'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

/* form builder */
function renderFormEditor(){
  const F = S.FM, E = F.edit;
  const sentN = E.id ? F.data.reqs.filter(r => r.form_id === E.id).length : 0;
  const qCard = (q, i) => `<div class="frm-qc" data-qi="${i}">
    <div class="qrow"><span class="qn">${i + 1}</span><input data-k="label" value="${esc(q.label || '')}" placeholder="Question" aria-label="Question ${i + 1}">
      <select data-k="type" aria-label="Answer type">${FQ_TYPES.map(([k, l]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="qbody"><input data-k="help" value="${esc(q.help || '')}" placeholder="Extra detail for athletes (optional)" aria-label="Help text">
      ${q.type === 'choice' || q.type === 'multi' ? `<textarea data-k="options" rows="${Math.max(3, (q.options || []).length + 1)}" placeholder="One option per line" aria-label="Options">${esc((q.options || []).join('\n'))}</textarea>` : ''}</div>
    ${q.type === 'scale' ? `<div class="qsub"><input data-k="min" type="number" value="${q.min ?? 1}" aria-label="Lowest" title="Lowest"><input data-k="max" type="number" value="${q.max ?? 10}" aria-label="Highest" title="Highest">
      <input data-k="low" value="${esc(q.low || '')}" placeholder="Label for lowest, e.g. Terrible" aria-label="Lowest label"><input data-k="high" value="${esc(q.high || '')}" placeholder="Label for highest, e.g. Great" aria-label="Highest label"></div>` : ''}
    <div class="qrow" style="padding-left:30px"><label class="req"><input type="checkbox" data-k="required" ${q.required ? 'checked' : ''}> Needs an answer</label><span class="sp"></span>
      <button class="qb" data-qa="up" ${i ? '' : 'disabled'} title="Move up" aria-label="Move up">↑</button><button class="qb" data-qa="down" ${i < E.questions.length - 1 ? '' : 'disabled'} title="Move down" aria-label="Move down">↓</button>
      <button class="qb" data-qa="dup" title="Duplicate" aria-label="Duplicate">⧉</button><button class="qb danger" data-qa="del" title="Remove" aria-label="Remove">✕</button></div></div>`;
  $('main').innerHTML = `<div class="page"><div><button class="btn ghost sm" id="feBack" style="margin-left:-8px">‹ Forms</button><h1 style="margin-top:6px">${E.id ? 'Edit form' : 'New form'}</h1>
      ${sentN ? `<p class="intro">Already sent ${sentN} time${sentN === 1 ? '' : 's'}. Changes show on forms that haven't been filled in yet and on future sends. Answers already in keep the questions they were answered with.</p>` : ''}</div>
    <div class="frm-ed">
      <label class="fld"><span>Title athletes see</span><input id="feTitle" class="ttl" value="${esc(E.title || '')}" placeholder="e.g. Weekly check-in" maxlength="120"></label>
      <label class="fld"><span>Intro (optional)</span><textarea id="feIntro" rows="2" placeholder="What it's for, how long it takes">${esc(E.intro || '')}</textarea></label>
      <div class="frm-qs" id="feQs">${E.questions.map(qCard).join('')}</div>
      <div class="frm-add"><span class="lbl">Add</span>${FQ_TYPES.map(([k, l]) => `<button class="btn sm" data-add="${k}">+ ${l}</button>`).join('')}</div>
      <div class="frm-edbar"><span class="st">${E.status === 'draft' ? 'Draft: athletes can\'t see it until you send it.' : ''}</span>
        <button class="btn ghost" id="feCancel">Cancel</button><button class="btn" id="feSave">Save</button><button class="btn pri" id="feSend">Save and send…</button></div>
    </div></div>`;
  const pull = () => {
    E.title = $('feTitle').value; E.intro = $('feIntro').value;
    $('feQs').querySelectorAll('[data-qi]').forEach(c => { const q = E.questions[+c.dataset.qi];
      c.querySelectorAll('[data-k]').forEach(inp => { const k = inp.dataset.k;
        if(k === 'required') q.required = inp.checked;
        else if(k === 'options') q.options = inp.value.split('\n').map(x => x.trim()).filter(Boolean);
        else if(k === 'min' || k === 'max') q[k] = inp.value === '' ? null : +inp.value;
        else if(k !== 'type') q[k] = inp.value; }); });
  };
  $('feQs').querySelectorAll('[data-qi]').forEach(c => {
    const i = +c.dataset.qi;
    c.querySelector('[data-k="type"]').onchange = e => { pull(); const q = E.questions[i]; q.type = e.target.value;
      if((q.type === 'choice' || q.type === 'multi') && !(q.options || []).length) q.options = ['', ''].filter(Boolean);
      if(q.type === 'scale'){ q.min = q.min ?? 1; q.max = q.max ?? 10; } renderFormEditor(); };
    c.querySelectorAll('[data-qa]').forEach(b => b.onclick = () => { pull(); const a = b.dataset.qa, Q = E.questions;
      if(a === 'up') [Q[i - 1], Q[i]] = [Q[i], Q[i - 1]];
      if(a === 'down') [Q[i + 1], Q[i]] = [Q[i], Q[i + 1]];
      if(a === 'dup') Q.splice(i + 1, 0, Object.assign(JSON.parse(JSON.stringify(Q[i])), {id:qid()}));
      if(a === 'del') Q.splice(i, 1);
      renderFormEditor(); });
  });
  $('main').querySelectorAll('[data-add]').forEach(b => b.onclick = () => { pull(); const t = b.dataset.add;
    E.questions.push(Object.assign({id:qid(), type:t, label:'', required:false}, t === 'scale' ? {min:1, max:10} : {}, t === 'choice' || t === 'multi' ? {options:[]} : {}));
    renderFormEditor(); const qs = $('feQs').querySelectorAll('[data-k="label"]'); qs[qs.length - 1].focus(); });
  $('feBack').onclick = $('feCancel').onclick = () => { F.edit = null; renderFormsPage(); };
  const save = async () => {
    pull();
    E.title = E.title.trim(); if(!E.title){ toast('Give the form a title'); $('feTitle').focus(); return null; }
    if(!E.questions.length){ toast('Add at least one question'); return null; }
    const blank = E.questions.findIndex(q => !String(q.label || '').trim()); if(blank >= 0){ toast(`Question ${blank + 1} needs some wording`); return null; }
    const noOpt = E.questions.findIndex(q => (q.type === 'choice' || q.type === 'multi') && (q.options || []).length < 2); if(noOpt >= 0){ toast(`Question ${noOpt + 1} needs at least two options`); return null; }
    const badScale = E.questions.findIndex(q => q.type === 'scale' && !(+q.max > +q.min && +q.max - +q.min <= 10)); if(badScale >= 0){ toast(`Question ${badScale + 1}: the scale needs a highest above its lowest, up to 11 steps`); return null; }
    const questions = E.questions.map(q => { const o = {id:q.id || qid(), type:q.type, label:q.label.trim(), required:!!q.required};
      if(q.help && q.help.trim()) o.help = q.help.trim();
      if(q.type === 'choice' || q.type === 'multi') o.options = q.options;
      if(q.type === 'scale'){ o.min = +q.min; o.max = +q.max; if(q.low) o.low = q.low.trim(); if(q.high) o.high = q.high.trim(); }
      return o; });
    const row = {title:E.title, intro:(E.intro || '').trim() || null, questions};
    const res = E.id ? await sb.from('forms').update(row).eq('id', E.id).select().single() : await sb.from('forms').insert(Object.assign(row, {status:'draft', created_by:S.user.id})).select().single();
    if(res.error){ toast(res.error.message); return null; }
    return res.data;
  };
  $('feSave').onclick = async () => { $('feSave').disabled = true; const f = await save(); if(!f){ $('feSave').disabled = false; return; }
    toast('Saved'); F.edit = null; F.tab = 'forms'; loadFormsPage(); };
  $('feSend').onclick = async () => { $('feSend').disabled = true; const f = await save(); $('feSend').disabled = false; if(!f) return;
    F.edit = null; F.tab = 'replies'; await loadFormsPage(); openSendForm(f); };
}

/* send window: who, when, repeat */
function openSendForm(form, draft){
  if(!form) return toast('That form was deleted');
  const d = Object.assign({group_ids:[], athlete_ids:[], late_joiners:true, repeat:'none'}, draft || {});
  const people = S.athletes.filter(a => a.active !== false).sort((a, b) => a.name.localeCompare(b.name));
  const groupsWith = S.groups.map(g => ({g, n: S.members.filter(m => m.group_id === g.id && people.some(p => p.id === m.profile_id && p.role !== 'coach')).length}));
  const tmr = ymd(addDays(new Date(), 1));
  const firstLocal = d.first_at ? new Date(new Date(d.first_at).getTime() + 8 * 3600e3).toISOString() : null;   // Perth wall clock
  const st = {groups:new Set(d.group_ids || []), ath:new Set(d.athlete_ids || []), when: d.first_at && new Date(d.first_at) > new Date() ? 'later' : 'now', q:''};
  const ov = sheet('Send "' + form.title + '"', `<div class="frm-snd" style="display:grid;gap:14px">
    <div class="fld"><span>Groups</span><div class="chips" id="sgG">${groupsWith.map(({g, n}) => `<button class="gch ${st.groups.has(g.id) ? 'on' : ''}" data-g="${g.id}">${esc(g.name)}<small>${n}</small></button>`).join('')}</div></div>
    <div class="fld"><span>Athletes</span><input id="sgQ" placeholder="Search athletes" aria-label="Search athletes"><div class="alist2" id="sgA"></div></div>
    <label class="tick" id="sgLateW"><input type="checkbox" id="sgLate" ${d.late_joiners !== false ? 'checked' : ''}> Also send it to athletes who join these groups while it's open</label>
    <div class="fld"><span>When</span><div class="seg" id="sgWhen"><button class="${st.when === 'now' ? 'on' : ''}" data-w="now">Send now</button><button class="${st.when === 'later' ? 'on' : ''}" data-w="later">Schedule</button></div></div>
    <div class="row2" id="sgLater"><label class="fld"><span>Date</span><input type="date" id="sgDate" value="${firstLocal ? firstLocal.slice(0, 10) : tmr}" min="${ymd(new Date())}"></label>
      <label class="fld"><span>Time (Perth)</span><input type="time" id="sgTime" value="${firstLocal ? firstLocal.slice(11, 16) : '07:00'}"></label></div>
    <div class="row2"><label class="fld"><span>Repeat</span><select id="sgRep">${Object.entries(F_REPEAT).map(([k, l]) => `<option value="${k}" ${d.repeat === k ? 'selected' : ''}>${k === 'none' ? 'Doesn\'t repeat' : l}</option>`).join('')}</select></label>
      <label class="fld" id="sgEndW"><span>Last round (optional)</span><input type="date" id="sgEnd" value="${d.ends_on || ''}"></label>
      <label class="fld" id="sgCloseW"><span>Stop taking replies (optional)</span><input type="date" id="sgClose" value="${d.close_at ? new Date(new Date(d.close_at).getTime() + 8 * 3600e3).toISOString().slice(0, 10) : ''}"></label></div>
    <div class="sum" id="sgSum"></div>
    <div class="row-act" style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn ghost" id="sgDraft">Save as draft</button><button class="btn pri" id="sgGo">Send now</button></div>
  </div>`, 'frm-modal');
  ov.querySelector('.modal').style.width = 'min(600px,100%)';
  const $o = sel => ov.querySelector(sel);
  const recipients = () => { const ids = new Set(st.ath);
    S.members.forEach(m => { if(st.groups.has(m.group_id)){ const p = people.find(x => x.id === m.profile_id); if(p && p.role !== 'coach') ids.add(p.id); } }); return ids; };
  const drawAth = () => { const q = st.q.trim().toLowerCase();
    $o('#sgA').innerHTML = people.filter(p => !q || p.name.toLowerCase().includes(q)).map(p => `<label><input type="checkbox" data-a="${p.id}" ${st.ath.has(p.id) ? 'checked' : ''}> ${esc(p.name)}${p.id === S.user.id ? ' <span class="muted small">(you, to test it)</span>' : p.role === 'coach' ? ' <span class="muted small">coach</span>' : ''}</label>`).join('') || '<div class="small muted" style="padding:6px 0">No match</div>';
    $o('#sgA').querySelectorAll('[data-a]').forEach(cb => cb.onchange = () => { cb.checked ? st.ath.add(cb.dataset.a) : st.ath.delete(cb.dataset.a); draw(); }); };
  const draw = () => {
    const rep = $o('#sgRep').value, later = st.when === 'later';
    $o('#sgLater').hidden = !later; $o('#sgEndW').hidden = rep === 'none'; $o('#sgCloseW').hidden = rep !== 'none';
    $o('#sgLateW').hidden = !st.groups.size;
    const n = recipients().size;
    const at = later ? fmtPerth(perthISO($o('#sgDate').value, $o('#sgTime').value)) : 'now';
    $o('#sgSum').innerHTML = !n ? 'Pick a group or some athletes.' : `Goes to <b>${n} athlete${n === 1 ? '' : 's'}</b> ${later ? 'on <b>' + esc(at) + '</b>' : '<b>straight away</b>'}${rep !== 'none' ? `, then <b>${F_REPEAT[rep].toLowerCase()}</b> at the same time${$o('#sgEnd').value ? ' until ' + esc(new Date($o('#sgEnd').value + 'T00:00').toLocaleDateString('en-AU', {day:'numeric', month:'short'})) : ''}. Each new round closes the last one` : ''}.
      They get a notification (if they've turned them on) and it pops up when they open the app.${form.status === 'draft' ? '' : ''}`;
    $o('#sgGo').textContent = later ? 'Schedule' : 'Send now';
  };
  $o('#sgG').querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const g = b.dataset.g; st.groups.has(g) ? st.groups.delete(g) : st.groups.add(g); b.classList.toggle('on'); draw(); });
  $o('#sgQ').oninput = e => { st.q = e.target.value; drawAth(); };
  $o('#sgWhen').querySelectorAll('[data-w]').forEach(b => b.onclick = () => { st.when = b.dataset.w; $o('#sgWhen').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); draw(); });
  ['#sgRep', '#sgDate', '#sgTime', '#sgEnd'].forEach(s => $o(s).onchange = draw);
  drawAth(); draw();
  const persist = async () => {
    const rep = $o('#sgRep').value, later = st.when === 'later';
    if(!recipients().size){ toast('Pick a group or some athletes'); return null; }
    const first = later ? perthISO($o('#sgDate').value, $o('#sgTime').value) : null;
    if(later && new Date(first) <= new Date()){ toast('Pick a time in the future, or Send now'); return null; }
    if(rep !== 'none' && $o('#sgEnd').value && $o('#sgEnd').value < (first || ymd(new Date())).slice(0, 10)){ toast('The last round is before the first'); return null; }
    const row = {form_id:form.id, group_ids:[...st.groups], athlete_ids:[...st.ath], late_joiners:$o('#sgLate').checked, repeat:rep, first_at:first,
      ends_on: rep !== 'none' ? ($o('#sgEnd').value || null) : null,
      close_at: rep === 'none' && $o('#sgClose').value ? perthISO($o('#sgClose').value, '23:59') : null};
    const res = d.id ? await sb.from('form_sends').update(row).eq('id', d.id).select().single() : await sb.from('form_sends').insert(Object.assign(row, {status:'draft', created_by:S.user.id})).select().single();

function computeCompliance(){
  const C = S.C, today = ymd(new Date()), fromS = ymd(C.from);
  const athletes = S.athletes.filter(a => a.role !== 'coach');
  const progById = Object.fromEntries(C.progs.map(p => [p.id, p]));
  const planById = Object.fromEntries(C.plans.map(p => [p.id, p]));
  const weeksOf = {}; C.sessions.forEach(x => { if(!x.override_athlete_id) weeksOf[x.program_id] = Math.max(weeksOf[x.program_id] || 0, x.week_number); });
  const shared = C.sessions.filter(x => !x.override_athlete_id), own = {};
  C.sessions.forEach(x => { if(x.override_athlete_id) (own[x.override_athlete_id] ||= []).push(x); });
  const hidden = {}; C.hidden.forEach(h => (hidden[h.athlete_id] ||= new Set()).add(h.session_id));
  const done = {}, last = {}; C.logs.forEach(l => { (done[l.athlete_id] ||= new Set()).add(l.session_id); if(!last[l.athlete_id] || l.completed_at > last[l.athlete_id]) last[l.athlete_id] = l.completed_at; });
  const gm = gid => S.members.filter(m => m.group_id === gid).map(m => m.profile_id);
  const myProgs = {};
  C.asg.forEach(a => { if(!progById[a.program_id]) return; (a.athlete_id ? [a.athlete_id] : a.group_id ? gm(a.group_id) : []).forEach(x => (myProgs[x] ||= new Map()).set(a.program_id, a)); });
  const weekStarts = Array.from({length:C.W}, (_, i) => ymd(addDays(C.from, i * 7)));
  C.rows = athletes.map(a => {
    const pm = myProgs[a.id];
    if(!pm || !pm.size) return {a, none:true, weeks:weekStarts.map(() => null), plans:[]};
    const base = {};
    pm.forEach((asg, pid) => {
      const p = progById[pid];
      if(p.start_date) base[pid] = parseD(p.start_date);
      else {
        const first = C.asg.filter(x => x.program_id === pid && (x.athlete_id === a.id || (x.group_id && gm(x.group_id).includes(a.id)))).map(x => x.created_at).filter(Boolean).sort()[0];
        if(first) base[pid] = addDays(mondayOf(new Date(first)), (p.week_offset || 0) * 7);
      }
    });
    const mineList = (own[a.id] || []).filter(x => pm.has(x.program_id));
    const replaced = new Set(mineList.filter(x => (x.override_kind || 'replace') !== 'extra').map(x => x.program_id + '|' + x.week_number + '|' + x.day_number));
    const list = shared.filter(x => pm.has(x.program_id) && !replaced.has(x.program_id + '|' + x.week_number + '|' + x.day_number))
      .concat(mineList.filter(x => x.override_kind !== 'removed'));
    const hid = hidden[a.id] || new Set(), dn = done[a.id] || new Set();
    // group into "cards" per date x plan x day option, like the calendar
    const cards = {};
    list.forEach(x => {
      if(hid.has(x.id)) return;
      const p = progById[x.program_id];
      let date = x.scheduled_date;
      if(!date){ const b = base[x.program_id]; if(!b) return; date = ymd(addDays(b, (x.week_number - 1) * 7 + (x.day_number - 1))); }
      if(date < fromS || date > today) return;
      const k = date + '|' + (p.plan_id || p.id) + '|' + (p.days_version || '');
      (cards[k] ||= {date, list:[]}).list.push({x, p});
    });
    const weeks = weekStarts.map(() => ({prog:0, done:0, part:0}));
    Object.values(cards).forEach(c => {
      const wi = Math.floor(dayDiff(c.date, fromS) / 7); if(wi < 0 || wi >= weeks.length) return;
      const opts = c.list.filter(y => y.p.is_option), choice = opts.length > 1;
      const req = c.list.filter(y => !(choice && y.p.is_option));
      const ok = req.every(y => dn.has(y.x.id)) && (!choice || opts.some(y => dn.has(y.x.id)));
      const any = c.list.some(y => dn.has(y.x.id));
      weeks[wi].prog++; if(ok) weeks[wi].done++; else if(any) weeks[wi].part++;
    });
    const tp = weeks.reduce((t, w) => t + w.prog, 0), td = weeks.reduce((t, w) => t + w.done, 0);
    const plans = [...new Set([...pm.keys()].map(pid => progById[pid].plan_id).filter(Boolean))].map(id => planById[id]).filter(Boolean);
    // last 2 full weeks vs the 2 before, for a trend arrow
    const span = (i, j) => { const ws = weeks.slice(i, j); const p = ws.reduce((t,w) => t + w.prog, 0); return p ? ws.reduce((t,w) => t + w.done, 0) / p : null; };
    const n = weeks.length, recent = span(n - 3, n - 1), before = span(n - 5, n - 3);
    return {a, weeks, tp, td, pct: tp ? td / tp : null, plans, last:last[a.id] || null, trend: recent != null && before != null ? recent - before : null};
  });
  C.weekStarts = weekStarts;
}

const safeYoutube = u => /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(u || '') ? u : null;
function ytId(u){ if(!safeYoutube(u)) return null; const m = u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }
function inlineMd(t){
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$|[.,!?])/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(text){
  const lines = esc(text || '').split('\n'); let out = '', list = false, para = [];
  const flush = () => { if(para.length){ out += '<p>' + inlineMd(para.join('<br>')) + '</p>'; para = []; } };
  for(const raw of lines){ const l = raw.trimEnd();
    if(/^- /.test(l)){ flush(); if(!list){ out += '<ul>'; list = true; } out += '<li>' + inlineMd(l.slice(2)) + '</li>'; continue; }
    if(list){ out += '</ul>'; list = false; }
    if(/^#{1,3} /.test(l)){ flush(); out += '<h3>' + inlineMd(l.replace(/^#{1,3} /,'')) + '</h3>'; continue; }
    if(!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); if(list) out += '</ul>'; return out;
}

function sortConvos(cs){
  const rank=c=>{ if(c.kind!=='group') return 99; const i=TEAM_CHATS.findIndex(t=>t.key===String(c.title||'').trim().toLowerCase()); return i<0?99:i; };
  return cs.map((c,i)=>({c,i})).sort((x,y)=>(rank(x.c)-rank(y.c))||(x.i-y.i)).map(x=>x.c);
}

    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:`conversation_id=eq.${id}`}, pl => {

    .on('postgres_changes', {event:'INSERT', schema:'public', table:'message_reactions', filter:`conversation_id=eq.${id}`}, pl => {
      const r = pl.new; if(!S.chat.rx.some(x => x.message_id === r.message_id && x.profile_id === r.profile_id && x.emoji === r.emoji)){ S.chat.rx.push(r); drawMsgs(false); } })

    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, pl => {

    const pv = $('imgPrev'); pv.hidden = false; pv.innerHTML = `<img src="${S.chat.pend.url}" alt=""><span class="muted small">Add a caption, then Send</span><button type="button" class="btn ghost sm" aria-label="Remove photo">✕</button>`;
    pv.querySelector('button').onclick = () => { S.chat.pend = null; pv.hidden = true; pv.innerHTML = ''; }; ta.focus(); };

    if(img){ const path = `${id}/${crypto.randomUUID()}.jpg`;
      const { error:ue } = await sb.storage.from('chat').upload(path, img.blob, {contentType:'image/jpeg'});
      if(ue){ toast('Photo did not upload: ' + ue.message); return; }
      Object.assign(rec, {image_path:path, image_w:img.w, image_h:img.h}); S.chat.urls[path] = img.url; }
    ta.value = ''; ta.style.height = 'auto'; S.chat.pend = null; $('imgPrev').hidden = true; $('imgPrev').innerHTML = '';
    const { data:m, error } = await sb.from('messages').insert(rec).select(MC).single();
    if(error){ toast(error.message); ta.value = text; return; }
    if(!S.chat.msgs.some(x => x.id === m.id)){ S.chat.msgs.push(m); drawMsgs(true); }
    refreshConvos().then(drawConvos); };
}
function drawMsgs(scroll){
  const box = $('msgs'); if(!box) return;
  if(!S.chat.msgs.length){ box.innerHTML = '<div class="empty">No messages yet. Say g\'day.</div>'; return; }
  let h = '', lastDay = '', lastAuthor = '';
  S.chat.msgs.forEach(m => {
    const day = new Date(m.created_at).toDateString();
    if(day !== lastDay){ h += `<div class="mday">${esc(new Date(m.created_at).toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'short'}))}</div>`; lastDay = day; lastAuthor = ''; }
    const mine = m.author_id === S.user.id, first = m.author_id !== lastAuthor; lastAuthor = m.author_id;
    h += `<div class="msg ${mine ? 'me' : ''} ${first ? 'first' : ''}">
      ${!mine && first && S.chat.kind === 'group' ? `<div class="mname">${esc(m.author_name || 'Athlete')}</div>` : ''}
      <div class="bub ${m.image_path ? 'has-img' : ''}" data-rxm="${m.id}">${m.image_path ? `<button class="mimg" data-view="${esc(m.image_path)}" style="aspect-ratio:${m.image_w && m.image_h ? m.image_w + '/' + m.image_h : '4/3'}">${S.chat.urls[m.image_path] ? `<img src="${S.chat.urls[m.image_path]}" alt="Photo" loading="lazy">` : ''}</button>` : ''}${m.image_path && m.body === '📷 Photo' ? '' : `<span class="mtx">${linkify(m.body)}</span>`}<span class="mt">${esc(new Date(m.created_at).toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'}))}</span></div>
      ${chatRxPills(m)}${S.chat.rxOpen === m.id ? `<div class="rx-pick">${CRX.map(e => `<button data-rxadd="${m.id}|${e}" class="${S.chat.rx.some(r => r.message_id === m.id && r.profile_id === S.user.id && r.emoji === e) ? 'on' : ''}">${e}</button>`).join('')}</div>` : ''}
      <button class="mdel" data-delm="${m.id}" aria-label="Delete message">×</button></div>`;
  });
  box.innerHTML = h;
  box.querySelectorAll('[data-rxm]').forEach(b => b.onclick = e => { if(e.target.closest('a,[data-view]')) return; S.chat.rxOpen = S.chat.rxOpen === b.dataset.rxm ? null : b.dataset.rxm; drawMsgs(false); });
  box.querySelectorAll('[data-rxadd],[data-rxt]').forEach(b => b.onclick = () => { const [mid, em] = (b.dataset.rxadd || b.dataset.rxt).split('|'); S.chat.rxOpen = null; chatReact(mid, em); });
  box.querySelectorAll('[data-view]').forEach(b => b.onclick = () => { const u = S.chat.urls[b.dataset.view]; if(!u) return;
    const ov = document.createElement('div'); ov.className = 'img-view'; ov.innerHTML = `<img src="${u}" alt="Photo"><button aria-label="Close">✕</button>`; ov.onclick = () => ov.remove(); document.body.appendChild(ov); });
  box.querySelectorAll('[data-delm]').forEach(b => b.onclick = async () => { const id = b.dataset.delm;
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Delete?'; b.classList.add('sure'); return; }
    const gone = S.chat.msgs.find(m => m.id === id);
    const { error } = await sb.from('messages').delete().eq('id', id); if(error) toast(error.message); else {
      if(gone && gone.image_path) sb.storage.from('chat').remove([gone.image_path]).then(() => {}, () => {});
      S.chat.msgs = S.chat.msgs.filter(m => m.id !== id); drawMsgs(false); } });
  if(scroll) box.scrollTop = box.scrollHeight;
}

const CRX = ['👍','❤️','😂','🔥','💪','👏','😮','🏋️','😭','😈'];
async function chatSign(){ S.chat.urls = S.chat.urls || {};
  const need = [...new Set(S.chat.msgs.map(m => m.image_path).filter(p => p && !S.chat.urls[p]))]; if(!need.length) return;

  (data || []).forEach(d => { if(d.signedUrl) S.chat.urls[d.path] = d.signedUrl; }); }
function chatRxPills(m){ const rs = S.chat.rx.filter(r => r.message_id === m.id); if(!rs.length) return '';
  const by = {}; rs.forEach(r => (by[r.emoji] = by[r.emoji] || []).push(r.profile_id));
  return `<div class="rx-row">${CRX.filter(e => by[e]).map(e => `<button class="rxn ${by[e].includes(S.user.id) ? 'mine' : ''}" data-rxt="${m.id}|${e}" title="${esc(by[e].map(id => id === S.user.id ? 'You' : athleteName(id)).join(', '))}">${e}${by[e].length > 1 ? `<b>${by[e].length}</b>` : ''}</button>`).join('')}</div>`; }
async function chatReact(mid, emoji){
  const mine = S.chat.rx.find(r => r.message_id === mid && r.profile_id === S.user.id && r.emoji === emoji);
  if(mine){ S.chat.rx = S.chat.rx.filter(r => r !== mine); drawMsgs(false);
    const { error } = await sb.from('message_reactions').delete().eq('message_id', mid).eq('profile_id', S.user.id).eq('emoji', emoji); if(error){ toast(error.message); S.chat.rx.push(mine); drawMsgs(false); } return; }
  const r = {message_id:mid, profile_id:S.user.id, emoji, conversation_id:S.chat.id}; S.chat.rx.push(r); drawMsgs(false);
  const { error } = await sb.from('message_reactions').insert(r); if(error && !/duplicate/i.test(error.message)){ toast(error.message); S.chat.rx = S.chat.rx.filter(x => x !== r); drawMsgs(false); } }
async function shrinkImage(file){
  const src = URL.createObjectURL(file);
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
  const k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.round(img.naturalWidth * k), h = Math.round(img.naturalHeight * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; cv.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(src);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.8)); if(!blob) throw new Error('encode');
  return { blob, w, h, url: URL.createObjectURL(blob) }; }

function bindAthleteGroups(){
  const aid = S.aid, first = athleteName(aid).split(' ')[0];
  const done = async msg => { toast(msg); S.A = await loadAthlete(aid).catch(() => S.A); renderMain(); renderList(); };
  if($('agSel')) $('agSel').onchange = async e => {
    const g = e.target.value; if(!g) return;
    const { error } = await sb.from('group_members').insert({group_id:g, profile_id:aid});
    if(error){ toast(error.message); return; }
    S.members.push({group_id:g, profile_id:aid});
    done(first + ' added to ' + ((S.groups.find(x => x.id === g) || {}).name || 'the group') + '. Group chats, events and group programs follow.');
  };
  $('main').querySelectorAll('[data-agun]').forEach(b => b.onclick = async () => {
    const g = b.dataset.agun;
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'remove?'; b.classList.add('sure'); setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = '×'; b.classList.remove('sure'); } }, 4000); return; }
    const { error } = await sb.from('group_members').delete().eq('group_id', g).eq('profile_id', aid);
    if(error){ toast(error.message); return; }
    S.members = S.members.filter(m => !(m.group_id === g && m.profile_id === aid));
    done(first + ' taken out of ' + ((S.groups.find(x => x.id === g) || {}).name || 'the group'));
  });
}

const planDays = pl => (Array.isArray(pl && pl.versions) ? pl.versions : []).map(v => +v.days).filter(Boolean).sort((a,b) => b - a);
const planTracks = pl => pl && pl.plan_type === 'BASE' && Array.isArray(pl.blocks) && pl.blocks[0] ? (pl.blocks[0].tracks || []).filter(t => t.select).map(t => t.name) : [];
const rosterOf = pl => ((pl && pl.roster && pl.roster.members) || []).filter(m => m && m.athlete_id);
async function setRoster(pl, athleteId, days, strength, remove){
  const tr = planTracks(pl);
  const doc = remove ? {plan_id:pl.id, athlete_id:athleteId, remove:true}
    : {plan_id:pl.id, athlete_id:athleteId, days: planDays(pl).length ? (+days || planDays(pl)[0]) : null, strength: tr.length ? (tr.includes(strength) ? strength : tr[0]) : null};
  const { error } = await sb.rpc('coach_plan_roster', { doc });
  if(error){ toast(typeof needsDb === 'function' && needsDb(error) ? 'This needs the database update first' : error.message); return false; }
  return true;
}

function viewPrograms(){
  const M = S.M, F = S.pgf, byPlan = new Map(), loose = [];
  M.programs.forEach(p => { if(p.plan_id){ if(!byPlan.has(p.plan_id)) byPlan.set(p.plan_id, []); byPlan.get(p.plan_id).push(p); } else loose.push(p); });
  const TYPE = {BASE:'Base', COMP:'Competitive', COMPETITIVE:'Competitive', FNDN:'FNDN', INDIVIDUAL:'Individual'};
  const ORDER = {BASE:0, COMPETITIVE:1, COMP:1, FNDN:2, INDIVIDUAL:3};

    const plan = M.plans.find(x => x.id === pid) || {name:String(ps[0].name).split(' · ')[0]};
    const pub = ps.filter(p => p.status === 'published').length;
    const who = new Set();
    M.asg.filter(a => ps.some(p => p.id === a.program_id)).forEach(a => { if(a.athlete_id) who.add(pname(a.athlete_id)); if(a.group_id) who.add(gName(a.group_id)); });
    rosterOf(plan).forEach(m => who.add(pname(m.athlete_id)));
    const status = !pub ? 'draft' : pub === ps.length ? 'live' : 'part';
    return {pid, ps, plan, pub, status, type:plan.plan_type || 'OTHER',
      text:[plan.name, ...ps.map(p => [p.name, p.track, p.phase, p.days_version ? p.days_version + ' day' : ''].join(' ')), ...who].join(' ').toLowerCase()};
  });
  if(loose.length) entries.push({pid:null, ps:loose, plan:{name:'Other programs'}, pub:loose.filter(p => p.status === 'published').length, type:'OTHER',
    status:loose.every(p => p.status === 'published') ? 'live' : loose.some(p => p.status === 'published') ? 'part' : 'draft',
    text:loose.map(p => [p.name, p.track, p.phase].join(' ')).join(' ').toLowerCase()});
  const q = F.q.trim().toLowerCase();
  const shown = entries.filter(e => (!F.type || e.type === F.type || (F.type === 'COMPETITIVE' && e.type === 'COMP')) && (!F.status || e.status === F.status) && (!q || q.split(/\s+/).every(w => e.text.includes(w))))
    .sort((x, y) => (ORDER[x.type] ?? 9) - (ORDER[y.type] ?? 9) || String(x.plan.name).localeCompare(String(y.plan.name)));
  const types = [['', 'All'], ['BASE', 'Base'], ['COMPETITIVE', 'Competitive'], ['FNDN', 'FNDN'], ['INDIVIDUAL', 'Individual'], ['OTHER', 'Other']]
    .filter(([k]) => !k || entries.some(e => e.type === k || (k === 'COMPETITIVE' && e.type === 'COMP')));
  const cntT = k => entries.filter(e => !k || e.type === k || (k === 'COMPETITIVE' && e.type === 'COMP')).length;
  const stats = [['', 'All'], ['live', 'Live'], ['part', 'Partly live'], ['draft', 'Draft']];
  const cntS = k => entries.filter(e => !k || e.status === k).length;
  let h = `<div><h1>Programs</h1><p class="intro">Publish, assign and remove programs. Drafts are only visible to coaches; once published, assigned athletes see them. Programs built in the program builder are grouped by program, with one row per block and track.</p></div>
    ${entries.length ? `<div class="pgfil">
      <input type="search" id="pgQ" placeholder="Search programs, tracks, blocks or athletes" value="${esc(F.q)}" aria-label="Search programs">
      <div class="afrow"><span class="aflbl">Type</span><div class="achips">${types.map(([k, l]) => `<button class="achip" data-pgtype="${k}" aria-pressed="${F.type === k}">${l}<span class="acnt">${cntT(k)}</span></button>`).join('')}</div></div>
      <div class="afrow"><span class="aflbl">Status</span><div class="achips">${stats.map(([k, l]) => `<button class="achip" data-pgstat="${k}" aria-pressed="${F.status === k}">${l}<span class="acnt">${cntS(k)}</span></button>`).join('')}</div></div>
      <div class="small muted">Showing ${shown.length} of ${entries.length} program${entries.length === 1 ? '' : 's'}${F.q || F.type || F.status ? ' · <button class="lnk" id="pgClear" style="margin:0">clear filters</button>' : ''}</div>
    </div>` : ''}`;
  shown.forEach(e => {
    const {pid, ps, plan, pub} = e;
    if(!pid){ h += `<div class="plan"><div class="ph"><h3>Other programs</h3><span class="small muted">${ps.length}</span></div>${ps.map(programRow).join('')}</div>`; return; }
    ps.sort((a,b) => (a.block_index || 0) - (b.block_index || 0) || (a.track || '').localeCompare(b.track || '') || (b.days_version || 0) - (a.days_version || 0));
    h += `<div class="plan"><div class="ph"><h3>${esc(plan.name)}</h3>${plan.plan_type ? `<span class="pill other">${esc(TYPE[plan.plan_type] || plan.plan_type)}</span>` : ''}
        <span class="small muted">${pub} of ${ps.length} published</span>
        ${pub < ps.length ? `<button class="btn sm pri" data-pubplan="${pid}" data-to="published">Publish all</button>` : ''}
        ${pub ? `<button class="btn sm" data-pubplan="${pid}" data-to="draft">Unpublish all</button>` : ''}
        <a class="btn sm ghost" href="${BUILDER_URL}" target="_blank" rel="noopener">Edit in builder</a></div>
      ${planDays(plan).length ? rosterTable(plan) + '<div class="small muted" style="padding-top:8px">Change days or strength focus above and it saves straight away; they move over from their next session. The rows below are the program behind each block, track and day option.</div>'
        : '<div class="small muted" style="padding-top:8px">Who is on this program is set in the builder\'s athlete list. Assignments you change on a row below are replaced the next time the program is saved from the builder.</div>'}
      ${ps.map(programRow).join('')}</div>`;
  });
  if(entries.length && !shown.length) h += '<div class="panel empty">Nothing matches. Clear the search or filters to see every program.</div>';
  if(!M.programs.length) h += '<div class="panel empty">No programs yet. Build one in the program builder.</div>';
  return `<div class="page">${h}</div>`;
}
function bindProgramFilters(){
  const F = S.pgf, main = $('main'); if(!$('pgQ')) return;
  let t; $('pgQ').oninput = e => { F.q = e.target.value; clearTimeout(t); t = setTimeout(() => { renderAdmin(); const q = $('pgQ'); if(q){ q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }, 200); };
  main.querySelectorAll('[data-pgtype]').forEach(b => b.onclick = () => { F.type = b.dataset.pgtype; renderAdmin(); });
  main.querySelectorAll('[data-pgstat]').forEach(b => b.onclick = () => { F.status = b.dataset.pgstat; renderAdmin(); });
  if($('pgClear')) $('pgClear').onclick = () => { F.q = ''; F.type = ''; F.status = ''; renderAdmin(); };
}
function viewMembers(){
  const M = S.M;
  const groups = M.groups.map(g => { const n = M.gm.filter(m => m.group_id === g.id).length;
    const who = M.gm.filter(m => m.group_id === g.id).map(m => M.people.find(x => x.id === m.profile_id)).filter(Boolean).sort((a,b) => (a.full_name || a.email || '').localeCompare(b.full_name || b.email || ''));
    return `<tr><td><details class="gdet"><summary><b style="font-weight:500">${esc(g.name)}</b><span class="small muted">${n} athlete${n === 1 ? '' : 's'}${g.name === 'Whole Team' ? ' · everyone joins automatically' : g.name.trim().toLowerCase() === 'video review' ? ' · these athletes can send videos for review' : ''}</span></summary>
        <div class="glist">${who.map(x => `<button class="glink" data-open="${x.id}">${esc(x.full_name || x.email)}${x.role === 'coach' ? ' <span class="muted small">Coach</span>' : ''}</button>`).join('') || '<span class="small muted">Nobody in this group yet</span>'}</div></details></td>
      <td style="text-align:right">${g.name === 'Whole Team' ? '' : `<button class="btn sm danger" data-delgroup="${g.id}">Delete</button>`}</td></tr>`; }).join('');
  const people = M.people.map(x => { const mine = M.gm.filter(m => m.profile_id === x.id);
    const avail = M.groups.filter(g => !mine.some(m => m.group_id === g.id));
    return `<tr><td><button class="btn ghost sm" style="padding-left:0;color:var(--text);font-weight:500" data-open="${x.id}">${esc(x.full_name || x.email)}</button>
        <div class="small muted">${esc(x.email || '')}${x.role === 'coach' ? ' · Coach' : ''}</div></td>
      <td>${mine.map(m => `<span class="tag">${esc(gName(m.group_id))}<button data-ungroup="${m.group_id}|${x.id}" aria-label="Remove from ${esc(gName(m.group_id))}">×</button></span>`).join('') || '<span class="small muted">No groups</span>'}</td>
      <td>${avail.length ? `<div class="addrow" style="margin:0"><select data-groupsel="${x.id}" aria-label="Add to group"><option value="">Add to group…</option>${avail.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><button class="btn sm" data-addgroup="${x.id}">Add</button></div>` : ''}</td></tr>`; }).join('');
  return `<div class="page"><div><h1>Groups & athletes</h1><p class="intro">Groups decide which group chats, events and group-assigned programs people get. Click a name to open their calendar.</p></div>
    <div class="cols">
      <div class="panel"><h2>Groups <span class="small muted">${M.groups.length}</span></h2>
        <table class="tbl"><tbody>${groups}</tbody></table>
        <div class="addrow"><input id="newGroup" placeholder="New group name"><button class="btn sm" id="addGroup">Add group</button></div>
        <p class="small muted" style="margin-top:8px">Deleting a group also deletes its group chat. The athletes stay in the app.</p></div>
      <div class="panel"><h2>Athletes <span class="small muted">${M.people.length}</span></h2>
        <div class="tscroll"><table class="tbl"><thead><tr><th>Athlete</th><th>Groups</th><th></th></tr></thead><tbody>${people}</tbody></table></div></div>
    </div></div>`;
}
function viewEvents(){
  const M = S.M, today = ymd(new Date());
  const THEME = {comp:'Comp', party:'Party', other:'Event'};
  const rows = M.events.map(e => `<tr class="${e.event_date < today ? 'past' : ''}"><td><b style="font-weight:500">${esc(e.title)}</b></td>
      <td>${parseD(e.event_date).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'})}${e.event_time ? ' · ' + esc(e.event_time.slice(0,5)) : ''}</td>
      <td>${esc(THEME[e.theme] || 'Event')}</td><td>${esc(e.location || '')}</td><td>${esc(e.group_id ? gName(e.group_id) : 'Everyone')}</td>
      <td style="text-align:right;white-space:nowrap">${e.post_id ? `<a class="btn sm" href="index.html#post/${e.post_id}" target="_blank" rel="noopener">Post</a> ` : ''}<button class="btn sm" data-editevent="${e.id}">Edit</button> <button class="btn sm" data-delevent="${e.id}">Remove</button></td></tr>`).join('');
  return `<div class="page"><div><h1>Events</h1><p class="intro">Events show in the banner carousel on the Home screen, for everyone or just one group. Past events fade out here and drop off Home.</p></div>
    <div class="panel" id="evPanel"><h2 id="evFormTitle">Add an event</h2><p class="small muted" style="margin:-4px 0 10px">Each event gets a forum post automatically. Editing the event updates its post, including who can see it.</p>
      <div class="form">
        <input id="evTitle" placeholder="Event name" aria-label="Event name">
        <input id="evDate" type="date" aria-label="Date">
        <input id="evTime" type="time" aria-label="Start time">
        <select id="evTheme" aria-label="Banner style"><option value="comp">Comp banner</option><option value="party">Party banner</option><option value="other">Other</option></select>
        <input id="evLoc" placeholder="Location (optional)" aria-label="Location">
        <select id="evGroup" aria-label="Who sees it"><option value="">Everyone</option>${M.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
        <input id="evDesc" placeholder="Details for the forum post (optional)" aria-label="Details" style="grid-column:1/-1;flex-basis:100%">
        <button class="btn pri" id="evAdd">Add event</button>
        <button class="btn" id="evCancel" hidden>Cancel</button>
      </div></div>
    <div class="panel"><h2>All events <span class="small muted">${M.events.length}</span></h2>
      ${M.events.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>Event</th><th>When</th><th>Banner</th><th>Location</th><th>For</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">No events yet.</div>'}</div>
  </div>`;
}
function bindAdmin(){
  const root = $('main');
  // Base / Competitive athlete table
  const plOf = id => S.M.plans.find(x => x.id === id);
  const memOf = (pl, aid) => rosterOf(pl).find(m => m.athlete_id === aid) || {};
  const rosterSave = async (pl, aid, days, str, msg) => { if(await setRoster(pl, aid, days, str)){ toast(msg); await loadAdmin(); } };
  root.querySelectorAll('[data-rdays]').forEach(sel => sel.onchange = () => { const [pid, aid] = sel.dataset.rdays.split('|'), pl = plOf(pid); if(!pl) return;
    rosterSave(pl, aid, +sel.value, memOf(pl, aid).strength, pName(aid).split(' ')[0] + ' is on the ' + sel.value + ' day ' + pl.name + ' from their next session'); });
  root.querySelectorAll('[data-rstr]').forEach(sel => sel.onchange = () => { const [pid, aid] = sel.dataset.rstr.split('|'), pl = plOf(pid); if(!pl) return;
    rosterSave(pl, aid, memOf(pl, aid).days, sel.value, pName(aid).split(' ')[0] + ' is on ' + sel.value + ' from their next session'); });
  root.querySelectorAll('[data-roff]').forEach(b => b.onclick = () => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Remove?'; setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = 'Remove'; } }, 4000); return; }
    const [pid, aid] = b.dataset.roff.split('|'), pl = plOf(pid); if(!pl) return;
    setRoster(pl, aid, null, null, true).then(ok => { if(ok){ toast(pName(aid).split(' ')[0] + ' taken off ' + pl.name + '. Anything logged stays in their history.'); loadAdmin(); } });
  });
  root.querySelectorAll('[data-radd]').forEach(b => b.onclick = () => { const pid = b.dataset.radd, pl = plOf(pid); if(!pl) return;
    const aid = (root.querySelector(`[data-raddsel="${pid}"]`) || {}).value; if(!aid){ toast('Pick an athlete'); return; }
    const d = (root.querySelector(`[data-radddays="${pid}"]`) || {}).value, st = (root.querySelector(`[data-raddstr="${pid}"]`) || {}).value;
    rosterSave(pl, aid, d, st, pName(aid).split(' ')[0] + ' added to ' + pl.name); });
  const act = async (fn, msg) => { const { error } = await fn(); if(error){ toast(error.message); return; } if(msg) toast(msg); await loadAdmin(); };
  const twoTap = (b, label, fn) => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; const old = b.textContent; b.textContent = label;
      setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = old; } }, 4000); return; }
    fn();
  };
  root.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => act(() => sb.from('programs').update({status: b.dataset.st === 'published' ? 'draft' : 'published'}).eq('id', b.dataset.pub), b.dataset.st === 'published' ? 'Unpublished' : 'Published'));
  root.querySelectorAll('[data-pubplan]').forEach(b => b.onclick = () => {
    const ids = S.M.programs.filter(p => p.plan_id === b.dataset.pubplan && p.status !== 'archived').map(p => p.id);
    act(() => sb.from('programs').update({status: b.dataset.to}).in('id', ids), b.dataset.to === 'published' ? 'All published' : 'All unpublished');
  });
  root.querySelectorAll('[data-assign]').forEach(b => b.onclick = () => {
    const v = root.querySelector(`[data-assignsel="${b.dataset.assign}"]`).value; if(!v){ toast('Pick a group or athlete'); return; }
    const [t, id] = v.split(':');
    act(() => sb.from('program_assignments').insert({program_id: b.dataset.assign, [t === 'g' ? 'group_id' : 'athlete_id']: id}), 'Assigned');
  });
  root.querySelectorAll('[data-unassign]').forEach(b => b.onclick = () => act(() => sb.from('program_assignments').delete().eq('id', b.dataset.unassign), 'Removed'));
  root.querySelectorAll('[data-repeat]').forEach(b => b.onclick = async () => {
    const on = b.dataset.on !== '1'; b.disabled = true;
    const { data, error } = await sb.rpc('coach_set_repeat', { pid: b.dataset.repeat, on_off: on });
    b.disabled = false;
    if(error){ toast(needsDb(error) ? 'This needs the database update first' : error.message); return; }
    toast(on ? 'Repeats weekly: week 1 now runs every week' : 'Repeat weekly turned off; the weeks already made stay');
    await loadAdmin();
  });
  root.querySelectorAll('[data-delprog]').forEach(b => b.onclick = () => twoTap(b, 'Click again to delete', () => act(() => sb.from('programs').delete().eq('id', b.dataset.delprog), 'Program deleted')));
  root.querySelectorAll('[data-addgroup]').forEach(b => b.onclick = () => {
    const g = root.querySelector(`[data-groupsel="${b.dataset.addgroup}"]`).value; if(!g){ toast('Pick a group'); return; }
    act(() => sb.from('group_members').insert({group_id: g, profile_id: b.dataset.addgroup}), 'Added to ' + gName(g));
  });
  root.querySelectorAll('[data-ungroup]').forEach(b => b.onclick = () => { const [g, pid] = b.dataset.ungroup.split('|');
    act(() => sb.from('group_members').delete().eq('group_id', g).eq('profile_id', pid), 'Removed from ' + gName(g)); });
  root.querySelectorAll('[data-delgroup]').forEach(b => b.onclick = () => twoTap(b, 'Click again to delete', () => act(() => sb.from('groups').delete().eq('id', b.dataset.delgroup), 'Group deleted')));
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => selectAthlete(b.dataset.open));
  if($('addGroup')) $('addGroup').onclick = async () => {
    const name = $('newGroup').value.trim(); if(!name){ toast('Name the group'); return; }
    const { data:g, error } = await sb.from('groups').insert({name, sort: S.M.groups.length}).select('id').single();
    if(error){ toast(error.message); return; }
    await sb.from('conversations').insert({kind:'group', group_id:g.id});   // every group gets its chat, as in the app
    toast('Group added'); loadAdmin();
  };
  root.querySelectorAll('[data-delevent]').forEach(b => b.onclick = () => act(() => sb.from('events').delete().eq('id', b.dataset.delevent), 'Event removed'));
  let evEdit = null;
  root.querySelectorAll('[data-editevent]').forEach(b => b.onclick = () => {
    const e = S.M.events.find(x => x.id === b.dataset.editevent); if(!e) return;
    evEdit = e.id;
    $('evTitle').value = e.title; $('evDate').value = e.event_date; $('evTime').value = (e.event_time || '').slice(0,5);
    $('evTheme').value = e.theme || 'other'; $('evLoc').value = e.location || ''; $('evGroup').value = e.group_id || ''; $('evDesc').value = e.description || '';
    $('evFormTitle').textContent = 'Edit event: ' + e.title; $('evAdd').textContent = 'Save changes'; $('evCancel').hidden = false;
    $('evPanel').scrollIntoView({behavior:'smooth', block:'start'}); $('evTitle').focus();
  });
  if($('evCancel')) $('evCancel').onclick = () => loadAdmin();
  if($('evAdd')) $('evAdd').onclick = () => {
    const title = $('evTitle').value.trim(), event_date = $('evDate').value;
    if(!title || !event_date){ toast('Add a name and a date'); return; }
    const rec = {title, event_date, event_time: $('evTime').value || null, theme: $('evTheme').value, location: $('evLoc').value.trim() || null,
                 group_id: $('evGroup').value || null, description: $('evDesc').value.trim() || null};
    if(evEdit) act(() => sb.from('events').update(rec).eq('id', evEdit), 'Event and its post updated');
    else act(() => sb.from('events').insert(rec), 'Event added and posted to the forum');
  };
}

let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }

/* Keyboard vs the fixed bottom menu (mostly iPhone): hide the menu while typing so it can't ride up on the keyboard,
   and nudge the page after the keyboard closes so iOS puts fixed bars back where they belong. */
(()=>{ const editable=el=>el&&el.matches&&el.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]):not([type=button]):not([type=submit]),textarea,select,[contenteditable="true"]');
  let t; const settle=()=>{ clearTimeout(t); t=setTimeout(()=>{ if(!editable(document.activeElement)){ document.body.classList.remove('kb'); window.scrollTo(window.scrollX, window.scrollY); } },120); };
  document.addEventListener('focusin',e=>{ if(editable(e.target)){ clearTimeout(t); document.body.classList.add('kb'); } });
  document.addEventListener('focusout',settle);
  const vv=window.visualViewport; if(vv) vv.addEventListener('resize',()=>{ if(vv.height>window.innerHeight*0.85) settle(); });
  window.addEventListener('pageshow',()=>window.scrollTo(window.scrollX, window.scrollY));
})();

/* New version check: the app compares the server's copy of this page with the one it loaded (ETag) whenever it's reopened,
   and offers a one-tap refresh, so home-screen apps don't sit on an old version. */
(()=>{ let base=null; const page=location.pathname.endsWith('.html')?location.pathname:location.pathname+'index.html';
  const tag=async()=>{ try{ const r=await fetch(page,{method:'HEAD',cache:'no-store'}); return r.headers.get('etag')||r.headers.get('last-modified'); }catch(e){ return null; } };
  const check=async()=>{ const t=await tag(); if(!t) return; if(base===null){ base=t; return; }
    if(t!==base && !document.querySelector('.upd-bar')){ const b=document.createElement('button'); b.className='upd-bar'; b.textContent='A new version of the app is ready. Tap to update.'; b.onclick=()=>location.reload(); document.body.appendChild(b); } };
  check(); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) check(); }); setInterval(check, 10*60*1000);
})();
</script>
