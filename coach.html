// which block a program is in on a given Monday
function pzWeek(pos, w){
  if(!pos.start) return null;
  const n = Math.floor(dayDiff(w, ymd(pos.start)) / 7) + 1;
  if(n < 1 || n > pos.total) return null;
  let acc = 0;
  for(let i = 0; i < pos.blocks.length; i++){ const b = pos.blocks[i], bw = +b.weeks; if(n <= acc + bw) return {n, bi:i, wib:n - acc, bw, name:b.name || 'Block ' + (i + 1)}; acc += bw; }
  return {n, bi:-1, wib:n - acc, bw:pos.total - acc, name:''};
}

function periodisation(ctx){
  S.pzCtx = ctx;
  const {auto, indiv, planPos, onPlan, trainedWk, monS, now} = ctx, H = S.H;
  const fmtD = (d, o) => parseD(d).toLocaleDateString('en-AU', o);
  // next comp
  const comp = (H.allEvents || []).filter(e => e.event_date >= monS && isComp(e))[0];
  const compMon = comp ? ymd(mondayOf(parseD(comp.event_date))) : null;

  // ---- timeline ----
  const rows = auto.map(pl => ({pl, pos:planPos(pl), label:pl.name, sub:TYPE_TXT[pl.plan_type] || '', who:[...(onPlan[pl.id] || [])]}));
  if(S.pz.indiv) indiv.forEach(({pl, pos, who}) => { const aid = who[0] || pl.athlete_id; rows.push({pl, pos, label:athleteName(aid), sub:pl.name, aid, who}); });
  const starts = rows.map(r => r.pos.start).filter(Boolean).map(ymd), ends = rows.map(r => r.pos.end).filter(Boolean).map(d => ymd(mondayOf(d)));
  let from = ymd(addDays(parseD(monS), -28));
  const firstStart = starts.sort()[0];
  if(firstStart && firstStart < from) from = firstStart < ymd(addDays(parseD(monS), -112)) ? ymd(addDays(parseD(monS), -112)) : firstStart;
  let to = ymd(addDays(parseD(monS), 7 * 12));
  [...ends, compMon].filter(Boolean).forEach(e => { if(e > to) to = e; });
  to = ymd(addDays(parseD(to), 14));
  const nW = Math.min(64, Math.round(dayDiff(to, from) / 7) + 1);
  const ws = Array.from({length:nW}, (_, i) => ymd(addDays(parseD(from), i * 7)));
  const ni = ws.indexOf(monS);
  let months = '', lastM = '';
  ws.forEach((w, i) => { const m = w.slice(0, 7); if(m !== lastM){ let span = 0; for(let j = i; j < ws.length && ws[j].slice(0, 7) === m; j++) span++; months += `<div class="pz-month" style="grid-row:1;grid-column:${i + 2} / span ${span}">${span > 1 ? MONTHS[parseD(w).getMonth()] : MONTHS[parseD(w).getMonth()].slice(0, 3)}</div>`; lastM = m; } });
  const dates = ws.map((w, i) => `<div class="pz-date${w === monS ? ' now' : ''}" style="grid-row:2;grid-column:${i + 2}">${parseD(w).getDate()}</div>`).join('');
  const usedPh = new Map();
  const cellsFor = r => ws.map((w, wi) => {
    const x = pzWeek(r.pos, w), past = w < monS ? ' past' : '';
    if(!x) return `<div style="grid-row:${r.ri + 4};grid-column:${wi + 2}"><div class="pz-cell"></div></div>`;
    const p = x.bi >= 0 ? blockPhase(r.pl.id, x.bi, x.name) : {k:'none', c:'#3a3a3f', t:'#ddd', n:'Unplanned'};
    usedPh.set(p.k + '|' + p.c, p);
    const first = x.wib === 1, end = x.n === r.pos.total;
    const tip = `${r.label}: ${x.name || 'Week'} · week ${x.wib} of ${x.bw}\nProgram week ${x.n} of ${r.pos.total} · w/c ${fmtD(w, {day:'numeric', month:'short'})}`;
    return `<div style="grid-row:${r.ri + 4};grid-column:${wi + 2}"><div class="pz-cell ph ${p.k}${past}${first ? ' first' : ''}${end ? ' end' : ''}" style="${pzSty(p)}" title="${esc(tip)}">${x.wib}</div></div>`;
  }).join('');
  rows.forEach((r, i) => r.ri = i);
  // events row: comps in gold, everything else as a dot
  const evByWk = {}; (H.allEvents || []).forEach(e => { const k = ymd(mondayOf(parseD(e.event_date))); (evByWk[k] ||= []).push(e); });
  const evCells = ws.map((w, wi) => {
    const es = evByWk[w] || [], c = es.find(isComp), past = w < monS ? ' past' : '';
    const tip = es.map(e => fmtD(e.event_date, {weekday:'short', day:'numeric', month:'short'}) + ' · ' + e.title).join('\n');
    return `<div style="grid-row:3;grid-column:${wi + 2}">${c ? `<div class="pz-cell pzev comp${past}" title="${esc(tip)}">${PZ_TROPHY}</div>` : es.length ? `<div class="pz-cell pzev${past}" title="${esc(tip)}"><i></i></div>` : '<div class="pz-cell pzev"></div>'}</div>`;
  }).join('');
  const nameCol = rows.map(r => `<${r.aid ? `button data-ath="${r.aid}"` : 'div'} class="pz-name" style="--tc:${PZ_TYPE_COL[r.pl.plan_type] || '#888'};grid-row:${r.ri + 4};grid-column:1" title="${esc(r.label + (r.sub ? ' · ' + r.sub : ''))}"><i></i><span><b>${esc(r.label)}</b><small>${esc(r.sub)}${r.who.length && !r.aid ? ' · ' + r.who.length : ''}</small></span></${r.aid ? 'button' : 'div'}>`).join('');
  const body = rows.map(cellsFor).join('');
  const legend = [...usedPh.values()].map(p => `<span><i class="pz-lg ${p.k}" style="${pzSty(p)}"></i>${esc(p.n)}</span>`).join('')
    + (comp || Object.keys(evByWk).length ? `<span><i class="pz-lg comp"></i>Comp</span>` : '') + (ni >= 0 ? '<span><i class="pz-lg now"></i>This week</span>' : '');
  const timeline = rows.length ? `<div class="pz-scroll" id="pzScroll"><div class="pz-tl" style="--pzn:${ws.length};grid-template-columns:184px repeat(${ws.length},var(--pzw))">
      <div class="pz-corner" style="grid-row:1 / span 2"></div>${months}${dates}
      <div class="pz-name pzev" style="grid-row:3;grid-column:1"><i></i><span><b>Events</b></span></div>${evCells}
      ${nameCol}${body}
      ${ni >= 0 ? `<div class="pz-now" style="grid-column:${ni + 2} / span 1;grid-row:2 / span ${rows.length + 2}"></div>` : ''}
    </div></div>` : '<div class="empty">No programs to show yet. Build one in the program builder.</div>';

  return `<div class="pz-top">
      <div class="pz-title">Programs running<span class="csub" style="margin-left:8px">${auto.length} group program${auto.length === 1 ? '' : 's'}${indiv.length ? ` · ${indiv.length} individual` : ''}</span></div>
      <div class="pz-ctl">
        <div class="pz-seg" role="group" aria-label="Rows"><button data-pzi="0" aria-pressed="${!S.pz.indiv}">Group programs</button><button data-pzi="1" aria-pressed="${S.pz.indiv}">+ Individual${indiv.length ? ' (' + indiv.length + ')' : ''}</button></div>
        ${ni >= 0 ? '<button class="btn sm" id="pzJump">Jump to now</button>' : ''}
        <button class="btn sm" id="pzFull">Full view →</button>
      </div>
    </div>
    ${timeline}
    ${rows.length ? `<div class="pz-legend">${legend}<span class="pz-dim">Numbers are the week of each block. Hover a week for details.</span></div>` : ''}`;
}

const rtClass = label => { const n = String(label || ''); const hit = RTYPES.find(t => t[0] === n) || RTYPES.find(t => n.startsWith(t[0])); return hit ? hit[1] : 't-other'; };
const focusClass = n => { n = String(n || '').toLowerCase(); return !n ? 's-other' : /squat|leg/.test(n) ? 's-squat' : /upper|press|bench/.test(n) ? 's-upper' : /pull/.test(n) ? 's-pulling' : /general/.test(n) ? 's-general' : 's-custom'; };

const PZ_PICK = [['accumulation','Accumulation','#ff8a3d','#241100'],['volume','Volume','#ffd84d','#221c00'],['strength','Strength','#4d9fff','#051a36'],['intensity','Intensity','#ff5252','#ffffff'],['deload','Deload','#34c96a','#03220f'],['dtm','Taper','#34c96a','#03220f'],['comp','Comp / test','#d4a72c','#1e1600']];

function blockPhase(planId, bi, name){

function computeRoster(R){
  const plans = Object.fromEntries(R.plans.map(p => [p.id, p]));
  const progs = Object.fromEntries(R.progs.map(p => [p.id, p]));
  const firstAsg = {};
  R.asg.forEach(a => { const p = progs[a.program_id]; if(!p || !p.plan_id || !a.created_at) return; if(!firstAsg[p.plan_id] || a.created_at < firstAsg[p.plan_id]) firstAsg[p.plan_id] = a.created_at; });
  const planStart = pl => pl.start_date ? mondayOf(parseD(pl.start_date)) : firstAsg[pl.id] ? mondayOf(new Date(firstAsg[pl.id])) : null;
  const progBase = p => { const pl = plans[p.plan_id]; if(p.start_date) return mondayOf(parseD(p.start_date)); const s = pl && planStart(pl); return s ? addDays(s, (p.week_offset || 0) * 7) : null; };
  // which Mondays have sessions written, per plan (published or still draft), and how many per program
  const wk = {};
  R.sess.forEach(s => { const p = progs[s.program_id]; if(!p || !p.plan_id) return; const b = progBase(p); if(!b) return;
    const m = ymd(addDays(b, (s.week_number - 1) * 7)), M = (wk[p.plan_id] ||= {}), e = (M[m] ||= {pub:0, draft:0, progs:{}});
    if(p.status === 'published') e.pub++; else e.draft++; e.progs[p.id] = (e.progs[p.id] || 0) + 1; });
  const runOut = {}, pubTo = {}, writtenTo = {};
  Object.entries(wk).forEach(([pid, M]) => { const ms = Object.keys(M).sort(), pub = ms.filter(m => M[m].pub);
    if(pub.length){ pubTo[pid] = ymd(addDays(parseD(pub[pub.length - 1]), 6)); runOut[pid] = ymd(addDays(parseD(pub[pub.length - 1]), 7)); }   // due = the Monday after the last published week
    if(ms.length) writtenTo[pid] = ymd(addDays(parseD(ms[ms.length - 1]), 6)); });
  const members = gid => R.gm.filter(m => m.group_id === gid).map(m => m.profile_id);
  const onPlan = {};
  R.asg.forEach(a => { const p = progs[a.program_id]; if(!p || !p.plan_id || !plans[p.plan_id]) return;
    (a.athlete_id ? [a.athlete_id] : a.group_id ? members(a.group_id) : []).forEach(x => (onPlan[p.plan_id] ||= new Set()).add(x)); });
  const plansOf = {};
  Object.entries(onPlan).forEach(([pid, set]) => set.forEach(a => (plansOf[a] ||= []).push(plans[pid])));
  Object.values(plansOf).forEach(l => l.sort((x, y) => (T_ORDER[x.plan_type] ?? 9) - (T_ORDER[y.plan_type] ?? 9) || x.name.localeCompare(y.name)));
  // where a plan is up to (same maths as the Home preview)
  const pos = {};
  R.plans.forEach(pl => {
    const blocks = Array.isArray(pl.blocks) ? pl.blocks.filter(b => +b.weeks > 0) : [];
    const total = pl.total_weeks || blocks.reduce((t, b) => t + (+b.weeks), 0) || 1;
    const start = planStart(pl);
    const week = start ? Math.floor(dayDiff(ymd(mondayOf(new Date())), ymd(start)) / 7) + 1 : null;
    pos[pl.id] = {total, blocks, start, week, end:start ? addDays(start, total * 7 - 1) : null};
  });
  return {plans, progs, planStart, wk, runOut, pubTo, writtenTo, onPlan, plansOf, pos};
}
// next due for one athlete on one program: the coach's date if set (app_settings 'due_overrides'), else where published sessions run out
const dueOf = (aid, pid) => (S.R.dueOv || {})[aid + '|' + (pid || '_')] || (pid ? S.R.C.runOut[pid] : null) || null;

const rDays = ds => ds ? dayDiff(ds, ymd(new Date())) : null;
const rBucket = n => n == null ? 'none' : n < 0 ? 'over' : n <= 7 ? 'week' : n <= 14 ? 'next' : 'later';
function athleteModel(a){
  const C = S.R.C, pls = (C.plansOf[a.id] || []).filter(Boolean), prim = pls[0] || null;
  const mem = prim ? rosterOf(prim).find(m => m.athlete_id === a.id) : null;
  const cls = !pls.length && isClassOnly(a.id);
  let type = cls ? 'OFF PROGRAM' : 'ONBOARDING';
  if(prim){ const d = (mem && mem.days) || planDays(prim)[0];
    type = prim.plan_type === 'BASE' ? (d ? 'BASE ' + d : 'BASE') : prim.plan_type === 'COMPETITIVE' ? 'COMPETITIVE' + (d ? ' ' + d : '') : prim.plan_type === 'FNDN' ? 'FNDN' : 'INDIVIDUAL'; }
  // next due: the soonest of their programs to run out of published training
  let due = null, dueFrom = null;
  pls.forEach(pl => { const r = dueOf(a.id, pl.id); if(r && (!due || r < due)){ due = r; dueFrom = pl; } });
  if(!pls.length && S.R.dueOv[a.id + '|_']) due = S.R.dueOv[a.id + '|_'];
  const n = rDays(due);
  const groups = S.R.gm.filter(m => m.profile_id === a.id).map(m => (S.groups.find(g => g.id === m.group_id) || {}).name).filter(Boolean);
  return {a, pls, prim, mem, type, due, dueFrom, n, bucket:cls ? (due ? rBucket(n) : 'class') : !pls.length ? 'unassigned' : rBucket(n), groups, draft:pls.length && !due, cls};
}

function athTabs(){
  return `<div class="at-tabs" role="tablist">${[['list','Athletes'],['period','Periodisation']].map(([k, l]) =>
    `<button role="tab" aria-selected="${S.ath.tab === k}" class="${S.ath.tab === k ? 'on' : ''}" data-atab="${k}">${l}</button>`).join('')}</div>`;
}
async function renderAthletesPage(){
  const main = $('main');
  if(!S.R) main.innerHTML = `<div class="ap">${athTabs()}<div class="empty"><span class="spin"></span> Loading athletes</div></div>`;
  try { await loadRoster(); } catch(e){ main.innerHTML = `<div class="empty">Could not load: ${esc(e.message || e)}</div>`; return; }
  if(S.view !== 'athletes' || !S.athList) return;
  if(S.ath.tab === 'period') renderPeriodPage(); else renderAthList();
}
function bindAthTabs(){
  $('main').querySelectorAll('[data-atab]').forEach(b => b.onclick = () => { S.ath.tab = b.dataset.atab; try { localStorage.setItem('rc-atab', S.ath.tab); } catch(e){} renderAthletesPage(); });
}

function renderAthList(){
  const F = S.ath, R = S.R;
  const all = R.people.filter(a => (F.coaches || a.role !== 'coach')).map(a => ({...a, name:a.full_name || a.email || 'Athlete'}));
  const active = all.filter(a => a.active !== false).map(athleteModel);
  const models = all.filter(a => (a.active === false) === F.archived).map(athleteModel);
  const q = F.q.trim().toLowerCase();
  const cats_ = m => m.pls.length ? m.pls.map(p => p.plan_type) : [m.cls ? 'CLASS' : 'ONBOARDING'];
  const cat = m => cats_(m)[0];
  const inGrp = (m, g) => S.R.gm.some(x => x.profile_id === m.a.id && x.group_id === g);
  const vis = models.filter(m => (!F.type || cats_(m).includes(F.type)) && (!F.grp || inGrp(m, F.grp)) && (!F.bucket || m.bucket === F.bucket)
    && (!q || (m.a.name + ' ' + (m.a.email || '') + ' ' + m.groups.join(' ')).toLowerCase().includes(q)));
  const cnt = {over:0, week:0, next:0}; active.forEach(m => { if(cnt[m.bucket] != null) cnt[m.bucket]++; });
  const cats = [['', 'All'], ...[['INDIVIDUAL','Individual'],['BASE','Base'],['COMPETITIVE','Competitive'],['FNDN','FNDN'],['ONBOARDING','No program'],['CLASS','Off program']].filter(([k]) => active.some(m => cats_(m).includes(k)))];
  const grps = S.groups.filter(g => active.some(m => inGrp(m, g.id)));
  if(F.grp && !grps.some(g => g.id === F.grp)) F.grp = '';
  const order = [['unassigned','No program assigned'],['over','Overdue'],['week','Due in the next 7 days'],['next','Due in 8 to 14 days'],['later','Later'],['none','No training published'],['class','Off program']];
  [...F.sel].forEach(id => { if(!models.some(m => m.a.id === id)) F.sel.delete(id); });
  const plural = n => n + ' athlete' + (n === 1 ? '' : 's');
  const sorted = vis.slice().sort((x, y) => (x.due || '9999').localeCompare(y.due || '9999') || x.a.name.localeCompare(y.a.name));
  const board = !R.people.length ? `<div class="aempty"><b>No athletes yet</b>Share a join link and they'll appear here as they sign up.</div>`
    : !sorted.length ? `<div class="aempty"><b>Nobody matches</b>Clear the search or filters to see everyone.</div>`
    : order.map(([k, label]) => {
      const g = sorted.filter(m => m.bucket === k); if(!g.length) return '';
      const allSel = g.every(m => F.sel.has(m.a.id));
      return `<section class="agrp"><h2>${label}<span>${plural(g.length)}</span></h2><div class="alst">
        <div class="arw ahr"><div><input type="checkbox" class="ack" data-pickgroup="${k}" aria-label="Select all in ${label}" ${allSel ? 'checked' : ''}></div><div>Athlete</div><div>Wk</div><div>Program</div><div>Focus</div><div>Next due</div><div>Days</div><div></div></div>
        ${g.map(athRow).join('')}</div></section>`;
    }).join('');
  $('main').innerHTML = `<div class="ap">
    ${athTabs()}
    <div class="ahd"><div><div class="eyebrow">Athlete programs</div><h1>Athletes</h1></div>
      <button class="btn pri" id="apInvite">+ Invite athletes</button></div>
    <section class="amet" aria-label="Programs due">
      <button class="amt m-over ${F.bucket === 'over' ? 'on' : ''}" data-bucket="over"><span class="l">Overdue</span><span class="v">${cnt.over}</span></button>
      <button class="amt m-week ${F.bucket === 'week' ? 'on' : ''}" data-bucket="week"><span class="l">Due in 7 days</span><span class="v">${cnt.week}</span></button>
      <button class="amt m-next ${F.bucket === 'next' ? 'on' : ''}" data-bucket="next"><span class="l">Due in 8 to 14 days</span><span class="v">${cnt.next}</span></button>
      <button class="amt m-all ${F.bucket === '' ? '' : ''}" data-bucket=""><span class="l">Active athletes</span><span class="v">${active.length}</span></button>
    </section>
    <div class="afl">
      <input type="search" id="apQ" placeholder="Search athletes, emails or groups" value="${esc(F.q)}" aria-label="Search">
      <label class="atg"><input type="checkbox" id="apCoach" ${F.coaches ? 'checked' : ''}> Show coaches</label>
      <label class="atg"><input type="checkbox" id="apArch" ${F.archived ? 'checked' : ''}> Show archived</label>
    </div>
    <div class="afrow"><span class="aflbl">Program</span><div class="achips">${cats.map(([v, l]) => `<button class="achip" data-atype="${v}" aria-pressed="${F.type === v}">${l}<span class="acnt">${v ? active.filter(m => cats_(m).includes(v)).length : active.length}</span></button>`).join('')}</div></div>
    <div class="afrow"><span class="aflbl">Group</span><div class="achips"><button class="achip" data-agrp="" aria-pressed="${!F.grp}">All<span class="acnt">${active.length}</span></button>${grps.map(g => `<button class="achip" data-agrp="${g.id}" aria-pressed="${F.grp === g.id}">${esc(g.name)}<span class="acnt">${active.filter(m => inGrp(m, g.id)).length}</span></button>`).join('')}</div></div>
    <p class="ahint">Next due is the Monday after their program's published sessions run out. Pick a date to override it; ↺ goes back to automatic.</p>
    <div id="apBoard">${board}</div>
  </div>
  <div class="abulk" id="apBulk" ${F.sel.size ? '' : 'hidden'}></div>`;
  bindAthTabs(); bindAthList(models); drawBulk(models);
}
function athRow(m){
  const a = m.a, on = S.ath.sel.has(a.id), arch = a.active === false, C = S.R.C;
  // one line per program the athlete is on (an automatic program first, then any Individual programming)
  const direct = m.prim && m.mem, pd = direct ? planDays(m.prim) : [];
  const tOpts = pd.length ? pd.map(d => { const l = (m.prim.plan_type === 'BASE' ? 'BASE ' : 'COMPETITIVE ') + d; return `<option value="days:${d}" ${l === m.type ? 'selected' : ''}>${l}</option>`; }).join('')
    : !m.pls.length ? `<option value="__none" ${m.cls ? '' : 'selected'}>NO PROGRAM</option><option value="__class" ${m.cls ? 'selected' : ''}>OFF PROGRAM</option>`
    : `<option selected>${esc(m.type)}</option>`;
  const typeSel = `<span class="selw ${rtClass(m.type)}"><select data-aset="type" data-id="${a.id}" aria-label="Program for ${esc(a.name)}" ${arch ? 'disabled' : ''}>${tOpts}<option value="__add">+ Add program…</option></select></span>`;
  const pt = direct ? planTracks(m.prim) : [];
  const focusFor = (pl, first) => {
    if(first && pt.length){ const cur = (m.mem && m.mem.strength) || pt[0];
      return `<span class="selw ${focusClass(cur)}"><select data-aset="focus" data-id="${a.id}" aria-label="Strength focus for ${esc(a.name)}" ${arch ? 'disabled' : ''}>${pt.map(t => `<option ${t === cur ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></span>`; }
    const txt = !pl ? '' : pl.plan_type === 'INDIVIDUAL' ? pl.name : pl.plan_type === 'FNDN' ? 'All tracks' : !rosterOf(pl).some(x => x.athlete_id === a.id) ? 'Via group' : '';
    return txt ? `<span class="selw s-other static" title="${esc(txt)}"><span>${esc(txt)}</span></span>` : '<span class="adash">–</span>';
  };
  const label = pl => pl.plan_type === 'BASE' ? 'BASE' : pl.plan_type === 'COMPETITIVE' ? 'COMPETITIVE' : pl.plan_type === 'FNDN' ? 'FNDN' : 'INDIVIDUAL';
  const dateFor = pl => { const pid = pl ? pl.id : '', auto = pl ? C.runOut[pl.id] : null, ov = (S.R.dueOv || {})[a.id + '|' + (pid || '_')], r = ov || auto;
    const soon = pl && pl === m.dueFrom && m.pls.length > 1;
    const tip = ov ? `Set by you.${auto ? ' Automatic: ' + dShort(auto) + ', the Monday after published sessions run out.' : ''} ↺ goes back to automatic.`
      : auto ? `${pl.name}: due the Monday after published sessions run out (${dShort(C.pubTo[pl.id])})${C.writtenTo[pl.id] > C.pubTo[pl.id] ? '. Drafts written to ' + dShort(C.writtenTo[pl.id]) : ''}. Pick a date to override.`
      : pl ? 'Nothing published on this program yet. Pick a date to set when it\'s due.' : m.cls ? 'Off program. Pick the date you\'ll need to write them a program.' : 'Pick a date to set when their program is due.';
    const txt = r ? dShort(r) : pl ? 'Draft only' : '–';
    return `<span class="adwrap"><label class="adbox ${soon ? 'soon' : ''} ${ov ? 'ov' : ''} ${r ? '' : 'empty'}" title="${esc(tip)}"><span>${esc(txt)}</span><input type="date" class="adin" data-due="${a.id}|${pid}" value="${esc(r || '')}" aria-label="Next due${pl ? ' for ' + esc(pl.name) : ''}" ${arch ? 'disabled' : ''}></label>${ov ? `<button class="arst" data-dreset="${a.id}|${pid}" title="Back to automatic${auto ? ' (' + esc(dShort(auto)) + ')' : ''}" aria-label="Back to automatic">↺</button>` : ''}</span>`; };
  const daysFor = pl => { const n = rDays(pl ? dueOf(a.id, pl.id) : dueOf(a.id, null)); return n == null ? '<span class="adays d-later">–</span>' : `<span class="adays d-${rBucket(n)}">${n}</span>`; };
  const actFor = pl => arch ? `<button class="asent" data-restore="${a.id}">Restore</button>`
    : `<a class="asent" href="${BUILDER_URL}" target="revbuilder" rel="noopener" title="Open the builder to write the next weeks of ${esc(pl.name)}">Write next ↗</a>`;
  let L;
  if(!m.pls.length) L = [{type:typeSel, focus:'<span class="adash">–</span>', date:dateFor(null), days:daysFor(null),
    act:arch ? actFor({}) : m.cls ? `<button class="asent" data-abuild="${a.id}" title="Opens the builder with a new Individual program for ${esc(a.name)}">Build program ↗</button>` : `<button class="asent" data-abuild="${a.id}" title="Opens the builder with a new Individual program for ${esc(a.name)}">Build program ↗</button>`}];
  else L = m.pls.map((pl, i) => ({
    type: i === 0 ? typeSel : `<button class="selw ${rtClass(label(pl))} static apl" data-open="${a.id}" title="${esc(pl.name)}: open ${esc(a.name.split(' ')[0])}'s calendar"><span>+ ${label(pl)}</span></button>`,
    focus: focusFor(pl, i === 0), date: dateFor(pl), days: daysFor(pl), act: actFor(pl)}));
  const col = k => L.length > 1 ? `<div class="alines">${L.map(l => `<div>${l[k]}</div>`).join('')}</div>` : L[0][k];
  const wkN = S.weekDone[a.id] ? S.weekDone[a.id].size : 0;
  const sub = m.groups.join(', ') || (a.role === 'coach' ? 'Coach' : 'No group');
  return `<div class="arw ${on ? 'sel' : ''} ${L.length > 1 ? 'multi' : ''}">
    <div class="c-check"><input type="checkbox" class="ack" data-pick="${a.id}" aria-label="Select ${esc(a.name)}" ${on ? 'checked' : ''}></div>
    <div class="c-name"><button class="aname" data-open="${a.id}">${esc(a.name)}<span class="anote">${esc(sub)}${L.length > 1 ? ' · ' + L.length + ' programs' : ''}</span></button></div>
    <div class="c-wk"><span class="wk" title="${wkN} day${wkN === 1 ? '' : 's'} trained this week">${[0,1,2,3,4].map(i => `<i class="${i < wkN ? 'on' : ''}"></i>`).join('')}</span></div>
    <div class="c-type">${col('type')}</div>
    <div class="c-focus">${col('focus')}</div>
    <div class="c-date">${col('date')}</div>
    <div class="c-days">${col('days')}</div>
    <div class="c-sent">${col('act')}</div>
  </div>`;
}
function drawBulk(models){
  const bar = $('apBulk'); if(!bar) return;
  const F = S.ath; if(!F.sel.size){ bar.hidden = true; return; }
  bar.hidden = false;
  const picked = models.filter(m => F.sel.has(m.a.id));
  const baseDays = [...new Set(picked.filter(m => m.mem && m.prim.plan_type !== 'INDIVIDUAL').flatMap(m => planDays(m.prim)))].sort((a, b) => b - a);
  const tracks = [...new Set(picked.filter(m => m.mem).flatMap(m => planTracks(m.prim)))];
  bar.innerHTML = `<b>${F.sel.size} selected</b>
    ${baseDays.length ? `<select id="bkDays" aria-label="Set day option"><option value="">Set days…</option>${baseDays.map(d => `<option value="${d}">${d} day</option>`).join('')}</select>` : ''}
    ${tracks.length ? `<select id="bkFocus" aria-label="Set strength focus"><option value="">Set focus…</option>${tracks.map(t => `<option>${esc(t)}</option>`).join('')}</select>` : ''}
    <span class="bkd"><input type="date" id="bkDue" aria-label="Next due"><button class="btn" id="bkDueGo">Set next due</button></span>
    <select id="bkGroup" aria-label="Add to a group"><option value="">Add to group…</option>${S.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
    <span class="spacer"></span>
    ${picked.some(m => !m.pls.length) ? `<button class="btn" id="bkClass">${picked.every(m => m.cls) ? 'Move to No program' : 'Off program'}</button>` : ''}
    <button class="btn danger" id="bkArch">${F.archived ? 'Restore' : 'Archive'}</button>
    <button class="btn" id="bkClear">Clear</button>`;
  const done = async msg => { toast(msg); F.sel.clear(); await loadRoster(true); renderAthList(); renderList(); };
  if($('bkDays')) $('bkDays').onchange = async e => { const d = +e.target.value; if(!d) return; let n = 0;
    for(const m of picked) if(m.mem && planDays(m.prim).includes(d)){ if(await setRoster(m.prim, m.a.id, d, m.mem.strength)) n++; }
    done(n + ' athlete' + (n === 1 ? '' : 's') + ' now on the ' + d + ' day version from their next session'); };
  if($('bkFocus')) $('bkFocus').onchange = async e => { const t = e.target.value; if(!t) return; let n = 0;
    for(const m of picked) if(m.mem && planTracks(m.prim).includes(t)){ if(await setRoster(m.prim, m.a.id, m.mem.days, t)) n++; }
    done(n + ' athlete' + (n === 1 ? '' : 's') + ' now on ' + t); };
  $('bkDueGo').onclick = async () => { const v = $('bkDue').value; if(!v){ $('bkDue').focus(); return; }
    const { data } = await sb.from('app_settings').select('value').eq('key', 'due_overrides').maybeSingle();
    const ov = (data && data.value) || {};
    picked.forEach(m => { const pid = m.dueFrom ? m.dueFrom.id : (m.prim ? m.prim.id : ''); ov[m.a.id + '|' + (pid || '_')] = v; });
    const { error } = await sb.from('app_settings').upsert({key:'due_overrides', value:ov, updated_at:new Date().toISOString()}, {onConflict:'key'});
    if(error){ toast(error.message); return; }
    S.R.dueOv = ov; done(picked.length + ' athlete' + (picked.length === 1 ? '' : 's') + ' now due ' + dShort(v)); };
  $('bkGroup').onchange = async e => { const g = e.target.value; if(!g) return;
    const rows = picked.filter(m => !S.R.gm.some(x => x.profile_id === m.a.id && x.group_id === g)).map(m => ({group_id:g, profile_id:m.a.id}));
    if(rows.length){ const { error } = await sb.from('group_members').insert(rows); if(error){ toast(error.message); return; } }
    done(rows.length + ' added to ' + ((S.groups.find(x => x.id === g) || {}).name || 'the group')); };
  $('bkArch').onclick = async () => { const ids = picked.map(m => m.a.id), to = F.archived;
    const { error } = await sb.from('profiles').update({active:to}).in('id', ids); if(error){ toast(error.message); return; }
    done((to ? 'Restored ' : 'Archived ') + ids.length + ' athlete' + (ids.length === 1 ? '' : 's') + (to ? '' : '. They can still sign in; they\'re just off your lists.')); };
  $('bkClear').onclick = () => { F.sel.clear(); renderAthList(); };
  if($('bkClass')) $('bkClass').onclick = async () => { const ids = picked.filter(m => !m.pls.length).map(m => m.a.id), on = !picked.every(m => m.cls);
    if(await setClassOnly(ids, on)) done(ids.length + ' athlete' + (ids.length === 1 ? '' : 's') + (on ? ' marked Off program' : ' moved to No program assigned')); };
}
function bindAthList(models){
  const F = S.ath, main = $('main');
  let t; $('apQ').oninput = e => { F.q = e.target.value; clearTimeout(t); t = setTimeout(() => { renderAthList(); const q = $('apQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 180); };
  main.querySelectorAll('[data-bucket]').forEach(b => b.onclick = () => { F.bucket = F.bucket === b.dataset.bucket ? '' : b.dataset.bucket; renderAthList(); });
  main.querySelectorAll('[data-atype]').forEach(b => b.onclick = () => { F.type = b.dataset.atype; renderAthList(); });
  main.querySelectorAll('[data-agrp]').forEach(b => b.onclick = () => { F.grp = b.dataset.agrp; renderAthList(); });
  $('apCoach').onchange = e => { F.coaches = e.target.checked; renderAthList(); };
  $('apArch').onchange = e => { F.archived = e.target.checked; F.sel.clear(); renderAthList(); };
  $('apInvite').onclick = openInvite;
  main.querySelectorAll('[data-open]').forEach(b => b.onclick = () => selectAthlete(b.dataset.open));
  main.querySelectorAll('[data-pick]').forEach(c => c.onchange = () => { c.checked ? F.sel.add(c.dataset.pick) : F.sel.delete(c.dataset.pick); renderAthList(); });
  main.querySelectorAll('[data-pickgroup]').forEach(c => c.onchange = () => { models.filter(m => m.bucket === c.dataset.pickgroup).forEach(m => c.checked ? F.sel.add(m.a.id) : F.sel.delete(m.a.id)); renderAthList(); });
  main.querySelectorAll('[data-abuild]').forEach(b => b.onclick = () => builderHandoff(b.dataset.abuild, b));
  main.querySelectorAll('[data-due]').forEach(inp => {
    inp.onclick = () => { try { inp.showPicker(); } catch(e){} };
    inp.onchange = async () => { const [aid, pid] = inp.dataset.due.split('|'), v = inp.value || null;
      const auto = pid ? S.R.C.runOut[pid] : null;
      if(await setDueOverride(aid, pid, v && v !== auto ? v : null)) toast(athleteName(aid).split(' ')[0] + ': next due ' + (v ? dShort(v) : 'back to automatic'));
      renderAthList(); };
  });
  main.querySelectorAll('[data-dreset]').forEach(b => b.onclick = async () => { const [aid, pid] = b.dataset.dreset.split('|');
    if(await setDueOverride(aid, pid, null)) toast(athleteName(aid).split(' ')[0] + ': next due back to automatic'); renderAthList(); });
  main.querySelectorAll('[data-restore]').forEach(b => b.onclick = async () => { const { error } = await sb.from('profiles').update({active:true}).eq('id', b.dataset.restore); if(error){ toast(error.message); return; } toast('Restored'); await loadRoster(true); renderAthList(); renderList(); });
  main.querySelectorAll('[data-aset]').forEach(sel => sel.onchange = async () => {
    const m = models.find(x => x.a.id === sel.dataset.id); if(!m) return;
    if(sel.value === '__add'){ sel.value = sel.querySelector('option[selected]') ? sel.querySelector('option[selected]').value : sel.querySelector('option').value; openAssign(m.a.id); return; }
    if(sel.value === '__class' || sel.value === '__none'){ const on = sel.value === '__class';
      if(await setClassOnly([m.a.id], on)) toast(m.a.name.split(' ')[0] + (on ? ' marked Off program' : ' moved to No program assigned'));
      renderAthList(); return; }
    sel.disabled = true; let ok = false, msg = '';
    if(sel.dataset.aset === 'type' && sel.value.startsWith('days:')){ const d = +sel.value.slice(5); ok = await setRoster(m.prim, m.a.id, d, m.mem && m.mem.strength); msg = m.a.name.split(' ')[0] + ' is on the ' + d + ' day version from their next session'; }
    if(sel.dataset.aset === 'focus'){ ok = await setRoster(m.prim, m.a.id, m.mem && m.mem.days, sel.value); msg = m.a.name.split(' ')[0] + ' is on ' + sel.value + ' from their next session'; }
    if(ok){ toast(msg); await loadRoster(true); } renderAthList();
  });
}
async function builderHandoff(aid, btn){
  const name = athleteName(aid), label = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = 'Opening…'; }
  const { error } = await sb.from('app_settings').upsert({key:'builder_handoff', value:{athlete_id:aid, name, at:new Date().toISOString()}, updated_at:new Date().toISOString()}, {onConflict:'key'});
  if(btn){ btn.disabled = false; btn.textContent = label; }
  if(error){ toast(error.message); return; }
  window.open(BUILDER_URL, 'revbuilder');
  toast('Opening the builder with a new program for ' + name.split(' ')[0] + '. Save and publish it there when it\'s ready.');
}
async function openInvite(){
  const ov = sheet('Invite athletes', '<div class="empty"><span class="spin"></span></div>');
  const { data, error } = await sb.from('invite_codes').select('code,group_id,active').eq('active', true);
  const box = ov.querySelector('.mb'); if(!box) return;
  const base = location.origin + location.pathname.replace(/[^/]*$/, '');
  const rows = (data || []).map(c => ({c, g:S.groups.find(g => g.id === c.group_id)})).filter(x => x.g).sort((x, y) => (x.g.sort ?? 0) - (y.g.sort ?? 0));
  box.innerHTML = error ? `<div class="err">${esc(error.message)}</div>` : `<p class="fnote">Send one of these. Whoever signs up with it lands in that group straight away, then shows up in New athletes on Home.</p>
    ${rows.map(({c, g}) => `<div class="inv"><b>${esc(g.name)}</b><div class="inv-r"><input readonly value="${esc(base + '?join=' + encodeURIComponent(c.code))}" aria-label="${esc(g.name)} join link"><button class="btn sm" data-copy="${esc(base + '?join=' + encodeURIComponent(c.code))}">Copy</button></div></div>`).join('')
      || '<div class="empty">No join links yet. Make them in the athlete app: Coach tools.</div>'}
    <p class="fnote">To make a new link or turn one off, use Coach tools in the athlete app.</p>`;
  box.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; } catch(e){ b.previousElementSibling.select(); toast('Press Cmd + C to copy'); } });
}

/* ---- Periodisation: the full view ---- */
function pzRows(){
  const R = S.R, C = R.C, show = S.pzv.show;
  const rows = R.plans.filter(pl => show[pl.plan_type] && (pl.plan_type !== 'INDIVIDUAL' || (C.onPlan[pl.id] && C.onPlan[pl.id].size) || pl.athlete_id) && R.progs.some(p => p.plan_id === pl.id))
    .sort((x, y) => (T_ORDER[x.plan_type] ?? 9) - (T_ORDER[y.plan_type] ?? 9) || x.name.localeCompare(y.name));
  return rows.map(pl => {
    const who = [...(C.onPlan[pl.id] || [])];
    const label = pl.plan_type === 'INDIVIDUAL' ? athleteName(who[0] || pl.athlete_id) : pl.name;
    return {pl, pos:C.pos[pl.id], who, label, sub:pl.plan_type === 'INDIVIDUAL' ? pl.name : (TYPE_TXT[pl.plan_type] || '') + (who.length ? ' · ' + who.length : '')};
  });
}
function pzCellInfo(r, w){
  const x = pzWeek(r.pos, w); if(!x) return null;
  const p = x.bi >= 0 ? blockPhase(r.pl.id, x.bi, x.name) : {k:'none', c:'#3a3a3f', t:'#ddd', n:'Unplanned'};
  const e = ((S.R.C.wk[r.pl.id] || {})[w]) || null;
  return {...x, p, written:e ? (e.pub ? 'pub' : 'draft') : 'no', e, note:(S.pzSet.notes || {})[r.pl.id + '|' + w] || ''};
}

function openPzWeek(planId, w){
  const R = S.R, C = R.C, pl = C.plans[planId]; if(!pl) return;
  const r = pzRows().find(x => x.pl.id === planId) || {pl, pos:C.pos[planId], who:[...(C.onPlan[planId] || [])], label:pl.name};
  const c = pzCellInfo(r, w);
  const fmtD = (d, o) => parseD(d).toLocaleDateString('en-AU', o);
  const title = (r.label || pl.name) + (c ? ' · week ' + c.n : '');
  const progs = R.progs.filter(p => p.plan_id === planId);
  const byProg = c && c.e ? Object.entries(c.e.progs).map(([pid, n]) => { const p = C.progs[pid]; return `<li><span>${esc([p.track || trackLabel(p), p.days_version ? p.days_version + ' day' : ''].filter(Boolean).join(' · '))}</span><b>${n} session${n === 1 ? '' : 's'}</b>${p.status === 'published' ? '' : '<span class="pill draft">Draft</span>'}</li>`; }).join('') : '';
  const block = c && c.bi >= 0 ? (r.pos.blocks[c.bi] || {}) : null;
  const curK = c && c.bi >= 0 ? (((S.pzSet.phases || {})[planId] || {})[c.bi] || '') : '';
  const who = r.who.slice().sort((a, b) => athleteName(a).localeCompare(athleteName(b)));
  const ov = sheet(title, `<div class="pzw">
    <div class="pzw-d">w/c ${esc(fmtD(w, {weekday:'short', day:'numeric', month:'long', year:'numeric'}))}${c ? ` · program week ${c.n} of ${r.pos.total}` : ''}</div>
    ${c && c.bi >= 0 ? `<div class="pzw-b" style="${pzSty(c.p)}"><b>${esc(c.name)}</b><span>Week ${c.wib} of ${c.bw}${block && block.focus ? ' · ' + esc(block.focus) : ''}</span></div>` : c ? '<div class="muted small">This week isn\'t in any block.</div>' : '<div class="muted small">This program isn\'t running this week.</div>'}
    <div class="pzw-s ${c ? 'w-' + c.written : ''}">${!c ? '' : c.written === 'pub' ? 'Written and published' : c.written === 'draft' ? 'Written, still a draft. Athletes can\'t see it yet.' : 'Not written yet'}</div>
    ${byProg ? `<ul class="pzw-l">${byProg}</ul>` : ''}
    ${c && c.bi >= 0 ? `<div class="clabel" style="margin:6px 0 0">Block colour<span class="csub">applies to all of ${esc(c.name)}</span></div>
      <div class="pzw-ph"><button class="pchip ${curK ? '' : 'on'}" data-phase="">Auto</button>${PZ_PICK.map(([k, n, col, t]) => `<button class="pchip ${curK === k ? 'on' : ''}" data-phase="${k}" style="--pc:${col};--pt:${t}"><i></i>${n}</button>`).join('')}</div>` : ''}
    ${c ? `<div class="clabel" style="margin:6px 0 0">Note for this week</div>
      <textarea id="pzNote" rows="3" placeholder="e.g. Test week, comp prep, gym closed Friday">${esc(c.note)}</textarea>
      <div class="row-act"><button class="btn pri sm" id="pzNoteSave">Save note</button>${c.note ? '<button class="btn ghost sm danger" id="pzNoteDel">Remove</button>' : ''}</div>` : ''}
    ${who.length ? `<div class="clabel" style="margin:6px 0 0">Athletes on it<span class="csub">${who.length}</span></div><div class="pzw-a">${who.map(a => `<button class="glink" data-open="${a}">${esc(athleteName(a))}</button>`).join('')}</div>` : ''}
    <div class="row-act"><a class="btn" href="${BUILDER_URL}" target="revbuilder" rel="noopener">Open in the builder ↗</a><span class="muted small">${progs.length} block${progs.length === 1 ? '' : 's'} × tracks · ${esc(TYPE_TXT[pl.plan_type] || '')}</span></div>
  </div>`, 'pzsheet');
  ov.querySelectorAll('[data-open]').forEach(b => b.onclick = () => { ov.remove(); selectAthlete(b.dataset.open); });
  ov.querySelectorAll('[data-phase]').forEach(b => b.onclick = async () => {
    const k = b.dataset.phase;
    if(await savePzSettings(s => { s.phases ||= {}; s.phases[planId] ||= {}; if(k) s.phases[planId][c.bi] = k; else delete s.phases[planId][c.bi]; })){
      toast(k ? c.name + ' is ' + PZ_PICK.find(p => p[0] === k)[1] + ' now' : c.name + ' back to its automatic colour'); ov.remove(); renderPeriodPage(); }
  });
  const saveNote = async txt => { if(await savePzSettings(s => { s.notes ||= {}; if(txt) s.notes[planId + '|' + w] = txt; else delete s.notes[planId + '|' + w]; })){ toast(txt ? 'Note saved' : 'Note removed'); ov.remove(); renderPeriodPage(); } };

  const athletes = S.athletes.filter(a => a.role !== 'coach');
  const ids = new Set(athletes.map(a => a.id));
  const groupMembers = gid => S.members.filter(m => m.group_id === gid).map(m => m.profile_id);
  // who is on which plan (resolving groups)
  const progPlan = Object.fromEntries(H.progs.map(p => [p.id, p]));
  const onPlan = {};      // plan_id -> Set(athlete)
  const onLive = new Set();
  H.asg.forEach(a => {
    const p = progPlan[a.program_id]; if(!p) return;
    const who = a.athlete_id ? [a.athlete_id] : a.group_id ? groupMembers(a.group_id) : [];
    who.filter(x => ids.has(x)).forEach(x => { (onPlan[p.plan_id] ||= new Set()).add(x); if(p.status === 'published') onLive.add(x); });
  });
  // training
  const thisWeek = H.logs.filter(l => l.completed_at >= monS);
  const trainedWk = new Set(thisWeek.map(l => l.athlete_id).filter(x => ids.has(x)));
  const lastWeekSame = H.logs.filter(l => { const d = new Date(l.completed_at); return d >= addDays(mon, -7) && d < addDays(now, -7); }).length;
  const lastTrained = {}; H.logs.forEach(l => { if(!lastTrained[l.athlete_id]) lastTrained[l.athlete_id] = l.completed_at; });
  const noProg = athletes.filter(a => !onLive.has(a.id) && !isClassOnly(a.id));   // classes-only athletes aren't meant to have training
  const liveCount = athletes.filter(a => onLive.has(a.id)).length;
  // group breakdown for the athletes tile
  const gCounts = S.groups.map(g => [g.name, groupMembers(g.id).filter(x => ids.has(x)).length]).filter(x => x[1]).sort((a,b) => b[1] - a[1]).slice(0, 3);
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const hr = now.getHours(), greet = hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening';
  const firstName = String(S.me.full_name || 'Coach').split(' ')[0];

  // program position
  const planPos = pl => {
    const blocks = Array.isArray(pl.blocks) ? pl.blocks.filter(b => +b.weeks > 0) : [];
    const total = pl.total_weeks || blocks.reduce((t,b) => t + (+b.weeks), 0) || 1;
    let start = pl.start_date ? parseD(pl.start_date) : null;
    if(!start){
      const pids = H.progs.filter(p => p.plan_id === pl.id).map(p => p.id);
      const first = H.asg.filter(a => pids.includes(a.program_id)).map(a => a.created_at).filter(Boolean).sort()[0];
      if(first) start = mondayOf(new Date(first));
    }
    if(!start) return {total, blocks, week:null};
    const week = Math.floor(dayDiff(monS, ymd(start)) / 7) + 1;
    let acc = 0, bi = -1, wib = 0;
    blocks.forEach((b, i) => { if(bi < 0 && week <= acc + (+b.weeks)){ bi = i; wib = week - acc; } acc += +b.weeks; });
    const end = addDays(start, total * 7 - 1);
    let nextBlock = null, a2 = 0;
    for(const b of blocks){ a2 += +b.weeks; if(a2 >= week && a2 < total){ nextBlock = addDays(start, a2 * 7); break; } }
    return {total, blocks, week, start, end, bi, wib, nextBlock};
  };
  const TYPE_ORDER = {BASE:0, COMPETITIVE:1, FNDN:2};
  const auto = H.plans.filter(p => p.plan_type !== 'INDIVIDUAL' && H.progs.some(q => q.plan_id === p.id))
    .sort((a,b) => (TYPE_ORDER[a.plan_type] ?? 9) - (TYPE_ORDER[b.plan_type] ?? 9) || a.name.localeCompare(b.name));
  const indiv = H.plans.filter(p => p.plan_type === 'INDIVIDUAL' && H.progs.some(q => q.plan_id === p.id)).map(pl => ({pl, pos:planPos(pl), who:[...(onPlan[pl.id] || [])]}))
    .filter(x => x.who.length || x.pl.athlete_id)
    .sort((a,b) => (a.pos.end ? a.pos.end : 9e15) - (b.pos.end ? b.pos.end : 9e15));
  // Individual programs: a short version of the Athletes list rows, soonest due first
  const indivDue = ({pl, pos, who}) => { const aid = who[0] || pl.athlete_id;
    return (S.R && S.R.C ? dueOf(aid, pl.id) : null) || (pos.end ? ymd(addDays(pos.end, 1)) : null); };
  indiv.sort((a, b) => (indivDue(a) || '9999').localeCompare(indivDue(b) || '9999'));
  const indivRows = indiv.map(x => {
    const {pl, pos, who} = x, aid = who[0] || pl.athlete_id, live = H.progs.some(q => q.plan_id === pl.id && q.status === 'published');
    const due = indivDue(x), n = due ? dayDiff(due, ymd(now)) : null, ov = S.R && (S.R.dueOv || {})[aid + '|' + pl.id];
    const grp = S.members.filter(m => m.profile_id === aid).map(m => (S.groups.find(g => g.id === m.group_id) || {}).name).filter(Boolean).join(', ');
    const wkN = S.weekDone[aid] ? S.weekDone[aid].size : 0;
    const st = pos.week == null ? 'Not started' : pos.week < 1 ? 'Starts ' + dShort(ymd(pos.start)) : pos.week > pos.total ? 'Finished' : `Week ${pos.week} of ${pos.total}`;
    return `<div class="irw">
      <button class="aname" data-ath="${aid}">${esc(athleteName(aid))}<span class="anote">${esc(grp || 'No group')}</span></button>
      <span class="wk iwk" title="${wkN} day${wkN === 1 ? '' : 's'} trained this week">${[0,1,2,3,4].map(i => `<i class="${i < wkN ? 'on' : ''}"></i>`).join('')}</span>
      <span class="ipl"><span class="selw t-individual static" title="${esc(pl.name)}"><span>${esc(pl.name)}</span></span>${live ? '' : '<span class="pill draft">Draft</span>'}</span>
      <span class="ist">${esc(st)}${pos.week >= 1 && pos.week <= pos.total ? `<span class="mini"><i style="width:${pct(pos.week, pos.total)}%"></i></span>` : ''}</span>
      <span class="adate ${ov ? 'iov' : ''}" title="${ov ? 'Next due set by you' : 'Next due: the Monday after published sessions run out'}">${due ? esc(dShort(due)) : '–'}</span>
      <span>${n == null ? '<span class="adays d-later">–</span>' : `<span class="adays d-${rBucket(n)}">${n}</span>`}</span>
      <a class="asent" href="${BUILDER_URL}" target="revbuilder" rel="noopener" title="Open the builder to write the next weeks of ${esc(pl.name)}">Write next ↗</a>
    </div>`;
  }).join('');
  const pzHtml = periodisation({auto, indiv, planPos, onPlan, trainedWk, monS, now});
  const latest = H.logs.slice(0, 12).map(l => `<button class="feed" data-ath="${l.athlete_id}"><span class="av">${avIn(l.athlete_id, athleteName(l.athlete_id))}</span>
      <span class="fb"><b>${esc(athleteName(l.athlete_id))}</b><span class="muted small">${esc((l.sessions && (l.sessions.code || l.sessions.title)) || 'Session')}${l.sessions && l.sessions.code && l.sessions.title ? ' · ' + esc(l.sessions.title) : ''}</span></span>
      <span class="ft">${esc(relTime(l.completed_at))}</span></button>`).join('');
  const quiet = athletes.filter(a => onLive.has(a.id) && !trainedWk.has(a.id))
    .sort((a,b) => (lastTrained[a.id] || '').localeCompare(lastTrained[b.id] || ''));
  const quietRows = quiet.slice(0, 10).map(a => `<button class="feed" data-ath="${a.id}"><span class="av dim">${avIn(a.id, a.name)}</span>
      <span class="fb"><b>${esc(a.name)}</b><span class="muted small">${lastTrained[a.id] ? 'Last trained ' + relTime(lastTrained[a.id]) : 'Nothing logged in 3 weeks'}</span></span></button>`).join('');
  // maxes: latest entry per athlete+lift in the last 30 days, with the previous best
  const cutoff = ymd(addDays(now, -30)), seen = new Set(), newMax = [];
  H.maxes.forEach(m => {
    const k = m.athlete_id + '|' + m.exercise_id; if(seen.has(k)) return; seen.add(k);
    if((m.recorded_on || '') < cutoff || !ids.has(m.athlete_id)) return;
    const prev = H.maxes.filter(x => x.athlete_id === m.athlete_id && x.exercise_id === m.exercise_id && x !== m && (x.recorded_on || '') <= (m.recorded_on || '')).map(x => +x.weight_kg);
    const best = prev.length ? Math.max(...prev) : null;
    newMax.push({...m, up: best != null ? +m.weight_kg - best : null});
  });
  const maxRows = newMax.slice(0, 8).map(m => `<button class="feed" data-ath="${m.athlete_id}"><span class="fb"><b>${esc(athleteName(m.athlete_id))}</b><span class="muted small">${esc((S.ex[m.exercise_id] || {}).name || 'Lift')} · ${esc(dShort(m.recorded_on))}</span></span>
      <span class="mxv"><b class="num">${+m.weight_kg}</b> kg${m.up > 0 ? `<span class="up">+${+m.up.toFixed(1)}</span>` : ''}</span></button>`).join('');
  const evRows = H.events.slice(0, 4).map(e => `<div class="evrow"><span class="evd"><b>${parseD(e.event_date).getDate()}</b>${MONTHS[parseD(e.event_date).getMonth()].slice(0,3)}</span>
      <span class="fb"><b>${esc(e.title)}</b><span class="muted small">${esc(parseD(e.event_date).toLocaleDateString('en-AU', {weekday:'long'}))}${e.event_time ? ' · ' + esc(e.event_time.slice(0,5)) : ''}${e.location ? ' · ' + esc(e.location) : ''}</span></span></div>`).join('');

  // new athletes: signed up, not on any program yet
  const onAny = new Set(); Object.values(onPlan).forEach(set => set.forEach(x => onAny.add(x)));
  const newAth = athletes.filter(a => !onAny.has(a.id) && !isClassOnly(a.id)).sort((a,b) => (b.created_at || '').localeCompare(a.created_at || ''));
  const assignable = H.plans.filter(p => p.plan_type !== 'INDIVIDUAL' && H.progs.some(q => q.plan_id === p.id))
    .sort((a,b) => (TYPE_ORDER[a.plan_type] ?? 9) - (TYPE_ORDER[b.plan_type] ?? 9) || a.name.localeCompare(b.name));
  const hasIndiv = H.plans.some(p => p.plan_type === 'INDIVIDUAL');
  const planOpts = ['BASE','COMPETITIVE','FNDN'].map(t => {
    const ps = assignable.filter(p => p.plan_type === t); if(!ps.length) return '';
    return `<optgroup label="${TYPE_TXT[t]}">${ps.map(p => { const live = H.progs.some(q => q.plan_id === p.id && q.status === 'published'); const pos = planPos(p);
      return `<option value="${p.id}">${esc(p.name)}${pos.week >= 1 && pos.week <= pos.total ? ' · wk ' + pos.week : pos.week != null && pos.week < 1 ? ' · starts ' + dShort(ymd(pos.start)) : ''}${live ? '' : ' (draft)'}</option>`; }).join('')}</optgroup>`;
  }).join('');
  const newRows = newAth.map(a => {
    const grp = S.members.filter(m => m.profile_id === a.id).map(m => (S.groups.find(g => g.id === m.group_id) || {}).name).filter(Boolean);
    return `<div class="narow" data-na="${a.id}">
      <button class="feed nawho" data-ath="${a.id}"><span class="av">${avIn(a.id, a.name)}</span><span class="fb"><b>${esc(a.name)}</b><span class="muted small">${a.created_at ? 'Signed up ' + esc(relTime(a.created_at)) : esc(a.email || '')}${grp.length ? ' · ' + esc(grp.join(', ')) : ''}</span></span></button>
      <div class="nactl">
        ${(() => { const av = S.groups.filter(g => !S.members.some(m => m.profile_id === a.id && m.group_id === g.id)); return av.length ? `<select data-nagrp="${a.id}" class="nagrp" aria-label="Add ${esc(a.name)} to a group"><option value="">Add to group…</option>${av.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>` : ''; })()}
        <select data-naplan aria-label="Program for ${esc(a.name)}"><option value="">Choose a program…</option>${planOpts}${hasIndiv ? '<option value="__indiv">Individual program…</option>' : ''}</select>
        <select data-nadays hidden aria-label="Day option"></select>
        <select data-nastr hidden aria-label="Strength track"></select>
        <button class="btn pri sm" data-nago disabled>Assign</button>
        <span class="naor">or</span>
        <button class="btn sm nabuild" data-nabuild="${a.id}" title="Opens the program builder with a new Individual program for ${esc(a.name)}">Build them a program ↗</button>
      </div>
    </div>`;
  }).join('');

  // Hold and cancel requests from the app's profile menu
  const dLong = ds => parseD(ds).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'});
  const reqs = S.reqs || [], pendR = reqs.filter(r => r.status === 'pending').sort((a,b) => a.created_at.localeCompare(b.created_at)), doneR = reqs.filter(r => r.status !== 'pending' && r.decided_at).sort((a,b) => b.decided_at.localeCompare(a.decided_at));
  const rqWhat = r => r.kind === 'hold' ? `On hold <b>${esc(dLong(r.start_date))}</b> to <b>${esc(dLong(r.end_date))}</b> <span class="muted">(${Math.round((parseD(r.end_date) - parseD(r.start_date)) / 864e5 / 7 * 10) / 10} wks)</span>` : `Last day <b>${esc(dLong(r.start_date))}</b>`;
  const rqHist = doneR.length ? `<details class="rqhist"><summary>Last 60 days (${doneR.length})</summary>${doneR.map(r => `<div class="rqh"><span><button class="alink" data-ath="${r.athlete_id}">${esc(athleteName(r.athlete_id))}</button> <span class="rqk ${r.kind}">${r.kind === 'hold' ? 'Hold' : 'Cancel'}</span> <span class="muted">${r.kind === 'hold' ? esc(dShort(r.start_date)) + ' to ' + esc(dShort(r.end_date)) : 'last day ' + esc(dShort(r.start_date))}${r.coach_note ? ' · “' + esc(r.coach_note) + '”' : ''}</span></span><span class="rqs ${r.status}">${esc(r.status)}</span></div>`).join('')}</details>` : '';
  const reqCard = S.reqs == null ? '' : pendR.length ? `<div class="card nabox rqbox has">
      <div class="nahead"><div><h2>Hold and cancel requests <span class="nacount">${pendR.length}</span></h2>
        <p class="muted small">Pending in the athlete's app until you approve or decline. They get a notification either way. Any note you add goes to them.</p></div></div>
      <div class="nalist">${pendR.map(r => `<div class="rqrow" data-rq="${r.id}">
        <button class="feed rqwho" data-ath="${r.athlete_id}"><span class="av">${avIn(r.athlete_id, athleteName(r.athlete_id))}</span><span class="fb"><b>${esc(athleteName(r.athlete_id))}<span class="rqk ${r.kind}">${r.kind === 'hold' ? 'Hold' : 'Cancel'}</span></b>
          <span class="rqwhat">${rqWhat(r)}</span>${r.reason ? `<span class="rqwhy">${esc(r.reason)}</span>` : ''}<span class="muted small">Sent ${esc(relTime(r.created_at))}</span></span></button>
        <div class="rqctl"><input data-rqnote placeholder="Note to ${esc(athleteName(r.athlete_id).split(' ')[0])} (optional)" maxlength="300" aria-label="Note">
          <button class="btn sm ghost danger" data-rqd="declined">Decline</button><button class="btn pri sm" data-rqd="approved">Approve</button></div>
      </div>`).join('')}</div>${rqHist}
    </div>` : `<div class="card rqbox slim"><span class="muted small"><b style="color:var(--text);font-weight:500">Hold and cancel requests</b> · none waiting</span>${rqHist ? `<span>${rqHist}</span>` : ''}</div>`;

  // From the coach (same posts as the top of the member app's Home)
  const KIND = {note:'Note', reminder:'Reminder', focus:'Focus'};
  const gName_ = id => id ? ((S.groups.find(g => g.id === id) || {}).name || 'A group') : 'Everyone';
  const notes = H.notes || [], topN = notes[0], restN = notes.slice(1);
  const noteCard = H.notes == null ? '' : `<div class="card fcoach">
    <div class="clabel"><span class="fck">From the coach</span><span class="csub">shows at the top of the app's Home</span></div>
    ${topN ? `<div class="fc-now"><div class="fc-meta"><span class="ktag k-${esc(topN.kind)}">${topN.pinned ? '📌 ' : ''}${KIND[topN.kind] || 'Note'}</span><span class="muted small">${esc(gName_(topN.group_id))} · ${esc(relTime(topN.created_at))}</span></div>
        ${topN.title ? `<div class="fc-t">${esc(topN.title)}</div>` : ''}<div class="fc-b">${esc(topN.body)}</div>
        <div class="fc-act"><button class="btn sm" data-npin="${topN.id}" data-p="${topN.pinned}">${topN.pinned ? 'Unpin' : 'Pin'}</button><button class="btn sm ghost danger" data-ndel="${topN.id}">Delete</button></div></div>`
      : '<div class="muted small" style="margin-bottom:10px">Nothing posted yet.</div>'}
    <div class="fc-comp">
      <input id="nTitle" placeholder="Headline (optional)" maxlength="120">
      <textarea id="nBody" placeholder="Reminder, focus for the week, a note to the team…" rows="3"></textarea>
      <div class="fc-row"><select id="nKind" aria-label="Type"><option value="note">Note</option><option value="reminder">Reminder</option><option value="focus">Focus</option></select>
        <select id="nGroup" aria-label="Who sees it"><option value="">Everyone</option>${S.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
        <label class="chk small"><input type="checkbox" id="nPin"> Pin</label>
        <button class="btn pri sm" id="nPost">Post</button></div>
    </div>
    ${restN.length ? `<details class="fc-old"><summary>Earlier (${restN.length})</summary>${restN.map(n => `<div class="fc-oldrow"><div class="muted small">${n.pinned ? '📌 ' : ''}${KIND[n.kind] || 'Note'} · ${esc(gName_(n.group_id))} · ${esc(relTime(n.created_at))}
        <button class="lnk" data-npin="${n.id}" data-p="${n.pinned}">${n.pinned ? 'unpin' : 'pin'}</button><button class="lnk danger" data-ndel="${n.id}">delete</button></div>${n.title ? `<b>${esc(n.title)}</b>` : ''}<p>${esc(n.body)}</p></div>`).join('')}</details>` : ''}
  </div>`;

  const wkSess = thisWeek.length, delta = wkSess - lastWeekSame;
  $('main').innerHTML = `<div class="home">
    <div class="hhead">
      <div><div class="greet">${greet}, ${esc(firstName)}</div><div class="hday">${now.toLocaleDateString('en-AU', {weekday:'long'})}</div><div class="hdate">${now.toLocaleDateString('en-AU', {day:'numeric', month:'long', year:'numeric'})}</div></div>
      <div class="hright"><a class="btn sm" href="${BUILDER_URL}" target="_blank" rel="noopener">Program builder ↗</a><span class="clock" id="hClock"></span></div>
    </div>
    <div class="metrics">
      <div class="metric"><div class="ml">Athletes</div><div class="mv num">${athletes.length}</div><div class="ms">${gCounts.map(([n,c]) => esc(n) + ' ' + c).join(' · ') || '&nbsp;'}</div></div>
      <div class="metric"><div class="ml">Trained this week</div><div class="mv num">${trainedWk.size}<span class="mof">/ ${liveCount}</span></div><div class="mbar"><i style="width:${pct(trainedWk.size, liveCount)}%"></i></div><div class="ms">${pct(trainedWk.size, liveCount)}% of athletes on a live program</div></div>
      <div class="metric"><div class="ml">Sessions completed</div><div class="mv num">${wkSess}</div><div class="ms">${delta === 0 ? 'Same as' : `<span class="${delta > 0 ? 'good' : 'amber'}">${delta > 0 ? '+' : ''}${delta}</span> vs`} this point last week</div></div>
      <button class="metric ${noProg.length ? 'alert' : ''}" id="mNoProg"><div class="ml">No live program</div><div class="mv num">${noProg.length}</div><div class="ms">${noProg.length ? 'Not seeing any training. Click to see who' : 'Everyone has training'}</div></button>
    </div>
    ${reqCard}
    <div class="card nabox ${newAth.length ? 'has' : ''}">
      <div class="nahead"><div><h2>New athletes ${newAth.length ? `<span class="nacount">${newAth.length}</span>` : ''}</h2>
        <p class="muted small">${newAth.length ? 'Signed up but not on a program yet, so the app shows them no training. Pick a track and assign.' : 'Nobody waiting. New sign-ups land here so you can put them on a program in one go.'}</p></div></div>
      ${newRows ? `<div class="nalist">${newRows}</div>` : ''}
    </div>
    <div class="card pz" id="pzCard">${pzHtml}</div>
    <div class="hgrid">
      <div class="hmain">
        ${forumCard()}
        <div class="card"><div class="clabel">Individual programs<span class="csub">soonest due first</span></div>
          ${indivRows ? `<div class="ilst"><div class="irw ihr"><span>Athlete</span><span class="iwk">Wk</span><span>Program</span><span>Progress</span><span>Next due</span><span>Days</span><span></span></div>${indivRows}</div>` : '<div class="empty">No individual programs assigned.</div>'}</div>
      </div>
      <div class="hside">
        ${noteCard}
        <div class="card"><div class="clabel">Latest sessions</div>${latest || '<div class="empty">No sessions completed in the last 3 weeks.</div>'}</div>
        <div class="card"><div class="clabel">Not trained this week<span class="csub">${quiet.length}</span></div>${quietRows || '<div class="empty">Everyone on a program has trained this week.</div>'}${quiet.length > 10 ? `<div class="muted small" style="padding-top:6px">+${quiet.length - 10} more</div>` : ''}</div>
        <div class="card"><div class="clabel">New maxes<span class="csub">last 30 days</span></div>${maxRows || '<div class="empty">No new maxes recorded.</div>'}</div>
        <div class="card"><div class="clabel">Coming up</div>${evRows || '<div class="empty">No events coming up.</div>'}</div>
      </div>
    </div>
  </div>`;
  const tick = () => { const c = $('hClock'); if(!c){ clearInterval(S.clockT); return; } c.textContent = new Date().toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'}); };
  tick(); clearInterval(S.clockT); S.clockT = setInterval(tick, 15000);
  $('main').querySelectorAll('[data-ath]').forEach(b => b.onclick = () => selectAthlete(b.dataset.ath));
  bindPz();
  if($('hNewPost')) $('hNewPost').onclick = () => { S.fm.edit = {}; S.fm.sel = null; setView('forum'); };
  $('main').querySelectorAll('[data-hpost]').forEach(b => b.onclick = () => { S.fm.sel = b.dataset.hpost; S.fm.edit = null; setView('forum'); });
  if($('nPost')) $('nPost').onclick = async () => {
    const body = $('nBody').value.trim();
    if(!body){ $('nBody').focus(); toast('Write the message first'); return; }
    const btn = $('nPost'); btn.disabled = true; btn.textContent = 'Posting…';
    const { error } = await sb.from('coach_notes').insert({ title:$('nTitle').value.trim() || null, body, kind:$('nKind').value, group_id:$('nGroup').value || null, pinned:$('nPin').checked });
    if(error){ btn.disabled = false; btn.textContent = 'Post'; toast(error.message); return; }
    toast('Posted to ' + ($('nGroup').value ? (S.groups.find(g => g.id === $('nGroup').value) || {}).name : 'everyone') + '. It\'s at the top of the app\'s Home now.');
    loadHome();
  };
  $('main').querySelectorAll('[data-npin]').forEach(b => b.onclick = async () => {
    const { error } = await sb.from('coach_notes').update({pinned: b.dataset.p !== 'true'}).eq('id', b.dataset.npin);
    if(error){ toast(error.message); return; } loadHome();

/* ---------- Compliance ----------
   Every athlete x the last N weeks: programmed sessions completed. Counted the way the athlete
   sees their week: published programs only, their personal versions replace the shared ones,
   removed and unpublished sessions don't count, one-off/pasted sessions do, and a FNDN-style
   day with options counts once (done if any option is done). Future days aren't counted. */
async function fetchAll(make, page = 1000){
  let out = [], from = 0;
  for(;;){
    const { data, error } = await make().range(from, from + page - 1);
    if(error) return { error };
    out = out.concat(data || []);
    if(!data || data.length < page) return { data: out };
    from += page;
  }
}

      ${r.status === 'reviewed' ? `<p class="small muted" style="margin-top:6px">Reviewed ${esc(vrWhen(r.reviewed_at))}${r.athlete_seen_at ? ' · seen by athlete' : ' · not seen yet'}</p>` : ''}
      <p class="small muted" id="vrLife" style="margin-top:4px"></p>

      : 'Deletes automatically 60 days after you review it, unless you tap Keep.'; };
  life();
  if(vid) vid.addEventListener('error', () => { if(vid.crossOrigin){ vid.removeAttribute('crossorigin'); vid.src = url; vid.load(); } }, {once:true});
  mkSign(V, r.markups.map(x => x.path)).then(() => mkThumbs(V, r));
  if($('vrDraw')) $('vrDraw').onclick = async () => { vid.pause(); const b = $('vrDraw'); b.disabled = true;
    try { const base = await mkGrab(vid, url), t = vid.currentTime;
      mkEditor(base, t, async (blob, w, h) => {
        const path = `${r.athlete_id}/mk-${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from('reviews').upload(path, blob, {contentType:'image/jpeg'}); if(up.error) throw up.error;
        const next = [...r.markups, {path, t:Math.round(t * 100) / 100, w, h}];
        const { error } = await sb.from('video_reviews').update({markups:next}).eq('id', id); if(error){ sb.storage.from('reviews').remove([path]); throw error; }
        r.markups = next; await mkSign(V, [path]); mkThumbs(V, r); toast(r.status === 'reviewed' ? 'Drawing added. The athlete can see it now.' : 'Drawing added. It goes to the athlete with your review.');
      });
    } catch(e){ toast('Could not grab the frame: ' + (e.message || e)); }
    b.disabled = false; };
  $('main').querySelectorAll('[data-vq]').forEach(b => b.onclick = () => { const ta = $('vrReply'), q = VR_QUICK[+b.dataset.vq], cur = ta.value.trimEnd();
    ta.value = cur ? cur + '\n' + q : q; ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); });

  $('vrSend').onclick = async () => { const txt = $('vrReply').value.trim(); if(!txt){ toast('Write your review first'); return; }
    const upd = {coach_reply:txt, status:'reviewed', reviewed_at:new Date().toISOString(), reviewed_by:S.user.id};
    const { error } = await sb.from('video_reviews').update(upd).eq('id', id); if(error){ toast(error.message); return; }
    Object.assign(r, upd); refreshVR(); toast('Review sent'); V.sel = null; drawReviews(); };
  $('vrStar').onclick = async () => { const { error } = await sb.from('video_reviews').update({starred:!r.starred}).eq('id', id); if(error){ toast(error.message); return; } r.starred = !r.starred; $('vrStar').textContent = r.starred ? '⭐ Kept' : '☆ Keep'; life(); };
  $('vrAth').onclick = () => selectAthlete(r.athlete_id);
  $('vrDel').onclick = async () => { const b = $('vrDel'); if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Delete for good?'; return; }
    const { error } = await sb.from('video_reviews').delete().eq('id', id); if(error){ toast(error.message); return; }
    sb.storage.from('reviews').remove([r.video_path, ...(r.markups || []).map(x => x.path)]).then(() => {}, () => {}); V.rows = V.rows.filter(x => x.id !== id); V.sel = null; refreshVR(); toast('Deleted'); drawReviews(); };
}

/* ---------- Technical notes: every athlete's notes in one place (athletes write them in the app) ---------- */

  renderTechNotes();
}

      <select id="tnX" aria-label="Lift" style="flex:1;min-width:150px"><option value="">All lifts</option>${lifts.map(x => `<option value="${x || 'general'}" ${(x || 'general') === T.x ? 'selected' : ''}>${esc(exN(x || null))}</option>`).join('')}</select>
