/* ---------- Compliance ----------
   Every athlete x the last N weeks: programmed sessions completed. Counted the way the athlete
   sees their week: published programs only, their personal versions replace the shared ones,
   removed and unpublished sessions don't count, one-off/pasted sessions do, and a FNDN-style
   day with options counts once (done if any option is done). Future days aren't counted. */
async function fetchAll(make, page = 1000){
  let out = [], from = 0;
  for(;;){
    const { data, error } = await make().range(from, from + page - 1);
    if(error) return { error };
    out = out.concat(data || []);
    if(!data || data.length < page) return { data: out };
    from += page;
  }
}
S.cmp = {weeks: 6, sort: 'pct', q: '', grp: 'all', plan: 'all'};
async function loadCompliance(){
  $('main').innerHTML = '<div class="empty"><span class="spin"></span> Working out compliance</div>';
  const W = S.cmp.weeks, mon = mondayOf(new Date()), from = addDays(mon, -(W - 1) * 7);
  const [pg, as, pl] = await Promise.all([
    sb.from('programs').select('id,plan_id,status,start_date,week_offset,days_version,track,is_option').eq('status','published'),
    sb.from('program_assignments').select('program_id,group_id,athlete_id,created_at'),
    sb.from('program_plans').select('id,name,plan_type').neq('status','archived')
  ]);
  const bad = [pg, as, pl].find(x => x.error);
  if(bad){ $('main').innerHTML = `<div class="empty">Could not load: ${esc(bad.error.message)}</div>`; return; }
  const progs = pg.data || [], pids = progs.map(p => p.id);
  const [ss, lg, hd] = await Promise.all([
    pids.length ? fetchAll(() => sb.from('sessions').select('id,program_id,week_number,day_number,scheduled_date,override_athlete_id,override_kind').in('program_id', pids).order('id')) : {data:[]},
    fetchAll(() => sb.from('workout_logs').select('athlete_id,session_id,completed_at').not('completed_at','is',null).gte('completed_at', ymd(addDays(from, -21))).order('completed_at')),
    fetchAll(() => sb.from('session_hidden').select('athlete_id,session_id').order('session_id'))
  ]);
  if(S.view !== 'compliance') return;
  const bad2 = [ss, lg].find(x => x.error);
  if(bad2){ $('main').innerHTML = `<div class="empty">Could not load: ${esc(bad2.error.message)}</div>`; return; }
  S.C = {progs, asg: as.data || [], plans: pl.data || [], sessions: ss.data || [], logs: lg.data || [], hidden: hd.error ? [] : (hd.data || []), from, W};
  computeCompliance(); renderCompliance();
}
function computeCompliance(){
  const C = S.C, today = ymd(new Date()), fromS = ymd(C.from);
  const athletes = S.athletes.filter(a => a.role !== 'coach');
  const progById = Object.fromEntries(C.progs.map(p => [p.id, p]));
  const planById = Object.fromEntries(C.plans.map(p => [p.id, p]));
  const weeksOf = {}; C.sessions.forEach(x => { if(!x.override_athlete_id) weeksOf[x.program_id] = Math.max(weeksOf[x.program_id] || 0, x.week_number); });
  const shared = C.sessions.filter(x => !x.override_athlete_id), own = {};
  C.sessions.forEach(x => { if(x.override_athlete_id) (own[x.override_athlete_id] ||= []).push(x); });
  const hidden = {}; C.hidden.forEach(h => (hidden[h.athlete_id] ||= new Set()).add(h.session_id));
  const done = {}, last = {}; C.logs.forEach(l => { (done[l.athlete_id] ||= new Set()).add(l.session_id); if(!last[l.athlete_id] || l.completed_at > last[l.athlete_id]) last[l.athlete_id] = l.completed_at; });
  const gm = gid => S.members.filter(m => m.group_id === gid).map(m => m.profile_id);
  const myProgs = {};
  C.asg.forEach(a => { if(!progById[a.program_id]) return; (a.athlete_id ? [a.athlete_id] : a.group_id ? gm(a.group_id) : []).forEach(x => (myProgs[x] ||= new Map()).set(a.program_id, a)); });
  const weekStarts = Array.from({length:C.W}, (_, i) => ymd(addDays(C.from, i * 7)));
  C.rows = athletes.map(a => {
    const pm = myProgs[a.id];
    if(!pm || !pm.size) return {a, none:true, weeks:weekStarts.map(() => null), plans:[]};
    const base = {};
    pm.forEach((asg, pid) => {
      const p = progById[pid];
      if(p.start_date) base[pid] = parseD(p.start_date);
      else {
        const first = C.asg.filter(x => x.program_id === pid && (x.athlete_id === a.id || (x.group_id && gm(x.group_id).includes(a.id)))).map(x => x.created_at).filter(Boolean).sort()[0];
        if(first) base[pid] = addDays(mondayOf(new Date(first)), (p.week_offset || 0) * 7);
      }
    });
    const mineList = (own[a.id] || []).filter(x => pm.has(x.program_id));
    const replaced = new Set(mineList.filter(x => (x.override_kind || 'replace') !== 'extra').map(x => x.program_id + '|' + x.week_number + '|' + x.day_number));
    const list = shared.filter(x => pm.has(x.program_id) && !replaced.has(x.program_id + '|' + x.week_number + '|' + x.day_number))
      .concat(mineList.filter(x => x.override_kind !== 'removed'));
    const hid = hidden[a.id] || new Set(), dn = done[a.id] || new Set();
    // group into "cards" per date x plan x day option, like the calendar
    const cards = {};
    list.forEach(x => {
      if(hid.has(x.id)) return;
      const p = progById[x.program_id];
      let date = x.scheduled_date;
      if(!date){ const b = base[x.program_id]; if(!b) return; date = ymd(addDays(b, (x.week_number - 1) * 7 + (x.day_number - 1))); }
      if(date < fromS || date > today) return;
      const k = date + '|' + (p.plan_id || p.id) + '|' + (p.days_version || '');
      (cards[k] ||= {date, list:[]}).list.push({x, p});
    });
    const weeks = weekStarts.map(() => ({prog:0, done:0, part:0}));
    Object.values(cards).forEach(c => {
      const wi = Math.floor(dayDiff(c.date, fromS) / 7); if(wi < 0 || wi >= weeks.length) return;
      const opts = c.list.filter(y => y.p.is_option), choice = opts.length > 1;
      const req = c.list.filter(y => !(choice && y.p.is_option));
      const ok = req.every(y => dn.has(y.x.id)) && (!choice || opts.some(y => dn.has(y.x.id)));
      const any = c.list.some(y => dn.has(y.x.id));
      weeks[wi].prog++; if(ok) weeks[wi].done++; else if(any) weeks[wi].part++;
    });
    const tp = weeks.reduce((t, w) => t + w.prog, 0), td = weeks.reduce((t, w) => t + w.done, 0);
    const plans = [...new Set([...pm.keys()].map(pid => progById[pid].plan_id).filter(Boolean))].map(id => planById[id]).filter(Boolean);
    // last 2 full weeks vs the 2 before, for a trend arrow
    const span = (i, j) => { const ws = weeks.slice(i, j); const p = ws.reduce((t,w) => t + w.prog, 0); return p ? ws.reduce((t,w) => t + w.done, 0) / p : null; };
    const n = weeks.length, recent = span(n - 3, n - 1), before = span(n - 5, n - 3);
    return {a, weeks, tp, td, pct: tp ? td / tp : null, plans, last:last[a.id] || null, trend: recent != null && before != null ? recent - before : null};
  });
  C.weekStarts = weekStarts;
}
function renderCompliance(){
  const C = S.C, F = S.cmp, today = new Date();
  let rows = C.rows.slice();
  if(F.grp !== 'all') rows = rows.filter(r => S.members.some(m => m.profile_id === r.a.id && m.group_id === F.grp));
  if(F.plan !== 'all') rows = rows.filter(r => r.plans && r.plans.some(p => p.id === F.plan));
  if(F.q) rows = rows.filter(r => r.a.name.toLowerCase().includes(F.q));
  const val = r => r.none ? 9 : r.pct == null ? 8 : r.pct;
  rows.sort(F.sort === 'name' ? (x, y) => x.a.name.localeCompare(y.a.name) : F.sort === 'last' ? (x, y) => (x.last || '').localeCompare(y.last || '') : (x, y) => val(x) - val(y) || x.a.name.localeCompare(y.a.name));

/* ---------- Shared text helpers (same as the member app) ---------- */
const CATS = ['Club News','Technique','Programming','Comp','Nutrition','Mindset'];
const REACTS = [['fire','🔥'],['strong','💪'],['clap','👏']];
const safeYoutube = u => /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//i.test(u || '') ? u : null;
function ytId(u){ if(!safeYoutube(u)) return null; const m = u.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/); return m ? m[1] : null; }
function inlineMd(t){
  return t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|\s)_(.+?)_(?=\s|$|[.,!?])/g,'$1<i>$2</i>')
    .replace(/\[([^\]]+)\]\((https:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/(^|[\s(])(https:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
}
function md(text){
  const lines = esc(text || '').split('\n'); let out = '', list = false, para = [];
  const flush = () => { if(para.length){ out += '<p>' + inlineMd(para.join('<br>')) + '</p>'; para = []; } };
  for(const raw of lines){ const l = raw.trimEnd();
    if(/^- /.test(l)){ flush(); if(!list){ out += '<ul>'; list = true; } out += '<li>' + inlineMd(l.slice(2)) + '</li>'; continue; }
    if(list){ out += '</ul>'; list = false; }
    if(/^#{1,3} /.test(l)){ flush(); out += '<h3>' + inlineMd(l.replace(/^#{1,3} /,'')) + '</h3>'; continue; }
    if(!l.trim()){ flush(); continue; }
    para.push(l);
  }
  flush(); if(list) out += '</ul>'; return out;
}
const plainTxt = t => String(t || '').replace(/[#*_>\[\]()-]/g,' ').replace(/https:\/\/\S+/g,'').replace(/\s+/g,' ').trim();
const linkify = t => esc(t).replace(/(https:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,'<br>');

async function fetchForum(){
  const F = S.fm;
  let q = sb.from('posts').select('id,title,body,category,video_url,pinned,status,created_at').order('pinned', {ascending:false}).order('created_at', {ascending:false}).limit(100);
  if(F.cat !== 'All') q = q.eq('category', F.cat);
  const term = F.q.replace(/[,()*:%\\."']/g, ' ').trim();
  if(term) q = q.or(`title.ilike.*${term}*,body.ilike.*${term}*`);
  const { data, error } = await q;
  if(S.view !== 'forum') return;
  if(error){ $('fmList').innerHTML = `<div class="empty">${esc(error.message)}</div>`; return; }
  const ids = (data || []).map(p => p.id);
  const [c, r] = ids.length ? await Promise.all([sb.from('post_comments').select('post_id,created_at').in('post_id', ids), sb.from('post_reactions').select('post_id').in('post_id', ids)]) : [{data:[]}, {data:[]}];
  const cc = {}, lastc = {}, rc = {};
  (c.data || []).forEach(x => { cc[x.post_id] = (cc[x.post_id] || 0) + 1; if(!lastc[x.post_id] || x.created_at > lastc[x.post_id]) lastc[x.post_id] = x.created_at; });
  (r.data || []).forEach(x => rc[x.post_id] = (rc[x.post_id] || 0) + 1);
  F.list = (data || []).map(p => ({...p, nc:cc[p.id] || 0, nr:rc[p.id] || 0, lastc:lastc[p.id] || null}));
  drawForumList();

      ${c.unread ? `<span class="cun">${c.unread}</span>` : ''}</button>`; }).join('') || '<div class="empty">No chats yet.</div>';
  el.querySelectorAll('[data-cid]').forEach(b => b.onclick = () => openThread(b.dataset.cid));
}
async function openThread(id){
  leaveThread(); S.chat.id = id; drawConvos();
  const c = S.chat.convos.find(x => x.id === id);
  const pane = $('chPane'); if(!pane || !c) return;
  const name = convoName(c);
  pane.closest('.split').classList.add('open');
  pane.innerHTML = `<div class="th-head">${backBtn('chBack', '')}<span class="cav ${c.kind === 'group' ? 'grp' : ''}">${c.kind === 'group' ? '👥' : esc(initials(name))}</span><b>${esc(name)}</b><span class="muted small">${c.kind === 'group' ? 'Group chat' : 'Direct message'}</span></div>
    <div class="msgs" id="msgs"><div class="empty"><span class="spin"></span></div></div>
    <form class="th-comp" id="sendForm"><textarea id="msgIn" rows="1" placeholder="Message ${esc(name.split(' ')[0])}${isPhone() ? '' : '. Enter to send, Shift + Enter for a new line'}"></textarea><button class="btn pri">Send</button></form>`;
  $('chBack').onclick = () => { leaveThread(); pane.closest('.split').classList.remove('open'); drawConvos(); };
  const { data } = await sb.from('messages').select('id,author_id,author_name,author_role,body,created_at').eq('conversation_id', id).order('created_at', {ascending:false}).limit(300);
  if(S.chat.id !== id) return;
  S.chat.msgs = (data || []).reverse(); S.chat.kind = c.kind; drawMsgs(true); markRead(id);
  S.chatSub = sb.channel('coach-chat-' + id)
    .on('postgres_changes', {event:'INSERT', schema:'public', table:'messages', filter:`conversation_id=eq.${id}`}, pl => {
      if(S.chat.msgs.some(m => m.id === pl.new.id)) return; S.chat.msgs.push(pl.new); drawMsgs(true); markRead(id); })
    .on('postgres_changes', {event:'DELETE', schema:'public', table:'messages'}, pl => {
      const n = S.chat.msgs.length; S.chat.msgs = S.chat.msgs.filter(m => m.id !== pl.old.id); if(S.chat.msgs.length !== n) drawMsgs(false); })
    .subscribe();
  const ta = $('msgIn'); if(!isPhone()) ta.focus();
  ta.oninput = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 160) + 'px'; };
  ta.onkeydown = e => { if(e.key === 'Enter' && !e.shiftKey && !isPhone()){ e.preventDefault(); $('sendForm').requestSubmit(); } };
  $('sendForm').onsubmit = async e => { e.preventDefault(); const body = ta.value.trim(); if(!body) return;
    ta.value = ''; ta.style.height = 'auto';
    const { data:m, error } = await sb.from('messages').insert({conversation_id:id, body}).select('id,author_id,author_name,author_role,body,created_at').single();
    if(error){ toast(error.message); ta.value = body; return; }
    if(!S.chat.msgs.some(x => x.id === m.id)){ S.chat.msgs.push(m); drawMsgs(true); }
    refreshConvos().then(drawConvos); };
}
function drawMsgs(scroll){
  const box = $('msgs'); if(!box) return;
  if(!S.chat.msgs.length){ box.innerHTML = '<div class="empty">No messages yet. Say g\'day.</div>'; return; }
  let h = '', lastDay = '', lastAuthor = '';
  S.chat.msgs.forEach(m => {
    const day = new Date(m.created_at).toDateString();
    if(day !== lastDay){ h += `<div class="mday">${esc(new Date(m.created_at).toLocaleDateString('en-AU', {weekday:'long', day:'numeric', month:'short'}))}</div>`; lastDay = day; lastAuthor = ''; }
    const mine = m.author_id === S.user.id, first = m.author_id !== lastAuthor; lastAuthor = m.author_id;
    h += `<div class="msg ${mine ? 'me' : ''} ${first ? 'first' : ''}">
      ${!mine && first && S.chat.kind === 'group' ? `<div class="mname">${esc(m.author_name || 'Athlete')}</div>` : ''}
      <div class="bub">${linkify(m.body)}<span class="mt">${esc(new Date(m.created_at).toLocaleTimeString('en-AU', {hour:'numeric', minute:'2-digit'}))}</span></div>
      <button class="mdel" data-delm="${m.id}" aria-label="Delete message">×</button></div>`;
  });
  box.innerHTML = h;
  box.querySelectorAll('[data-delm]').forEach(b => b.onclick = async () => { const id = b.dataset.delm;
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Delete?'; b.classList.add('sure'); return; }
    const { error } = await sb.from('messages').delete().eq('id', id); if(error) toast(error.message); else { S.chat.msgs = S.chat.msgs.filter(m => m.id !== id); drawMsgs(false); } });
  if(scroll) box.scrollTop = box.scrollHeight;
}

/* Base / Competitive athletes: day option and strength track live on the plan's roster (coach_plan_roster).
   The builder keeps any change made here (it only sends its own list when it was edited there). */
const planDays = pl => (Array.isArray(pl && pl.versions) ? pl.versions : []).map(v => +v.days).filter(Boolean).sort((a,b) => b - a);
const planTracks = pl => pl && pl.plan_type === 'BASE' && Array.isArray(pl.blocks) && pl.blocks[0] ? (pl.blocks[0].tracks || []).filter(t => t.select).map(t => t.name) : [];
const rosterOf = pl => ((pl && pl.roster && pl.roster.members) || []).filter(m => m && m.athlete_id);
async function setRoster(pl, athleteId, days, strength, remove){
  const tr = planTracks(pl);
  const doc = remove ? {plan_id:pl.id, athlete_id:athleteId, remove:true}
    : {plan_id:pl.id, athlete_id:athleteId, days: planDays(pl).length ? (+days || planDays(pl)[0]) : null, strength: tr.length ? (tr.includes(strength) ? strength : tr[0]) : null};
  const { error } = await sb.rpc('coach_plan_roster', { doc });
  if(error){ toast(typeof needsDb === 'function' && needsDb(error) ? 'This needs the database update first' : error.message); return false; }
  return true;
}
function rosterTable(pl){
  const days = planDays(pl), tr = planTracks(pl); if(!days.length) return '';
  const mem = rosterOf(pl).map(m => ({...m, name:pName(m.athlete_id)})).sort((a,b) => a.name.localeCompare(b.name));

  const counts = days.map(d => d + ' day: ' + mem.filter(m => (+m.days || days[0]) === d).length).join(' · ') + (tr.length ? ' · ' + tr.map(t => t + ': ' + mem.filter(m => (m.strength || tr[0]) === t).length).join(' · ') : '');
  const avail = S.M.people.filter(x => x.role !== 'coach' && !mem.some(m => m.athlete_id === x.id));
  return `<div class="rost">
    <div class="rost-h"><b>Athletes</b><span class="small muted">${mem.length} on this program${mem.length ? ' · ' + esc(counts) : ''}</span></div>

        ${tr.length ? `<td><select data-rstr="${pl.id}|${m.athlete_id}" aria-label="Strength focus for ${esc(m.name)}">${opt(tr, m.strength || tr[0])}</select></td>` : ''}
        <td style="text-align:right"><button class="btn sm ghost danger" data-roff="${pl.id}|${m.athlete_id}">Remove</button></td></tr>`).join('')}
    </tbody></table>` : '<div class="small muted" style="padding:6px 0">Nobody on it yet.</div>'}
    <div class="addrow"><select data-raddsel="${pl.id}" aria-label="Add an athlete"><option value="">Add an athlete…</option>${avail.map(x => `<option value="${x.id}">${esc(x.full_name || x.email)}</option>`).join('')}</select>

      ${tr.length ? `<select data-raddstr="${pl.id}" aria-label="Strength focus">${opt(tr, tr[0])}</select>` : ''}
      <button class="btn sm" data-radd="${pl.id}">Add</button></div>
  </div>`;
}

      <td>${mine.map(m => `<span class="tag">${esc(gName(m.group_id))}<button data-ungroup="${m.group_id}|${x.id}" aria-label="Remove from ${esc(gName(m.group_id))}">×</button></span>`).join('') || '<span class="small muted">No groups</span>'}</td>
      <td>${avail.length ? `<div class="addrow" style="margin:0"><select data-groupsel="${x.id}" aria-label="Add to group"><option value="">Add to group…</option>${avail.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select><button class="btn sm" data-addgroup="${x.id}">Add</button></div>` : ''}</td></tr>`; }).join('');
  return `<div class="page"><div><h1>Groups & athletes</h1><p class="intro">Groups decide which group chats, events and group-assigned programs people get. Click a name to open their calendar.</p></div>
    <div class="cols">
      <div class="panel"><h2>Groups <span class="small muted">${M.groups.length}</span></h2>
        <table class="tbl"><tbody>${groups}</tbody></table>
        <div class="addrow"><input id="newGroup" placeholder="New group name"><button class="btn sm" id="addGroup">Add group</button></div>
        <p class="small muted" style="margin-top:8px">Deleting a group also deletes its group chat. The athletes stay in the app.</p></div>
      <div class="panel"><h2>Athletes <span class="small muted">${M.people.length}</span></h2>
        <div class="tscroll"><table class="tbl"><thead><tr><th>Athlete</th><th>Groups</th><th></th></tr></thead><tbody>${people}</tbody></table></div></div>
    </div></div>`;
}
function viewEvents(){
  const M = S.M, today = ymd(new Date());
  const THEME = {comp:'Comp', party:'Party', other:'Event'};
  const rows = M.events.map(e => `<tr class="${e.event_date < today ? 'past' : ''}"><td><b style="font-weight:500">${esc(e.title)}</b></td>
      <td>${parseD(e.event_date).toLocaleDateString('en-AU', {weekday:'short', day:'numeric', month:'short', year:'numeric'})}${e.event_time ? ' · ' + esc(e.event_time.slice(0,5)) : ''}</td>
      <td>${esc(THEME[e.theme] || 'Event')}</td><td>${esc(e.location || '')}</td><td>${esc(e.group_id ? gName(e.group_id) : 'Everyone')}</td>
      <td style="text-align:right;white-space:nowrap">${e.post_id ? `<a class="btn sm" href="index.html#post/${e.post_id}" target="_blank" rel="noopener">Post</a> ` : ''}<button class="btn sm" data-editevent="${e.id}">Edit</button> <button class="btn sm" data-delevent="${e.id}">Remove</button></td></tr>`).join('');
  return `<div class="page"><div><h1>Events</h1><p class="intro">Events show in the banner carousel on the Home screen, for everyone or just one group. Past events fade out here and drop off Home.</p></div>
    <div class="panel" id="evPanel"><h2 id="evFormTitle">Add an event</h2><p class="small muted" style="margin:-4px 0 10px">Each event gets a forum post automatically. Editing the event updates its post, including who can see it.</p>
      <div class="form">
        <input id="evTitle" placeholder="Event name" aria-label="Event name">
        <input id="evDate" type="date" aria-label="Date">
        <input id="evTime" type="time" aria-label="Start time">
        <select id="evTheme" aria-label="Banner style"><option value="comp">Comp banner</option><option value="party">Party banner</option><option value="other">Other</option></select>
        <input id="evLoc" placeholder="Location (optional)" aria-label="Location">
        <select id="evGroup" aria-label="Who sees it"><option value="">Everyone</option>${M.groups.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
        <input id="evDesc" placeholder="Details for the forum post (optional)" aria-label="Details" style="grid-column:1/-1;flex-basis:100%">
        <button class="btn pri" id="evAdd">Add event</button>
        <button class="btn" id="evCancel" hidden>Cancel</button>
      </div></div>
    <div class="panel"><h2>All events <span class="small muted">${M.events.length}</span></h2>
      ${M.events.length ? `<div class="tscroll"><table class="tbl"><thead><tr><th>Event</th><th>When</th><th>Banner</th><th>Location</th><th>For</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>` : '<div class="empty">No events yet.</div>'}</div>
  </div>`;
}
function bindAdmin(){
  const root = $('main');
  // Base / Competitive athlete table
  const plOf = id => S.M.plans.find(x => x.id === id);
  const memOf = (pl, aid) => rosterOf(pl).find(m => m.athlete_id === aid) || {};
  const rosterSave = async (pl, aid, days, str, msg) => { if(await setRoster(pl, aid, days, str)){ toast(msg); await loadAdmin(); } };
  root.querySelectorAll('[data-rdays]').forEach(sel => sel.onchange = () => { const [pid, aid] = sel.dataset.rdays.split('|'), pl = plOf(pid); if(!pl) return;
    rosterSave(pl, aid, +sel.value, memOf(pl, aid).strength, pName(aid).split(' ')[0] + ' is on the ' + sel.value + ' day ' + pl.name + ' from their next session'); });
  root.querySelectorAll('[data-rstr]').forEach(sel => sel.onchange = () => { const [pid, aid] = sel.dataset.rstr.split('|'), pl = plOf(pid); if(!pl) return;
    rosterSave(pl, aid, memOf(pl, aid).days, sel.value, pName(aid).split(' ')[0] + ' is on ' + sel.value + ' from their next session'); });
  root.querySelectorAll('[data-roff]').forEach(b => b.onclick = () => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; b.textContent = 'Remove?'; setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = 'Remove'; } }, 4000); return; }
    const [pid, aid] = b.dataset.roff.split('|'), pl = plOf(pid); if(!pl) return;
    setRoster(pl, aid, null, null, true).then(ok => { if(ok){ toast(pName(aid).split(' ')[0] + ' taken off ' + pl.name + '. Anything logged stays in their history.'); loadAdmin(); } });
  });
  root.querySelectorAll('[data-radd]').forEach(b => b.onclick = () => { const pid = b.dataset.radd, pl = plOf(pid); if(!pl) return;
    const aid = (root.querySelector(`[data-raddsel="${pid}"]`) || {}).value; if(!aid){ toast('Pick an athlete'); return; }
    const d = (root.querySelector(`[data-radddays="${pid}"]`) || {}).value, st = (root.querySelector(`[data-raddstr="${pid}"]`) || {}).value;
    rosterSave(pl, aid, d, st, pName(aid).split(' ')[0] + ' added to ' + pl.name); });
  const act = async (fn, msg) => { const { error } = await fn(); if(error){ toast(error.message); return; } if(msg) toast(msg); await loadAdmin(); };
  const twoTap = (b, label, fn) => {
    if(b.dataset.sure !== '1'){ b.dataset.sure = '1'; const old = b.textContent; b.textContent = label;
      setTimeout(() => { if(document.body.contains(b)){ b.dataset.sure = ''; b.textContent = old; } }, 4000); return; }
    fn();
  };
  root.querySelectorAll('[data-pub]').forEach(b => b.onclick = () => act(() => sb.from('programs').update({status: b.dataset.st === 'published' ? 'draft' : 'published'}).eq('id', b.dataset.pub), b.dataset.st === 'published' ? 'Unpublished' : 'Published'));
  root.querySelectorAll('[data-pubplan]').forEach(b => b.onclick = () => {
    const ids = S.M.programs.filter(p => p.plan_id === b.dataset.pubplan && p.status !== 'archived').map(p => p.id);
    act(() => sb.from('programs').update({status: b.dataset.to}).in('id', ids), b.dataset.to === 'published' ? 'All published' : 'All unpublished');
  });
  root.querySelectorAll('[data-assign]').forEach(b => b.onclick = () => {
    const v = root.querySelector(`[data-assignsel="${b.dataset.assign}"]`).value; if(!v){ toast('Pick a group or athlete'); return; }
    const [t, id] = v.split(':');
    act(() => sb.from('program_assignments').insert({program_id: b.dataset.assign, [t === 'g' ? 'group_id' : 'athlete_id']: id}), 'Assigned');
  });
  root.querySelectorAll('[data-unassign]').forEach(b => b.onclick = () => act(() => sb.from('program_assignments').delete().eq('id', b.dataset.unassign), 'Removed'));
  root.querySelectorAll('[data-delprog]').forEach(b => b.onclick = () => twoTap(b, 'Click again to delete', () => act(() => sb.from('programs').delete().eq('id', b.dataset.delprog), 'Program deleted')));
  root.querySelectorAll('[data-addgroup]').forEach(b => b.onclick = () => {
    const g = root.querySelector(`[data-groupsel="${b.dataset.addgroup}"]`).value; if(!g){ toast('Pick a group'); return; }
    act(() => sb.from('group_members').insert({group_id: g, profile_id: b.dataset.addgroup}), 'Added to ' + gName(g));
  });
  root.querySelectorAll('[data-ungroup]').forEach(b => b.onclick = () => { const [g, pid] = b.dataset.ungroup.split('|');
    act(() => sb.from('group_members').delete().eq('group_id', g).eq('profile_id', pid), 'Removed from ' + gName(g)); });
  root.querySelectorAll('[data-delgroup]').forEach(b => b.onclick = () => twoTap(b, 'Click again to delete', () => act(() => sb.from('groups').delete().eq('id', b.dataset.delgroup), 'Group deleted')));
  root.querySelectorAll('[data-open]').forEach(b => b.onclick = () => selectAthlete(b.dataset.open));
  if($('addGroup')) $('addGroup').onclick = async () => {
    const name = $('newGroup').value.trim(); if(!name){ toast('Name the group'); return; }
    const { data:g, error } = await sb.from('groups').insert({name, sort: S.M.groups.length}).select('id').single();
    if(error){ toast(error.message); return; }
    await sb.from('conversations').insert({kind:'group', group_id:g.id});   // every group gets its chat, as in the app
    toast('Group added'); loadAdmin();
  };
  root.querySelectorAll('[data-delevent]').forEach(b => b.onclick = () => act(() => sb.from('events').delete().eq('id', b.dataset.delevent), 'Event removed'));
  let evEdit = null;
  root.querySelectorAll('[data-editevent]').forEach(b => b.onclick = () => {
    const e = S.M.events.find(x => x.id === b.dataset.editevent); if(!e) return;
    evEdit = e.id;
    $('evTitle').value = e.title; $('evDate').value = e.event_date; $('evTime').value = (e.event_time || '').slice(0,5);
    $('evTheme').value = e.theme || 'other'; $('evLoc').value = e.location || ''; $('evGroup').value = e.group_id || ''; $('evDesc').value = e.description || '';
    $('evFormTitle').textContent = 'Edit event: ' + e.title; $('evAdd').textContent = 'Save changes'; $('evCancel').hidden = false;
    $('evPanel').scrollIntoView({behavior:'smooth', block:'start'}); $('evTitle').focus();
  });
  if($('evCancel')) $('evCancel').onclick = () => loadAdmin();
  if($('evAdd')) $('evAdd').onclick = () => {
    const title = $('evTitle').value.trim(), event_date = $('evDate').value;
    if(!title || !event_date){ toast('Add a name and a date'); return; }
    const rec = {title, event_date, event_time: $('evTime').value || null, theme: $('evTheme').value, location: $('evLoc').value.trim() || null,
                 group_id: $('evGroup').value || null, description: $('evDesc').value.trim() || null};
    if(evEdit) act(() => sb.from('events').update(rec).eq('id', evEdit), 'Event and its post updated');
    else act(() => sb.from('events').insert(rec), 'Event added and posted to the forum');
  };
}

let toastT = null;
function toast(m){ const t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
</script>
</body>
</html>
